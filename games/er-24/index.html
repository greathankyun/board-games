<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>急診室24小時</title>
<meta name="description" content="原創全合作危機管理桌遊：醫師、護理師、檢驗師、社工一起檢傷分級、搶床位、處理重症，撐到天亮。支援單人模式與四種難度。">
<meta name="theme-color" content="#1E5641">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="icon" href="../../icons/icon-192.png">
<link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="桌遊大廳">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Outfit:wght@600;700;800&display=swap">
<style>
:root{
  --paper:#F5EEE1; --paper2:#EFE6D4; --card:#FFFBF4; --ink:#1F2B27; --muted:#6E7068; --line:#E5D9C3; --line2:#D9CBB1;
  --green:#1E5641; --green2:#28704F; --green-ink:#F3F7EF; --yellow:#F5C443; --yellow-ink:#2A2310;
  --orange:#E9643B; --pink:#F7DDD3; --pink2:#EFC6B8; --up:#2C8F4E; --up-bg:#D5EEDA; --down:#C8432F; --down-bg:#F7DAD3; --flat-bg:#ECE5D7;
  --red:#D7542B; --red-bg:#F8DCCF; --blue:#2E7DC0; --blue-bg:#D6E7F5; --violet:#7A5AD3; --violet-bg:#E4DCF7; --gold:#D19A17; --gold-bg:#F6E7BE;
  --p0:#E58FA0; --p1:#8B67D6; --p2:#4F9E61; --p3:#E0922F; --p4:#3E9CC4; --p5:#C8573E; --p6:#6C7A3A; --p7:#5C6BC0;
  --scrim:rgba(40,32,20,.45);
  --f-body:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
  --f-num:'Outfit','Noto Sans TC',system-ui,sans-serif;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55;font-weight:500}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
  background-image:radial-gradient(rgba(120,90,40,.07) 1px,transparent 1px);background-size:5px 5px}
.wrap{position:relative;z-index:1;max-width:1600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 28px}
h1,h2,h3,h4{text-wrap:balance;margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
svg{display:block}

/* header */
.top{display:flex;align-items:center;gap:14px 22px;flex-wrap:wrap;padding-block:6px 12px;border-bottom:1.5px solid var(--line2)}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit}
.brand svg{width:44px;height:44px;flex:none}
.brand h1{font-size:clamp(26px,3.4vw,38px);font-weight:900;letter-spacing:.06em;line-height:1}
.brand small{font-family:var(--f-num);font-size:12px;letter-spacing:.42em;color:var(--ink);font-weight:600;margin-left:6px}
.homelink{display:inline-flex;align-items:center;gap:6px;font-size:15px;font-weight:900;color:var(--ink);text-decoration:none;border:1.5px solid var(--ink);border-radius:12px;padding:7px 12px;background:var(--card)}.homelink svg{width:18px;height:18px}
.vsep{width:1.5px;align-self:stretch;background:var(--line2);margin-block:6px}
.steps{display:flex;align-items:center;flex:1;min-width:0;justify-content:center}
.step{font-family:var(--f-num);font-weight:700;font-size:15px;padding:5px 14px;border-radius:999px;border:1.5px solid var(--line2);background:var(--card);color:var(--ink);white-space:nowrap}
.step.done{color:var(--muted);background:var(--paper2)}
.step.now{background:var(--green);border-color:var(--green);color:var(--green-ink);font-size:17px;padding:6px 18px}
.link{flex:1;min-width:8px;max-width:56px;height:2px;background:repeating-linear-gradient(90deg,var(--line2) 0 4px,transparent 4px 8px)}
.link.done{background:var(--green)}
.tops{display:flex;gap:10px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--ink);background:var(--card);color:var(--ink);padding:8px 16px;border-radius:12px;cursor:pointer;font-weight:700;line-height:1.2;text-decoration:none}
.btn svg{width:18px;height:18px}
.btn:hover:not(:disabled){transform:translateY(-1px)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.dark,.btn.primary{background:var(--green);border-color:var(--green);color:var(--green-ink)}
.btn.ghost{background:transparent}

/* layout */
.board{display:grid;grid-template-columns:minmax(0,1fr) minmax(340px,430px);grid-template-areas:"hero desk" "main desk";grid-template-rows:auto 1fr;gap:14px 18px;margin-top:12px;align-items:start}
.hero{grid-area:hero;position:relative;min-height:140px;display:flex;align-items:center;overflow:hidden;border-radius:18px}
.hero-txt{position:relative;z-index:2;padding:8px 0 10px}
.eyebrow{display:flex;align-items:center;gap:12px;font-family:var(--f-num);font-weight:600;letter-spacing:.32em;font-size:13px}
.eyebrow::after{content:"";width:80px;height:1.5px;background:var(--ink)}
.hero h2{font-size:clamp(28px,4vw,48px);font-weight:900;letter-spacing:.03em;line-height:1.15;margin-top:6px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.swoosh{display:block;width:150px;height:14px;margin-top:-2px}
.qbadge{position:relative;font-size:17px;font-weight:900;border:2px solid var(--ink);border-radius:999px;padding:3px 14px;background:var(--card);letter-spacing:.04em}
.hero-art{position:absolute;right:0;top:0;bottom:0;width:min(62%,640px);z-index:1;
  -webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 28%);mask-image:linear-gradient(90deg,transparent 0%,#000 28%)}
.hero-art svg{width:100%;height:100%}
main{grid-area:main;min-width:0}
.sect{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:900;padding-bottom:10px;border-bottom:1.5px solid var(--line2);margin:0 0 12px}
.sect svg{width:26px;height:26px;color:var(--orange)}
.sect{flex-wrap:wrap}
.sect small{font-size:13px;color:var(--muted);font-weight:700;margin-left:auto}
@media (max-width:640px){.sect small{flex-basis:100%;margin-left:0}}

/* desk */
.desk{grid-area:desk;position:sticky;top:max(10px,env(safe-area-inset-top,0px));background:var(--green);color:var(--green-ink);border-radius:26px;padding:24px 24px 22px;overflow:hidden;display:flex;flex-direction:column;gap:14px;box-shadow:0 18px 40px rgba(20,60,45,.25)}
.desk .leaf{position:absolute;right:-30px;top:-20px;width:190px;height:190px;opacity:.9;pointer-events:none}
.desk>*{position:relative}
.dhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.dhead h2{font-size:clamp(26px,2.6vw,36px);font-weight:900;letter-spacing:.04em;line-height:1.1}
.pill{background:var(--orange);color:#fff;font-weight:900;border-radius:999px;padding:5px 14px;font-size:15px;white-space:nowrap}
.pill.soft{background:rgba(255,255,255,.16)}
.dsub{font-weight:700;font-size:15px;margin-top:-6px;opacity:.9}
.dlab{font-size:14px;opacity:.9;font-weight:900;display:flex;align-items:center;gap:8px;justify-content:space-between}
.dlab small{font-weight:700;opacity:.8;font-size:12px}
.dnote{font-size:13px;font-weight:700;background:rgba(255,255,255,.12);border-radius:10px;padding:7px 12px}
.dnote.warn{background:rgba(233,100,59,.28)}
.confirm{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:none;border-radius:16px;background:var(--yellow);color:var(--yellow-ink);font-size:22px;font-weight:900;padding:13px;cursor:pointer;box-shadow:0 4px 0 #C99A1E;letter-spacing:.06em}
.confirm svg{width:24px;height:24px}
.confirm:active:not(:disabled){transform:translateY(2px);box-shadow:0 2px 0 #C99A1E}
.confirm:disabled{opacity:.5;cursor:not-allowed}
.passbtn{width:100%;border:2px solid rgba(255,255,255,.85);background:transparent;color:var(--green-ink);border-radius:14px;font-weight:900;font-size:17px;padding:10px;cursor:pointer}
.passbtn:hover{background:rgba(255,255,255,.08)}
.empty{border:2px dashed rgba(255,255,255,.35);border-radius:16px;padding:20px 16px;text-align:center;font-weight:700;opacity:.92}
.empty b{display:block;font-size:19px;margin-bottom:4px}
.think{display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.1);border-radius:16px;padding:14px}
.think .av{width:56px;height:56px;flex:none}
.think b{font-size:19px}
.dots::after{content:"…";display:inline-block;animation:blink 1.1s steps(3) infinite}
@keyframes blink{0%{opacity:.2}50%{opacity:1}100%{opacity:.2}}
.chooser{display:flex;flex-wrap:wrap;gap:6px}
.chooser button{border:2px solid rgba(255,255,255,.55);background:transparent;color:var(--green-ink);border-radius:12px;padding:7px 12px;font-weight:900;cursor:pointer;display:inline-flex;align-items:center;gap:6px;min-height:40px}
.chooser button .av{width:24px;height:24px}
.chooser button.on{background:var(--card);color:var(--ink);border-color:var(--card)}
.chooser button:disabled{opacity:.35;cursor:not-allowed}
.chooser button.red.on{background:var(--red);border-color:var(--red);color:#fff}
.chooser button.blue.on{background:var(--blue);border-color:var(--blue);color:#fff}
.chooser.big button{flex:1;justify-content:center;font-size:16px}
.opt2{display:flex;flex-direction:column;gap:6px}
.opt2 button{display:flex;justify-content:space-between;gap:10px;align-items:center;text-align:left;border:2px solid rgba(255,255,255,.4);background:transparent;color:var(--green-ink);border-radius:12px;padding:9px 12px;cursor:pointer}
.opt2 button b{font-weight:900;font-size:15px}
.opt2 button span{font-size:12px;opacity:.85}
.opt2 button.on{background:var(--card);color:var(--ink);border-color:var(--card)}
.opt2 button.on span{opacity:1;color:var(--muted)}
.opt2 button:disabled{opacity:.35;cursor:not-allowed}
.dsec{display:flex;flex-direction:column;gap:8px;padding-top:12px;border-top:1px solid rgba(255,255,255,.2)}

/* private note card */
.intel{position:relative;background:var(--pink);color:var(--ink);border-radius:14px;padding:14px 16px 12px;box-shadow:0 6px 14px rgba(0,0,0,.18)}
.intel::after{content:"";position:absolute;right:0;top:0;width:28px;height:28px;background:linear-gradient(225deg,var(--green) 50%,var(--pink2) 50%);border-bottom-left-radius:8px}
.intel .ilab{display:flex;align-items:center;gap:8px;font-weight:900;color:#B24A35;font-size:16px;padding-bottom:8px;border-bottom:1.5px solid var(--pink2)}
.intel .ilab svg{width:20px;height:20px}
.intel ul{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:260px;overflow:auto}
.intel li{font-size:13.5px;line-height:1.45;display:flex;gap:8px;align-items:flex-start}
.intel li .rt{font-family:var(--f-num);font-weight:700;font-size:11px;border:1.5px solid var(--pink2);border-radius:6px;padding:0 5px;background:var(--card);white-space:nowrap;margin-top:1px}
.intel li.void{opacity:.45;text-decoration:line-through}
.intel .inote{font-size:12.5px;color:#5B4A40;margin-top:8px}
.intel .big{font-size:22px;font-weight:900;margin:8px 0 2px}
.stamp{border:1.5px solid #B24A35;color:#B24A35;border-radius:8px;padding:1px 9px;font-weight:900;font-size:12px;white-space:nowrap;display:inline-block;transform:rotate(-3deg)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:900;padding:1px 9px;border-radius:8px;background:var(--flat-bg);color:var(--ink);white-space:nowrap}
.chip.red{background:var(--red);color:#fff}.chip.blue{background:var(--blue);color:#fff}.chip.violet{background:var(--violet);color:#fff}
.chip.gold{background:var(--gold-bg);color:#6B4D07}.chip.green{background:var(--up-bg);color:var(--up)}.chip.down{background:var(--down-bg);color:var(--down)}

/* feed */
.feed{margin-top:18px}
.feedlist{list-style:none;margin:0;padding:0;overflow:auto;max-height:320px}
.feedlist li{display:grid;grid-template-columns:auto 34px minmax(0,1fr);gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.qtag{font-family:var(--f-num);font-weight:700;font-size:12px;border:1.5px solid var(--line2);border-radius:6px;padding:1px 6px;background:var(--card)}
.feedlist .av{width:34px;height:34px}
.feedlist .txt{font-size:13.5px;line-height:1.45;min-width:0}
.feedlist .ic{width:34px;height:34px;border-radius:50%;background:var(--paper2);display:grid;place-items:center;color:var(--green)}
.feedlist .ic svg{width:18px;height:18px}
.feedlist li.q .txt{font-weight:900;color:var(--green)}
.feedlist li.k .txt{color:#8A4A12}
.pn{font-weight:900;color:var(--ink)}

/* players strip */
.players{margin-top:18px;background:var(--card);border:1.5px solid var(--line);border-radius:20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));padding:8px;gap:6px;box-shadow:0 8px 20px rgba(90,70,30,.06)}
.pl{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:14px;position:relative;min-width:0}
.pl.cur{background:var(--pink)}
.pl .av{width:52px;height:52px;flex:none}
.pl .nm{font-size:17px;font-weight:900;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tag{font-size:11px;font-weight:700;border:1.5px solid var(--line2);border-radius:6px;padding:0 5px;color:var(--muted);background:var(--card)}
.pl .fig{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:13px;color:var(--muted)}
.pl .fig b{font-family:var(--f-num);font-weight:800;color:var(--ink);font-size:16px;margin-left:3px}

/* responsive */
@media (max-width:1040px){
  .board{grid-template-columns:minmax(0,1fr);grid-template-areas:"hero" "desk" "main"}
  .desk{position:relative;top:0}
  .hero-art{width:70%;opacity:.55}
}
@media (max-width:640px){
  .vsep{display:none}
  .steps{order:3;flex-basis:100%;justify-content:flex-start;overflow-x:auto;padding-bottom:2px}
  .step{padding:4px 10px;font-size:13px}.step.now{padding:5px 12px;font-size:15px}
  .brand small{display:none}
  .desk{padding:20px 16px;border-radius:22px}
  .tops .btn{padding:8px 11px}
}

/* modals */
.overlay{position:fixed;inset:0;background:var(--scrim);display:grid;place-items:center;z-index:50;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--card);color:var(--ink);border-radius:24px;border:1.5px solid var(--line);width:min(660px,100%);max-height:calc(100dvh - 32px);overflow:auto;padding:24px;box-shadow:0 30px 70px rgba(40,30,10,.3)}
.modal h2{font-size:27px;font-weight:900;margin-bottom:6px;letter-spacing:.03em}
.modal .sub{color:var(--muted);margin:0 0 14px}
.modal .acts{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}
.modal .acts .btn{padding:10px 20px;font-size:16px}
.modal .intel::after{background:linear-gradient(225deg,var(--card) 50%,var(--pink2) 50%)}
.seats{display:flex;flex-direction:column;gap:10px}
.seat{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center}
.seat .av{width:44px;height:44px}
.seat input{font:inherit;font-weight:700;padding:9px 12px;border:1.5px solid var(--line2);border-radius:12px;background:var(--paper);color:var(--ink);min-width:0;width:100%}
.seg{display:inline-flex;border:1.5px solid var(--line2);border-radius:12px;overflow:hidden;background:var(--paper);flex-wrap:wrap}
.seg button{border:none;background:transparent;color:var(--muted);padding:8px 12px;cursor:pointer;font-weight:700}
.seg button.on{background:var(--green);color:var(--green-ink)}
.field{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:14px 0;flex-wrap:wrap}
.field>span{font-weight:900;font-size:16px}
.note{font-size:12px;color:var(--muted)}
.pitch{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:0 0 6px}
.pitch div{background:var(--paper);border-radius:14px;padding:12px;font-size:13px;color:var(--muted)}
.pitch b{display:block;color:var(--ink);font-size:15px;font-weight:900;margin-bottom:2px}
.setup-art{height:120px;margin:-24px -24px 16px;overflow:hidden;border-radius:24px 24px 0 0}
.setup-art svg{width:100%;height:100%}
.rules{font-size:15px;line-height:1.8}
.rules h3{font-size:19px;font-weight:900;margin:18px 0 6px;color:var(--green)}
.rules p,.rules li{max-width:64ch}
.rules ol,.rules ul{padding-left:1.3em;margin:6px 0}
.rules table{border-collapse:collapse;font-size:14px;margin:6px 0;width:100%}
.rules td,.rules th{border-top:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.rules th{font-size:12px;color:var(--muted)}
.handoff .av{width:84px;height:84px;margin-bottom:10px}
table.res{width:100%;border-collapse:collapse;margin-top:12px;font-size:14px}
table.res th{font-size:12px;color:var(--muted);text-align:right;font-weight:700;padding:4px 6px}
table.res td{text-align:right;padding:8px 6px;border-top:1px solid var(--line);font-family:var(--f-num);font-weight:700;font-variant-numeric:tabular-nums}
table.res th:first-child,table.res td:first-child{text-align:left;font-family:var(--f-body)}
.tablewrap{overflow-x:auto}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--muted)}
.win{font-size:32px;font-weight:900;color:var(--green);margin:4px 0}
.revlist{display:flex;flex-direction:column;gap:8px}
.rev{border:1.5px solid var(--line2);border-radius:14px;padding:10px 14px;background:var(--paper);display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.rev h4{font-size:16px;font-weight:900}
.rev .kn{font-size:12.5px;color:var(--muted);font-weight:700}
@media (prefers-reduced-motion:reduce){.dots::after{animation:none}.btn{transition:none}}


/* ---- game ---- */
/* Layout: gauges, the bed board and the waiting room on the left; the green desk shows the selected patient and the active role's actions. */
.gauges{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:14px}
.gauge{background:var(--card);border:1.5px solid var(--line2);border-radius:14px;padding:8px 12px}
.gauge small{display:block;font-size:12px;color:var(--muted);font-weight:900}
.gauge b{font-family:var(--f-num);font-size:22px;font-weight:800}
.gauge.bad b{color:var(--down)}
@media (max-width:560px){.gauges{grid-template-columns:repeat(2,minmax(0,1fr))}}
.bedgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.bed{border:2px dashed var(--line2);border-radius:14px;min-height:126px;padding:8px;display:flex;flex-direction:column;gap:4px;background:transparent}
.bed.red{border-color:#E7A99B;background:#FBEDE8}
.bed .bl{font-size:11.5px;font-weight:900;color:var(--muted)}
.bed.red .bl{color:var(--down)}
.pt{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:4px;border-radius:12px;background:var(--card);border:1.5px solid var(--line2);padding:7px 9px;min-width:0;position:relative}
.pt:focus-visible{outline:3px solid var(--yellow)}
.pt.sel{outline:3px solid var(--green);outline-offset:1px}
.pt .top{display:flex;align-items:center;gap:6px;font-weight:900;font-size:13.5px;min-width:0}
.pt .top span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lv{flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;color:#fff;font-family:var(--f-num);font-weight:800;font-size:14px}
.lv1{background:#C8432F}.lv2{background:#E9643B}.lv3{background:#D19A17}.lv4{background:#2C8F4E}.lv5{background:#2E7DC0}.lv0{background:#8B8B8B}
.tm{display:flex;gap:3px;align-items:center;font-size:11px;font-weight:900;color:var(--muted)}
.tm i{width:12px;height:8px;border-radius:3px;background:var(--line2);display:inline-block}
.tm i.on{background:var(--up)}
.tm.warn i.on{background:var(--down)}
.nd{display:flex;flex-wrap:wrap;gap:3px}
.nd span{font-size:11.5px;font-weight:900;border-radius:6px;padding:0 6px;background:var(--paper2)}
.nd span.done{background:var(--up-bg);color:var(--up);text-decoration:line-through}
.nd span.r-診{border:1.5px solid #C8432F}.nd span.r-護{border:1.5px solid #E58FA0}.nd span.r-驗{border:1.5px solid #7A5AD3}.nd span.r-社{border:1.5px solid #2E7DC0}
.waitgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.waitgrid .empty2{color:var(--muted);font-size:13px;padding:8px}
.vip{position:absolute;right:6px;top:-8px;font-size:10.5px;font-weight:900;background:var(--gold);color:#fff;border-radius:6px;padding:0 6px}
.acts2{display:flex;flex-direction:column;gap:6px}
.acts2 button{display:flex;justify-content:space-between;gap:10px;align-items:center;text-align:left;border:2px solid rgba(255,255,255,.45);background:transparent;color:var(--green-ink);border-radius:12px;padding:9px 12px;cursor:pointer;font-weight:900}
.acts2 button span{font-size:12px;opacity:.85;font-weight:700;white-space:nowrap}
.acts2 button:hover:not(:disabled){background:rgba(255,255,255,.1)}
.acts2 button:disabled{opacity:.3;cursor:not-allowed}
.apbar{display:flex;gap:6px}
.apbar i{width:30px;height:12px;border-radius:6px;background:rgba(255,255,255,.2);display:inline-block}
.apbar i.on{background:var(--yellow)}
.cards{display:flex;flex-direction:column;gap:6px}
.cards button{display:flex;flex-direction:column;align-items:flex-start;text-align:left;border:none;background:var(--pink);color:var(--ink);border-radius:12px;padding:8px 12px;cursor:pointer}
.cards button b{font-weight:900}
.cards button span{font-size:12px;color:#5B4A40}
.cards button.on{outline:3px solid var(--yellow)}
.selpt{background:rgba(255,255,255,.1);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.selpt .top{display:flex;align-items:center;gap:8px;font-weight:900;font-size:16px}
.selpt .nd span{background:rgba(255,255,255,.18);color:var(--green-ink)}
.selpt .nd span.done{background:rgba(255,255,255,.08);color:rgba(255,255,255,.55)}
.role{display:inline-flex;align-items:center;gap:6px}
.role i{width:12px;height:12px;border-radius:50%;display:inline-block}
.stars{font-size:28px;letter-spacing:4px;color:var(--gold)}
.brand small{display:none}
.step{padding:4px 9px;font-size:13px}.step.now{padding:5px 12px;font-size:15px}
.link{max-width:14px}
.top .vsep{display:none}
.top .tops{margin-left:auto}
.steps{order:3;flex-basis:100%;justify-content:center;overflow-x:auto;padding-bottom:2px}
@media (max-width:640px){.steps{justify-content:flex-start}}

</style>
</head>
<body>

      <div id="wait"></div>
      <section class="feed"><h3 class="sect"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 21h18M6 17v-4M10 17V9M14 17v-6M18 17V5"/></svg>值班紀錄</h3><div id="feed"></div></section>
    </main>
  </div>
  <section class="players" id="players" aria-label="醫療團隊"></section>

</div>

<script>
'use strict';
const LOBBY='../../';
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

let SPEED=650, timer=null;

function showRulesHTML(html){
  $('#rulesModal').innerHTML=`<h2>遊戲規則</h2><div class="rules">${html}</div><div class="acts"><button class="btn primary" id="closeRules">知道了</button></div>`;

$('#rulesOv').addEventListener('click',e=>{if(e.target.id==='closeRules'||e.target.id==='rulesOv')$('#rulesOv').hidden=true;});
function feedHTML(log,tag,emptyTxt){
  const items=log.slice(0,40).map(l=>{
    const who=l.a!=null&&S.players[l.a]?avatar(l.a):`<span class="ic">${l.c==='q'?ICONS.spark:l.c==='k'?ICONS.gavel:ICONS.bars}</span>`;
    return `<li class="${l.c||''}"><span class="qtag">${tag(l)}</span>${who}<span class="txt">${l.h}</span></li>`;}).join('');

function setupSeatsHTML(cfg,min,max){
  return `<div class="field"><span>玩家人數</span><div class="seg">${Array.from({length:max-min+1},(_,k)=>k+min).map(k=>`<button data-m="n:${k}" class="${k===cfg.n?'on':''}">${k} 人</button>`).join('')}</div></div>

   <div class="field"><span>AI 速度</span><div class="seg">${Object.keys(SPEEDS).map(k=>`<button data-m="sp:${k}" class="${k===cfg.speed?'on':''}">${k}</button>`).join('')}</div></div>`;

function setupSeatsHandle(cfg,m,redraw){
  document.querySelectorAll('[data-seat]').forEach(inp=>{cfg.seats[+inp.dataset.seat].name=inp.value;});
  if(m.startsWith('n:')){cfg.n=+m.slice(2);redraw();return true;}
  if(m.startsWith('h:')||m.startsWith('a:')){cfg.seats[+m.slice(2)].ai=m[0]==='a';redraw();return true;}
  if(m.startsWith('sp:')){cfg.speed=m.slice(3);SPEED=SPEEDS[cfg.speed];redraw();return true;}
  return false;

  {k:'mass',n:'大量傷患',d:'遊覽車翻覆：額外湧入 3 位病人，其中 1 位是 1 級。'},

  {k:'round',n:'主任巡房',d:'所有病人倒數 +1。'},
  {k:'vip',n:'VIP 病人',d:'一位議員到院。3 回合內沒處理完，投訴 +2。'},
  {k:'amb',n:'救護車連環叩',d:'額外 2 位病人。'},
];
const CARDS={
  coffee:{n:'加班咖啡',d:'本回合 +1 行動點。'},
  senior:{n:'學長支援',d:'免費完成選定病人的一項需求。'},
  transfer:{n:'轉院',d:'把一位已檢傷、3 級以上的候診病人轉走（不算救回，也不罰）。'},
  extra:{n:'加床',d:'永久增加一張一般床。'},
  cart:{n:'急救推車',d:'選定病人倒數 +3。'},
  calmc:{n:'安撫家屬',d:'投訴 −1。'},
  rapid:{n:'快篩',d:'候診區所有病人立刻檢傷。'},
};
const CARD_DECK=['coffee','coffee','coffee','senior','senior','senior','transfer','transfer','extra','cart','cart','cart','calmc','calmc','rapid','rapid'];
const PT_NAMES=['胸痛的阿伯','發燒的小孩','車禍的外送員','腹痛的上班族','喝醉的大學生','扭到腳的阿嬤','過敏的女孩','呼吸喘的老先生','頭暈的孕婦','割傷的廚師','中暑的工人','獨居的阿公','燙傷的店員','流鼻血的國中生','跌倒的騎士','頭痛的工程師','吃壞肚子的遊客','被狗咬的郵差','氣喘的阿姨','打球受傷的高中生'];
const AI_NAMES=['林醫師','小芳','阿凱','陳社工'];
const SAVE_KEY='er24-save-v1';

/* ================= state ================= */
let S=null, UI={};
let setupCfg={n:1,diff:1,seats:[{name:'你',ai:false},{name:'小芳',ai:true},{name:'阿凱',ai:true},{name:'陳社工',ai:true}],speed:'中'};
const humans=()=>S.players.filter(p=>!p.ai);
const pn=i=>`<b class="pn" data-p="${i}">${esc(S.players[i].name)}・${ROLES[S.players[i].role].n}</b>`;
function log(html,cls=''){const m=/data-p="(\d+)"/.exec(html);S.log.unshift({h:html,c:cls,a:m?+m[1]:null,r:S.r});if(S.log.length>260)S.log.length=260;}
function save(){lsSet(SAVE_KEY,S);}
function clearSave(){lsSet(SAVE_KEY,null);}
const diff=()=>DIFF[S.diff];
const ev=()=>S.ev!=null?EVENTS[S.ev]:null;
const allPts=()=>S.beds.filter(Boolean).concat(S.wait);
const findPt=id=>allPts().find(p=>p.id===id);
const where=pt=>{const b=S.beds.findIndex(x=>x&&x.id===pt.id);return b>=0?b:-1;};

/* ================= setup ================= */
function setupGame(cfg){
  clearTimeout(timer);
  let players;
  if(cfg.solo)players=[{name:cfg.players[0].name,ai:false,role:0},{name:cfg.players[0].name,ai:false,role:1}];
  else players=cfg.players.map((p,i)=>({name:p.name,ai:p.ai,role:i}));
  S={players:players.map(p=>({...p,hand:[]})),diff:cfg.diff,r:1,turn:0,ap:0,used:{},beds:[null,null,null,null,null,null],red:2,wait:[],saved:[],deaths:0,comp:0,acc:0,nid:1,
     ev:null,evDeck:shuffle(EVENTS.map((_,k)=>k)),cards:shuffle(CARD_DECK.slice()),phase:'turn',log:[],viewer:null,cfg,solo:!!cfg.solo,vip:null};
  S.players.forEach(p=>{p.hand.push(drawCard());});
  log(`早上 08:00，${S.solo?'你':'團隊'}接班。難度「${diff().n}」：死亡 ${diff().death} 人或投訴 ${diff().comp} 件就失敗。撐到明天 08:00！`,'q');
  startRound(true);
}
function drawCard(){if(!S.cards.length)S.cards=shuffle(CARD_DECK.slice());return S.cards.pop();}
function newPatient(lvl){
  if(lvl==null){const r=Math.random();lvl=r<.1?1:r<.3?2:r<.6?3:r<.85?4:5;}
  let needs;
  const two=shuffle(['診','護','驗']);
  if(lvl===1)needs=['診','護','驗'];
  else if(lvl===2)needs=Math.random()<.5?['診','護','驗']:['診','護'];
  else if(lvl===3)needs=two.slice(0,2);
  else if(lvl===4)needs=[Math.random()<.5?'診':'護'];
  else needs=[Math.random()<.6?'護':'社'];
  if(lvl>=2&&lvl<=4&&Math.random()<.25&&!needs.includes('社'))needs.push('社');
  return {id:S.nid++,name:pick(PT_NAMES),lvl,lvl0:lvl,tri:false,t:LV_T[lvl],needs:needs.map(n=>({n,d:false})),age:0};
}
function startRound(first){
  S.used={};S.turn=0;
  if(!first){S.ev=S.evDeck.length?S.evDeck.pop():null;if(!S.evDeck.length)S.evDeck=shuffle(EVENTS.map((_,k)=>k));}
  const e=ev();
  const nR=S.players.length;
  const f=(.32*nR+.05)*diff().rate;
  let n=e&&e.k==='calm'?0:ARR[S.r-1]*f+S.acc;
  const whole=Math.floor(n);S.acc=n-whole;
  const arrivals=[];for(let k=0;k<whole;k++)arrivals.push(newPatient());
  if(e){
    if(e.k==='mass'){arrivals.push(newPatient(1),newPatient(),newPatient());}
    if(e.k==='flu'){arrivals.push(newPatient(4),newPatient(4));}
    if(e.k==='amb'){arrivals.push(newPatient(),newPatient());}
    if(e.k==='family'){S.comp++;}
    if(e.k==='round'){allPts().forEach(p=>p.t++);}
    if(e.k==='vip'){const v=newPatient(3);v.vip=S.r+3;v.name='來視察的議員';arrivals.push(v);}
  }
  S.wait.push(...arrivals);
  log(`${HOURS(S.r)}・${e?`事件「${e.n}」：${e.d}`:'第一班，病人陸續到院。'}${arrivals.length?` 新到 ${arrivals.length} 位病人。`:''}`,'q');
  if(checkLose())return;
  beginTurn();
}
function beginTurn(){
  const p=S.players[S.turn];
  S.ap=AP+(ev()&&ev().k==='help'?1:0);
  if(p.hand.length<HAND_MAX)p.hand.push(drawCard());
  S.used={};
  UI={sel:UI.sel};
  proceed();
}

/* ================= actions ================= */
function triCost(i){let c=1;if(S.players[i].role===2&&!S.used.freeTri)c=0;if(ev()&&ev().k==='pc')c++;return c;}
function needCost(i,n){let c=ROLES[S.players[i].role].need===n?1:2;if(n==='驗'&&ev()&&ev().k==='power')c++;return c;}
function canAct(i,a,pt,arg){
  const p=S.players[i];
  if(!pt&&!['card','end','calm'].includes(a))return false;
  if(a==='tri')return pt&&!pt.tri&&S.ap>=triCost(i);
  if(a==='bed'){if(!pt||!pt.tri||where(pt)>=0||S.ap<1)return false;return freeBed(pt.lvl)>=0;}
  if(a==='need'){if(!pt||!pt.tri||where(pt)<0)return false;const nd=pt.needs[arg];return nd&&!nd.d&&S.ap>=needCost(i,nd.n);}
  if(a==='stab')return pt&&S.ap>=1;
  if(a==='rescue')return p.role===0&&!S.used.rescue&&pt&&pt.tri&&pt.lvl===1;
  if(a==='calm')return p.role===3&&!S.used.calm&&S.comp>0;
  return false;
}
function freeBed(lvl){
  // level-1 patients need a resuscitation bed; others take a general bed first, red bed if needed
  if(lvl===1){for(let k=0;k<S.red;k++)if(!S.beds[k])return k;return -1;}
  for(let k=S.red;k<S.beds.length;k++)if(!S.beds[k])return k;
  for(let k=0;k<S.red;k++)if(!S.beds[k])return k;
  return -1;
}
function act(i,a,ptId,arg){
  const pt=ptId!=null?findPt(ptId):null;
  if(!canAct(i,a,pt,arg))return false;
  const who=pn(i);
  if(a==='tri'){S.ap-=triCost(i);if(S.players[i].role===2)S.used.freeTri=true;pt.tri=true;log(`${who} 檢傷：${esc(pt.name)} 是 <b>${pt.lvl} 級（${LV_N[pt.lvl]}）</b>，需要${pt.needs.map(n=>NEEDS[n.n]).join('、')}。`);}
  else if(a==='bed'){S.ap-=1;const b=freeBed(pt.lvl);S.wait=S.wait.filter(x=>x.id!==pt.id);S.beds[b]=pt;log(`${who} 把 ${esc(pt.name)} 送上${b<S.red?'急救床':'一般床'}。`);}
  else if(a==='need'){const nd=pt.needs[arg];S.ap-=needCost(i,nd.n);nd.d=true;log(`${who} 為 ${esc(pt.name)} 完成${NEEDS[nd.n]}。`);checkDone(pt);}
  else if(a==='stab'){S.ap-=1;const g=S.players[i].role===1?2:1;pt.t+=g;log(`${who} 穩定 ${esc(pt.name)} 的狀況，倒數 +${g}。`);}
  else if(a==='rescue'){S.used.rescue=true;pt.t+=2;log(`${who} 對 ${esc(pt.name)} 急救，倒數 +2。`,'k');}
  else if(a==='calm'){S.used.calm=true;S.comp--;log(`${who} 安撫家屬，投訴 −1。`);}
  return true;
}
function playCard(i,ci,ptId){
  const p=S.players[i],c=p.hand[ci];const pt=ptId!=null?findPt(ptId):null;
  const ok=cardUsable(c,pt);if(!ok)return false;
  p.hand.splice(ci,1);
  const who=pn(i);
  if(c==='coffee'){S.ap++;log(`${who} 灌了一杯加班咖啡，+1 行動點。`);}
  else if(c==='senior'){const nd=pt.needs.find(n=>!n.d);nd.d=true;log(`${who} 找學長支援，${esc(pt.name)} 的${NEEDS[nd.n]}完成。`);checkDone(pt);}
  else if(c==='transfer'){S.wait=S.wait.filter(x=>x.id!==pt.id);log(`${who} 安排 ${esc(pt.name)} 轉院。`);}
  else if(c==='extra'){S.beds.push(null);log(`${who} 爭取到加床，一般床 +1。`);}
  else if(c==='cart'){pt.t+=3;log(`${who} 推來急救推車，${esc(pt.name)} 倒數 +3。`,'k');}
  else if(c==='calmc'){S.comp=Math.max(0,S.comp-1);log(`${who} 出面安撫家屬，投訴 −1。`);}
  else if(c==='rapid'){S.wait.forEach(x=>x.tri=true);log(`${who} 啟動快篩，候診區全部完成檢傷。`);}
  return true;
}
function cardUsable(c,pt){
  if(c==='senior')return pt&&pt.tri&&where(pt)>=0&&pt.needs.some(n=>!n.d);
  if(c==='transfer')return pt&&pt.tri&&where(pt)<0&&pt.lvl>=3;
  if(c==='cart')return !!pt;
  if(c==='calmc')return S.comp>0;
  if(c==='rapid')return S.wait.some(x=>!x.tri);
  return true;
}
function checkDone(pt){
  if(pt.needs.every(n=>n.d)){
    const b=where(pt);if(b>=0)S.beds[b]=null;else S.wait=S.wait.filter(x=>x.id!==pt.id);
    S.saved.push({name:pt.name,lvl:pt.lvl0,pts:6-pt.lvl0});
    log(`${esc(pt.name)} 處理完成，順利${pt.lvl0<=2?'轉入病房':'出院'}！`,'q');
    if(UI.sel===pt.id)UI.sel=null;
  }
}
function endTurn(){
  S.turn++;
  if(S.turn>=S.players.length){endRound();return;}
  beginTurn();
}
function endRound(){
  S.turn=0;
  // deterioration
  const dead=[];
  allPts().forEach(pt=>{
    pt.t--;pt.age++;
    if(pt.t<=0){
      if(pt.lvl===1){dead.push(pt);return;}
      pt.lvl--;pt.t=LV_T[pt.lvl];
      if(!pt.needs.some(n=>n.n==='護'&&!n.d))pt.needs.push({n:'護',d:false});
      log(`${esc(pt.name)} 病情惡化，變成 ${pt.lvl} 級${pt.tri?'':'（還沒檢傷，沒人發現）'}。`,'k');
    }
  });
  dead.forEach(pt=>{const b=where(pt);if(b>=0)S.beds[b]=null;else S.wait=S.wait.filter(x=>x.id!==pt.id);S.deaths++;log(`${esc(pt.name)} 搶救不及，宣告不治。`,'k');});
  // VIP
  allPts().forEach(pt=>{if(pt.vip&&S.r>=pt.vip){S.comp+=2;pt.vip=null;log('議員等太久，上了新聞：投訴 +2。','k');}});
  // overflow
  if(S.wait.length>WAIT_CAP){
    const extra=S.wait.length-WAIT_CAP;
    const leave=S.wait.slice().sort((a,b)=>b.age-a.age||a.id-b.id).slice(0,extra);
    S.wait=S.wait.filter(x=>!leave.includes(x));
    leave.forEach(pt=>{if(pt.lvl<=2){S.deaths++;log(`${esc(pt.name)} 等不到床位自行離院，在路上倒下了（${pt.lvl} 級，算一次死亡）。`,'k');}else{S.comp++;log(`${esc(pt.name)} 等太久自行離開，投訴 +1。`,'k');}});
  }
  if(checkLose())return;
  if(S.r>=ROUNDS){finish(true);return;}
  S.r++;
  render();save();
  if(humans().length){showRoundModal();}else startRound();
}
function showRoundModal(){
  S.phase='between';render();
  openModal(`<h2>${HOURS(S.r)}</h2><p class="sub">新的兩小時開始了。救回 ${S.saved.length} 人、死亡 ${S.deaths}/${diff().death}、投訴 ${S.comp}/${diff().comp}。</p>
   <div class="acts"><button class="btn primary" data-m="go">繼續值班</button></div>`,()=>{closeModal();S.phase='turn';startRound();});
}
function checkLose(){
  if(S.deaths>=diff().death){finish(false,`死亡人數達到 ${S.deaths} 人。`);return true;}
  if(S.comp>=diff().comp){finish(false,`投訴累積 ${S.comp} 件，院長下令停診。`);return true;}
  return false;
}
function scoreOf(){return S.saved.reduce((a,s)=>a+s.pts,0);}
function stars(){const sc=scoreOf();const n=S.players.length;const k=sc/((.32*n+.05)*diff().rate);return k>=65?3:k>=50?2:1;}
function finish(win,why){
  S.phase='end';S.win=win;S.why=why||'撐到天亮了！';
  log(win?`早上 08:00，交班！救回 ${S.saved.length} 位病人。`:`值班失敗：${why}`,'q');
  clearSave();render();endModal();
}
function endModal(){
  const st=S.win?stars():0;
  openModal(`<h2>${S.win?'撐到天亮':'值班失敗'}</h2><div class="win">${S.win?'交班成功':'急診停診'}</div>${S.win?`<div class="stars">${'★'.repeat(st)}${'☆'.repeat(3-st)}</div>`:''}
   <p class="sub">${S.why}</p>
   <div class="tablewrap"><table class="res"><thead><tr><th>項目</th><th>數字</th></tr></thead><tbody>
   <tr><td>難度</td><td>${diff().n}</td></tr><tr><td>救回病人</td><td>${S.saved.length}</td></tr><tr><td>救治分數（1 級 5 分 … 5 級 1 分）</td><td>${scoreOf()}</td></tr>
   <tr><td>死亡</td><td>${S.deaths} / ${diff().death}</td></tr><tr><td>投訴</td><td>${S.comp} / ${diff().comp}</td></tr><tr><td>撐到</td><td>${HOURS(Math.min(S.r+(S.win?1:0),ROUNDS+1))}</td></tr></tbody></table></div>
   <div class="acts"><button class="btn" data-m="close">看看急診室</button><button class="btn primary" data-m="again">再來一局</button></div>`,m=>{closeModal();if(m==='again')setupGame(S.cfg);});
}

/* ================= AI teammate ================= */
function aiStep(i){
  const p=S.players[i];const me=ROLES[p.role].need;
  const pts=allPts();
  // cards first
  for(let ci=0;ci<p.hand.length;ci++){
    const c=p.hand[ci];
    if(c==='coffee'&&S.ap<=1&&pts.some(x=>x.tri&&where(x)>=0&&x.needs.some(n=>!n.d)))return playCard(i,ci);
    if(c==='extra'&&S.wait.some(x=>x.tri&&x.lvl>1)&&freeBed(3)<0)return playCard(i,ci);
    if(c==='calmc'&&S.comp>=diff().comp-2)return playCard(i,ci);
    if(c==='rapid'&&S.wait.filter(x=>!x.tri).length>=3)return playCard(i,ci);
    if(c==='cart'){const d=pts.filter(x=>x.lvl<=2&&x.t<=1)[0];if(d)return playCard(i,ci,d.id);}
    if(c==='senior'){const d=pts.filter(x=>x.tri&&where(x)>=0&&x.needs.some(n=>!n.d)).sort((a,b)=>a.lvl-b.lvl||a.t-b.t)[0];if(d&&d.lvl<=2)return playCard(i,ci,d.id);}
    if(c==='transfer'&&S.wait.length>=WAIT_CAP-1){const d=S.wait.filter(x=>x.tri&&x.lvl>=4)[0];if(d)return playCard(i,ci,d.id);}
  }
  if(canAct(i,'calm')&&S.comp>0)return act(i,'calm');
  // rescue dying level-1
  const crit=pts.filter(x=>x.tri&&x.lvl===1&&x.t<=1);
  for(const c of crit)if(canAct(i,'rescue',c))return act(i,'rescue',c.id);
  // patients about to die: finish my need or stabilize
  const urgent=pts.filter(x=>x.tri&&x.t<=1&&x.lvl<=2).sort((a,b)=>a.lvl-b.lvl);
  for(const u of urgent){
    if(where(u)>=0){const k=u.needs.findIndex(n=>!n.d&&n.n===me);if(k>=0&&canAct(i,'need',u,k)&&u.needs.filter(n=>!n.d).length===1)return act(i,'need',u.id,k);}
    if(canAct(i,'stab',u))return act(i,'stab',u.id);
  }
  // move critical triaged waiting patients to beds
  const wt=S.wait.filter(x=>x.tri).sort((a,b)=>a.lvl-b.lvl||a.t-b.t);
  for(const w of wt)if(canAct(i,'bed',w))return act(i,'bed',w.id);
  // triage unknowns (lab prioritises)
  const unk=S.wait.filter(x=>!x.tri);
  if(unk.length&&(p.role===2||triCost(i)<=1)&&canAct(i,'tri',unk[0]))return act(i,'tri',unk[0].id);
  // do my role's need on bedded patients, most severe first
  const bedded=S.beds.filter(Boolean).sort((a,b)=>a.lvl-b.lvl||a.t-b.t);
  for(const b of bedded){const k=b.needs.findIndex(n=>!n.d&&n.n===me);if(k>=0&&canAct(i,'need',b,k))return act(i,'need',b.id,k);}
  // finish patients with only one remaining need even off-role
  for(const b of bedded){const rem=b.needs.filter(n=>!n.d);if(rem.length===1){const k=b.needs.indexOf(rem[0]);if(canAct(i,'need',b,k)&&(b.lvl<=3||S.ap>=2))return act(i,'need',b.id,k);}}
  // stabilize lowest timer severe patient
  const low=pts.filter(x=>x.tri&&x.lvl<=3&&x.t<=2).sort((a,b)=>a.t-b.t)[0];
  if(low&&canAct(i,'stab',low))return act(i,'stab',low.id);
  if(unk.length&&canAct(i,'tri',unk[0]))return act(i,'tri',unk[0].id);
  for(const b of bedded){const k=b.needs.findIndex(n=>!n.d);if(k>=0&&canAct(i,'need',b,k))return act(i,'need',b.id,k);}
  return false;
}

/* ================= flow ================= */
function proceed(){
  clearTimeout(timer);save();
  if(!S||!$('#overlay').hidden)return;
  if(S.phase!=='turn')return render();
  const i=S.turn,p=S.players[i];
  if(p.ai){
    render();
    timer=setTimeout(()=>{
      const did=aiStep(i);
      if(!did||S.ap<=0&&!p.hand.includes('coffee')){if(S.phase==='turn')endTurn();return;}
      if(S.phase==='turn')proceed();
    },humans().length?Math.min(SPEED,420):SPEED/4);
    return;
  }
  const viewerKey=S.solo?0:i;
  if(S.viewer!==viewerKey&&humans().length>1&&!S.solo){
    S.viewer=null;render();
    openModal(`<div class="handoff">${avatar(i)}</div><h2>請把裝置交給 ${esc(p.name)}（${ROLES[p.role].n}）</h2><p class="sub">輪到你的 3 點行動。你的處置卡只有你看得到，請不要直接說出卡名，用「我有辦法幫忙」這類說法溝通。</p>
     <div class="acts"><button class="btn primary" data-m="go">我是 ${esc(p.name)}，開始</button></div>`,()=>{closeModal();S.viewer=viewerKey;render();scrollDeskIntoView();});
    return;
  }
  S.viewer=viewerKey;
  render();
}

/* ================= view ================= */
function myTurn(){return S.phase==='turn'&&!S.players[S.turn].ai&&$('#overlay').hidden&&(S.solo||humans().length===1||S.viewer===S.turn);}
function render(){
  if(!S)return;
  let st='';for(let r=1;r<=ROUNDS;r++){if(r>1)st+=`<span class="link ${r<=S.r?'done':''}"></span>`;st+=`<span class="step ${r<S.r||S.phase==='end'?'done':r===S.r&&S.phase!=='idle'?'now':''}">${HOURS(r).slice(0,2)}</span>`;}
  $('#steps').innerHTML=st;
  const head={idle:'今晚不平靜',turn:'分流、搶床、救人',between:'下一個兩小時',end:S.win?'天亮了':'急診停診'}[S.phase];
  $('#hero').innerHTML=`<div class="hero-art">${heroArt()}</div><div class="hero-txt"><div class="eyebrow">EMERGENCY ROOM</div><h2>${head}<span class="qbadge">${S.phase==='idle'?'準備接班':HOURS(S.r)+(ev()?'・'+ev().n:'')}</span></h2>${swoosh}</div>`;
  $('#gauges').innerHTML=S.phase==='idle'?'':`<div class="gauge"><small>時間</small><b>${HOURS(S.r)}</b></div><div class="gauge"><small>救回</small><b>${S.saved.length}</b></div><div class="gauge ${S.deaths>=diff().death-1?'bad':''}"><small>死亡</small><b>${S.deaths}/${diff().death}</b></div><div class="gauge ${S.comp>=diff().comp-2?'bad':''}"><small>投訴</small><b>${S.comp}/${diff().comp}</b></div>`;
  renderBoard();renderDesk();renderPlayers();
  $('#feed').innerHTML=feedHTML(S.log,l=>l.r?HOURS(l.r):'—','每一位病人的動向都會記在這裡。');
}
function ptHTML(pt){
  const lv=pt.tri?pt.lvl:0;
  const pips=Array.from({length:Math.max(pt.t,LV_T[Math.max(1,pt.lvl)])},(_,k)=>`<i class="${k<pt.t?'on':''}"></i>`).join('');
  return `<button class="pt ${UI.sel===pt.id?'sel':''}" data-pt="${pt.id}">${pt.vip?`<span class="vip">VIP 到 ${HOURS(pt.vip).slice(0,2)}點</span>`:''}<span class="top"><span class="lv lv${lv}">${pt.tri?pt.lvl:'?'}</span><span>${esc(pt.name)}</span></span>
   ${pt.tri?`<span class="tm ${pt.t<=1?'warn':''}">倒數 ${pips}</span><span class="nd">${pt.needs.map(n=>`<span class="r-${n.n} ${n.d?'done':''}">${NEEDS[n.n]}</span>`).join('')}</span>`:'<span class="tm">尚未檢傷，病情不明</span>'}</button>`;
}
function renderBoard(){
  if(S.phase==='idle'){$('#beds').innerHTML='';$('#wait').innerHTML='';return;}
  $('#beds').innerHTML=`<div class="bedgrid">${S.beds.map((b,k)=>`<div class="bed ${k<S.red?'red':''}"><span class="bl">${k<S.red?'急救床 '+(k+1):'一般床 '+(k-S.red+1)}</span>${b?ptHTML(b):''}</div>`).join('')}</div>`;
  $('#bednote').textContent=`1 級病人只能上急救床`;
  $('#wait').innerHTML=`<div class="waitgrid">${S.wait.map(ptHTML).join('')||'<div class="empty2">候診區沒有人。</div>'}</div>`;
  $('#waitnote').textContent=`${S.wait.length} / ${WAIT_CAP}（超過的人會自行離開並投訴）`;
}
function myIntel(i){
  const p=S.players[i];
  return `<div class="intel"><div class="ilab">${ICONS.lock}${esc(p.name)} 的處置卡</div><ul>${p.hand.map(c=>`<li><span class="rt">${CARDS[c].n}</span><span>${CARDS[c].d}</span></li>`).join('')||'<li>沒有卡</li>'}</ul><div class="inote">多人遊戲時，請不要直接說出你的卡名。</div></div>`;
}
function renderDesk(){
  let h=leafDeco;
  if(S.phase==='turn'){
    const i=S.turn,p=S.players[i],R=ROLES[p.role];
    if(myTurn()){
      const pt=UI.sel!=null?findPt(UI.sel):null;if(!pt)UI.sel=null;
      h+=`<div class="dhead"><h2><span class="role"><i style="background:${R.c}"></i>${R.n}</span></h2><span class="pill">${HOURS(S.r)}</span></div><div class="dsub">${esc(p.name)}・${R.d}</div>
       <div class="dlab">行動點<small>剩 ${S.ap} 點</small></div><div class="apbar">${Array.from({length:Math.max(S.ap,AP)},(_,k)=>`<i class="${k<S.ap?'on':''}"></i>`).join('')}</div>
       ${ev()?`<div class="dnote">${ev().n}：${ev().d}</div>`:''}`;
      if(pt){
        const inBed=where(pt)>=0;
        h+=`<div class="selpt"><div class="top"><span class="lv lv${pt.tri?pt.lvl:0}">${pt.tri?pt.lvl:'?'}</span>${esc(pt.name)}</div>${pt.tri?`<div>倒數 ${pt.t}・${inBed?'在床上':'在候診區'}</div><div class="nd">${pt.needs.map(n=>`<span class="${n.d?'done':''}">${NEEDS[n.n]}</span>`).join('')}</div>`:'<div>還沒檢傷</div>'}</div>
         <div class="acts2">
          ${!pt.tri?`<button data-a="tri" ${canAct(i,'tri',pt)?'':'disabled'}>檢傷分級<span>${triCost(i)} 點</span></button>`:''}
          ${pt.tri&&!inBed?`<button data-a="bed" ${canAct(i,'bed',pt)?'':'disabled'}>送上床位<span>${freeBed(pt.lvl)<0?(pt.lvl===1?'急救床滿了':'沒有空床'):'1 點'}</span></button>`:''}
          ${pt.tri?pt.needs.map((n,k)=>n.d?'':`<button data-a="need" data-k="${k}" ${canAct(i,'need',pt,k)?'':'disabled'}>完成${NEEDS[n.n]}<span>${inBed?needCost(i,n.n)+' 點':'要先上床'}</span></button>`).join(''):''}
          <button data-a="stab" ${canAct(i,'stab',pt)?'':'disabled'}>穩定病況<span>1 點・倒數 +${p.role===1?2:1}</span></button>
          ${p.role===0&&pt.tri&&pt.lvl===1?`<button data-a="rescue" ${canAct(i,'rescue',pt)?'':'disabled'}>急救<span>免費・倒數 +2</span></button>`:''}
         </div>`;
      }else h+=`<div class="empty"><b>點一位病人</b>在左邊的床位或候診區選病人，這裡會出現可以做的事。</div>`;
      if(p.role===3)h+=`<div class="acts2"><button data-a="calm" ${canAct(i,'calm')?'':'disabled'}>安撫家屬<span>免費・投訴 −1</span></button></div>`;
      if(p.hand.length)h+=`<div class="dsec"><div class="dlab">處置卡<small>${pt?'會用在選定的病人':'有些卡要先選病人'}</small></div><div class="cards">${p.hand.map((c,ci)=>`<button data-card="${ci}" ${cardUsable(c,pt)?'':'disabled style="opacity:.45;cursor:not-allowed"'}><b>${CARDS[c].n}</b><span>${CARDS[c].d}</span></button>`).join('')}</div></div>`;
      h+=`<button class="confirm" id="btnEnd">${S.ap>0?'結束這個角色的回合':'回合結束'} ${ICONS.arrow}</button>`;
    }else{
      h+=`<div class="dhead"><h2>${p.ai?'隊友行動':'換人操作'}</h2><span class="pill soft">${HOURS(S.r)}</span></div><div class="think">${avatar(i)}<div><b>${esc(p.name)}・${R.n}</b><div>${p.ai?`剩 ${S.ap} 點，處理中<span class="dots"></span>`:'等待交接裝置'}</div></div></div>`;
    }
  }else if(S.phase==='end'){
    h+=`<div class="dhead"><h2>${S.win?'交班成功':'值班失敗'}</h2><span class="pill">${diff().n}</span></div><div class="empty"><b>救回 ${S.saved.length} 人</b>${S.why}</div>
     <button class="passbtn" id="btnResult">再看一次結算</button><button class="confirm" id="btnAgain">再來一局 ${ICONS.arrow}</button>`;
  }else if(S.phase==='idle'){
    h+=`<div class="dhead"><h2>準備接班</h2></div><div class="empty"><b>設定團隊後開始</b>1 到 4 人合作，單人模式由你一人操作醫師和護理師。</div>`;
  }else{
    h+=`<div class="dhead"><h2>交接中</h2><span class="pill soft">${HOURS(S.r)}</span></div><div class="empty"><b>下一個兩小時</b>新病人即將到院。</div>`;
  }
  $('#desk').innerHTML=h;
}
function renderPlayers(){
  $('#players').innerHTML=S.players.map((p,i)=>{const R=ROLES[p.role];return `<div class="pl ${S.phase==='turn'&&i===S.turn?'cur':''}">${avatar(p.role)}<div style="min-width:0"><div class="nm">${esc(p.name)}${p.ai?'<span class="tag">AI</span>':''}</div>
    <div class="fig"><span class="role"><i style="background:${R.c}"></i>${R.n}</span><span>卡<b>${p.hand.length}</b></span></div></div></div>`;}).join('');
}
function heroArt(){return `<svg viewBox="0 0 640 180" preserveAspectRatio="xMaxYMid slice" aria-hidden="true">
  <rect width="640" height="180" fill="#E8EEF0"/>
  <rect x="200" y="20" width="440" height="140" fill="#F5F8F8"/>
  <rect x="380" y="34" width="120" height="30" rx="6" fill="#C8432F"/><text x="440" y="56" font-size="18" font-weight="900" fill="#fff" text-anchor="middle" letter-spacing="4">急診 ER</text>
  <path d="M220 110h60l12-26 16 52 14-38 10 12h60" fill="none" stroke="#2C8F4E" stroke-width="4" stroke-linejoin="round"/>
  <g transform="translate(470 104)"><rect width="130" height="16" rx="4" fill="#9BB5BD"/><rect x="0" y="-14" width="34" height="14" rx="5" fill="#FFFBF4"/><rect x="10" y="16" width="6" height="26" fill="#6E8790"/><rect x="114" y="16" width="6" height="26" fill="#6E8790"/><circle cx="13" cy="44" r="5" fill="#3B4A44"/><circle cx="117" cy="44" r="5" fill="#3B4A44"/></g>
  <g transform="translate(560 30)"><rect x="0" y="0" width="4" height="70" fill="#9BB5BD"/><rect x="-14" y="4" width="18" height="26" rx="5" fill="#BFE3F2"/></g>
  <rect x="160" y="160" width="480" height="20" fill="#C9D6DA"/>
 </svg>`;}

/* ================= setup & rules ================= */
function showSetup(){
  clearTimeout(timer);
  const sv=lsGet(SAVE_KEY);const c=setupCfg;
  const seats=c.n===1?`<div class="seats"><div class="seat">${avatar(0)}<input data-seat="0" value="${esc(c.seats[0].name)}" maxlength="10" aria-label="玩家名稱"><span class="note">單人：醫師＋護理師</span></div></div>`
   :`<div class="seats">${c.seats.slice(0,c.n).map((s,i)=>`<div class="seat">${avatar(i)}<input data-seat="${i}" value="${esc(s.name)}" maxlength="10" aria-label="${ROLES[i].n}"><div class="seg"><button data-m="h:${i}" class="${s.ai?'':'on'}">人類</button><button data-m="a:${i}" class="${s.ai?'on':''}">AI</button></div></div>`).join('')}</div><p class="note">角色依序是：${ROLES.slice(0,c.n).map(r=>r.n).join('、')}。</p>`;
  openModal(`<div class="setup-art">${heroArt()}</div><h2>急診室24小時</h2><p class="sub">早上八點接班，到明天早上八點交班。病人一直湧進來，有人只是扭到腳，有人下一秒就會倒下。檢傷分級、搶床位、分工合作，撐到天亮。</p>
   <div class="pitch"><div><b>檢傷分級</b>病人進來時看不出輕重，先檢傷才知道是 1 級危急還是 5 級輕症。</div><div><b>惡化倒數</b>每位病人都有倒數，歸零就惡化，1 級再歸零就救不回來。</div><div><b>不怕一人指揮</b>每人的處置卡是秘密的，不能直接說卡名，每個角色只有自己最會做的事。</div></div>
   <div class="field"><span>玩家人數</span><div class="seg">${[1,2,3,4].map(k=>`<button data-m="n:${k}" class="${k===c.n?'on':''}">${k===1?'單人':k+' 人'}</button>`).join('')}</div></div>
   ${seats}
   <div class="field"><span>難度</span><div class="seg">${DIFF.map((d,k)=>`<button data-m="d:${k}" class="${k===c.diff?'on':''}">${d.n}</button>`).join('')}</div></div>
   <p class="note">${DIFF[c.diff].n}：死亡 ${DIFF[c.diff].death} 人或投訴 ${DIFF[c.diff].comp} 件就失敗。${DIFF[c.diff].d}</p>
   <div class="field"><span>AI 速度</span><div class="seg">${Object.keys(SPEEDS).map(k=>`<button data-m="sp:${k}" class="${k===c.speed?'on':''}">${k}</button>`).join('')}</div></div>
   <div class="acts"><a class="btn ghost" href="${LOBBY}">← 回大廳</a><button class="btn" data-m="rules">先看規則</button>${sv&&sv.phase==='turn'?'<button class="btn" data-m="resume">繼續上一局</button>':''}<button class="btn primary" data-m="start">開始值班</button></div>`,
  m=>{
    document.querySelectorAll('[data-seat]').forEach(inp=>{c.seats[+inp.dataset.seat].name=inp.value;});
    if(m.startsWith('n:')){c.n=+m.slice(2);return showSetup();}
    if(m.startsWith('d:')){c.diff=+m.slice(2);return showSetup();}
    if(m.startsWith('h:')||m.startsWith('a:')){c.seats[+m.slice(2)].ai=m[0]==='a';return showSetup();}
    if(m.startsWith('sp:')){c.speed=m.slice(3);SPEED=SPEEDS[c.speed];return showSetup();}
    if(m==='rules')showRules();
    else if(m==='resume'){closeModal();SPEED=SPEEDS[c.speed];S=sv;S.viewer=null;UI={};render();proceed();}
    else if(m==='start'){
      closeModal();SPEED=SPEEDS[c.speed];
      const players=c.seats.slice(0,Math.max(1,c.n)).map((s,i)=>({name:(s.name||'').trim()||(s.ai?AI_NAMES[i]:'玩家'+(i+1)),ai:c.n===1?false:s.ai}));
      setupGame({solo:c.n===1,diff:c.diff,players});
    }
  });
}
function showRules(){showRulesHTML(`
  <p><b>一句話：</b>全合作。大家一起經營急診室 24 小時，把湧進來的病人檢傷、送上床、治療出院，撐到天亮。</p>
  <p>1–4 人（含單人模式）・30–45 分鐘・12 歲以上</p>
  <h3>角色</h3><ul>${ROLES.map(r=>`<li><b>${r.n}：</b>${r.d}</li>`).join('')}</ul>
  <p>2 人玩醫師＋護理師，3 人加檢驗師，4 人加社工。單人模式由你一人輪流操作醫師和護理師。</p>
  <h3>每一回合（兩小時，共 ${ROUNDS} 回合）</h3>
  <ol><li><b>翻事件、病人到院：</b>新病人進候診區，臉朝下看不出病情。深夜會有一波高峰。</li>
  <li><b>每個角色輪流行動，各 ${AP} 點：</b>
   <ul><li>檢傷分級（1 點）：翻開病人的級數、需求和倒數。</li>
   <li>送上床位（1 點）：只有床上的病人可以治療。1 級病人只能上急救床。</li>
   <li>完成一項需求：自己專長 1 點，別人的專長 2 點。需求有診斷（醫師）、處置（護理師）、檢驗（檢驗師）、安置（社工）。</li>
   <li>穩定病況（1 點）：倒數 +1（護理師 +2）。</li>
   <li>每回合開始抽 1 張處置卡（手上最多 ${HAND_MAX} 張），隨時可以打出，不花點數。</li></ul></li>
  <li><b>病情變化：</b>所有病人倒數 −1。歸零就惡化一級、倒數重算，並多一項處置需求。1 級歸零就宣告不治。</li>
  <li><b>候診區滿了：</b>超過 ${WAIT_CAP} 人時，等最久的病人自行離開。3 級以上每人投訴 +1；1、2 級的人離開會在外面倒下，算一次死亡。</li></ol>
  <table><tr><th>級數</th><th>名稱</th><th>倒數</th><th>救回得分</th></tr>${[1,2,3,4,5].map(l=>`<tr><td>${l}</td><td>${LV_N[l]}</td><td>${LV_T[l]}</td><td>${6-l}</td></tr>`).join('')}</table>
  <h3>勝負</h3><p>撐到第 ${ROUNDS} 回合結束（隔天早上 08:00）就成功，依救治分數評 1–3 星。死亡人數或投訴達到難度上限就失敗。</p>
  <table><tr><th>難度</th><th>死亡上限</th><th>投訴上限</th><th>病人量</th></tr>${DIFF.map(d=>`<tr><td>${d.n}</td><td>${d.death}</td><td>${d.comp}</td><td>×${d.rate}</td></tr>`).join('')}</table>
  <h3>事件卡</h3><ul>${EVENTS.map(e=>`<li><b>${e.n}：</b>${e.d}</li>`).join('')}</ul>
  <h3>處置卡</h3><ul>${Object.values(CARDS).map(c=>`<li><b>${c.n}：</b>${c.d}</li>`).join('')}</ul>
  <h3>避免「一個老手指揮全場」</h3><ul><li>處置卡只有自己看得到，討論時不能說出卡名或效果，只能說「我可以幫忙穩住一個人」這類模糊的話。</li>
  <li>每個角色的專長只要 1 點，別人做要 2 點，所以每個人都得自己判斷這回合怎麼花最有效。</li></ul>
  <h3>致勝心法</h3><ul><li>先檢傷再說。看起來不痛不癢的人，可能是快倒下的 1 級。</li>
  <li>急救床很寶貴，不要讓 4、5 級病人佔著。</li><li>深夜高峰前，先把床位清出來。</li></ul>`);}

/* ================= input ================= */
document.querySelector('main').addEventListener('click',e=>{
  const b=e.target.closest('[data-pt]');if(!b)return;
  UI.sel=+b.dataset.pt;render();if(innerWidth<=1040&&myTurn())scrollDeskIntoView();
});
$('#desk').addEventListener('click',e=>{
  if(e.target.closest('#btnAgain')){setupGame(S.cfg);return;}
  if(e.target.closest('#btnResult')){endModal();return;}
  if(!myTurn())return;
  const b=e.target.closest('button');if(!b||b.disabled)return;
  const i=S.turn;
  if(b.dataset.a){act(i,b.dataset.a,UI.sel,b.dataset.k!=null?+b.dataset.k:undefined);save();}
  else if(b.dataset.card!=null){playCard(i,+b.dataset.card,UI.sel);save();}
  else if(b.id==='btnEnd'){endTurn();return;}
  else return;
  render();
});
$('#btnRules').addEventListener('click',showRules);
$('#btnNew').addEventListener('click',()=>{if(S&&S.phase!=='end'&&S.phase!=='idle'){openModal(`<h2>放棄這次值班？</h2><p class="sub">目前的進度會被清除。</p><div class="acts"><button class="btn" data-m="no">繼續值班</button><button class="btn primary" data-m="yes">重新開始</button></div>`,m=>{if(m==='yes'){clearTimeout(timer);clearSave();showSetup();}else{closeModal();if(S.phase==='between')showRoundModal();else proceed();}});}else showSetup();});

/* ================= boot ================= */
window.__game={setupGame,setSpeed:v=>{SPEED=v;},get S(){return S;},aiStep};
(function boot(){
  S={players:[{name:'—',ai:true,role:0,hand:[]},{name:'—',ai:true,role:1,hand:[]}],diff:1,r:1,turn:0,ap:0,used:{},beds:[],red:2,wait:[],saved:[],deaths:0,comp:0,phase:'idle',log:[],viewer:null};
  render();showSetup();
})();

</script>
<script>if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("../../sw.js",{scope:"../../"}).catch(()=>{}));</script>
