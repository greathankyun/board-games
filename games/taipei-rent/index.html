<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>台北租屋大逃殺</title>
<meta name="description" content="原創交易談判桌遊：房東、二房東、房客互相開條件，換房間、漲房租、檢舉違建，每人藏著一張秘密目標，看誰住得最好、賺得最多。">
<meta name="theme-color" content="#1E5641">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="icon" href="../../icons/icon-192.png">
<link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="桌遊大廳">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Outfit:wght@600;700;800&display=swap">
<style>
:root{
  --paper:#F5EEE1; --paper2:#EFE6D4; --card:#FFFBF4; --ink:#1F2B27; --muted:#6E7068; --line:#E5D9C3; --line2:#D9CBB1;
  --green:#1E5641; --green2:#28704F; --green-ink:#F3F7EF; --yellow:#F5C443; --yellow-ink:#2A2310;
  --orange:#E9643B; --pink:#F7DDD3; --pink2:#EFC6B8; --up:#2C8F4E; --up-bg:#D5EEDA; --down:#C8432F; --down-bg:#F7DAD3; --flat-bg:#ECE5D7;
  --red:#D7542B; --red-bg:#F8DCCF; --blue:#2E7DC0; --blue-bg:#D6E7F5; --violet:#7A5AD3; --violet-bg:#E4DCF7; --gold:#D19A17; --gold-bg:#F6E7BE;
  --p0:#E58FA0; --p1:#8B67D6; --p2:#4F9E61; --p3:#E0922F; --p4:#3E9CC4; --p5:#C8573E; --p6:#6C7A3A; --p7:#5C6BC0;
  --scrim:rgba(40,32,20,.45);
  --f-body:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
  --f-num:'Outfit','Noto Sans TC',system-ui,sans-serif;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55;font-weight:500}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
  background-image:radial-gradient(rgba(120,90,40,.07) 1px,transparent 1px);background-size:5px 5px}
.wrap{position:relative;z-index:1;max-width:1600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 28px}
h1,h2,h3,h4{text-wrap:balance;margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
svg{display:block}

/* header */
.top{display:flex;align-items:center;gap:14px 22px;flex-wrap:wrap;padding-block:6px 12px;border-bottom:1.5px solid var(--line2)}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit}
.brand svg{width:44px;height:44px;flex:none}
.brand h1{font-size:clamp(26px,3.4vw,38px);font-weight:900;letter-spacing:.06em;line-height:1}
.brand small{font-family:var(--f-num);font-size:12px;letter-spacing:.42em;color:var(--ink);font-weight:600;margin-left:6px}
.homelink{display:inline-flex;align-items:center;gap:6px;font-size:15px;font-weight:900;color:var(--ink);text-decoration:none;border:1.5px solid var(--ink);border-radius:12px;padding:7px 12px;background:var(--card)}.homelink svg{width:18px;height:18px}
.vsep{width:1.5px;align-self:stretch;background:var(--line2);margin-block:6px}
.steps{display:flex;align-items:center;flex:1;min-width:0;justify-content:center}
.step{font-family:var(--f-num);font-weight:700;font-size:15px;padding:5px 14px;border-radius:999px;border:1.5px solid var(--line2);background:var(--card);color:var(--ink);white-space:nowrap}
.step.done{color:var(--muted);background:var(--paper2)}
.step.now{background:var(--green);border-color:var(--green);color:var(--green-ink);font-size:17px;padding:6px 18px}
.link{flex:1;min-width:8px;max-width:56px;height:2px;background:repeating-linear-gradient(90deg,var(--line2) 0 4px,transparent 4px 8px)}
.link.done{background:var(--green)}
.tops{display:flex;gap:10px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--ink);background:var(--card);color:var(--ink);padding:8px 16px;border-radius:12px;cursor:pointer;font-weight:700;line-height:1.2;text-decoration:none}
.btn svg{width:18px;height:18px}
.btn:hover:not(:disabled){transform:translateY(-1px)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.dark,.btn.primary{background:var(--green);border-color:var(--green);color:var(--green-ink)}
.btn.ghost{background:transparent}

/* layout */
.board{display:grid;grid-template-columns:minmax(0,1fr) minmax(340px,430px);grid-template-areas:"hero desk" "main desk";grid-template-rows:auto 1fr;gap:14px 18px;margin-top:12px;align-items:start}
.hero{grid-area:hero;position:relative;min-height:140px;display:flex;align-items:center;overflow:hidden;border-radius:18px}
.hero-txt{position:relative;z-index:2;padding:8px 0 10px}
.eyebrow{display:flex;align-items:center;gap:12px;font-family:var(--f-num);font-weight:600;letter-spacing:.32em;font-size:13px}
.eyebrow::after{content:"";width:80px;height:1.5px;background:var(--ink)}
.hero h2{font-size:clamp(28px,4vw,48px);font-weight:900;letter-spacing:.03em;line-height:1.15;margin-top:6px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.swoosh{display:block;width:150px;height:14px;margin-top:-2px}
.qbadge{position:relative;font-size:17px;font-weight:900;border:2px solid var(--ink);border-radius:999px;padding:3px 14px;background:var(--card);letter-spacing:.04em}
.hero-art{position:absolute;right:0;top:0;bottom:0;width:min(62%,640px);z-index:1;
  -webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 28%);mask-image:linear-gradient(90deg,transparent 0%,#000 28%)}
.hero-art svg{width:100%;height:100%}
main{grid-area:main;min-width:0}
.sect{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:900;padding-bottom:10px;border-bottom:1.5px solid var(--line2);margin:0 0 12px}
.sect svg{width:26px;height:26px;color:var(--orange)}
.sect{flex-wrap:wrap}
.sect small{font-size:13px;color:var(--muted);font-weight:700;margin-left:auto}
@media (max-width:640px){.sect small{flex-basis:100%;margin-left:0}}

/* desk */
.desk{grid-area:desk;position:sticky;top:max(10px,env(safe-area-inset-top,0px));background:var(--green);color:var(--green-ink);border-radius:26px;padding:24px 24px 22px;overflow:hidden;display:flex;flex-direction:column;gap:14px;box-shadow:0 18px 40px rgba(20,60,45,.25)}
.desk .leaf{position:absolute;right:-30px;top:-20px;width:190px;height:190px;opacity:.9;pointer-events:none}
.desk>*{position:relative}
.dhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.dhead h2{font-size:clamp(26px,2.6vw,36px);font-weight:900;letter-spacing:.04em;line-height:1.1}
.pill{background:var(--orange);color:#fff;font-weight:900;border-radius:999px;padding:5px 14px;font-size:15px;white-space:nowrap}
.pill.soft{background:rgba(255,255,255,.16)}
.dsub{font-weight:700;font-size:15px;margin-top:-6px;opacity:.9}
.dlab{font-size:14px;opacity:.9;font-weight:900;display:flex;align-items:center;gap:8px;justify-content:space-between}
.dlab small{font-weight:700;opacity:.8;font-size:12px}
.dnote{font-size:13px;font-weight:700;background:rgba(255,255,255,.12);border-radius:10px;padding:7px 12px}
.dnote.warn{background:rgba(233,100,59,.28)}
.confirm{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:none;border-radius:16px;background:var(--yellow);color:var(--yellow-ink);font-size:22px;font-weight:900;padding:13px;cursor:pointer;box-shadow:0 4px 0 #C99A1E;letter-spacing:.06em}
.confirm svg{width:24px;height:24px}
.confirm:active:not(:disabled){transform:translateY(2px);box-shadow:0 2px 0 #C99A1E}
.confirm:disabled{opacity:.5;cursor:not-allowed}
.passbtn{width:100%;border:2px solid rgba(255,255,255,.85);background:transparent;color:var(--green-ink);border-radius:14px;font-weight:900;font-size:17px;padding:10px;cursor:pointer}
.passbtn:hover{background:rgba(255,255,255,.08)}
.empty{border:2px dashed rgba(255,255,255,.35);border-radius:16px;padding:20px 16px;text-align:center;font-weight:700;opacity:.92}
.empty b{display:block;font-size:19px;margin-bottom:4px}
.think{display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.1);border-radius:16px;padding:14px}
.think .av{width:56px;height:56px;flex:none}
.think b{font-size:19px}
.dots::after{content:"…";display:inline-block;animation:blink 1.1s steps(3) infinite}
@keyframes blink{0%{opacity:.2}50%{opacity:1}100%{opacity:.2}}
.chooser{display:flex;flex-wrap:wrap;gap:6px}
.chooser button{border:2px solid rgba(255,255,255,.55);background:transparent;color:var(--green-ink);border-radius:12px;padding:7px 12px;font-weight:900;cursor:pointer;display:inline-flex;align-items:center;gap:6px;min-height:40px}
.chooser button .av{width:24px;height:24px}
.chooser button.on{background:var(--card);color:var(--ink);border-color:var(--card)}
.chooser button:disabled{opacity:.35;cursor:not-allowed}
.chooser button.red.on{background:var(--red);border-color:var(--red);color:#fff}
.chooser button.blue.on{background:var(--blue);border-color:var(--blue);color:#fff}
.chooser.big button{flex:1;justify-content:center;font-size:16px}
.opt2{display:flex;flex-direction:column;gap:6px}
.opt2 button{display:flex;justify-content:space-between;gap:10px;align-items:center;text-align:left;border:2px solid rgba(255,255,255,.4);background:transparent;color:var(--green-ink);border-radius:12px;padding:9px 12px;cursor:pointer}
.opt2 button b{font-weight:900;font-size:15px}
.opt2 button span{font-size:12px;opacity:.85}
.opt2 button.on{background:var(--card);color:var(--ink);border-color:var(--card)}
.opt2 button.on span{opacity:1;color:var(--muted)}
.opt2 button:disabled{opacity:.35;cursor:not-allowed}
.dsec{display:flex;flex-direction:column;gap:8px;padding-top:12px;border-top:1px solid rgba(255,255,255,.2)}

/* private note card */
.intel{position:relative;background:var(--pink);color:var(--ink);border-radius:14px;padding:14px 16px 12px;box-shadow:0 6px 14px rgba(0,0,0,.18)}
.intel::after{content:"";position:absolute;right:0;top:0;width:28px;height:28px;background:linear-gradient(225deg,var(--green) 50%,var(--pink2) 50%);border-bottom-left-radius:8px}
.intel .ilab{display:flex;align-items:center;gap:8px;font-weight:900;color:#B24A35;font-size:16px;padding-bottom:8px;border-bottom:1.5px solid var(--pink2)}
.intel .ilab svg{width:20px;height:20px}
.intel ul{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:260px;overflow:auto}
.intel li{font-size:13.5px;line-height:1.45;display:flex;gap:8px;align-items:flex-start}
.intel li .rt{font-family:var(--f-num);font-weight:700;font-size:11px;border:1.5px solid var(--pink2);border-radius:6px;padding:0 5px;background:var(--card);white-space:nowrap;margin-top:1px}
.intel li.void{opacity:.45;text-decoration:line-through}
.intel .inote{font-size:12.5px;color:#5B4A40;margin-top:8px}
.intel .big{font-size:22px;font-weight:900;margin:8px 0 2px}
.stamp{border:1.5px solid #B24A35;color:#B24A35;border-radius:8px;padding:1px 9px;font-weight:900;font-size:12px;white-space:nowrap;display:inline-block;transform:rotate(-3deg)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:900;padding:1px 9px;border-radius:8px;background:var(--flat-bg);color:var(--ink);white-space:nowrap}
.chip.red{background:var(--red);color:#fff}.chip.blue{background:var(--blue);color:#fff}.chip.violet{background:var(--violet);color:#fff}
.chip.gold{background:var(--gold-bg);color:#6B4D07}.chip.green{background:var(--up-bg);color:var(--up)}.chip.down{background:var(--down-bg);color:var(--down)}

/* feed */
.feed{margin-top:18px}
.feedlist{list-style:none;margin:0;padding:0;overflow:auto;max-height:320px}
.feedlist li{display:grid;grid-template-columns:auto 34px minmax(0,1fr);gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.qtag{font-family:var(--f-num);font-weight:700;font-size:12px;border:1.5px solid var(--line2);border-radius:6px;padding:1px 6px;background:var(--card)}
.feedlist .av{width:34px;height:34px}
.feedlist .txt{font-size:13.5px;line-height:1.45;min-width:0}
.feedlist .ic{width:34px;height:34px;border-radius:50%;background:var(--paper2);display:grid;place-items:center;color:var(--green)}
.feedlist .ic svg{width:18px;height:18px}
.feedlist li.q .txt{font-weight:900;color:var(--green)}
.feedlist li.k .txt{color:#8A4A12}
.pn{font-weight:900;color:var(--ink)}

/* players strip */
.players{margin-top:18px;background:var(--card);border:1.5px solid var(--line);border-radius:20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));padding:8px;gap:6px;box-shadow:0 8px 20px rgba(90,70,30,.06)}
.pl{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:14px;position:relative;min-width:0}
.pl.cur{background:var(--pink)}
.pl .av{width:52px;height:52px;flex:none}
.pl .nm{font-size:17px;font-weight:900;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tag{font-size:11px;font-weight:700;border:1.5px solid var(--line2);border-radius:6px;padding:0 5px;color:var(--muted);background:var(--card)}
.pl .fig{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:13px;color:var(--muted)}
.pl .fig b{font-family:var(--f-num);font-weight:800;color:var(--ink);font-size:16px;margin-left:3px}

/* responsive */
@media (max-width:1040px){
  .board{grid-template-columns:minmax(0,1fr);grid-template-areas:"hero" "desk" "main"}
  .desk{position:relative;top:0}
  .hero-art{width:70%;opacity:.55}
}
@media (max-width:640px){
  .vsep{display:none}
  .steps{order:3;flex-basis:100%;justify-content:flex-start;overflow-x:auto;padding-bottom:2px}
  .step{padding:4px 10px;font-size:13px}.step.now{padding:5px 12px;font-size:15px}
  .brand small{display:none}
  .desk{padding:20px 16px;border-radius:22px}
  .tops .btn{padding:8px 11px}
}

/* modals */
.overlay{position:fixed;inset:0;background:var(--scrim);display:grid;place-items:center;z-index:50;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--card);color:var(--ink);border-radius:24px;border:1.5px solid var(--line);width:min(660px,100%);max-height:calc(100dvh - 32px);overflow:auto;padding:24px;box-shadow:0 30px 70px rgba(40,30,10,.3)}
.modal h2{font-size:27px;font-weight:900;margin-bottom:6px;letter-spacing:.03em}
.modal .sub{color:var(--muted);margin:0 0 14px}
.modal .acts{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}
.modal .acts .btn{padding:10px 20px;font-size:16px}
.modal .intel::after{background:linear-gradient(225deg,var(--card) 50%,var(--pink2) 50%)}
.seats{display:flex;flex-direction:column;gap:10px}
.seat{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center}
.seat .av{width:44px;height:44px}
.seat input{font:inherit;font-weight:700;padding:9px 12px;border:1.5px solid var(--line2);border-radius:12px;background:var(--paper);color:var(--ink);min-width:0;width:100%}
.seg{display:inline-flex;border:1.5px solid var(--line2);border-radius:12px;overflow:hidden;background:var(--paper);flex-wrap:wrap}
.seg button{border:none;background:transparent;color:var(--muted);padding:8px 12px;cursor:pointer;font-weight:700}
.seg button.on{background:var(--green);color:var(--green-ink)}
.field{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:14px 0;flex-wrap:wrap}
.field>span{font-weight:900;font-size:16px}
.note{font-size:12px;color:var(--muted)}
.pitch{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:0 0 6px}
.pitch div{background:var(--paper);border-radius:14px;padding:12px;font-size:13px;color:var(--muted)}
.pitch b{display:block;color:var(--ink);font-size:15px;font-weight:900;margin-bottom:2px}
.setup-art{height:120px;margin:-24px -24px 16px;overflow:hidden;border-radius:24px 24px 0 0}
.setup-art svg{width:100%;height:100%}
.rules{font-size:15px;line-height:1.8}
.rules h3{font-size:19px;font-weight:900;margin:18px 0 6px;color:var(--green)}
.rules p,.rules li{max-width:64ch}
.rules ol,.rules ul{padding-left:1.3em;margin:6px 0}
.rules table{border-collapse:collapse;font-size:14px;margin:6px 0;width:100%}
.rules td,.rules th{border-top:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.rules th{font-size:12px;color:var(--muted)}
.handoff .av{width:84px;height:84px;margin-bottom:10px}
table.res{width:100%;border-collapse:collapse;margin-top:12px;font-size:14px}
table.res th{font-size:12px;color:var(--muted);text-align:right;font-weight:700;padding:4px 6px}
table.res td{text-align:right;padding:8px 6px;border-top:1px solid var(--line);font-family:var(--f-num);font-weight:700;font-variant-numeric:tabular-nums}
table.res th:first-child,table.res td:first-child{text-align:left;font-family:var(--f-body)}
.tablewrap{overflow-x:auto}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--muted)}
.win{font-size:32px;font-weight:900;color:var(--green);margin:4px 0}
.revlist{display:flex;flex-direction:column;gap:8px}
.rev{border:1.5px solid var(--line2);border-radius:14px;padding:10px 14px;background:var(--paper);display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.rev h4{font-size:16px;font-weight:900}
.rev .kn{font-size:12.5px;color:var(--muted);font-weight:700}
@media (prefers-reduced-motion:reduce){.dots::after{animation:none}.btn{transition:none}}

/* Layout: four districts as columns of room cards on the left; the green desk holds your actions and the trade builder. */
.map{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.brand small{display:none}
.dist{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:10px;display:flex;flex-direction:column;gap:8px;box-shadow:0 2px 0 var(--line)}
.dist h4{font-size:17px;font-weight:900;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.dist h4 small{font-size:12px;font-weight:700;color:var(--muted)}
.room{border:1.5px solid var(--line2);border-radius:12px;padding:8px 10px;background:var(--paper);display:grid;grid-template-columns:40px minmax(0,1fr);gap:8px;align-items:center;position:relative}
.room svg.ic{width:40px;height:40px}
.room b{font-size:14.5px;font-weight:900;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.room small{display:flex;flex-wrap:wrap;gap:3px 8px;font-size:12px;color:var(--muted);font-weight:700}
.room small i{font-style:normal;color:var(--ink)}
.room .who{display:flex;gap:4px;align-items:center;margin-top:2px;flex-wrap:wrap}
.room .who .av{width:22px;height:22px}
.room.mine{border-color:var(--green);background:#EAF3EC}
.room.home{box-shadow:inset 0 0 0 2px var(--orange)}
.room.dead{opacity:.45;text-decoration:line-through}
.room.gov{background:var(--blue-bg);border-color:#B9D3EA}
.room.pick{cursor:pointer}.room.pick:hover{border-color:var(--ink)}
.room.sel{outline:3px solid var(--yellow);outline-offset:1px}
.own{font-size:11px;font-weight:900;border-radius:6px;padding:0 6px;background:var(--card);border:1px solid var(--line2)}
.rep{font-size:11px;font-weight:900;color:var(--down);background:var(--down-bg);border-radius:6px;padding:0 5px}
.acts2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.acts2 button{border:2px solid rgba(255,255,255,.45);background:transparent;color:var(--green-ink);border-radius:12px;padding:8px 10px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:1px}

  cool:{n:'打房政策',d:'每區房價 −2（最低回到原價）'},
  bonus:{n:'年終獎金',d:'每人 +3'},
  calm:{n:'平靜的兩個月',d:'沒有特別的事'},
};
const AI_NAMES=['包租婆','阿傑','小美','陳董','室友','房仲阿明'];
const SAVE_KEY='taipei-rent-save-v1';

/* ================= helpers on a state ================= */
function owned(i,st=S){return st.rooms.filter(r=>r.owner===i&&!r.dead);}
function resident(id,st=S){return st.players.findIndex(p=>p.home===id);}
function homeRoom(i,st=S){const h=st.players[i].home;return h==null?null:st.rooms[h];}
function rent(r,st=S){if(r.t==='social')return 1;return TY[r.t].rent+(st.L[r.d]-1)+r.bonus+(st.rentUp?1:0);}
function value(r,st=S){if(r.dead||r.t==='social')return 0;return TY[r.t].val+2*(st.L[r.d]-1)+st.boom[r.d];}
function comfort(r,st=S){return r?TY[r.t].q+st.L[r.d]-1:0;}
function price(i,r,st=S){const v=value(r,st);return st.players[i].role==='builder'?Math.ceil(v*.8):v;}
function buildCost(i,d,st=S){const c=4+2*(st.L[d]-1);return st.players[i].role==='builder'?Math.ceil(c/2):c;}
const vacant=(r,st=S)=>!r.dead&&resident(r.id,st)<0;
function clone(){return JSON.parse(JSON.stringify({rooms:S.rooms,players:S.players,L:S.L,boom:S.boom,rentUp:S.rentUp}));}

/* ================= state ================= */
let S=null, UI={}, tick=null;
let setupCfg={n:4,seats:[{name:'你',ai:false}].concat(AI_NAMES.slice(0,5).map(n=>({name:n,ai:true}))),speed:'中',timer:true};
const NP=()=>S.players.length;
const humans=()=>S.players.filter(p=>!p.ai);
const pn=i=>`<b class="pn" data-p="${i}">${esc(S.players[i].name)}</b>`;
const rn=r=>`${DISTS[r.d].n}${TY[r.t].n}`;
function log(html,cls=''){const m=/data-p="(\d)"/.exec(html);S.log.unshift({h:html,c:cls,a:m?+m[1]:null,r:S.round});if(S.log.length>220)S.log.length=220;}
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(S));}catch(e){}}
function clearSave(){lsSet(SAVE_KEY,null);}

/* ================= setup ================= */
function setupGame(players){
  clearTimeout(timer);
  const rooms=[];LAYOUT.forEach((ts,d)=>ts.forEach(t=>rooms.push({id:rooms.length,d,t,owner:t==='social'?-2:-1,bonus:0,rep:0,dead:false})));
  const roles=shuffle(ROLE_KEYS.slice()),goals=shuffle(GOAL_KEYS.slice());
  S={players:players.map((p,i)=>({name:p.name,ai:p.ai,role:roles[i],goal:goals[i],money:START_MONEY,home:null,comfort:0,reports:0,lottery:false,freeProp:0})),
     rooms,L:DISTS.map(d=>d.L),boom:[0,0,0,0],rentUp:false,round:1,start:Math.random()*players.length|0,cur:0,acts:ACTS,
     phase:'event',events:shuffle(Object.keys(EVENTS)).slice(0,ROUNDS),log:[],rej:{},cfgPlayers:players,viewer:null};
  const priv=shuffle(rooms.filter(r=>r.t!=='social'));
  S.players.forEach((p,i)=>{
    if(p.role==='landlord')p.money-=4;if(p.role==='tenant')p.money+=6;
    for(let k=0;k<(p.role==='landlord'?3:2)&&priv.length;k++)priv.pop().owner=i;
  });
  const homes=shuffle(rooms.filter(r=>r.t!=='social'));
  S.players.forEach((p,i)=>{const h=homes.find(r=>vacant(r));p.home=h.id;});
  S.cur=S.start;
  const hs=humans();S.viewer=hs.length===1?S.players.indexOf(hs[0]):null;
  log('租約到期，大家開始找房、談條件。','q');
  UI={};eventPhase();
}
function eventPhase(){
  S.phase='event';const k=S.events[S.round-1],ev=EVENTS[k];
  const extra=applyEvent(k);
  render();save();
  openModal(`<h2>${MONTHS[S.round-1]} · 新聞快報</h2><div class="intel" style="margin:6px 0 4px"><div class="ilab">${ICONS.spark}${ev.n}</div><div class="inote" style="font-size:14px">${ev.d}</div>${extra?`<div class="big" style="font-size:17px">${extra}</div>`:''}</div>
    <p class="sub">接下來每人輪流做 ${ACTS} 個行動，可以搬家、買房、漲租、檢舉、加蓋或提案交易。兩個月結束時收房租。</p>
    <div class="acts"><button class="btn primary" data-m="go">開始行動</button></div>`,()=>{closeModal();S.phase='act';S.cur=S.start;S.acts=ACTS;S.players.forEach(p=>p.freeProp=p.role==='agent'?1:0);UI={};startTurn();});
  if(!humans().length)timer=setTimeout(()=>modalCb&&modalCb('go'),SPEED*2);
}
function applyEvent(k){
  if(k==='metro'){const ds=DISTS.map((_,d)=>d).filter(d=>S.L[d]<4);const d=pick(ds);S.L[d]++;log(`捷運新站：${DISTS[d].n}地段升到 ${S.L[d]}`,'q');return `${DISTS[d].n}地段 +1`;}
  if(k==='renewal'){const d=Math.random()*4|0;S.boom[d]+=3;log(`都更傳聞：${DISTS[d].n}房價 +3`,'q');return `${DISTS[d].n}房價 +3`;}
  if(k==='typhoon'){const out=[];S.rooms.filter(r=>r.t==='roof'&&!r.dead&&r.owner>=0).forEach(r=>{S.players[r.owner].money-=2;out.push(S.players[r.owner].name);});log(`颱風夜：頂加屋主付修繕費（${out.join('、')||'沒人'}）`,'q');return out.length?`${out.join('、')} 各付 2`:'沒有玩家擁有頂加';}
  if(k==='inspect'){const ds=S.rooms.filter(r=>r.t==='roof'&&!r.dead&&r.rep>0);ds.forEach(demolish);log(`違建大稽查：拆了 ${ds.length} 間頂加`,'q');return ds.length?`拆了 ${ds.map(rn).join('、')}`:'沒有被檢舉過的頂加';}
  if(k==='school'){const out=[];S.rooms.filter(r=>r.owner>=0&&vacant(r)).forEach(r=>{S.players[r.owner].money+=2;out.push(rn(r));});log(`開學季：空房短租 ${out.length} 間`,'q');return out.length?`${out.join('、')} 屋主各 +2`:'沒有空著的玩家房間';}
  if(k==='inflation'){S.rentUp=true;log('物價上漲：本輪租金 +1','q');return '';}
  if(k==='cool'){S.boom=S.boom.map(b=>Math.max(0,b-2));log('打房政策：房價回落','q');return '';}
  if(k==='bonus'){S.players.forEach(p=>p.money+=3);log('年終獎金：每人 +3','q');return '';}
  log('平靜的兩個月','q');return '';
}
function demolish(r){
  r.dead=true;const ow=r.owner;r.owner=-1;
  const j=resident(r.id);
  if(j>=0){S.players[j].home=null;const alt=S.rooms.filter(x=>x.owner===-1&&vacant(x)&&x.t!=='social').sort((a,b)=>rent(a)-rent(b))[0];if(alt)S.players[j].home=alt.id;
    log(`${pn(j)} 住的頂加被拆，${alt?'只好搬去 '+rn(alt):'只能睡朋友家沙發'}`,'k');}
  if(ow>=0)log(`${pn(ow)} 的 ${rn(r)} 被拆除`,'k');
}

/* ================= actions ================= */
function legal(i,a,id,st=S){
  const p=st.players[i],r=id!=null?st.rooms[id]:null;
  switch(a){
    case 'move':return r&&vacant(r,st)&&r.t!=='social'&&p.home!==id&&(p.role==='tenant'||p.money>=1);
    case 'buy':return r&&r.owner===-1&&!r.dead&&r.t!=='social'&&p.money>=price(i,r,st);
    case 'raise':return r&&r.owner===i&&!r.dead&&r.bonus<2;
    case 'report':return r&&r.t==='roof'&&!r.dead&&r.owner>=0&&r.owner!==i&&st.players[r.owner].role!=='chief'&&(p.role==='chief'||p.money>=1);
    case 'build':return r&&r.owner===i&&!r.dead&&(r.t==='suite'||r.t==='flat')&&st.rooms.filter(x=>x.d===r.d&&!x.dead).length<6&&p.money>=buildCost(i,r.d,st);
    case 'lottery':return !p.lottery&&st.rooms.some(x=>x.t==='social');
  }
  return false;
}
function doAction(i,a,id,st=S,quiet=false){
  const p=st.players[i],r=id!=null?st.rooms[id]:null,L=quiet?()=>{}:log;
  if(a==='move'){if(p.role!=='tenant')p.money-=1;p.home=id;L(`${pn(i)} 搬進 ${rn(r)}（月租 ${rent(r,st)}）`);}
  else if(a==='buy'){const c=price(i,r,st);p.money-=c;r.owner=i;L(`${pn(i)} 花 ${c} 跟銀行買下 ${rn(r)}`);}
  else if(a==='raise'){r.bonus++;L(`${pn(i)} 把 ${rn(r)} 的房租漲到 ${rent(r,st)}`,'k');}
  else if(a==='report'){if(p.role!=='chief')p.money-=1;const ow=st.players[r.owner];ow.money-=3;r.rep++;p.reports++;L(`${pn(i)} 檢舉 ${pn(r.owner)} 的 ${rn(r)} 是違建，屋主罰 3`,'k');if(r.rep>=2){if(quiet){r.dead=true;r.owner=-1;const j=resident(r.id,st);if(j>=0)st.players[j].home=null;}else demolish(r);}}
  else if(a==='build'){p.money-=buildCost(i,r.d,st);st.rooms.push({id:st.rooms.length,d:r.d,t:'roof',owner:i,bonus:0,rep:0,dead:false});L(`${pn(i)} 在${DISTS[r.d].n}頂樓加蓋一間頂加`,'k');}
  else if(a==='lottery'){p.lottery=true;L(`${pn(i)} 登記社宅抽籤`);}
}
function applyTrade(o,st=S){
  const a=st.players[o.from],b=st.players[o.to];
  a.money+=o.take.money-o.give.money;b.money+=o.give.money-o.take.money;
  o.give.rooms.forEach(id=>st.rooms[id].owner=o.to);o.take.rooms.forEach(id=>st.rooms[id].owner=o.from);
  if(o.swap){const h=a.home;a.home=b.home;b.home=h;}
}
function tradeOK(o,st=S){
  const a=st.players[o.from],b=st.players[o.to];
  if(o.give.money>Math.max(0,a.money)||o.take.money>Math.max(0,b.money))return false;
  if(o.give.rooms.some(id=>st.rooms[id].owner!==o.from)||o.take.rooms.some(id=>st.rooms[id].owner!==o.to))return false;
  return o.give.money||o.take.money||o.give.rooms.length||o.take.rooms.length||o.swap;
}
function tradeTxt(o,side){
  const s=side==='give'?o.give:o.take,out=s.rooms.map(id=>rn(S.rooms[id]));
  if(s.money)out.push(`$${s.money}`);
  if(o.swap)out.push(side==='give'?`你的住處（${S.players[o.from].home!=null?rn(S.rooms[S.players[o.from].home]):'沙發'}）`:`對方住處（${S.players[o.to].home!=null?rn(S.rooms[S.players[o.to].home]):'沙發'}）`);
  return out.length?out:['（沒有）'];
}
function settleTrade(o,ok){
  const a=o.from,b=o.to;
  if(ok){applyTrade(o);log(`${pn(a)} 和 ${pn(b)} 成交：${tradeTxt(o,'give').join('、')} 換 ${tradeTxt(o,'take').join('、')}`,'k');
    S.players.forEach((p,k)=>{if(p.role==='agent'&&k!==a&&k!==b){p.money+=1;}});}
  else{log(`${pn(b)} 拒絕了 ${pn(a)} 的提案`);S.rej[key(o)]=S.round;}
}
const key=o=>JSON.stringify([o.from,o.to,o.give,o.take,o.swap]);

/* ================= round end ================= */
function endRound(){
  // lottery
  S.rooms.filter(r=>r.t==='social'&&vacant(r)).forEach(r=>{
    const pool=[];S.players.forEach((p,i)=>{if(p.lottery){pool.push(i);if(p.role==='tenant')pool.push(i);}});
    if(!pool.length)return;const w=pick(pool);S.players[w].home=r.id;S.players[w].lottery=false;
    log(`社宅抽籤：${pn(w)} 中籤，搬進 ${rn(r)}！`,'k');
  });
  S.players.forEach(p=>p.lottery=false);
  const rows=[];
  S.players.forEach((p,i)=>{
    const h=homeRoom(i);let pay=0,to='';
    if(h&&h.owner!==i){pay=rent(h);p.money-=pay;
      if(h.owner>=0){S.players[h.owner].money+=pay;to=S.players[h.owner].name;}
      else if(h.owner===-1){to='大房東';const sub=S.players.findIndex(q=>q.role==='sub');if(sub>=0&&sub!==i){S.players[sub].money+=Math.floor(pay/2);to+='（二房東抽成）';}}
      else to='政府';}
    const c=comfort(h);p.comfort+=c;
    rows.push(`<tr><td>${esc(p.name)}</td><td>${h?rn(h):'沙發'}</td><td>${pay?'−'+pay+' → '+esc(to):'自住'}</td><td>+${c}</td><td>${p.money}</td></tr>`);
  });
  log(`${MONTHS[S.round-1]} 收房租`,'q');
  S.rentUp=false;
  render();save();
  openModal(`<h2>${MONTHS[S.round-1]} · 收房租</h2><p class="sub">每個人付房租給自己住的房間的屋主，並得到居住分。</p>
   <div class="tablewrap"><table class="res"><thead><tr><th>玩家</th><th>住處</th><th>房租</th><th>居住分</th><th>現金</th></tr></thead><tbody>${rows.join('')}</tbody></table></div>
   <div class="acts"><button class="btn primary" data-m="go">${S.round>=ROUNDS?'年底結算':'下兩個月'}</button></div>`,()=>{closeModal();
     if(S.round>=ROUNDS){finish();return;}
     S.round++;S.start=(S.start+1)%NP();if(humans().length>1)S.viewer=null;eventPhase();});
  if(!humans().length)timer=setTimeout(()=>modalCb&&modalCb('go'),SPEED*2);
}

/* ================= scoring ================= */
function scoreOf(i,st=S){
  const p=st.players[i];
  const prop=owned(i,st).reduce((a,r)=>a+value(r,st),0);
  const g=GOALS[p.goal].f(i,st)?GOALS[p.goal].v:0;
  return {money:p.money,prop,comfort:p.comfort,goal:g,total:p.money+prop+p.comfort+g};
}
function finish(){
  S.phase='end';S.viewer=null;stopTick();
  const sc=S.players.map((_,i)=>scoreOf(i));S.final=sc;
  const best=Math.max(...sc.map(s=>s.total));
  let ws=sc.map((s,i)=>i).filter(i=>sc[i].total===best);
  if(ws.length>1){const mc=Math.max(...ws.map(i=>sc[i].comfort));ws=ws.filter(i=>sc[i].comfort===mc);}
  S.winners=ws;log(`年底結算：${ws.map(i=>esc(S.players[i].name)).join('、')} 是租屋界贏家`,'q');
  clearSave();render();endModal();
}
function endModal(){
  const sc=S.final;
  openModal(`<h2>年底結算</h2><div class="win">${S.winners.map(i=>esc(S.players[i].name)).join('、')} 勝出</div>
   <p class="sub">現金 + 房產價值 + 累積居住分 + 秘密目標。平手時居住分高的人贏。</p>
   <div class="tablewrap"><table class="res"><thead><tr><th>玩家</th><th>身分</th><th>現金</th><th>房產</th><th>居住</th><th>秘密目標</th><th>總分</th></tr></thead><tbody>
   ${sc.map((s,i)=>({s,i})).sort((a,b)=>b.s.total-a.s.total).map(({s,i})=>{const p=S.players[i];return `<tr><td>${esc(p.name)}</td><td>${ROLES[p.role].n}</td><td>${s.money}</td><td>${s.prop}</td><td>${s.comfort}</td><td>${GOALS[p.goal].n} ${s.goal?'+'+s.goal:'✗'}</td><td><b>${s.total}</b></td></tr>`;}).join('')}</tbody></table></div>
   <div class="acts"><button class="btn" data-m="close">看看房市</button><button class="btn primary" data-m="again">再來一局</button></div>`,m=>{closeModal();if(m==='again')setupGame(S.cfgPlayers);});
}

/* ================= AI ================= */
function est(i,st,withGoal){
  const p=st.players[i],left=ROUNDS-S.round+1,h=homeRoom(i,st);
  let v=p.money+p.comfort+owned(i,st).reduce((a,r)=>a+value(r,st),0);
  v+=left*(comfort(h,st)-(h&&h.owner!==i?rent(h,st):0));
  owned(i,st).forEach(r=>{const j=resident(r.id,st);if(j>=0&&j!==i)v+=left*rent(r,st)*.9;else if(j<0)v+=left*.8;});
  if(p.role==='sub')st.rooms.forEach(r=>{const j=resident(r.id,st);if(r.owner===-1&&j>=0&&j!==i)v+=left*Math.floor(rent(r,st)/2);});
  if(p.money<0)v+=p.money*.5;
  if(withGoal&&GOALS[p.goal].f(i,st))v+=GOALS[p.goal].v*(S.round>=4?1:.75);
  return v;
}
function leaderOther(i){let b=-1,bv=-1e9;S.players.forEach((_,j)=>{if(j!==i){const v=est(j,S,false);if(v>bv){bv=v;b=j;}}});return b;}
function evalAct(i,fn){
  const st=clone(),ld=leaderOther(i);
  const b0=est(i,S,true),l0=est(ld,S,false);
  fn(st);
  return est(i,st,true)-b0-.3*(est(ld,st,false)-l0);
}
function aiCandidates(i){
  const out=[];
  S.rooms.forEach(r=>{['move','buy','raise','report','build'].forEach(a=>{if(legal(i,a,r.id))out.push({a,id:r.id});});});
  if(legal(i,'lottery')&&S.rooms.some(r=>r.t==='social'&&vacant(r)))out.push({a:'lottery'});
  return out;
}
function aiTradeIdeas(i){
  const ideas=[],me=S.players[i];
  const add=(o,mine,theirs)=>{if(tradeOK(o)&&!(S.rej[key(o)]===S.round))ideas.push({o,mine,theirs});};
  S.players.forEach((q,j)=>{
    if(j===i)return;
    owned(j).forEach(r=>{const o0={from:i,to:j,give:{money:0,rooms:[]},take:{money:0,rooms:[r.id]},swap:false};
      const A=tradeGain(o0,i,true),B=-tradeGain(o0,j,false);
      if(A-B>2.5){const m=Math.max(0,Math.min(me.money,Math.round((A+B)/2+.5)));const o={...o0,give:{money:m,rooms:[]}};add(o,A-m,m-B);}});
    owned(i).forEach(r=>{const o0={from:i,to:j,give:{money:0,rooms:[r.id]},take:{money:0,rooms:[]},swap:false};
      const A=-tradeGain(o0,i,true),B=tradeGain(o0,j,false);
      if(B-A>2.5){const m=Math.max(0,Math.min(q.money,Math.round((A+B)/2)));const o={...o0,take:{money:m,rooms:[]}};add(o,m-A,B-m);}
      owned(j).forEach(r2=>{const o1={from:i,to:j,give:{money:0,rooms:[r.id]},take:{money:0,rooms:[r2.id]},swap:false};
        const a=tradeGain(o1,i,true),b=tradeGain(o1,j,false);
        if(a+b>2){const d=Math.round((a-b)/2);const o={...o1,give:{money:Math.max(0,Math.min(me.money,d)),rooms:[r.id]},take:{money:Math.max(0,Math.min(q.money,-d)),rooms:[r2.id]}};add(o,a-Math.max(0,d)+Math.max(0,-d),b+Math.max(0,d)-Math.max(0,-d));}});});
    if(me.home!=null&&q.home!=null){const o1={from:i,to:j,give:{money:0,rooms:[]},take:{money:0,rooms:[]},swap:true};
      const a=tradeGain(o1,i,true),b=tradeGain(o1,j,false);
      if(a+b>2){const d=Math.round((a-b)/2);const o={...o1,give:{money:Math.max(0,Math.min(me.money,d)),rooms:[]},take:{money:Math.max(0,Math.min(q.money,-d)),rooms:[]}};add(o,a-Math.max(0,d)+Math.max(0,-d),b+Math.max(0,d)-Math.max(0,-d));}}
  });
  return ideas;
}
function tradeGain(o,who,withGoal){const st=clone();const b=est(who,S,withGoal);applyTrade(o,st);return est(who,st,withGoal)-b;}
function aiAccept(o){
  if(!tradeOK(o))return false;
  const g=tradeGain(o,o.to,true);
  const lead=est(o.from,S,false)-Math.max(...S.players.map((_,k)=>k===o.from?-1e9:est(k,S,false)));
  return g>=(lead>12?3:1);
}
function aiTurnStep(i){
  // returns {kind:'act',a,id} | {kind:'trade',o} | {kind:'end'}
  const p=S.players[i];
  let best=null,bv=.6;
  aiCandidates(i).forEach(c=>{const v=evalAct(i,st=>doAction(i,c.a,c.id,st,true))+(Math.random()-.5)*.4;if(v>bv){bv=v;best={kind:'act',...c};}});
  if(p.freeProp>0||S.acts>0){
    aiTradeIdeas(i).forEach(({o,mine,theirs})=>{
      if(theirs<1.5||mine<1.2)return;
      const v=mine+(Math.random()-.5)*.6;
      if(v>bv){bv=v;best={kind:'trade',o};}
    });
  }
  return best||{kind:'end'};
}

/* ================= flow ================= */
function startTurn(){
  clearTimeout(timer);stopTick();save();
  if(S.phase!=='act')return render();
  const p=S.players[S.cur];
  UI={};
  if(p.ai){render();timer=setTimeout(aiAct,humans().length?SPEED:SPEED/3);return;}
  if(S.viewer!==S.cur){
    S.viewer=null;render();
    openModal(`<div class="handoff">${avatar(S.cur)}</div><h2>請把裝置交給 ${esc(p.name)}</h2><p class="sub">輪到你行動。畫面會顯示 ${esc(p.name)} 的秘密目標，其他人請別偷看。${setupCfg.timer?`每回合有 ${TURN_SECONDS} 秒談判時間。`:''}</p>
      <div class="acts"><button class="btn primary" data-m="go">我是 ${esc(p.name)}，開始</button></div>`,()=>{closeModal();S.viewer=S.cur;beginHumanTurn();});
    return;
  }
  beginHumanTurn();
}
function beginHumanTurn(){UI={};S.deadline=setupCfg.timer?Date.now()+TURN_SECONDS*1000:null;render();scrollDeskIntoView();startTick();}
function startTick(){stopTick();if(!S.deadline)return;tick=setInterval(()=>{if(!$('#overlay').hidden){S.deadline+=1000;return;}const left=Math.ceil((S.deadline-Date.now())/1000);const el=$('#timer');if(el){el.textContent=`⏳ ${Math.max(0,left)} 秒`;el.classList.toggle('low',left<=15);}if(left<=0){stopTick();log(`${pn(S.cur)} 談判時間到`);endTurn();}},1000);}
function stopTick(){if(tick){clearInterval(tick);tick=null;}}
function aiAct(){
  if(S.phase!=='act')return;
  const i=S.cur,p=S.players[i];
  if(S.acts<=0&&p.freeProp<=0){endTurn();return;}
  const s=aiTurnStep(i);
  if(s.kind==='end'){log(`${pn(i)} 這回合按兵不動`);endTurn();return;}
  if(s.kind==='act'){if(S.acts<=0){endTurn();return;}S.acts--;doAction(i,s.a,s.id);save();render();timer=setTimeout(aiAct,humans().length?SPEED:SPEED/3);return;}
  useProposal(i);
  offer(s.o,()=>{timer=setTimeout(aiAct,humans().length?SPEED:SPEED/3);});
}
function useProposal(i){const p=S.players[i];if(p.freeProp>0)p.freeProp--;else S.acts--;}
function offer(o,then){
  const tgt=S.players[o.to];
  log(`${pn(o.from)} 向 ${pn(o.to)} 提案`);
  if(tgt.ai){const ok=aiAccept(o);settleTrade(o,ok);save();render();then(ok);return;}
  // a human must answer
  const prevViewer=S.viewer;
  const ask=()=>{S.viewer=o.to;render();
    openModal(`<h2>${esc(S.players[o.from].name)} 向你提案</h2><p class="sub">${esc(tgt.name)}，要接受嗎？</p>
      <div class="offer"><div><h5>你會得到</h5><ul>${tradeTxt(o,'give').map(t=>`<li>${esc(t)}</li>`).join('')}</ul></div><div><h5>你要付出</h5><ul>${tradeTxt(o,'take').map(t=>`<li>${esc(t)}</li>`).join('')}</ul></div></div>
      ${myIntel(o.to)}
      <div class="acts"><button class="btn" data-m="no">拒絕</button><button class="btn primary" data-m="yes">成交</button></div>`,m=>{
        closeModal();settleTrade(o,m==='yes');save();
        const back=()=>{S.viewer=prevViewer;if(S.deadline)S.deadline+=0;render();then(m==='yes');};
        if(humans().length>1&&prevViewer!=null&&prevViewer!==o.to&&!S.players[o.from].ai){
          S.viewer=null;render();openModal(`<div class="handoff">${avatar(o.from)}</div><h2>請把裝置還給 ${esc(S.players[o.from].name)}</h2><p class="sub">${m==='yes'?'對方接受了。':'對方拒絕了。'}</p><div class="acts"><button class="btn primary" data-m="go">繼續</button></div>`,()=>{closeModal();back();});
        }else back();
      });};
  if(humans().length>1&&S.viewer!==o.to){
    S.viewer=null;render();
    openModal(`<div class="handoff">${avatar(o.to)}</div><h2>請把裝置交給 ${esc(tgt.name)}</h2><p class="sub">${esc(S.players[o.from].name)} 有一個提案要你決定。</p><div class="acts"><button class="btn primary" data-m="go">我是 ${esc(tgt.name)}</button></div>`,()=>{closeModal();ask();});
  }else ask();
}
function endTurn(){
  stopTick();S.deadline=null;UI={};
  S.cur=(S.cur+1)%NP();S.acts=ACTS;
  if(S.cur===S.start){endRound();return;}
  if(humans().length>1)S.viewer=null;
  startTurn();
}

  <ol><li><b>新聞快報：</b>翻一張事件。</li>
  <li><b>行動：</b>從起手玩家開始，每人做 ${ACTS} 個行動，可以重複：
    <ul>${Object.values(ACT_INFO).map(a=>`<li><b>${a.n}：</b>${a.d}</li>`).join('')}</ul>
    檢舉的頂加累積 2 次就拆除（房契作廢、住戶被迫搬家）。漲房租每間最多 +2。加蓋的費用是 4 + 2×(地段−1)，一區最多 6 間房。</li>
  <li><b>收房租：</b>先抽社宅籤，然後每人付房租給自己住處的屋主，並拿到那間房的居住分。自己住自己的房不用付房租。</li></ol>
  <h3>交易</h3>
  <p>提案可以包含：房契、現金、互換住處，任何組合都行。對方說好才成交。提案不管成不成交都算一個行動。${setupCfg.timer?`每人每回合有 ${TURN_SECONDS} 秒，時間到就換人，避免拖太久。`:''}</p>
  <h3>身分</h3><ul>${Object.values(ROLES).map(r=>`<li><b>${r.n}：</b>${r.d}</li>`).join('')}</ul>
  <h3>秘密目標</h3><ul>${Object.values(GOALS).map(g=>`<li><b>${g.n}（+${g.v}）：</b>${g.d}</li>`).join('')}</ul>
  <h3>事件</h3><ul>${Object.values(EVENTS).map(e=>`<li><b>${e.n}：</b>${e.d}</li>`).join('')}</ul>
  <p>每局隨機抽 ${ROUNDS} 張。</p>
  <h3>小撇步</h3>
  <ul><li>空房不會賺錢。讓別人住進你的房，比自己住更划算。</li>
  <li>漲房租太兇，房客會搬走；搬家要錢，所以小漲通常留得住人。</li>
  <li>觀察別人想買什麼房，能猜到他的秘密目標。</li></ul>`);}

/* ================= input ================= */
$('#desk').addEventListener('click',e=>{
  if(e.target.closest('#btnAgain')){setupGame(S.cfgPlayers);return;}
  if(e.target.closest('#btnResult')){endModal();return;}
  if(!myTurn())return;
  const b=e.target.closest('button');if(!b||b.disabled)return;
  const i=S.cur;
  if(b.dataset.act){const a=b.dataset.act;UI={act:UI.act===a?null:a};if(a==='trade')UI.tr={give:{money:0,rooms:[]},take:{money:0,rooms:[]},swap:false};}
  else if(b.id==='btnDo'){
    if(UI.act==='lottery'){if(S.acts>0){S.acts--;doAction(i,'lottery');}}
    else if(UI.room!=null&&legal(i,UI.act,UI.room)&&S.acts>0){S.acts--;doAction(i,UI.act,UI.room);}
    UI={};save();
    if(S.acts<=0&&S.players[i].freeProp<=0){endTurn();return;}
  }
  else if(b.dataset.tt!=null){UI.t=+b.dataset.tt;UI.tr={give:{money:0,rooms:[]},take:{money:0,rooms:[]},swap:false};}
  else if(b.dataset.gr!=null){const id=+b.dataset.gr,a=UI.tr.give.rooms;UI.tr.give.rooms=a.includes(id)?a.filter(x=>x!==id):a.concat(id);}
  else if(b.dataset.tr!=null){const id=+b.dataset.tr,a=UI.tr.take.rooms;UI.tr.take.rooms=a.includes(id)?a.filter(x=>x!==id):a.concat(id);}
  else if(b.dataset.gm){UI.tr.give.money=Math.max(0,Math.min(Math.max(0,S.players[i].money),UI.tr.give.money+(+b.dataset.gm)));}
  else if(b.dataset.tm){UI.tr.take.money=Math.max(0,Math.min(Math.max(0,S.players[UI.t].money),UI.tr.take.money+(+b.dataset.tm)));}
  else if(b.dataset.swap){UI.tr.swap=!UI.tr.swap;}
  else if(b.id==='btnOffer'){
    const o={from:i,to:UI.t,give:UI.tr.give,take:UI.tr.take,swap:UI.tr.swap};
    if(!tradeOK(o))return;
    useProposal(i);UI={};
    offer(o,()=>{save();if(S.acts<=0&&S.players[i].freeProp<=0){endTurn();}else render();});
    return;
  }
  else if(b.id==='btnEnd'){endTurn();return;}
  else return;
  render();
});
$('#map').addEventListener('click',e=>{
  const el=e.target.closest('[data-room]');if(!el||!myTurn())return;
  UI.room=+el.dataset.room;render();
});
$('#map').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){const el=e.target.closest('[data-room]');if(el){e.preventDefault();el.click();}}});
$('#btnRules').addEventListener('click',showRules);
$('#btnNew').addEventListener('click',()=>{if(S&&S.phase!=='end'&&S.phase!=='idle'){openModal(`<h2>放棄目前這局？</h2><p class="sub">目前的進度會被清除。</p><div class="acts"><button class="btn" data-m="no">繼續玩</button><button class="btn primary" data-m="yes">開新遊戲</button></div>`,m=>{if(m==='yes'){clearTimeout(timer);stopTick();clearSave();showSetup();}else{closeModal();render();}});}else showSetup();});

/* ================= boot ================= */
window.__game={setupGame,setSpeed:v=>{SPEED=v;},get S(){return S;},scoreOf};
(function boot(){
  const rooms=[];LAYOUT.forEach((ts,d)=>ts.forEach(t=>rooms.push({id:rooms.length,d,t,owner:t==='social'?-2:-1,bonus:0,rep:0,dead:false})));
  S={players:Array.from({length:4},()=>({name:'—',ai:true,role:'tenant',goal:'nice',money:START_MONEY,home:null,comfort:0,reports:0})),rooms,L:DISTS.map(d=>d.L),boom:[0,0,0,0],rentUp:false,round:1,start:0,cur:0,acts:ACTS,phase:'idle',events:Object.keys(EVENTS),log:[],rej:{},viewer:null};
  render();showSetup();
})();
</script>
<script>if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("../../sw.js",{scope:"../../"}).catch(()=>{}));</script>
