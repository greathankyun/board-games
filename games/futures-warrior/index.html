<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>期貨戰士</title>
<meta name="description" content="原創看盤對戰遊戲：K 線一根一根揭曉，大家同時決定做多、做空、開幾口、停損放哪裡。每盤結束教你看懂頭肩頂、W 底、三角形、假突破等真實型態。">
<meta name="theme-color" content="#173F3B">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="icon" href="../../icons/icon-192.png">
<link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="遊戲群島">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}img.av{display:block;border-radius:50%;object-fit:cover}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Outfit:wght@600;700;800&display=swap">
<style>
/* Layout: trading terminal on warm paper — hero + big candlestick chart (with live reading panel and feed) on the left,
   a deep-teal order desk on the right, player strip along the bottom. Same visual language as the rest of the series.
   Colours follow the Taiwan market convention: red = up, green = down. */
/* Layout: illustrated market board — hero + company cards (with live feed in the last slot) on the left,
   a deep-green "next move" desk on the right, player strip along the bottom. Single warm-paper look by design. */
:root{
  --paper:#F5EEE1; --paper2:#EFE6D4; --card:#FFFBF4; --ink:#1F2B27; --muted:#6E7068; --line:#E5D9C3; --line2:#D9CBB1;
  --green:#173F3B; --green2:#22574F; --green-ink:#F3F7EF; --yellow:#F5C443; --yellow-ink:#2A2310;
  --orange:#E9643B; --pink:#F7DDD3; --pink2:#EFC6B8; --up:#D2412F; --up-bg:#F8DCD5; --down:#1F8A57; --down-bg:#D3EEDD; --flat-bg:#ECE5D7;
  --c0:#2E7DC0; --c1:#D7542B; --c2:#22987A; --c3:#B7791F; --c4:#7A5AD3;
  --p0:#E58FA0; --p1:#8B67D6; --p2:#4F9E61; --p3:#E0922F; --p4:#3E9CC4; --p5:#C2577A;
  --scrim:rgba(40,32,20,.45);
  --f-body:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
  --f-num:'Outfit','Noto Sans TC',system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55;font-weight:500}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
  background-image:radial-gradient(rgba(120,90,40,.07) 1px,transparent 1px);background-size:5px 5px}
.wrap{position:relative;z-index:1;max-width:1600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 28px}
h1,h2,h3,h4{text-wrap:balance;margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
svg{display:block}

/* ---------- header ---------- */
.top{display:flex;align-items:center;gap:14px 22px;flex-wrap:wrap;padding-block:6px 12px;border-bottom:1.5px solid var(--line2)}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit}
.brand svg{width:44px;height:44px;flex:none}
.brand h1{font-size:clamp(26px,3.4vw,38px);font-weight:900;letter-spacing:.06em;line-height:1}
.brand small{font-family:var(--f-num);font-size:12px;letter-spacing:.42em;color:var(--ink);font-weight:600;margin-left:6px}
.homelink{display:inline-flex;align-items:center;gap:6px;font-size:15px;font-weight:900;color:var(--ink);text-decoration:none;border:1.5px solid var(--ink);border-radius:12px;padding:7px 12px;background:var(--card)}.homelink svg{width:18px;height:18px}
.homelink:hover{color:var(--ink);border-color:var(--ink)}
.vsep{width:1.5px;align-self:stretch;background:var(--line2);margin-block:6px}
.steps{display:flex;align-items:center;flex:1;min-width:0;justify-content:center}
.step{font-family:var(--f-num);font-weight:700;font-size:15px;padding:5px 14px;border-radius:999px;border:1.5px solid var(--line2);background:var(--card);color:var(--ink);white-space:nowrap}
.step.done{color:var(--muted);background:var(--paper2)}
.step.now{background:var(--green);border-color:var(--green);color:var(--green-ink);font-size:17px;padding:6px 18px}
.link{flex:1;min-width:8px;max-width:56px;height:2px;background:repeating-linear-gradient(90deg,var(--line2) 0 4px,transparent 4px 8px);position:relative}
.link.done{background:var(--green)}
.tops{display:flex;gap:10px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--ink);background:var(--card);color:var(--ink);padding:8px 16px;border-radius:12px;cursor:pointer;font-weight:700;line-height:1.2;text-decoration:none}
.btn svg{width:18px;height:18px}
.btn:hover:not(:disabled){transform:translateY(-1px)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.dark{background:var(--green);border-color:var(--green);color:var(--green-ink)}
.btn.primary{background:var(--green);border-color:var(--green);color:var(--green-ink)}
.btn.ghost{background:transparent}

/* ---------- layout ---------- */
.board{display:grid;grid-template-columns:minmax(0,1fr) minmax(340px,430px);grid-template-areas:"hero desk" "main desk";grid-template-rows:auto 1fr;gap:14px 18px;margin-top:12px;align-items:start}
.hero{grid-area:hero;position:relative;min-height:150px;display:flex;align-items:center;overflow:hidden;border-radius:18px}
.hero-txt{position:relative;z-index:2;padding:8px 0 10px}
.eyebrow{display:flex;align-items:center;gap:12px;font-family:var(--f-num);font-weight:600;letter-spacing:.32em;font-size:13px}
.eyebrow::after{content:"";width:80px;height:1.5px;background:var(--ink)}
.hero h2{font-size:clamp(30px,4.2vw,52px);font-weight:900;letter-spacing:.03em;line-height:1.15;margin-top:6px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.swoosh{display:block;width:150px;height:14px;margin-top:-2px}
.qbadge{position:relative;font-size:17px;font-weight:900;border:2px solid var(--ink);border-radius:999px;padding:3px 14px;background:var(--card);letter-spacing:.04em}
.qbadge::after{content:"";position:absolute;right:-16px;top:-14px;width:22px;height:18px;
  background:linear-gradient(var(--orange),var(--orange)) 0 100%/3px 9px no-repeat,linear-gradient(var(--orange),var(--orange)) 9px 40%/3px 11px no-repeat,linear-gradient(var(--orange),var(--orange)) 18px 100%/3px 9px no-repeat;transform:rotate(18deg)}
.hero-art{position:absolute;right:0;top:0;bottom:0;width:min(62%,640px);z-index:1;
  -webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 28%);mask-image:linear-gradient(90deg,transparent 0%,#000 28%)}
.hero-art svg{width:100%;height:100%}
main{grid-area:main;min-width:0}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:1280px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* ---------- company card ---------- */
.co{--cc:var(--c0);position:relative;background:var(--card);border:1.5px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 2px 0 var(--line),0 8px 20px rgba(90,70,30,.07);min-width:0}
.co.pick{cursor:pointer;transition:transform .15s,box-shadow .15s}
.co.pick:hover{transform:translateY(-2px);box-shadow:0 2px 0 var(--line),0 14px 26px rgba(90,70,30,.12)}
.co.sel{border:3px solid var(--green);box-shadow:0 0 0 3px rgba(23,63,59,.12),0 12px 26px rgba(23,63,59,.18)}
.co .art{height:112px;position:relative;overflow:hidden}
.co .art svg{width:100%;height:100%}
.co .art .emb{position:absolute;right:10px;top:8px;bottom:8px;height:calc(100% - 16px);aspect-ratio:1;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,.25);border:2px solid rgba(255,255,255,.7);object-fit:cover}
.check{position:absolute;right:10px;top:10px;width:30px;height:30px;border-radius:50%;background:var(--green);display:grid;place-items:center;z-index:2;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.check svg{width:18px;height:18px}
.co .body{padding:12px 16px 14px;display:flex;flex-direction:column;gap:8px}
.cohead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.co h3{font-size:26px;font-weight:900;letter-spacing:.03em;line-height:1.1}
.tick{font-family:var(--f-num);font-size:12px;font-weight:800;letter-spacing:.06em;color:#fff;background:var(--cc);border-radius:999px;padding:2px 9px}
.sector{margin-left:auto;display:inline-flex;align-items:center;gap:5px;font-weight:700;font-size:14px}
.sector svg{width:20px;height:20px;color:var(--cc)}
.prow{display:flex;align-items:center;gap:12px}
.price{font-family:var(--f-num);font-size:38px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.delta{font-family:var(--f-num);font-weight:800;font-size:17px;border-radius:999px;padding:3px 12px;display:inline-flex;gap:4px;align-items:center}
.delta.up{background:var(--up-bg);color:var(--up)} .delta.down{background:var(--down-bg);color:var(--down)} .delta.flat{background:var(--flat-bg);color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);margin:2px 0 0}
.stats div{padding:0 10px;border-left:1.5px solid var(--line2)}
.stats div:first-child{padding-left:0;border-left:none}
.stats dt{font-size:12px;color:var(--muted);font-weight:500}
.stats dd{margin:0;font-family:var(--f-num);font-weight:800;font-size:19px;font-variant-numeric:tabular-nums}
.ceo{display:flex;align-items:center;gap:8px;font-size:14px;min-height:24px;flex-wrap:wrap}
.ceo .k{font-family:var(--f-num);font-weight:600;color:var(--muted)}
.ceo b{font-weight:900}
.emb{font-size:11px;font-weight:700;color:var(--down);background:var(--down-bg);border-radius:999px;padding:1px 8px}
.holdrow{display:flex;align-items:center;gap:10px}
.hold{flex:1;display:grid;grid-template-columns:repeat(10,1fr);gap:3px}
.cell{height:12px;border-radius:4px;background:var(--flat-bg)}
.cell.f{background:var(--pc)}
.hbadge{font-size:12px;font-weight:700;background:var(--paper2);border-radius:8px;padding:2px 8px;white-space:nowrap}
.hlist{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:12px;color:var(--muted);min-height:18px}
.hlist span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--pc);margin-right:4px}

/* ---------- feed ---------- */
.feed{background:transparent;padding:6px 6px 0;display:flex;flex-direction:column;min-width:0}
.feed h3{display:flex;align-items:center;gap:10px;font-size:24px;font-weight:900;padding-bottom:10px;border-bottom:1.5px solid var(--line2)}
.feed h3 svg{width:28px;height:28px;color:var(--orange)}
.feedlist{list-style:none;margin:0;padding:0;overflow:auto;max-height:300px}
.feedlist li{display:grid;grid-template-columns:auto 40px minmax(0,1fr);gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.qtag{font-family:var(--f-num);font-weight:700;font-size:12px;border:1.5px solid var(--line2);border-radius:6px;padding:1px 6px;background:var(--card)}
.feedlist .av{width:40px;height:40px}
.feedlist .txt{font-size:13.5px;line-height:1.45;min-width:0}
.feedlist .ic{width:40px;height:40px;border-radius:50%;background:var(--paper2);display:grid;place-items:center;color:var(--green)}
.feedlist .ic svg{width:20px;height:20px}
.feedlist li.q .txt{font-weight:900;color:var(--green)}
.feedlist li.k .txt{color:#8A4A12}
.pn{font-weight:900;color:var(--ink)}
.cn{font-weight:900}

/* ---------- desk (right panel) ---------- */
.desk{grid-area:desk;position:sticky;top:max(10px,env(safe-area-inset-top,0px));background:var(--green);color:var(--green-ink);border-radius:26px;padding:24px 24px 22px;overflow:hidden;display:flex;flex-direction:column;gap:14px;box-shadow:0 18px 40px rgba(15,40,36,.25)}
.desk .leaf{position:absolute;right:-30px;top:-20px;width:190px;height:190px;opacity:.9;pointer-events:none}
.desk>*{position:relative}
.dhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.dhead h2{font-size:clamp(28px,2.8vw,40px);font-weight:900;letter-spacing:.04em;line-height:1.1}
.pill{background:var(--orange);color:#fff;font-weight:900;border-radius:999px;padding:5px 14px;font-size:16px;white-space:nowrap}
.pill.soft{background:rgba(255,255,255,.16)}
.dsub{font-weight:700;font-size:16px;margin-top:-6px;opacity:.9}
.dlab{font-size:14px;opacity:.85;font-weight:700}
.target{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:-6px}
.target svg{width:30px;height:30px}
.target b{font-size:26px;font-weight:900;letter-spacing:.03em}
.target .vs{width:1.5px;height:24px;background:rgba(255,255,255,.4)}
.target .cur{font-weight:700;font-size:17px}
.target .cur span{font-family:var(--f-num);font-size:28px;font-weight:800;margin-left:6px}
.toggle{display:grid;grid-template-columns:1fr 1fr;border:2px solid rgba(255,255,255,.85);border-radius:12px;overflow:hidden}
.toggle button{border:none;background:transparent;color:var(--green-ink);font-weight:900;font-size:17px;padding:10px;cursor:pointer}
.toggle button.on{background:var(--card);color:var(--ink)}
.qrow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.qrow>span{font-weight:700;font-size:16px}
.stepper{display:grid;grid-template-columns:52px 1fr 52px;background:var(--yellow);border-radius:12px;min-width:220px;overflow:hidden}
.stepper button{border:none;background:rgba(255,255,255,.35);color:var(--yellow-ink);font-size:24px;font-weight:700;cursor:pointer;line-height:1;padding:8px 0}
.stepper button:disabled{opacity:.4;cursor:not-allowed}
.stepper b{display:grid;place-items:center;font-family:var(--f-num);font-weight:800;font-size:24px;color:var(--yellow-ink);background:#FBE7A6}
.est{margin:0;display:flex;flex-direction:column}
.est div{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px solid rgba(255,255,255,.22)}
.est div:first-child{border-top:none}
.est dt{font-weight:700;font-size:15px}
.est dd{margin:0;font-family:var(--f-num);font-weight:800;font-size:20px}
.dnote{font-size:13px;font-weight:700;background:rgba(255,255,255,.12);border-radius:10px;padding:7px 12px}
.dnote.warn{background:rgba(233,100,59,.28)}
.confirm{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:none;border-radius:16px;background:var(--yellow);color:var(--yellow-ink);font-size:24px;font-weight:900;padding:14px;cursor:pointer;box-shadow:0 4px 0 #C99A1E;letter-spacing:.06em}
.confirm svg{width:26px;height:26px}
.confirm:active:not(:disabled){transform:translateY(2px);box-shadow:0 2px 0 #C99A1E}
.confirm:disabled{opacity:.5;cursor:not-allowed}
.passbtn{width:100%;border:2px solid rgba(255,255,255,.85);background:transparent;color:var(--green-ink);border-radius:14px;font-weight:900;font-size:18px;padding:11px;cursor:pointer}
.passbtn:hover{background:rgba(255,255,255,.08)}
.empty{border:2px dashed rgba(255,255,255,.35);border-radius:16px;padding:22px 16px;text-align:center;font-weight:700;opacity:.92}
.empty b{display:block;font-size:20px;margin-bottom:4px}
.think{display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.1);border-radius:16px;padding:14px}
.think .av{width:56px;height:56px;flex:none}
.think b{font-size:20px}
.dots::after{content:"…";display:inline-block;animation:blink 1.1s steps(3) infinite}
@keyframes blink{0%{opacity:.2}50%{opacity:1}100%{opacity:.2}}
@media (prefers-reduced-motion:reduce){.dots::after{animation:none}.co.pick,.btn{transition:none}}

/* private intel card */
.intel{position:relative;background:var(--pink);color:var(--ink);border-radius:14px;padding:16px 18px 14px;transform:rotate(-1.2deg);box-shadow:0 6px 14px rgba(0,0,0,.18);margin-top:6px}
.intel::after{content:"";position:absolute;right:0;top:0;width:30px;height:30px;background:linear-gradient(225deg,var(--green) 50%,var(--pink2) 50%);border-bottom-left-radius:8px}
.intel .ilab{display:flex;align-items:center;gap:8px;font-weight:900;color:#B24A35;font-size:17px;padding-bottom:8px;border-bottom:1.5px solid var(--pink2)}
.intel .ilab svg{width:20px;height:20px}
.intel .ititle{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 0 6px;flex-wrap:wrap}
.intel h4{font-size:24px;font-weight:900;letter-spacing:.03em}
.intel .inote{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;font-size:13px;color:#5B4A40}
.stamp{border:1.5px solid #B24A35;color:#B24A35;border-radius:8px;padding:2px 10px;font-weight:900;font-size:13px;white-space:nowrap;transform:rotate(-3deg)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:14px;font-weight:900;padding:2px 10px;border-radius:8px;background:var(--flat-bg);color:var(--ink)}
.chip.up{background:var(--up-bg);color:var(--up)}
.chip.down{background:#E8573F;color:#fff}
.chip.sp{background:#F4D58A;color:#5A4210}

/* ---------- players strip ---------- */
.players{margin-top:18px;background:var(--card);border:1.5px solid var(--line);border-radius:20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));padding:8px;gap:6px;box-shadow:0 8px 20px rgba(90,70,30,.06)}
.pl{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:14px;position:relative;min-width:0}
.pl+.pl::before{content:"";position:absolute;left:-4px;top:16px;bottom:16px;width:1.5px;background:var(--line2)}
.pl.cur{background:var(--pink)}
.pl.cur::before,.pl.cur+.pl::before{display:none}
.pl .av{width:60px;height:60px;flex:none}
.pl .nm{font-size:19px;font-weight:900;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tag{font-size:11px;font-weight:700;border:1.5px solid var(--line2);border-radius:6px;padding:0 5px;color:var(--muted);background:var(--card)}
.pl .fig{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:13px;color:var(--muted)}
.pl .fig b{font-family:var(--f-num);font-weight:800;color:var(--ink);font-size:16px;margin-left:3px}
.pl .ceos{display:flex;gap:4px;margin-top:3px}
.pl .ceos i{font-style:normal;font-size:10px;font-weight:900;color:#fff;background:var(--cc);border-radius:5px;padding:0 5px;font-family:var(--f-num)}

/* ---------- responsive ---------- */
@media (max-width:1040px){
  .board{grid-template-columns:minmax(0,1fr);grid-template-areas:"hero" "desk" "main"}
  .desk{position:relative;top:0}
  .hero-art{width:70%;opacity:.55}
}
@media (max-width:640px){
  .cards{grid-template-columns:minmax(0,1fr)}
  .vsep{display:none}
  .steps{order:3;flex-basis:100%;justify-content:flex-start;overflow-x:auto;padding-bottom:2px}
  .step{padding:4px 10px;font-size:13px}.step.now{padding:5px 12px;font-size:15px}
  .brand small{display:none}
  .stepper{min-width:170px}
  .desk{padding:20px 18px;border-radius:22px}
  .co h3{font-size:23px}
}

/* ---------- modals ---------- */
.overlay{position:fixed;inset:0;background:var(--scrim);display:grid;place-items:center;z-index:50;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--card);color:var(--ink);border-radius:24px;border:1.5px solid var(--line);width:min(640px,100%);max-height:calc(100dvh - 32px);overflow:auto;padding:26px;box-shadow:0 30px 70px rgba(40,30,10,.3)}
.modal h2{font-size:28px;font-weight:900;margin-bottom:6px;letter-spacing:.03em}
.modal .sub{color:var(--muted);margin:0 0 16px}
.modal .acts{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:20px}
.modal .acts .btn{padding:10px 20px;font-size:16px}
.modal .intel{transform:none;margin-bottom:6px}
.modal .intel::after{background:linear-gradient(225deg,var(--card) 50%,var(--pink2) 50%)}
.opts{display:flex;flex-direction:column;gap:10px}

/* Pattern templates. Levels are in volatility units; mirror (sgn=-1) flips the shape, so every template is two scenarios.
   hist = anchors for the 36 visible candles, ok = textbook continuation, ng = the pattern fails. txt[0] normal, txt[1] mirrored. */
const TPL=[
 {id:'hs',sig:-1,
  hist:[[0,0],[5,5],[10,8],[14,5],[20,11],[25,5],[30,8],[35,5.7]],
  ok:[[37,4],[39,3.6],[40,5],[41,4.6],[43,2.5],[47,-1]], ng:[[37,5.4],[39,7],[41,6.4],[43,9],[47,12]],

  lines:[{a:8,ya:5,b:47,yb:5,n:['頸線','頸線']},{a:37,ya:-1,b:47,yb:-1,n:['目標價','目標價'],dash:1}],
  txt:[
   {name:'頭肩頂',feat:P=>`三個高點，中間的「頭」（約 ${P(11)}）最高，左右兩肩差不多高；把兩次回檔的低點連起來就是<b>頸線</b>（約 ${P(5)}）。右肩的成交量比頭部小，追價的力道變弱了。`,
    key:P=>`收盤<b>跌破頸線 ${P(5)}</b>，最好帶量。跌破之後常出現「反彈回測頸線、站不回去」，那是第二個進場點。`,
    plan:P=>`跌破頸線做空，停損放在頸線上方一點；目標價 ≈ 頸線 −（頭 − 頸線）≈ ${P(-1)}。`,

 {id:'dt',sig:-1,

/* ================= price generation ================= */
function gauss(){let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
function interpA(anc,t){if(t<=anc[0][0])return anc[0][1];for(let k=1;k<anc.length;k++){const [t1,v1]=anc[k],[t0,v0]=anc[k-1];if(t<=t1)return v0+(v1-v0)*(t-t0)/(t1-t0);}return anc[anc.length-1][1];}
function genScenario(ti,mir,ok){
  const T=TPL[ti],sgn=mir?-1:1,U=Math.round((5+Math.random()*4)*2)/2,B=Math.round(900+Math.random()*700);
  const path=T.hist.concat(ok?T.ok:T.ng),va=T.vol.concat(ok?T.vok:T.vng),base=2400+Math.random()*4000;
  const cs=[];let e=0,prev=B+U*interpA(path,0)*sgn;
  for(let t=0;t<TOTAL;t++){
    e=e*.5+gauss()*.2;
    const tgt=B+U*(interpA(path,t)*sgn+e);
    let o=t?prev+gauss()*U*.12:tgt-gauss()*U*.3,c=tgt;
    let h=Math.max(o,c)+Math.abs(gauss())*U*.42,l=Math.min(o,c)-Math.abs(gauss())*U*.42;
    let shp=T.shape&&T.shape[t];if(shp&&mir)shp=shp==='lw'?'uw':'lw';
    if(shp==='lw'){if(c<o)[o,c]=[c,o];c=Math.max(c,o+U*.25);l=o-U*(2.3+Math.random()*.8);h=c+U*.12;}
    if(shp==='uw'){if(c>o)[o,c]=[c,o];c=Math.min(c,o-U*.25);h=o+U*(2.3+Math.random()*.8);l=c-U*.12;}
    const v=Math.round(base*interpA(va,t)*(.78+Math.random()*.44));
    o=Math.round(o);c=Math.round(c);h=Math.max(Math.round(h),o,c);l=Math.min(Math.round(l),o,c);
    cs.push({o,h,l,c,v});prev=c;
  }
  return {cs,sc:{ti,mir:!!mir,ok:!!ok,B,U,sgn,sig:T.sig*sgn}};
}
function scP(sc){return y=>fmt(sc.B+sc.U*y*sc.sgn);}
function scTxt(sc){return TPL[sc.ti].txt[sc.mir?1:0];}

/* ================= indicators & reading ================= */
function maAt(cs,n,i){if(i<n-1)return null;let s=0;for(let k=i-n+1;k<=i;k++)s+=cs[k].c;return s/n;}
function atr(cs,n=14){const m=Math.min(n,cs.length-1);if(m<1)return 8;let s=0;for(let k=cs.length-m;k<cs.length;k++){const a=cs[k],p=cs[k-1].c;s+=Math.max(a.h-a.l,Math.abs(a.h-p),Math.abs(a.l-p));}return s/m;}
function avgVol(cs,i,n=20){const a=Math.max(0,i-n),b=i;if(b<=a)return cs[i].v;let s=0;for(let k=a;k<b;k++)s+=cs[k].v;return s/(b-a);}
function candleKind(cs,i){
  const k=cs[i],body=Math.abs(k.c-k.o),rng=Math.max(1,k.h-k.l),lw=Math.min(k.o,k.c)-k.l,uw=k.h-Math.max(k.o,k.c);
  let ab=0,ar=0;const a=Math.max(0,i-20);for(let j=a;j<i;j++){ab+=Math.abs(cs[j].c-cs[j].o);ar+=cs[j].h-cs[j].l;}const n=Math.max(1,i-a);ab=ab/n||body||1;ar=ar/n||rng;
  if(lw>=Math.max(2*body,uw*1.6)&&lw>=ar*.55)return {n:'長下影線',d:'盤中殺低又被買回來，下方有人承接。',t:'lw'};
  if(uw>=Math.max(2*body,lw*1.6)&&uw>=ar*.55)return {n:'長上影線',d:'盤中拉高又被賣下來，上方有賣壓。',t:'uw'};
  if(body<=rng*.12)return {n:'十字線',d:'開盤收盤幾乎一樣，多空拉鋸、方向未明。',t:'doji'};
  if(body>=ab*1.7)return k.c>k.o?{n:'長紅 K',d:'買方強勢，從開盤一路買到收盤。',t:'bull'}:{n:'長黑 K',d:'賣方強勢，從開盤一路賣到收盤。',t:'bear'};
  return k.c>k.o?{n:'小紅 K',d:'收盤比開盤高，但力道普通。',t:'up'}:k.c<k.o?{n:'小黑 K',d:'收盤比開盤低，但力道普通。',t:'dn'}:{n:'平盤',d:'收盤和開盤一樣。',t:'doji'};
}
function analyze(cs){
  const i=cs.length-1;if(i<20)return [];
  const k=cs[i],m5=maAt(cs,5,i),m20=maAt(cs,20,i),m20p=maAt(cs,20,i-8),slope=(m20-m20p)/Math.max(1,atr(cs));
  const win=cs.slice(Math.max(0,i-20),i),hi=Math.max(...win.map(x=>x.h)),lo=Math.min(...win.map(x=>x.l));
  const vr=k.v/avgVol(cs,i),ck=candleKind(cs,i),A=atr(cs);
  const trend=slope>.5?['上升趨勢','up','月線往上走：大方向偏多，順勢做多比較省力。']:slope<-.5?['下降趨勢','down','月線往下走：大方向偏空，逆勢做多要小心。']:['盤整','flat','月線走平：沒有明確方向，常在區間內來回。'];
  const arr=k.c>m5&&m5>m20?['多頭排列','up','價格 > 5 日線 > 20 日線，多方掌控。']:k.c<m5&&m5<m20?['空頭排列','down','價格 < 5 日線 < 20 日線，空方掌控。']:['均線糾結','flat',`價格在均線之間（5 日 ${fmt(m5)}、20 日 ${fmt(m20)}），多空還在拉扯。`];
  const vol=vr>=1.8?['爆量','up',`成交量是 20 根均量的 ${vr.toFixed(1)} 倍，大量資金在這裡換手。`]:vr>=1.25?['量增','up',`成交量是均量的 ${vr.toFixed(1)} 倍，有資金進場。`]:vr<=.7?['量縮','flat',`成交量只有均量的 ${vr.toFixed(1)} 倍，觀望的人多。`]:['量平','flat','成交量和平常差不多。'];
  const cls=c=>c==='up'?'up':c==='down'?'down':'';
  return [
    {k:'趨勢（月線方向）',v:`<span class="${cls(trend[1])}">${trend[0]}</span>`,p:trend[2]},
    {k:'均線排列',v:`<span class="${cls(arr[1])}">${arr[0]}</span>`,p:arr[2]},
    {k:'最新一根 K 線',v:ck.n,p:ck.d},
    {k:'量能',v:vol[0],p:vol[2]},
    {k:'近 20 根壓力／支撐',v:`<span class="num">${fmt(hi)}</span> ／ <span class="num">${fmt(lo)}</span>`,p:k.c>hi?'收盤已經突破近期高點！':k.c<lo?'收盤已經跌破近期低點！':`現價離壓力 ${fmt(hi-k.c)} 點、離支撐 ${fmt(k.c-lo)} 點。`},
    {k:'平均波動（ATR）',v:`<span class="num">${A.toFixed(1)}</span> 點／根`,p:`一根 K 平均跳 ${A.toFixed(0)} 點＝每口 ${money(A*PV)}。停損太緊容易被正常波動洗掉。`},
  ];
}
function comment(cs,i){
  const k=cs[i],p=cs[i-1],ch=k.c-p.c,notes=[];
  const win=cs.slice(Math.max(0,i-20),i),hi=Math.max(...win.map(x=>x.h)),lo=Math.min(...win.map(x=>x.l));
  if(k.c>hi)notes.push(`突破近 20 根高點 ${fmt(hi)}`);else if(k.c<lo)notes.push(`跌破近 20 根低點 ${fmt(lo)}`);
  const vr=k.v/avgVol(cs,i);if(vr>=1.8)notes.push(`爆量（${vr.toFixed(1)} 倍均量）`);else if(vr<=.6)notes.push('量縮');
  const a5=maAt(cs,5,i),a20=maAt(cs,20,i),b5=maAt(cs,5,i-1),b20=maAt(cs,20,i-1);
  if(a5!=null&&b20!=null){if(b5<=b20&&a5>a20)notes.push('5 日線向上穿過月線（黃金交叉）');else if(b5>=b20&&a5<a20)notes.push('5 日線向下穿過月線（死亡交叉）');
    if(p.c<=b20&&k.c>a20)notes.push('站上月線');else if(p.c>=b20&&k.c<a20)notes.push('跌破月線');}
  const ck=candleKind(cs,i);if(['lw','uw','bull','bear','doji'].includes(ck.t))notes.unshift(ck.n);
  return `第 ${i+1} 根收 <b class="num">${fmt(k.c)}</b>（<span class="${ch>0?'up':ch<0?'down':'flat'}">${ch>0?'▲':ch<0?'▼':'±'}${Math.abs(ch)}</span>）${notes.length?'：'+notes.slice(0,3).join('，'):''}`;
}

/* ================= accounting ================= */
function eqAt(p,px){const q=p.pos;return p.cash+(q&&q.l?q.d*q.l*(px-q.e)*PV:0);}
function maxLots(p,px){return Math.max(0,Math.min(MAXLOT,Math.floor(eqAt(p,px)/MARGIN)));}
function liqPrice(cash,d,l,e){return e-d*(cash-l*MARGIN*MAINT)/(l*PV);}
function orderFee(q,d,l){return q.l&&q.d===d?Math.abs(l-q.l)*FEE:((q.l||0)+l)*FEE;}
function planOrder(p,o,px,A){ // pure preview of what an order does
  const q=p.pos||{d:0,l:0};
  if(o.keep&&q.l)return {d:q.d,l:q.l,e:q.e,sl:q.sl,tp:q.tp,liq:q.liq,fee:0,cash:p.cash};
  const d=o.d,l=d?o.l:0,fee=orderFee(q,d,l);
  const cash=p.cash+(q.l?q.d*q.l*(px-q.e)*PV:0)-fee;
  if(!l)return {d:0,l:0,fee,cash};
  return {d,l,e:px,fee,cash,sl:o.sl?Math.round(px-d*SLK[o.sl]*A):null,tp:o.tp?Math.round(px+d*TPK[o.tp]*A):null,liq:Math.round(liqPrice(cash,d,l,px))};
}
function execOrder(i,o){
  const p=S.players[i],px=lastPx(),r=planOrder(p,o,px,atr(shown()));
  p.cash=r.cash;p.fees+=r.fee;
  p.pos=r.l?{d:r.d,l:r.l,e:r.e,sl:r.sl,tp:r.tp,liq:r.liq}:{d:0,l:0};
}
function closePos(i,X,why){
  const p=S.players[i],q=p.pos;if(!q.l)return 0;
  const pnl=q.d*q.l*(X-q.e)*PV;p.cash+=pnl-FEE*q.l;p.fees+=FEE*q.l;if(p.cash<0)p.cash=0;
  p.pos={d:0,l:0};return pnl;
}
function checkCandle(i,k){
  const p=S.players[i],q=p.pos;if(!q||!q.l)return;
  const d=q.d,adv=d>0?k.l:k.h,hitAdv=(lvl,x)=>d>0?x<=lvl:x>=lvl;
  const lv=[];if(q.sl!=null)lv.push(['sl',q.sl]);lv.push(['liq',q.liq]);
  lv.sort((a,b)=>d>0?b[1]-a[1]:a[1]-b[1]);
  let X=null,why='';
  for(const [kind,l] of lv){if(hitAdv(l,adv)){X=hitAdv(l,k.o)?k.o:l;why=kind;break;}}
  if(X==null&&q.tp!=null){const hit=d>0?k.h>=q.tp:k.l<=q.tp;if(hit){X=(d>0?k.o>=q.tp:k.o<=q.tp)?k.o:q.tp;why='tp';}}
  if(X==null)return;
  const l=q.l,pnl=closePos(i,Math.round(X),why);
  if(why==='sl'){p.st.sl++;log(`${pn(i)} 觸價停損 ${fmt(X)}，${l} 口出場 <span class="pnl ${pnl>=0?'up':'down'}">${smoney(pnl)}</span>`,'k');}
  else if(why==='tp'){p.st.tp++;log(`${pn(i)} 停利入袋 ${fmt(X)}，${l} 口 <span class="pnl up">${smoney(pnl)}</span>`,'k');}
  else{p.st.liq++;log(`${pn(i)} 保證金不足被<b>斷頭</b>！${l} 口在 ${fmt(X)} 強制平倉 <span class="pnl down">${smoney(pnl)}</span>`,'k');}
}
const scoreOf=p=>Math.round(eqAt(p,lastPx())-p.debt);

/* ================= AI ================= */
function aiOrder(i){
  const p=S.players[i],per=PERS[p.per%PERS.length],cs=shown(),px=lastPx(),A=atr(cs),n=cs.length;
  const mom=Math.sign(cs[n-1].c-cs[n-5].c);
  let v=S.ai[i];
  if(S.block===0||!v){v=Math.random()<per.read?S.sc.sig:(Math.random()<.5?(mom||1):-S.sc.sig);S.ai[i]=v;S.aiPx[i]=px;}
  let d=v;
  if(S.block>0){
    const moved=(px-S.aiPx[i])*v/A;
    if(moved<-1.6&&Math.random()<.65){d=per.chase>0?(mom||-v):-v;S.ai[i]=d;S.aiPx[i]=px;}
    else if(Math.random()<per.chase*.4)d=mom||d;
  }
  if(per.chase<0&&Math.random()<-per.chase*.5)d=-d;
  if(Math.random()<.1)d=0;
  const ml=maxLots(p,px);if(!ml)return {d:0,l:0,sl:0,tp:0};
  const q=p.pos;
  if(S.block>0&&q.l&&q.d===d&&Math.random()<.7)return {keep:true};
  const l=Math.max(1,Math.min(ml,Math.round(1+per.risk*4*(.55+.45*Math.random()))));
  return {d,l:d?l:0,sl:per.sl,tp:Math.random()<.3?1+(Math.random()*2|0):0};
}

/* ================= game flow ================= */
function setupGame(cfg,rounds,aid){
  clearTimeout(timer);closeModal();
  S={players:cfg.map((p,i)=>({id:i,name:p.name,ai:p.ai,remote:!!p.remote,pid:p.pid||null,per:AI_NAMES.indexOf(p.name)>=0?AI_NAMES.indexOf(p.name):i,
      cash:START,debt:0,fees:0,pos:{d:0,l:0},order:null,rd:[],hintLeft:HINTS0,hints:[],reads:0,best:null,eq0:START,st:{sl:0,tp:0,liq:0}})),
     R:rounds||5,aid:aid!==false,round:0,block:0,phase:'idle',shown:0,cands:null,sc:null,prod:null,done:[],log:[],hist:[],
     tdeck:[],ai:cfg.map(()=>0),aiPx:cfg.map(()=>0),viewer:null,cfg,gid:Date.now()%100000};
  const hs=humans();S.viewer=hs.length===1?hs[0].id:null;
  log(`新局開始：${S.players.length} 位操盤手，每人本金 ${money(START)}，共 ${S.R} 盤。`,'q');
  startRound();
}
function startRound(){
  S.round++;S.block=0;
  if(!S.tdeck.length)S.tdeck=shuffle(TPL.map((_,i)=>i));
  const ti=S.tdeck.pop(),g=genScenario(ti,Math.random()<.5,Math.random()<OK_RATE);
  S.cands=g.cs;S.sc=g.sc;S.shown=HIST;S.prod=Math.random()*PRODUCTS.length|0;
  S.players.forEach((p,i)=>{p.pos={d:0,l:0};p.rd=[];p.order=null;
    if(p.cash<BAIL_UNDER){p.cash+=BAIL;p.debt+=BAIL;log(`${pn(i)} 資金見底，向家人借了 ${money(BAIL)} 東山再起（結算時要還）`,'k');}
    p.eq0=p.cash;});
  S.ai=S.players.map(()=>0);S.aiPx=S.players.map(()=>0);
  log(`第 ${S.round} 盤開盤：${PRODUCTS[S.prod][0]}。先看前 ${HIST} 根 K 線，判斷接下來往哪走。`,'q');
  startDecide();
}
function startDecide(){
  S.phase='decide';S.done=[];S.players.forEach(p=>{p.order=null;});
  resetUI();
  if(humans().length>1)S.viewer=null;
  save();render();
  timer=setTimeout(proceedDecide,humans().length?60:SPEED*.5);
}
function resetUI(){
  UI.pending=false;const v=S&&S.viewer!=null?S.players[S.viewer]:null;
  if(v&&v.pos&&v.pos.l){UI.keep=true;UI.d=v.pos.d;UI.l=v.pos.l;}else{UI.keep=false;UI.d=1;UI.l=1;}
  UI.sl=2;UI.tp=0;
}
function proceedDecide(){
  clearTimeout(timer);
  if(S.phase!=='decide')return;
  S.players.forEach((p,i)=>{if(!S.done.includes(i)){
    if(p.ai){p.order=aiOrder(i);S.done.push(i);}
    else if(!maxLots(p,lastPx())&&!(p.pos&&p.pos.l)){p.order={d:0,l:0,sl:0,tp:0};S.done.push(i);}
  }});
  const pend=S.players.map((_,i)=>i).filter(i=>!S.done.includes(i));
  save();
  if(!pend.length){render();timer=setTimeout(lockIn,humans().length?250:SPEED*.4);return;}
  const locals=pend.filter(i=>!S.players[i].remote);
  if(!locals.length){render();return;}
  const pi=locals[0];
  if(humans().length>1&&S.viewer!==pi){S.viewer=null;render();handoff(pi,'輪到你下單',()=>{S.viewer=pi;resetUI();render();});}
  else{if(S.viewer!==pi){S.viewer=pi;resetUI();}render();}
}
function lockIn(){
  clearTimeout(timer);if(S.phase!=='decide')return;
  const cnt={L:0,S:0,F:0};
  S.players.forEach((p,i)=>{const o=p.order||{keep:true};execOrder(i,o);p.order=null;
    const q=p.pos;p.rd.push({d:q.d,l:q.l});cnt[q.d>0?'L':q.d<0?'S':'F']++;});
  log(`委託全部成交於 ${fmt(lastPx())}。全場 ${cnt.L} 多・${cnt.S} 空・${cnt.F} 空手`,'q');
  S.players.forEach((p,i)=>{const q=p.pos;log(`${pn(i)} ${q.l?`${dirTxt(q.d)} ${q.l} 口 @${fmt(q.e)}${q.sl!=null?`，停損 ${fmt(q.sl)}`:'，沒設停損'}`:'空手觀望'}`);});
  S.phase='reveal';S.ratio=cnt;
  if(humans().length>1)S.viewer=null;
  save();render();
  timer=setTimeout(stepReveal,SPEED*1.6);
}
function stepReveal(){
  clearTimeout(timer);if(S.phase!=='reveal')return;
  const end=HIST+BLOCK*(S.block+1);
  if(S.shown<end){
    const t=S.shown,k=S.cands[t];
    S.shown++;
    log(comment(S.cands,t),'c');
    S.players.forEach((_,i)=>checkCandle(i,k));
    save();render();
    timer=setTimeout(stepReveal,S.shown<end?SPEED:SPEED*1.3);
    return;
  }
  S.block++;
  if(S.block<NB)startDecide();else settleRound();
}
function settleRound(){
  clearTimeout(timer);
  const px=lastPx();
  S.players.forEach((p,i)=>{if(p.pos.l){const l=p.pos.l,d=p.pos.d,pnl=closePos(i,px);log(`${pn(i)} 收盤平倉 ${dirTxt(d)} ${l} 口 <span class="pnl ${pnl>=0?'up':'down'}">${smoney(pnl)}</span>`);}});
  const rows=S.players.map((p,i)=>{const pnl=p.cash-p.eq0,read=p.rd[0]&&p.rd[0].d===S.sc.sig;if(read)p.reads++;
    if(!p.best||pnl>p.best.v)p.best={v:pnl,r:S.round};return {pnl,read,rd:p.rd.slice()};});
  S.hist.push({r:S.round,name:scTxt(S.sc).name,ok:S.sc.ok,sig:S.sc.sig,prod:S.prod,rows});
  S.phase='lesson';
  log(`第 ${S.round} 盤收盤：這是「${scTxt(S.sc).name}」，${S.sc.ok?'型態成功':'型態失敗'}。`,'q');
  if(humans().length>1)S.viewer=null;
  save();render();lessonModal();
  if(!humans().length)timer=setTimeout(()=>{if(S.phase==='lesson')nextRound();},SPEED*6);
}
function nextRound(){
  clearTimeout(timer);if(S.phase!=='lesson')return;closeModal();
  if(S.round>=S.R)endGame();else startRound();
}
function endGame(){S.phase='end';clearSave();log(`${S.R} 盤結束，結算總分`,'q');render();endModal();}

   <div class="pitch"><div><b>真實型態</b>頭肩頂、W 底、三角形、旗形、假突破…18 種劇本，七成照教科書走，三成會失敗。</div><div><b>槓桿與停損</b>一口保證金 ${money(MARGIN)}，一點 ${money(PV)}。開越多口賺越快，也越容易被斷頭。</div><div><b>盤後教室</b>每盤結束畫出頸線、支撐壓力，講解訊號和進出場點。</div></div>
   <div class="field"><span>玩家人數</span><div class="seg">${[2,3,4,5,6].map(k=>`<button data-m="n:${k}" class="${k===n?'on':''}">${k} 人</button>`).join('')}</div></div>
   <div class="seats">${seats}</div>
   <div class="field"><span>盤數</span><div class="seg">${[3,5,7].map(k=>`<button data-m="r:${k}" class="${k===setupCfg.rounds?'on':''}">${k} 盤</button>`).join('')}</div></div>

   <div class="field"><span>揭曉速度</span><div class="seg">${Object.keys(SPEEDS).map(k=>`<button data-m="sp:${k}" class="${k===setupCfg.speed?'on':''}">${k}</button>`).join('')}</div></div>
   <p class="note">多位人類玩家可共用同一台裝置輪流下單（熱座模式），換人時會遮住別人的委託。遊戲中的商品與價格都是程式產生的練習行情。</p>
   <div class="acts"><a class="btn ghost" href="${LOBBY}">← 回大廳</a><button class="btn" data-m="rules">先看規則</button>${NET.setupBtns()}${sv&&sv.phase&&sv.phase!=='end'&&sv.phase!=='idle'?'<button class="btn" data-m="resume">繼續上一局</button>':''}<button class="btn primary" data-m="start">開始遊戲</button></div>`,
  m=>{
    readSeats();

    else if(m.startsWith('h:')||m.startsWith('a:')){setupCfg.seats[+m.slice(2)].ai=m[0]==='a';showSetup();}
    else if(m.startsWith('r:')){setupCfg.rounds=+m.slice(2);showSetup();}
    else if(m.startsWith('aid:')){setupCfg.aid=m==='aid:1';showSetup();}
    else if(m.startsWith('sp:')){setupCfg.speed=m.slice(3);SPEED=SPEEDS[setupCfg.speed];showSetup();}
    else if(m==='rules')showRules();

    else if(m==='resume'){closeModal();SPEED=SPEEDS[setupCfg.speed];resumeGame(sv);}
    else if(m==='start'){closeModal();SPEED=SPEEDS[setupCfg.speed];
      const used=new Set();
      const cfg=setupCfg.seats.slice(0,setupCfg.n).map((s,i)=>{let nm=(s.name||'').trim()||(s.ai?AI_NAMES[i%AI_NAMES.length]:'玩家'+(i+1));if(used.has(nm))nm+=i+1;used.add(nm);return {name:nm,ai:s.ai};});
      setupGame(cfg,setupCfg.rounds,setupCfg.aid);}

function readSeats(){document.querySelectorAll('[data-seat]').forEach(inp=>{setupCfg.seats[+inp.dataset.seat].name=inp.value;});}
async function resumeGame(sv){
  S=sv;
  if(sv.online&&!(await NET.resumeHost(sv))){S.players.forEach(p=>{if(p.remote){p.remote=false;p.ai=true;}});delete S.online;}
  const hs=humans();S.viewer=hs.length===1?hs[0].id:null;
  resumeAfterModal();
}
function resumeAfterModal(){
  if(!S)return;if(NET.role==='client'){NET.resync();return;}
  if(S.phase==='decide')proceedDecide();else if(S.phase==='reveal'){render();timer=setTimeout(stepReveal,SPEED);}
  else if(S.phase==='lesson'){render();lessonModal();}else if(S.phase==='end'){render();endModal();}else render();
}

function miniCandle(o,c,h,l,col){const y=v=>4+(20-v)*2.5;const top=y(Math.max(o,c)),bot=y(Math.min(o,c));return `<svg viewBox="0 0 40 56" aria-hidden="true"><path d="M20 ${y(h)}V${y(l)}" stroke="${col}" stroke-width="2"/><rect x="12" y="${top}" width="16" height="${Math.max(2,bot-top)}" fill="${col}" rx="1.5"/></svg>`;}
function showRules(){
  $('#rulesModal').innerHTML=`<h2>遊戲規則</h2><div class="rules">
  <p><b>目標：</b>${setupCfg.rounds||5} 盤之後，總分（帳戶權益 − 借款）最高的人是期貨戰士。</p>
  <h3>每一盤</h3>
  <ol>
   <li><b>看盤：</b>畫面上是一張 ${TOTAL} 根的 K 線圖，先公開前 ${HIST} 根。每張圖都藏著一個真實的技術型態（頭肩頂、W 底、三角形、旗形、假突破、楔形…）。右邊的「盤面解讀」會幫你整理趨勢、均線、量能和支撐壓力。</li>
   <li><b>下單：</b>所有人同時、祕密地決定：<b>做多</b>（賭漲）、<b>做空</b>（賭跌）或<b>空手</b>；開 1～${MAXLOT} 口；停損和停利要不要設、設多遠。</li>
   <li><b>揭曉：</b>接下來 ${BLOCK} 根 K 線一根一根出現，大家的損益即時跳動。碰到停損、停利或斷頭價就當場出場。</li>
   <li>重複「下單 → 揭曉」共 ${NB} 次（每次可以續抱、加減碼、反手或出場），${TOTAL} 根走完後所有部位以收盤價平倉。</li>
   <li><b>盤後教室：</b>公布型態名稱、畫出頸線與支撐壓力、說明關鍵訊號、進場點、停損點和目標價。</li>
  </ol>

   <li>虧到權益低於<b>維持保證金</b>（每口 ${money(MARGIN*MAINT)}），就會在那個價位被<b>斷頭</b>強制平倉。畫面上會標出你的斷頭價。</li>
   <li><b>停損／停利</b>以平均波動（ATR，一根 K 線平均跳幾點）為單位：停損「緊」= 1.5 倍、「寬」= 3 倍；停利「近」= 3 倍、「遠」= 6 倍。</li>

   <div>${miniCandle(16,6,18,4,'#1F8A57')}<b>綠 K（黑 K）</b>收盤比開盤低。長綠 K 代表賣方強勢。</div>

   <div><b>型態</b>頭肩頂底、雙重頂底、三角形、旗形、楔形…都是「多空力量的變化畫成的圖」。型態完成的訊號通常是<b>突破或跌破頸線</b>。</div>
  </div>
  <h3>致勝心法</h3>

  <li>第一段看不懂可以空手，等第二段訊號更清楚再進場，雖然價格可能已經跑了一段。</li></ul>
  </div><div class="acts"><button class="btn primary" id="closeRules">知道了</button></div>`;
  $('#rulesOv').hidden=false;$('#closeRules').focus({preventScroll:true});
}

/* ================= chart ================= */
const C_UP='#D2412F',C_DN='#1F8A57',C_MA5='#D9A21B',C_MA20='#2E6FB0';
function chartSVG(o){
  const all=o.cs,n=o.lesson?TOTAL:S.shown,cs=all.slice(0,n);
  const nar=innerWidth<640,W=nar?560:960,H=nar?(o.lesson?330:380):(o.lesson?400:440),L=6,R=64,pT=16,pB=o.lesson?268:296,vT=pB+16,vB=H-6,sw=(W-L-R)/TOTAL;
  const X=i=>L+sw*(i+.5);
  const lines=[];
  if(o.lesson&&S.sc){const sc=S.sc,T=TPL[sc.ti];
    T.lines.forEach(ln=>{let pa,pb;if(ln.at!=null){pa=pb=sc.sgn>0?all[ln.at].l:all[ln.at].h;}else{pa=sc.B+sc.U*ln.ya*sc.sgn;pb=sc.B+sc.U*ln.yb*sc.sgn;}
      lines.push({a:ln.a,b:ln.b,pa,pb,n:ln.n[sc.mir?1:0],dash:ln.dash,col:'#7B2A25'});});}
  if(o.aid&&cs.length>21){const w=cs.slice(-21,-1),hi=Math.max(...w.map(x=>x.h)),lo=Math.min(...w.map(x=>x.l));
    lines.push({a:n-21,b:n-1+(o.lesson?0:2),pa:hi,pb:hi,n:'壓力',dash:2,col:'#8C7B62'},{a:n-21,b:n-1+(o.lesson?0:2),pa:lo,pb:lo,n:'支撐',dash:2,col:'#8C7B62'});}
  const marks=(o.marks||[]).filter(m=>m.p!=null&&isFinite(m.p));
  let lo=Math.min(...cs.map(k=>k.l)),hi=Math.max(...cs.map(k=>k.h));
  lines.forEach(l=>{lo=Math.min(lo,l.pa,l.pb);hi=Math.max(hi,l.pa,l.pb);});
  const span0=hi-lo;
  marks.forEach(m=>{if(m.p>lo-span0*.4&&m.p<hi+span0*.4){lo=Math.min(lo,m.p);hi=Math.max(hi,m.p);}});
  const pad=(hi-lo)*.06||5;lo-=pad;hi+=pad;
  const Y=p=>pT+(hi-p)/(hi-lo)*(pB-pT);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="K 線圖，已揭曉 ${n} 根，最新收盤 ${cs.length?cs[cs.length-1].c:''}">`;
  s+=`<rect x="0" y="0" width="${W}" height="${H}" fill="#FFFDF8"/>`;
  // grid
  const step=niceStep((hi-lo)/5);
  for(let v=Math.ceil(lo/step)*step;v<hi;v+=step){const y=Y(v);s+=`<path d="M${L} ${y.toFixed(1)}H${W-R}" stroke="#EFE6D4" stroke-width="1"/><text x="${W-R+6}" y="${(y+4).toFixed(1)}" font-size="12" fill="#8C8273">${fmt(v)}</text>`;}
  s+=`<path d="M${L} ${vT-6}H${W-R}" stroke="#E5D9C3" stroke-width="1"/>`;
  // future zone
  if(n<TOTAL){const x0=L+sw*n;s+=`<rect x="${x0.toFixed(1)}" y="${pT-8}" width="${(W-R-x0).toFixed(1)}" height="${vB-pT+8}" fill="#F3ECDD" opacity=".75"/><text x="${((x0+W-R)/2).toFixed(1)}" y="${((pT+pB)/2).toFixed(1)}" text-anchor="middle" font-size="44" font-weight="800" fill="#D9CBB1">?</text><text x="${((x0+W-R)/2).toFixed(1)}" y="${((pT+pB)/2+26).toFixed(1)}" text-anchor="middle" font-size="13" font-weight="700" fill="#B5A688" font-family="Noto Sans TC,sans-serif">還有 ${TOTAL-n} 根</text>`;}
  // decision markers
  for(let b=0;b<NB;b++){const t=HIST+BLOCK*b;if(t<=n||o.lesson){const x=L+sw*t;s+=`<path d="M${x.toFixed(1)} ${pT-8}V${vB}" stroke="#173F3B" stroke-width="1" stroke-dasharray="3 4" opacity=".35"/><text x="${(x+3).toFixed(1)}" y="${pT}" font-size="11" fill="#173F3B" opacity=".6" font-family="Noto Sans TC,sans-serif">決策${b+1}</text>`;}}
  // volume
  const vmax=Math.max(...cs.map(k=>k.v));
  cs.forEach((k,i)=>{const h=(k.v/vmax)*(vB-vT),x=X(i)-sw*.32;s+=`<rect x="${x.toFixed(1)}" y="${(vB-h).toFixed(1)}" width="${(sw*.64).toFixed(1)}" height="${h.toFixed(1)}" fill="${k.c>=k.o?C_UP:C_DN}" opacity=".45"/>`;});
  s+=`<text x="${L+2}" y="${vT+6}" font-size="11" fill="#8C8273" font-family="Noto Sans TC,sans-serif">成交量</text>`;
  // candles
  const bw=Math.max(2,sw*.62);
  cs.forEach((k,i)=>{const col=k.c>k.o?C_UP:k.c<k.o?C_DN:'#6E7068',x=X(i),yt=Y(Math.max(k.o,k.c)),yb=Y(Math.min(k.o,k.c));
    s+=`<path d="M${x.toFixed(1)} ${Y(k.h).toFixed(1)}V${Y(k.l).toFixed(1)}" stroke="${col}" stroke-width="1.4"/><rect x="${(x-bw/2).toFixed(1)}" y="${yt.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(1.2,yb-yt).toFixed(1)}" fill="${col}"${!o.lesson&&i===n-1?' stroke="#2A2310" stroke-width="1.2"':''}/>`;});
  // moving averages
  [[5,C_MA5],[20,C_MA20]].forEach(([m,col])=>{const pts=[];cs.forEach((_,i)=>{const v=maAt(cs,m,i);if(v!=null)pts.push(`${X(i).toFixed(1)},${Y(v).toFixed(1)}`);});if(pts.length>1)s+=`<polyline points="${pts.join(' ')}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" opacity=".9"/>`;});
  // pattern / aid lines
  lines.forEach(l=>{const xa=L+sw*l.a,xb=L+sw*Math.min(TOTAL,l.b+1);s+=`<path d="M${xa.toFixed(1)} ${Y(l.pa).toFixed(1)}L${xb.toFixed(1)} ${Y(l.pb).toFixed(1)}" stroke="${l.col}" stroke-width="${l.dash===2?1.4:2.4}" ${l.dash?`stroke-dasharray="${l.dash===2?'3 4':'8 6'}"`:''} opacity=".9"/>`;
    s+=`<text x="${(xa+4).toFixed(1)}" y="${(Y(l.pa)-6).toFixed(1)}" font-size="${l.dash===2?11:13}" font-weight="800" fill="${l.col}" font-family="Noto Sans TC,sans-serif" paint-order="stroke" stroke="#FFFDF8" stroke-width="3">${esc(l.n)}</text>`;});
  // position marks (entry / stop / take profit / liquidation)
  marks.forEach(m=>{const y=Y(m.p);if(y<pT-10||y>pB+10)return;const yy=Math.max(pT,Math.min(pB,y));
    s+=`<path d="M${L} ${yy.toFixed(1)}H${W-R}" stroke="${m.col}" stroke-width="1.6" stroke-dasharray="${m.dash||'6 4'}"/><rect x="${W-R+1}" y="${(yy-9).toFixed(1)}" width="${R-2}" height="18" rx="4" fill="${m.col}"/><text x="${W-R+R/2}" y="${(yy+4).toFixed(1)}" text-anchor="middle" font-size="11" font-weight="800" fill="#fff" font-family="Noto Sans TC,sans-serif">${m.n} ${fmt(m.p)}</text>`;});
  // last price tag
  if(cs.length&&!o.lesson){const k=cs[cs.length-1],y=Y(k.c),col=k.c>=k.o?C_UP:C_DN;s+=`<rect x="${W-R+1}" y="${(y-10).toFixed(1)}" width="${R-2}" height="20" rx="4" fill="#2A2310"/><text x="${W-R+R/2}" y="${(y+4.5).toFixed(1)}" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">${fmt(k.c)}</text><path d="M${(X(cs.length-1)+bw/2+2).toFixed(1)} ${y.toFixed(1)}H${W-R}" stroke="${col}" stroke-width="1" opacity=".6"/>`;}
  return s+`</svg>`;
}
function niceStep(x){const p=Math.pow(10,Math.floor(Math.log10(Math.max(1e-6,x)))),f=x/p;return (f<1.5?1:f<3?2:f<7?5:10)*p;}

        if(r.sl==null)h+=`<div class="dnote warn">沒設停損：行情反向時會一路賠到斷頭價 ${fmt(r.liq)} 才出場。</div>`;
        else if(lev>=12)h+=`<div class="dnote warn">高槓桿：斷頭價只離 ${Math.abs(r.liq-r.e)} 點，大約 ${(Math.abs(r.liq-r.e)/A).toFixed(1)} 根 K 線的波動。</div>`;
      }else h+=`<div class="dnote">${q.l?`以 ${fmt(px)} 平倉，${smoney(eqNow-p.cash)}，手續費 ${money(r.fee)}。`:'這段不進場，看清楚再說。空手也是一種部位。'}</div>`;
      h+=`<button class="confirm" id="btnOrder">送出委託 ${ICONS.arrow}</button>`;
      const used=Array.isArray(p.hints)?p.hints.filter(x=>x.r===S.round).length:0;
      h+=`<button class="hintbtn" id="btnHint" ${p.hintLeft>0&&used<2?'':'disabled'}>${ICONS.bulb.replace('<svg','<svg style="width:18px;height:18px;display:inline-block;vertical-align:-3px;margin-right:4px"')}打開分析師錦囊（整局剩 ${p.hintLeft} 個${used>=2?'，本盤已用完':''}）</button>`;
      h+=ready;
    }else{
      h+=`<div class="dhead"><h2>${UI.pending?'送出中':'等待委託'}</h2><span class="pill soft">第 ${S.block+1}/${NB} 次</span></div><div class="empty"><b>大家正在偷偷下單</b>全部送出後一起成交，再開始揭曉 K 線。</div>${ready}`;
    }
    if(S.viewer!=null)h+=intelHTML(S.viewer);
  }else if(S.phase==='reveal'){
    const end=HIST+BLOCK*(S.block+1),done=S.shown-(end-BLOCK),R=S.ratio||{L:0,S:0,F:0},tot=Math.max(1,R.L+R.S+R.F);
    h+=`<div class="dhead"><h2>K 線揭曉</h2><span class="pill">${S.shown}/${TOTAL}</span></div>
      <div class="prog" aria-hidden="true"><i style="width:${done/BLOCK*100}%"></i></div>
      <div class="dlab">全場多空比：${R.L} 多・${R.S} 空・${R.F} 空手</div>
      <div class="ratio" aria-hidden="true"><i class="L" style="width:${R.L/tot*100}%"></i><i class="S" style="width:${R.S/tot*100}%"></i><i class="F" style="width:${R.F/tot*100}%"></i></div>
      <div class="dlab">本盤損益（即時）</div>${liveRows()}`;
    if(S.viewer!=null)h+=intelHTML(S.viewer);
  }else if(S.phase==='lesson'){
    const H=S.hist[S.hist.length-1];
    h+=`<div class="dhead"><h2>盤後教室</h2><span class="pill">第 ${S.round} 盤</span></div><div class="empty"><b>${H?esc(H.name):''}</b>${H&&H.ok?'這次照劇本走。':'這次型態失敗。'}打開教室看型態線和關鍵訊號。</div>
      <button class="passbtn" id="btnLesson">打開盤後教室</button>`;
    if(NET.role!=='client')h+=`<button class="confirm" id="btnNext">${S.round>=S.R?'查看最終結算':'開下一盤'} ${ICONS.arrow}</button>`;
  }else if(S.phase==='end'){
    const w=S.players.map((p,i)=>({i,t:Math.round(p.cash-p.debt)})).sort((a,b)=>b.t-a.t)[0];
    h+=`<div class="dhead"><h2>遊戲結束</h2><span class="pill">期貨戰士</span></div><div class="think">${avatar(w.i)}<div><b>${pnTxt(w.i)}</b><div>總分 ${money(w.t)}</div></div></div><button class="confirm" id="btnResult">查看結算 ${ICONS.arrow}</button><button class="passbtn" id="btnAgain">再來一局</button>`;
  }else{
    h+=`<div class="dhead"><h2>準備開局</h2></div><div class="empty"><b>設定玩家後開始</b>2 到 6 人，可以混搭 AI 對手。</div>`;
  }
  h+=NET.barHTML();
  $('#desk').innerHTML=h;
}
function renderPlayers(){
  const px=lastPx();
  $('#players').innerHTML=S.players.map((p,i)=>{const eq=eqAt(p,px),rp=eq-p.eq0,q=p.pos||{d:0,l:0};
    const st=S.phase==='decide'?(S.done.includes(i)?'<span class="tag">已委託</span>':'<span class="tag">看盤中</span>'):'';
    return `<div class="pl ${S.phase==='decide'&&!S.done.includes(i)?'cur':''}">${avatar(i)}<div style="min-width:0"><div class="nm">${esc(p.name)}${p.ai?'<span class="tag">AI</span>':''}${st}</div>
      <div class="fig"><span>權益<b>${money(eq)}</b></span>${S.phase!=='idle'?`<span>本盤<b class="pnl ${rp>0?'up':rp<0?'down':''}">${smoney(rp)}</b></span>`:''}${p.debt?`<span>借款<b>${money(p.debt)}</b></span>`:''}</div>
      <div class="pos">${dirTag(q.d,q.l)}${q.l?` <span class="note">成本 ${fmt(q.e)}</span>`:''}</div></div></div>`;}).join('');
}

/* ================= input ================= */
function scrollDesk(){if(innerWidth<=1040){const d=$('#desk');const r=d.getBoundingClientRect();if(r.top<0||r.bottom>innerHeight)d.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'});}}
$('#desk').addEventListener('click',e=>{
  if(e.target.closest('#btnAgain')){if(NET.role){NET.leave();showSetup();}else setupGame(S.cfg,S.R,S.aid);return;}
  if(e.target.closest('#btnResult')){endModal();return;}
  if(e.target.closest('#btnLesson')){lessonModal();return;}
  if(e.target.closest('#btnNext')){if(NET.role!=='client')nextRound();return;}
  if(!canDecide())return;
  const p=S.players[S.viewer],ml=maxLots(p,lastPx());
  if(e.target.closest('[data-keep]')){UI.keep=!UI.keep;if(!UI.keep&&p.pos.l){UI.d=p.pos.d;UI.l=Math.min(p.pos.l,Math.max(1,ml));}render();return;}
  const d=e.target.closest('[data-d]');if(d&&!d.disabled){UI.keep=false;UI.d=+d.dataset.d;if(UI.l>ml)UI.l=Math.max(1,ml);render();return;}
  const q=e.target.closest('[data-q]');if(q&&!q.disabled){UI.l=Math.max(1,Math.min(ml,UI.l+(+q.dataset.q)));render();return;}
  const sl=e.target.closest('[data-sl]');if(sl){UI.sl=+sl.dataset.sl;render();return;}
  const tp=e.target.closest('[data-tp]');if(tp){UI.tp=+tp.dataset.tp;render();return;}
  if(e.target.closest('#btnHint')){act({t:'hint'});return;}
  if(e.target.closest('#btnOrder')){act({t:'order',...curOrder()});}
});
function act(a){
  if(NET.role==='client'){if(a.t==='order')UI.pending=true;render();NET.send(a);return;}
  applyAct(S.viewer,a);
}
function applyAct(seat,a){
  if(S.phase!=='decide'||!S.players[seat]||S.done.includes(seat))return;
  const p=S.players[seat];
  if(a.t==='hint'){
    if(!(p.hintLeft>0))return;const used=p.hints.filter(x=>x.r===S.round).length;if(used>=2)return;
    const T=scTxt(S.sc);p.hints.push({r:S.round,h:T.hint[used](scP(S.sc))});p.hintLeft--;
    save();render();return;
  }
  if(a.t!=='order')return;
  let o;
  if(a.keep){o={keep:true};}
  else{const d=+a.d;if(![1,-1,0].includes(d))return;const sl=+a.sl||0,tp=+a.tp||0;if(![0,1,2].includes(sl)||![0,1,2].includes(tp))return;
    const l=d?Math.floor(+a.l):0;if(d&&!(l>=1&&l<=maxLots(p,lastPx())))return;o={d,l,sl,tp};}
  p.order=o;S.done.push(seat);
  if(humans().length>1&&!p.remote)S.viewer=null;
  proceedDecide();
}

/* ================= online multiplayer =================
   Shared engine in ../../assets/net.js. Future candles and the scenario stay on the host until revealed;
   orders are hidden until everyone has submitted; analyst hints are private per seat. */
const GAME={id:'futures-warrior',name:'期貨戰士',hostKey:'futureswarrior-net-host',clientKey:'futureswarrior-net-client',min:2,max:6,aiNames:AI_NAMES,
  secretHint:'每個人的委託在全部送出前互相看不到，分析師錦囊只會出現在自己的手機上。',
  start(cfg){setupGame(cfg,setupCfg.rounds,setupCfg.aid);S.online={code:NET.code};save();},
  strip(pub){
    delete pub.tdeck;delete pub.ai;delete pub.aiPx;delete pub.cfg;
    if(pub.cands)pub.cands=pub.cands.slice(0,pub.shown);
    if(pub.phase!=='lesson'&&pub.phase!=='end')delete pub.sc;
    pub.players.forEach(p=>{delete p.hints;delete p.order;});
  },
  secret(i){const p=S.players[i];return {gid:S.gid,round:S.round,hints:p.hints||[]};},
  applySecret(seat,sec){if(sec&&sec.gid===S.gid&&S.players[seat])S.players[seat].hints=sec.hints||[];},
  waiting(){
    if(!S)return [];
    if(S.phase==='decide')return S.players.map((_,i)=>i).filter(i=>!S.done.includes(i)&&!S.players[i].ai);
    return [];
  },
  action(seat,a){applyAct(seat,a);},
  afterTakeover(){if(S.phase==='decide')proceedDecide();},
  afterReclaim(){save();},
  resumeUI(){resumeAfterModal();},
  clientReset(prev){
    if(NET.seat!=null)S.viewer=NET.seat;
    if(!prev||prev.phase!==S.phase||prev.block!==S.block||prev.round!==S.round){resetUI();}
    else if(UI.pending&&S.done.includes(NET.seat))UI.pending=false;
  },
  clientModal(){
    if(S.phase==='lesson')return {key:'l'+S.gid+'-'+S.round,open:lessonModal};
    if(S.phase==='end')return {key:'end'+S.gid,open:endModal};
    return null;
  },
};

/* ================= boot ================= */
let wasNar=innerWidth<640;addEventListener('resize',()=>{const n=innerWidth<640;if(n!==wasNar){wasNar=n;if(S)renderChart();}});
window.__fw={setupGame,setSpeed:v=>{SPEED=v;},get S(){return S;},genScenario,TPL,analyze,planOrder,applyAct,lockIn,stepReveal};
(function boot(){
  S={players:[{name:'—',ai:true,cash:START,debt:0,pos:{d:0,l:0},eq0:START,hints:[],st:{}}],R:setupCfg.rounds,round:0,block:0,phase:'idle',shown:0,cands:null,sc:null,prod:null,done:[],log:[],hist:[],viewer:null,aid:true};
  render();showSetup();
})();
</script>
