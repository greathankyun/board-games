<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>無名信</title>
<meta name="description" content="原創匿名推理桌遊：1931 年上海小報互寄匿名信，從蠟封顏色推理是誰下的手，所有簽名在終刊一次翻開。">
<meta name="theme-color" content="#1E5641">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="icon" href="../../icons/icon-192.png">
<link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="桌遊大廳">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Outfit:wght@600;700;800&display=swap">
<style>
:root{
  --paper:#F5EEE1; --paper2:#EFE6D4; --card:#FFFBF4; --ink:#1F2B27; --muted:#6E7068; --line:#E5D9C3; --line2:#D9CBB1;
  --green:#1E5641; --green2:#28704F; --green-ink:#F3F7EF; --yellow:#F5C443; --yellow-ink:#2A2310;
  --orange:#E9643B; --pink:#F7DDD3; --pink2:#EFC6B8; --up:#2C8F4E; --up-bg:#D5EEDA; --down:#C8432F; --down-bg:#F7DAD3; --flat-bg:#ECE5D7;
  --red:#D7542B; --red-bg:#F8DCCF; --blue:#2E7DC0; --blue-bg:#D6E7F5; --violet:#7A5AD3; --violet-bg:#E4DCF7; --gold:#D19A17; --gold-bg:#F6E7BE;
  --p0:#E58FA0; --p1:#8B67D6; --p2:#4F9E61; --p3:#E0922F; --p4:#3E9CC4; --p5:#C8573E; --p6:#6C7A3A; --p7:#5C6BC0;
  --scrim:rgba(40,32,20,.45);
  --f-body:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
  --f-num:'Outfit','Noto Sans TC',system-ui,sans-serif;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55;font-weight:500}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
  background-image:radial-gradient(rgba(120,90,40,.07) 1px,transparent 1px);background-size:5px 5px}
.wrap{position:relative;z-index:1;max-width:1600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 28px}
h1,h2,h3,h4{text-wrap:balance;margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
svg{display:block}

/* header */
.top{display:flex;align-items:center;gap:14px 22px;flex-wrap:wrap;padding-block:6px 12px;border-bottom:1.5px solid var(--line2)}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit}
.brand svg{width:44px;height:44px;flex:none}
.brand h1{font-size:clamp(26px,3.4vw,38px);font-weight:900;letter-spacing:.06em;line-height:1}
.brand small{font-family:var(--f-num);font-size:12px;letter-spacing:.42em;color:var(--ink);font-weight:600;margin-left:6px}
.homelink{display:inline-flex;align-items:center;gap:6px;font-size:15px;font-weight:900;color:var(--ink);text-decoration:none;border:1.5px solid var(--ink);border-radius:12px;padding:7px 12px;background:var(--card)}.homelink svg{width:18px;height:18px}
.vsep{width:1.5px;align-self:stretch;background:var(--line2);margin-block:6px}
.steps{display:flex;align-items:center;flex:1;min-width:0;justify-content:center}
.step{font-family:var(--f-num);font-weight:700;font-size:15px;padding:5px 14px;border-radius:999px;border:1.5px solid var(--line2);background:var(--card);color:var(--ink);white-space:nowrap}
.step.done{color:var(--muted);background:var(--paper2)}
.step.now{background:var(--green);border-color:var(--green);color:var(--green-ink);font-size:17px;padding:6px 18px}
.link{flex:1;min-width:8px;max-width:56px;height:2px;background:repeating-linear-gradient(90deg,var(--line2) 0 4px,transparent 4px 8px)}
.link.done{background:var(--green)}
.tops{display:flex;gap:10px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--ink);background:var(--card);color:var(--ink);padding:8px 16px;border-radius:12px;cursor:pointer;font-weight:700;line-height:1.2;text-decoration:none}
.btn svg{width:18px;height:18px}
.btn:hover:not(:disabled){transform:translateY(-1px)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.dark,.btn.primary{background:var(--green);border-color:var(--green);color:var(--green-ink)}
.btn.ghost{background:transparent}

/* layout */
.board{display:grid;grid-template-columns:minmax(0,1fr) minmax(340px,430px);grid-template-areas:"hero desk" "main desk";grid-template-rows:auto 1fr;gap:14px 18px;margin-top:12px;align-items:start}
.hero{grid-area:hero;position:relative;min-height:140px;display:flex;align-items:center;overflow:hidden;border-radius:18px}
.hero-txt{position:relative;z-index:2;padding:8px 0 10px}
.eyebrow{display:flex;align-items:center;gap:12px;font-family:var(--f-num);font-weight:600;letter-spacing:.32em;font-size:13px}
.eyebrow::after{content:"";width:80px;height:1.5px;background:var(--ink)}
.hero h2{font-size:clamp(28px,4vw,48px);font-weight:900;letter-spacing:.03em;line-height:1.15;margin-top:6px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.swoosh{display:block;width:150px;height:14px;margin-top:-2px}
.qbadge{position:relative;font-size:17px;font-weight:900;border:2px solid var(--ink);border-radius:999px;padding:3px 14px;background:var(--card);letter-spacing:.04em}
.hero-art{position:absolute;right:0;top:0;bottom:0;width:min(62%,640px);z-index:1;
  -webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 28%);mask-image:linear-gradient(90deg,transparent 0%,#000 28%)}
.hero-art svg{width:100%;height:100%}
main{grid-area:main;min-width:0}
.sect{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:900;padding-bottom:10px;border-bottom:1.5px solid var(--line2);margin:0 0 12px}
.sect svg{width:26px;height:26px;color:var(--orange)}
.sect small{font-size:13px;color:var(--muted);font-weight:700;margin-left:auto}

/* desk */
.desk{grid-area:desk;position:sticky;top:max(10px,env(safe-area-inset-top,0px));background:var(--green);color:var(--green-ink);border-radius:26px;padding:24px 24px 22px;overflow:hidden;display:flex;flex-direction:column;gap:14px;box-shadow:0 18px 40px rgba(20,60,45,.25)}
.desk .leaf{position:absolute;right:-30px;top:-20px;width:190px;height:190px;opacity:.9;pointer-events:none}
.desk>*{position:relative}
.dhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.dhead h2{font-size:clamp(26px,2.6vw,36px);font-weight:900;letter-spacing:.04em;line-height:1.1}
.pill{background:var(--orange);color:#fff;font-weight:900;border-radius:999px;padding:5px 14px;font-size:15px;white-space:nowrap}
.pill.soft{background:rgba(255,255,255,.16)}
.dsub{font-weight:700;font-size:15px;margin-top:-6px;opacity:.9}
.dlab{font-size:14px;opacity:.9;font-weight:900;display:flex;align-items:center;gap:8px;justify-content:space-between}
.dlab small{font-weight:700;opacity:.8;font-size:12px}
.dnote{font-size:13px;font-weight:700;background:rgba(255,255,255,.12);border-radius:10px;padding:7px 12px}
.dnote.warn{background:rgba(233,100,59,.28)}
.confirm{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:none;border-radius:16px;background:var(--yellow);color:var(--yellow-ink);font-size:22px;font-weight:900;padding:13px;cursor:pointer;box-shadow:0 4px 0 #C99A1E;letter-spacing:.06em}
.confirm svg{width:24px;height:24px}
.confirm:active:not(:disabled){transform:translateY(2px);box-shadow:0 2px 0 #C99A1E}
.confirm:disabled{opacity:.5;cursor:not-allowed}
.passbtn{width:100%;border:2px solid rgba(255,255,255,.85);background:transparent;color:var(--green-ink);border-radius:14px;font-weight:900;font-size:17px;padding:10px;cursor:pointer}
.passbtn:hover{background:rgba(255,255,255,.08)}
.empty{border:2px dashed rgba(255,255,255,.35);border-radius:16px;padding:20px 16px;text-align:center;font-weight:700;opacity:.92}
.empty b{display:block;font-size:19px;margin-bottom:4px}
.think{display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.1);border-radius:16px;padding:14px}
.think .av{width:56px;height:56px;flex:none}
.think b{font-size:19px}
.dots::after{content:"…";display:inline-block;animation:blink 1.1s steps(3) infinite}
@keyframes blink{0%{opacity:.2}50%{opacity:1}100%{opacity:.2}}
.chooser{display:flex;flex-wrap:wrap;gap:6px}
.chooser button{border:2px solid rgba(255,255,255,.55);background:transparent;color:var(--green-ink);border-radius:12px;padding:7px 12px;font-weight:900;cursor:pointer;display:inline-flex;align-items:center;gap:6px;min-height:40px}
.chooser button .av{width:24px;height:24px}
.chooser button.on{background:var(--card);color:var(--ink);border-color:var(--card)}
.chooser button:disabled{opacity:.35;cursor:not-allowed}
.chooser button.red.on{background:var(--red);border-color:var(--red);color:#fff}
.chooser button.blue.on{background:var(--blue);border-color:var(--blue);color:#fff}
.chooser.big button{flex:1;justify-content:center;font-size:16px}
.opt2{display:flex;flex-direction:column;gap:6px}
.opt2 button{display:flex;justify-content:space-between;gap:10px;align-items:center;text-align:left;border:2px solid rgba(255,255,255,.4);background:transparent;color:var(--green-ink);border-radius:12px;padding:9px 12px;cursor:pointer}
.opt2 button b{font-weight:900;font-size:15px}
.opt2 button span{font-size:12px;opacity:.85}
.opt2 button.on{background:var(--card);color:var(--ink);border-color:var(--card)}
.opt2 button.on span{opacity:1;color:var(--muted)}
.opt2 button:disabled{opacity:.35;cursor:not-allowed}
.dsec{display:flex;flex-direction:column;gap:8px;padding-top:12px;border-top:1px solid rgba(255,255,255,.2)}

/* private note card */
.intel{position:relative;background:var(--pink);color:var(--ink);border-radius:14px;padding:14px 16px 12px;box-shadow:0 6px 14px rgba(0,0,0,.18)}
.intel::after{content:"";position:absolute;right:0;top:0;width:28px;height:28px;background:linear-gradient(225deg,var(--green) 50%,var(--pink2) 50%);border-bottom-left-radius:8px}
.intel .ilab{display:flex;align-items:center;gap:8px;font-weight:900;color:#B24A35;font-size:16px;padding-bottom:8px;border-bottom:1.5px solid var(--pink2)}
.intel .ilab svg{width:20px;height:20px}
.intel ul{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:260px;overflow:auto}
.intel li{font-size:13.5px;line-height:1.45;display:flex;gap:8px;align-items:flex-start}
.intel li .rt{font-family:var(--f-num);font-weight:700;font-size:11px;border:1.5px solid var(--pink2);border-radius:6px;padding:0 5px;background:var(--card);white-space:nowrap;margin-top:1px}
.intel li.void{opacity:.45;text-decoration:line-through}
.intel .inote{font-size:12.5px;color:#5B4A40;margin-top:8px}
.intel .big{font-size:22px;font-weight:900;margin:8px 0 2px}
.stamp{border:1.5px solid #B24A35;color:#B24A35;border-radius:8px;padding:1px 9px;font-weight:900;font-size:12px;white-space:nowrap;display:inline-block;transform:rotate(-3deg)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:900;padding:1px 9px;border-radius:8px;background:var(--flat-bg);color:var(--ink);white-space:nowrap}
.chip.red{background:var(--red);color:#fff}.chip.blue{background:var(--blue);color:#fff}.chip.violet{background:var(--violet);color:#fff}
.chip.gold{background:var(--gold-bg);color:#6B4D07}.chip.green{background:var(--up-bg);color:var(--up)}.chip.down{background:var(--down-bg);color:var(--down)}

/* feed */
.feed{margin-top:18px}
.feedlist{list-style:none;margin:0;padding:0;overflow:auto;max-height:320px}
.feedlist li{display:grid;grid-template-columns:auto 34px minmax(0,1fr);gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.qtag{font-family:var(--f-num);font-weight:700;font-size:12px;border:1.5px solid var(--line2);border-radius:6px;padding:1px 6px;background:var(--card)}
.feedlist .av{width:34px;height:34px}
.feedlist .txt{font-size:13.5px;line-height:1.45;min-width:0}
.feedlist .ic{width:34px;height:34px;border-radius:50%;background:var(--paper2);display:grid;place-items:center;color:var(--green)}
.feedlist .ic svg{width:18px;height:18px}
.feedlist li.q .txt{font-weight:900;color:var(--green)}
.feedlist li.k .txt{color:#8A4A12}
.pn{font-weight:900;color:var(--ink)}

/* players strip */
.players{margin-top:18px;background:var(--card);border:1.5px solid var(--line);border-radius:20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));padding:8px;gap:6px;box-shadow:0 8px 20px rgba(90,70,30,.06)}
.pl{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:14px;position:relative;min-width:0}
.pl.cur{background:var(--pink)}
.pl .av{width:52px;height:52px;flex:none}
.pl .nm{font-size:17px;font-weight:900;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tag{font-size:11px;font-weight:700;border:1.5px solid var(--line2);border-radius:6px;padding:0 5px;color:var(--muted);background:var(--card)}
.pl .fig{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:13px;color:var(--muted)}
.pl .fig b{font-family:var(--f-num);font-weight:800;color:var(--ink);font-size:16px;margin-left:3px}

/* responsive */
@media (max-width:1040px){
  .board{grid-template-columns:minmax(0,1fr);grid-template-areas:"hero" "desk" "main"}
  .desk{position:relative;top:0}
  .hero-art{width:70%;opacity:.55}
}
@media (max-width:640px){
  .vsep{display:none}
  .steps{order:3;flex-basis:100%;justify-content:flex-start;overflow-x:auto;padding-bottom:2px}
  .step{padding:4px 10px;font-size:13px}.step.now{padding:5px 12px;font-size:15px}
  .brand small{display:none}
  .desk{padding:20px 16px;border-radius:22px}
  .tops .btn{padding:8px 11px}
}

/* modals */
.overlay{position:fixed;inset:0;background:var(--scrim);display:grid;place-items:center;z-index:50;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--card);color:var(--ink);border-radius:24px;border:1.5px solid var(--line);width:min(660px,100%);max-height:calc(100dvh - 32px);overflow:auto;padding:24px;box-shadow:0 30px 70px rgba(40,30,10,.3)}
.modal h2{font-size:27px;font-weight:900;margin-bottom:6px;letter-spacing:.03em}
.modal .sub{color:var(--muted);margin:0 0 14px}
.modal .acts{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}
.modal .acts .btn{padding:10px 20px;font-size:16px}
.modal .intel::after{background:linear-gradient(225deg,var(--card) 50%,var(--pink2) 50%)}
.seats{display:flex;flex-direction:column;gap:10px}
.seat{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center}
.seat .av{width:44px;height:44px}
.seat input{font:inherit;font-weight:700;padding:9px 12px;border:1.5px solid var(--line2);border-radius:12px;background:var(--paper);color:var(--ink);min-width:0;width:100%}
.seg{display:inline-flex;border:1.5px solid var(--line2);border-radius:12px;overflow:hidden;background:var(--paper);flex-wrap:wrap}
.seg button{border:none;background:transparent;color:var(--muted);padding:8px 12px;cursor:pointer;font-weight:700}
.seg button.on{background:var(--green);color:var(--green-ink)}
.field{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:14px 0;flex-wrap:wrap}
.field>span{font-weight:900;font-size:16px}
.note{font-size:12px;color:var(--muted)}
.pitch{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:0 0 6px}
.pitch div{background:var(--paper);border-radius:14px;padding:12px;font-size:13px;color:var(--muted)}
.pitch b{display:block;color:var(--ink);font-size:15px;font-weight:900;margin-bottom:2px}
.setup-art{height:120px;margin:-24px -24px 16px;overflow:hidden;border-radius:24px 24px 0 0}
.setup-art svg{width:100%;height:100%}
.rules{font-size:15px;line-height:1.8}
.rules h3{font-size:19px;font-weight:900;margin:18px 0 6px;color:var(--green)}
.rules p,.rules li{max-width:64ch}
.rules ol,.rules ul{padding-left:1.3em;margin:6px 0}
.rules table{border-collapse:collapse;font-size:14px;margin:6px 0;width:100%}
.rules td,.rules th{border-top:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.rules th{font-size:12px;color:var(--muted)}
.handoff .av{width:84px;height:84px;margin-bottom:10px}
table.res{width:100%;border-collapse:collapse;margin-top:12px;font-size:14px}
table.res th{font-size:12px;color:var(--muted);text-align:right;font-weight:700;padding:4px 6px}
table.res td{text-align:right;padding:8px 6px;border-top:1px solid var(--line);font-family:var(--f-num);font-weight:700;font-variant-numeric:tabular-nums}
table.res th:first-child,table.res td:first-child{text-align:left;font-family:var(--f-body)}
.tablewrap{overflow-x:auto}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--muted)}
.win{font-size:32px;font-weight:900;color:var(--green);margin:4px 0}
.revlist{display:flex;flex-direction:column;gap:8px}
.rev{border:1.5px solid var(--line2);border-radius:14px;padding:10px 14px;background:var(--paper);display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.rev h4{font-size:16px;font-weight:900}
.rev .kn{font-size:12.5px;color:var(--muted);font-weight:700}
@media (prefers-reduced-motion:reduce){.dots::after{animation:none}.btn{transition:none}}

/* Layout: a postmark ledger of every letter on the left, the green writing desk on the right. */
.seal{display:inline-block;width:18px;height:18px;border-radius:50%;background:var(--sc);box-shadow:inset 0 -2px 0 rgba(0,0,0,.25),0 0 0 2px rgba(255,255,255,.7);vertical-align:-3px;flex:none}
.seal.lg{width:30px;height:30px}
.period{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:12px 14px;margin-bottom:12px;box-shadow:0 2px 0 var(--line)}
.period h4{font-size:16px;font-weight:900;display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.period h4 .hl{font-size:13px;font-weight:700;color:#8A4A12;background:var(--gold-bg);border-radius:8px;padding:1px 8px}
.letters{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.lt{display:flex;gap:10px;align-items:center;border:1.5px solid var(--line2);border-radius:12px;padding:8px 10px;background:var(--paper);min-width:0}
.lt .no{font-family:var(--f-num);font-weight:800;font-size:12px;color:var(--muted);width:24px;flex:none}
.lt .bd{min-width:0;display:flex;flex-direction:column;gap:2px}
.lt .bd b{font-size:14.5px;font-weight:900}
.lt .bd small{font-size:12px;color:var(--muted);font-weight:700;display:flex;gap:4px;flex-wrap:wrap}
.lt.mine{border-color:var(--green);background:#EAF3EC}
.lt.bad b{color:var(--down)} .lt.good b{color:var(--up)}
.tl{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:900;border-radius:6px;padding:0 6px;background:var(--card);border:1px solid var(--line2);color:var(--ink)}
.tl.me{background:var(--green);color:#fff;border-color:var(--green)}
.tl.acc{background:var(--down-bg);color:var(--down);border-color:var(--down-bg)}
.tl.clm{background:var(--up-bg);color:var(--up);border-color:var(--up-bg)}
.tl.inv{background:var(--pink);color:#B24A35;border-color:var(--pink2)}
.typecards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.typecards button{border:2px solid rgba(255,255,255,.5);background:transparent;color:var(--green-ink);border-radius:12px;padding:8px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:900}
.typecards button small{font-size:11px;font-weight:700;opacity:.85}
.typecards button.on{background:var(--card);color:var(--ink);border-color:var(--card)}
.typecards button:disabled{opacity:.28;cursor:not-allowed;text-decoration:line-through}

.sealpick{display:flex;flex-wrap:wrap;gap:8px}

.sealpick button.on{background:var(--card);color:var(--ink);border-color:var(--card)}
.accrow{display:flex;flex-direction:column;gap:6px;background:rgba(255,255,255,.08);border-radius:12px;padding:10px}
.accrow .q{font-weight:900;font-size:14px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.stat{display:flex;flex-wrap:wrap;gap:6px}
</style>

<body>
<div class="wrap">
  <header class="top">
    <a class="homelink" href="../../"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg>大廳</a>
    <div class="brand"><svg viewBox="0 0 56 48" aria-hidden="true"><rect x="5" y="10" width="40" height="28" rx="3" fill="none" stroke="#1E5641" stroke-width="5"/><path d="M7 12l18 14 18-14" fill="none" stroke="#1E5641" stroke-width="4"/><circle cx="42" cy="34" r="9" fill="#E9643B"/></svg><h1>無名信</h1><small>UNSIGNED</small></div>

      <button class="btn" id="btnRules" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 5h6a3 3 0 0 1 3 3v12a2 2 0 0 0-2-2H3z"/><path d="M21 5h-6a3 3 0 0 0-3 3v12a2 2 0 0 1 2-2h7z"/></svg>規則</button>
      <button class="btn dark" id="btnNew" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>新遊戲</button>

      <h3 class="sect"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="5.5" width="18" height="13" rx="2"/><path d="M3.5 7l8.5 6 8.5-6"/></svg>郵戳紀錄<small id="ledgernote"></small></h3>
      <div class="stat" id="stat" style="margin-bottom:12px"></div>
      <div id="ledger"></div>
      <section class="feed"><h3 class="sect"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 21h18M6 17v-4M10 17V9M14 17v-6M18 17V5"/></svg>報社動態</h3><div id="feed"></div></section>
    </main>

  <section class="players" id="players" aria-label="報社"></section>
</div>

<div class="overlay" id="rulesOv" hidden><div class="modal" id="rulesModal" role="dialog" aria-modal="true"></div></div>
<script>
'use strict';
const LOBBY='../../';
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
const pick=a=>a[Math.random()*a.length|0];
const SPEEDS={快:250,中:650,慢:1200};
let SPEED=650, timer=null;
function lsGet(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch(e){return null;}}
function lsSet(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
const ICONS={
  lock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></svg>',
  bars:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 21h18M6 17v-4M10 17V9M14 17v-6M18 17V5"/></svg>',
  arrow:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15M13 6l6 6-6 6"/></svg>',
  spark:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M18 6l-2.5 2.5M8.5 15.5 6 18"/></svg>',
  gavel:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4l6 6M11 7l6 6M12.5 5.5l-5 5 4 4 5-5M9.5 12.5 3 19"/></svg>',
  book:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 5h6a3 3 0 0 1 3 3v12a2 2 0 0 0-2-2H3z"/><path d="M21 5h-6a3 3 0 0 0-3 3v12a2 2 0 0 1 2-2h7z"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg>',
  eye:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
  mail:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="5.5" width="18" height="13" rx="2"/><path d="M3.5 7l8.5 6 8.5-6"/></svg>',

};
const AVATARS=[
 `<circle cx="32" cy="32" r="32" fill="#F6C6CF"/><ellipse cx="24" cy="17" rx="5.5" ry="14" fill="#fff" transform="rotate(-12 24 17)"/><ellipse cx="24" cy="18" rx="2.6" ry="10" fill="#F2A0B0" transform="rotate(-12 24 18)"/><ellipse cx="40" cy="17" rx="5.5" ry="14" fill="#fff" transform="rotate(12 40 17)"/><ellipse cx="40" cy="18" rx="2.6" ry="10" fill="#F2A0B0" transform="rotate(12 40 18)"/><ellipse cx="32" cy="40" rx="16" ry="14" fill="#fff"/><circle cx="26" cy="38" r="2.2" fill="#3A2A2A"/><circle cx="38" cy="38" r="2.2" fill="#3A2A2A"/><ellipse cx="32" cy="43.5" rx="2.4" ry="1.7" fill="#E9798F"/><circle cx="22" cy="44" r="2.6" fill="#F8C4CE"/><circle cx="42" cy="44" r="2.6" fill="#F8C4CE"/>`,
 `<circle cx="32" cy="32" r="32" fill="#CDBCF0"/><path d="M10 64c2-14 10-20 22-20s20 6 22 20z" fill="#7A5236"/><path d="M18 34c0-12 7-20 15-20s14 7 14 16c0 6-3 10-6 12l-8 2-11-3c-3-2-4-4-4-7z" fill="#fff"/><path d="M38 30c6 0 11 2 12 6-2 0-3 1-5 3-1-3-4-4-7-4z" fill="#F4B63B"/><circle cx="34" cy="27" r="2.6" fill="#2A2320"/><path d="M29 23l9 2" stroke="#2A2320" stroke-width="2.2" stroke-linecap="round"/>`,
 `<circle cx="32" cy="32" r="32" fill="#CFE6CB"/><path d="M14 14l9 12h18l9-12 1 18c0 12-9 20-19 20s-19-8-19-20z" fill="#E98A3A"/><path d="M17 18l5 7M47 18l-5 7" stroke="#B85A1E" stroke-width="3" stroke-linecap="round"/><path d="M15 33c4 0 11 4 17 13 6-9 13-13 17-13-1 11-8 19-17 19S16 44 15 33z" fill="#fff"/><circle cx="25" cy="33" r="2.4" fill="#2A2320"/><circle cx="39" cy="33" r="2.4" fill="#2A2320"/><circle cx="32" cy="45" r="2.6" fill="#2A2320"/>`,
 `<circle cx="32" cy="32" r="32" fill="#F4D3A0"/><path d="M12 64c2-11 9-15 20-15s18 4 20 15z" fill="#5E7F55"/><circle cx="32" cy="36" r="13" fill="#F2C49B"/><path d="M8 27c8-3 40-3 48 0-4 2-44 2-48 0z" fill="#8A5A2E"/><path d="M19 26c1-9 6-13 13-13s12 4 13 13z" fill="#B07A42"/><rect x="19" y="22" width="26" height="4" fill="#6E4522"/><circle cx="27" cy="36" r="1.9" fill="#2A2320"/><circle cx="37" cy="36" r="1.9" fill="#2A2320"/><path d="M27 42c3 3 7 3 10 0" stroke="#8A4A2A" stroke-width="2" fill="none" stroke-linecap="round"/>`,
 `<circle cx="32" cy="32" r="32" fill="#C3E2EE"/><path d="M14 22l6 6M50 22l-6 6" stroke="#6B5444" stroke-width="4" stroke-linecap="round"/><ellipse cx="32" cy="40" rx="18" ry="19" fill="#8C6E58"/><ellipse cx="32" cy="46" rx="11" ry="11" fill="#D9C2A5"/><circle cx="24.5" cy="34" r="7" fill="#fff"/><circle cx="39.5" cy="34" r="7" fill="#fff"/><circle cx="25" cy="34" r="3.2" fill="#2A2320"/><circle cx="39" cy="34" r="3.2" fill="#2A2320"/><path d="M29.5 39l2.5 4 2.5-4z" fill="#F0A93B"/>`,
 `<circle cx="32" cy="32" r="32" fill="#F3C9A8"/><path d="M14 14l8 14M50 14l-8 14" stroke="#4A4A4A" stroke-width="7" stroke-linecap="round"/><ellipse cx="32" cy="38" rx="18" ry="16" fill="#5A5A5E"/><ellipse cx="32" cy="43" rx="9" ry="7" fill="#EDE6DC"/><circle cx="25" cy="35" r="2.6" fill="#F4D35E"/><circle cx="39" cy="35" r="2.6" fill="#F4D35E"/><path d="M29.5 41.5h5l-2.5 2.5z" fill="#E77F8B"/><path d="M14 42h8M14 46h8M42 42h8M42 46h8" stroke="#DCD6CC" stroke-width="1.2"/>`,
 `<circle cx="32" cy="32" r="32" fill="#D8E6B5"/><circle cx="18" cy="20" r="7" fill="#8A5E3C"/><circle cx="46" cy="20" r="7" fill="#8A5E3C"/><circle cx="32" cy="36" r="18" fill="#A9774E"/><ellipse cx="32" cy="43" rx="9" ry="7" fill="#E6C9A3"/><circle cx="25" cy="33" r="2.4" fill="#2A2320"/><circle cx="39" cy="33" r="2.4" fill="#2A2320"/><ellipse cx="32" cy="40" rx="3.2" ry="2.3" fill="#2A2320"/>`,
 `<circle cx="32" cy="32" r="32" fill="#BFD0F2"/><ellipse cx="32" cy="38" rx="17" ry="19" fill="#2E3440"/><ellipse cx="32" cy="42" rx="11" ry="13" fill="#fff"/><circle cx="26" cy="32" r="2.4" fill="#2A2320"/><circle cx="38" cy="32" r="2.4" fill="#2A2320"/><path d="M28.5 37l3.5 3 3.5-3z" fill="#F0A93B"/><circle cx="26.7" cy="31.3" r=".8" fill="#fff"/><circle cx="38.7" cy="31.3" r=".8" fill="#fff"/>`,
];
const avatar=i=>`<svg class="av" viewBox="0 0 64 64" aria-hidden="true">${AVATARS[i%AVATARS.length]}</svg>`;
const swoosh='<svg class="swoosh" viewBox="0 0 150 14" aria-hidden="true"><path d="M3 10 Q60 1 147 6" stroke="#E9643B" stroke-width="4.5" fill="none" stroke-linecap="round"/></svg>';
const leafDeco='<svg class="leaf" viewBox="0 0 200 200" aria-hidden="true"><g fill="#2E7553"><path d="M120 10c40 10 70 40 74 80-40-6-70-36-74-80z"/><path d="M60 0c30 20 44 54 36 90-30-22-44-56-36-90z" fill="#2A6B4C"/><path d="M190 120c-30 10-64 4-86-20 32-12 64-6 86 20z" fill="#327C59"/></g><g stroke="#24614A" stroke-width="2" fill="none"><path d="M124 16c20 24 40 44 66 70"/><path d="M64 8c10 26 20 50 30 76"/></g></svg>';
function tree(x,y,r,col,trunk='#8A6A4A'){return `<rect x="${x-1.6}" y="${y}" width="3.2" height="${r*1.3}" fill="${trunk}"/><circle cx="${x}" cy="${y-r*.2}" r="${r}" fill="${col}"/><circle cx="${x-r*.6}" cy="${y+r*.25}" r="${r*.7}" fill="${col}"/><circle cx="${x+r*.65}" cy="${y+r*.2}" r="${r*.72}" fill="${col}"/>`;}

/* modals */
let modalCb=null;
function openModal(html,cb){$('#modal').innerHTML=html;$('#overlay').hidden=false;$('#modal').scrollTop=0;modalCb=cb;const f=$('#modal .primary');f&&f.focus({preventScroll:true});}
function closeModal(){$('#overlay').hidden=true;$('#modal').innerHTML='';modalCb=null;}
$('#modal').addEventListener('click',e=>{const b=e.target.closest('[data-m]');if(b&&!b.disabled&&modalCb)modalCb(b.dataset.m,b);});
function showRulesHTML(html){
  $('#rulesModal').innerHTML=`<h2>遊戲規則</h2><div class="rules">${html}</div><div class="acts"><button class="btn primary" id="closeRules">知道了</button></div>`;
  $('#rulesOv').hidden=false;$('#rulesModal').scrollTop=0;$('#closeRules').focus({preventScroll:true});
}
$('#rulesOv').addEventListener('click',e=>{if(e.target.id==='closeRules'||e.target.id==='rulesOv')$('#rulesOv').hidden=true;});
function feedHTML(log,tag,emptyTxt){
  const items=log.slice(0,40).map(l=>{
    const who=l.a!=null&&S.players[l.a]?avatar(l.a):`<span class="ic">${l.c==='q'?ICONS.spark:l.c==='k'?ICONS.gavel:ICONS.bars}</span>`;
    return `<li class="${l.c||''}"><span class="qtag">${tag(l)}</span>${who}<span class="txt">${l.h}</span></li>`;}).join('');
  return `<ul class="feedlist">${items||`<li><span class="txt" style="grid-column:1/-1;color:var(--muted)">${emptyTxt}</span></li>`}</ul>`;
}
function setupSeatsHTML(cfg,min,max){
  return `<div class="field"><span>玩家人數</span><div class="seg">${Array.from({length:max-min+1},(_,k)=>k+min).map(k=>`<button data-m="n:${k}" class="${k===cfg.n?'on':''}">${k} 人</button>`).join('')}</div></div>
   <div class="seats">${cfg.seats.slice(0,cfg.n).map((s,i)=>`<div class="seat">${avatar(i)}<input data-seat="${i}" value="${esc(s.name)}" maxlength="10" aria-label="玩家 ${i+1} 名稱"><div class="seg"><button data-m="h:${i}" class="${s.ai?'':'on'}">人類</button><button data-m="a:${i}" class="${s.ai?'on':''}">AI</button></div></div>`).join('')}</div>
   <div class="field"><span>AI 速度</span><div class="seg">${Object.keys(SPEEDS).map(k=>`<button data-m="sp:${k}" class="${k===cfg.speed?'on':''}">${k}</button>`).join('')}</div></div>`;
}
function setupSeatsHandle(cfg,m,redraw){
  document.querySelectorAll('[data-seat]').forEach(inp=>{cfg.seats[+inp.dataset.seat].name=inp.value;});
  if(m.startsWith('n:')){cfg.n=+m.slice(2);redraw();return true;}
  if(m.startsWith('h:')||m.startsWith('a:')){cfg.seats[+m.slice(2)].ai=m[0]==='a';redraw();return true;}
  if(m.startsWith('sp:')){cfg.speed=m.slice(3);SPEED=SPEEDS[cfg.speed];redraw();return true;}
  return false;
}
function seatsToPlayers(cfg,aiNames){return cfg.seats.slice(0,cfg.n).map((s,i)=>({name:(s.name||'').trim()||(s.ai?aiNames[i%aiNames.length]:'玩家'+(i+1)),ai:s.ai}));}
function scrollDeskIntoView(){if(innerWidth<=1040){const d=$('#desk');const r=d.getBoundingClientRect();if(r.top<0||r.top>innerHeight*.6)d.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'});}}

/* ================= constants ================= */
const PERIODS=5, START_SALES=10, START_REP=3, CLAIMS=2, PROBES=2;
const COLORS=[{n:'紅',c:'#C8432F'},{n:'藍',c:'#2E6FB0'},{n:'綠',c:'#2F8F5B'},{n:'金',c:'#D19A17'},{n:'紫',c:'#7A5AD3'},{n:'黑',c:'#2F3437'}];
const PAIRS=[];for(let a=0;a<6;a++)for(let b=a+1;b<6;b++)PAIRS.push([a,b]);
const TYPES={
  expose:{n:'爆料',fx:'銷量 −3',gain:2,bad:true,desc:'收件人銷量 −3；終刊時你 +2'},
  poach:{n:'挖角',fx:'記者 −1',gain:3,bad:true,desc:'收件人失去 1 名記者；終刊時你 +3'},
  gift:{n:'贈禮',fx:'銷量 +2',gain:0,bad:false,desc:'收件人銷量 +2；可以公開認領'},
  forge:{n:'偽造爆料',fx:'銷量 −2',gain:0,bad:true,desc:'收件人銷量 −2；可以用任何顏色的蠟封'},
  blank:{n:'白紙',fx:'無',gain:0,bad:false,desc:'什麼都不做，用來掩護'},
};
const TK=['expose','poach','gift','forge','blank'];
const HEADLINES=[
  {n:'戰火新聞',d:'本期爆料與偽造爆料額外 −1',k:'war'},
  {n:'慈善年',d:'本期贈禮效果加倍（+4）',k:'charity'},
  {n:'停刊風波',d:'本期不印刷',k:'halt'},
  {n:'號外',d:'本期印刷每家額外 +1',k:'extra'},
  {n:'讀者投書',d:'印刷後銷量最低的報社 +3',k:'readers'},
  {n:'偵探出差',d:'本期每人可以免費調查一封信（不扣調查令）',k:'detective'},
  {n:'平靜的一週',d:'沒有特別的事',k:'calm'},
  {n:'樹大招風',d:'印刷後銷量最高的報社 −2',k:'tall'},
  {n:'紙價上漲',d:'本期印刷每家 −1',k:'paper'},
  {n:'挖角潮',d:'本期挖角的收件人另外銷量 −2',k:'raid'},
];
const AI_NAMES=['申報','新聞報','晶報','時事新報','大公報','小日報'];
const SAVE_KEY='unsigned-save-v1';

/* ================= state ================= */
let S=null, UI={};
let setupCfg={n:4,seats:[{name:'你',ai:false}].concat(AI_NAMES.slice(0,5).map(n=>({name:n,ai:true}))),speed:'中'};
const NP=()=>S.players.length;
const humans=()=>S.players.filter(p=>!p.ai);
const pn=i=>`<b class="pn" data-p="${i}">${esc(S.players[i].name)}</b>`;
const sealH=(c,lg)=>`<span class="seal ${lg?'lg':''}" style="--sc:${COLORS[c].c}" title="${COLORS[c].n}蠟"></span>`;
const cname=c=>COLORS[c].n;
function log(html,cls=''){const m=/data-p="(\d)"/.exec(html);S.log.unshift({h:html,c:cls,a:m?+m[1]:null,p:S.p});if(S.log.length>200)S.log.length=200;}
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(S));}catch(e){}}
function clearSave(){lsSet(SAVE_KEY,null);}
const order=()=>Array.from({length:NP()},(_,k)=>(S.start+k)%NP());
const hl=()=>HEADLINES[S.heads[S.p-1]];

/* ================= setup ================= */
function setupGame(players){
  clearTimeout(timer);
  const pairs=shuffle(PAIRS.map((_,k)=>k));
  S={players:players.map((p,i)=>({name:p.name,ai:p.ai,pair:pairs[i],sales:START_SALES,rep:START_REP,used:[],claims:CLAIMS,probes:PROBES,notes:[],main:Math.random()<.5?0:1})),
     letters:[],p:1,start:Math.random()*players.length|0,phase:'head',heads:shuffle(HEADLINES.map((_,k)=>k)).slice(0,PERIODS),
     ch:{},pr:{},statements:[],log:[],viewer:null,cfgPlayers:players};
  const hs=humans();S.viewer=hs.length===1?S.players.indexOf(hs[0]):null;
  log('創刊號出刊。各報社開始互寄匿名信。','q');
  UI={};render();headModal();
}
function headModal(){
  S.phase='head';render();save();
  const h=hl();
  openModal(`<h2>第 ${S.p} 期 · 頭條</h2><div class="intel" style="margin:6px 0 4px"><div class="ilab">${ICONS.spark}本期頭條</div><div class="big">${h.n}</div><div class="inote">${h.d}</div></div>
   <p class="sub">接下來每家報社秘密寫一封匿名信：選信件、選收件人、選蠟封顏色。</p>
   <div class="acts"><button class="btn primary" data-m="go">開始寫信</button></div>`,()=>{closeModal();S.phase='write';S.ch={};proceed();});
  if(!humans().length)timer=setTimeout(()=>modalCb&&modalCb('go'),SPEED*2);
}

/* ================= deduction (AI) ================= */
function sampleWorlds(i,K){
  const me=S.players[i],N=NP(),L=S.letters,strictT=false;
  const fixed={};L.forEach((l,k)=>{if(l.from===i)fixed[k]=i;});
  me.notes.forEach(n=>{if(n.k==='probe')fixed[n.l]=n.from;});
  const others=S.players.map((_,j)=>j).filter(j=>j!==i);
  const freePairs=PAIRS.map((_,k)=>k).filter(k=>k!==me.pair);
  const worlds=[];let tries=0;
  while(worlds.length<K&&tries<K*6){
    tries++;
    const pp=shuffle(freePairs.slice());const pairOf={};others.forEach((j,x)=>pairOf[j]=pp[x]);pairOf[i]=me.pair;
    // quick check fixed letters consistent with pairs
    const ok=(j,l)=>l.t!==j&&(l.type==='forge'||PAIRS[pairOf[j]].includes(l.seal));
    let bad=false;for(const k in fixed){if(fixed[k]!==i&&!ok(fixed[k],L[k])){bad=true;break;}}
    if(bad)continue;
    const ass=new Array(L.length).fill(-1);const usedT=S.players.map(()=>new Set());const usedP=S.players.map(()=>new Set());
    for(const k in fixed){ass[k]=fixed[k];usedT[fixed[k]].add(L[k].type);usedP[fixed[k]].add(L[k].p);}
    const idx=L.map((_,k)=>k).filter(k=>ass[k]<0);shuffle(idx);
    let budget=400;
    const bt=x=>{
      if(x===idx.length)return true;
      if(--budget<0)return false;
      const k=idx[x],l=L[k];
      const cand=shuffle(others.filter(j=>!usedP[j].has(l.p)&&(!strictT||!usedT[j].has(l.type))&&ok(j,l)));
      for(const j of cand){ass[k]=j;usedT[j].add(l.type);usedP[j].add(l.p);if(bt(x+1))return true;usedT[j].delete(l.type);usedP[j].delete(l.p);ass[k]=-1;}
      return false;
    };
    if(bt(0)){let w=1;S.statements.forEach(st=>{if(st.by!==i)w*=ass[st.l]===st.who?2.5:0.7;});worlds.push({ass,w});}
  }
  return worlds;
}
function senderProbs(i,k,worlds){
  const pr=S.players.map(()=>0);let tot=0;
  worlds.forEach(w=>{pr[w.ass[k]]+=w.w;tot+=w.w;});
  return tot?pr.map(v=>v/tot):pr.map((_,j)=>j===i?0:1/(NP()-1));
}

/* ================= AI ================= */
function aiWrite(i){
  const p=S.players[i],left=TK.filter(t=>!p.used.includes(t));
  const w=left.map(t=>t==='poach'?(7-S.p)*1.4:t==='expose'?2.2:t==='forge'?1.8:t==='gift'?1.6:1.2);
  let r=Math.random()*w.reduce((a,b)=>a+b,0),type=left[0];for(let k=0;k<left.length;k++){r-=w[k];if(r<=0){type=left[k];break;}}
  if(left.length===1)type=left[0];
  const others=S.players.map((_,j)=>j).filter(j=>j!==i);
  const score=j=>S.players[j].sales+S.players[j].rep*(PERIODS-S.p+1);
  let t;
  if(TYPES[type].bad){const s=others.map(j=>score(j)+Math.random()*4);t=others[s.indexOf(Math.max(...s))];}
  else if(type==='gift'){const s=others.map(j=>score(j)-Math.random()*4);t=others[s.indexOf(Math.min(...s))];}
  else t=pick(others);
  let seal;const pr=PAIRS[p.pair];
  if(type==='forge'){const c=[0,1,2,3,4,5].filter(c=>!pr.includes(c));seal=pick(c);}
  else seal=Math.random()<.75?pr[p.main]:pr[1-p.main];
  return {type,t,seal};
}
function aiProbe(i){
  const p=S.players[i],res={probe:null,acc:{},claims:[],stmt:null};
  const mine=S.letters.map((l,k)=>k).filter(k=>S.letters[k].p===S.p);
  const hits=mine.filter(k=>S.letters[k].t===i&&TYPES[S.letters[k].type].bad);
  let worlds=sampleWorlds(i,50);
  const free=hl().k==='detective';
  if((p.probes>0||free)&&hits.length){
    let best=null,bm=1;hits.forEach(k=>{const m=Math.max(...senderProbs(i,k,worlds));if(m<bm){bm=m;best=k;}});
    if(best!=null&&bm<0.7){res.probe=best;doProbe(i,best,free);worlds=sampleWorlds(i,50);}
  }else if(free){const k=pick(mine.filter(k=>S.letters[k].from!==i));if(k!=null){res.probe=k;doProbe(i,k,true);}}
  hits.forEach(k=>{const pr=senderProbs(i,k,worlds);const m=Math.max(...pr);if(m>0.5)res.acc[k]=pr.indexOf(m);});
  mine.forEach(k=>{const l=S.letters[k];if(l.type==='gift'&&l.from===i&&p.claims>0&&Math.random()<.8)res.claims.push(k);});
  // statement: frame someone for my own harmful letter, or expose a probed sender
  const myBad=mine.find(k=>S.letters[k].from===i&&TYPES[S.letters[k].type].bad);
  const lead=S.players.map((q,j)=>({j,s:q.sales+q.rep*2})).filter(x=>x.j!==i).sort((a,b)=>b.s-a.s);
  if(myBad!=null&&Math.random()<.45){const v=lead.find(x=>x.j!==S.letters[myBad].t);if(v)res.stmt={l:myBad,who:v.j};}
  else{const pn=p.notes.find(n=>n.k==='probe'&&n.pp===S.p&&n.from!==i&&S.letters[n.l].t!==i);if(pn&&Math.random()<.7)res.stmt={l:pn.l,who:pn.from};}
  return res;
}

/* ================= flow ================= */
function proceed(){
  clearTimeout(timer);save();
  if(!S||!$('#overlay').hidden)return;
  if(S.phase!=='write'&&S.phase!=='probe')return render();
  const key=S.phase==='write'?'ch':'pr';
  const next=order().find(j=>S[key][j]==null);
  if(next==null){S.phase==='write'?deliver():print();return;}
  const p=S.players[next];
  if(p.ai){render();timer=setTimeout(()=>{if(S.phase==='write')S.ch[next]=aiWrite(next);else{const r=aiProbe(next);applyProbe(next,r);S.pr[next]=r;}proceed();},humans().length?Math.min(SPEED,300):SPEED/3);return;}
  if(S.viewer!==next){
    S.viewer=null;UI={};render();
    openModal(`<div class="handoff">${avatar(next)}</div><h2>請把裝置交給 ${esc(p.name)}</h2><p class="sub">${S.phase==='write'?'輪到你秘密寫信':'輪到你調查、指認和認領'}。其他人請別偷看：畫面會顯示 ${esc(p.name)} 的蠟色和秘密筆記。</p>
     <div class="acts"><button class="btn primary" data-m="go">我是 ${esc(p.name)}，開始</button></div>`,()=>{closeModal();S.viewer=next;UI={acc:{},claims:[]};render();scrollDeskIntoView();});
    return;
  }
  if(!UI.acc)UI={acc:{},claims:[]};
  render();
}
function deliver(){
  const h=hl().k;
  const batch=shuffle(order().map(i=>({...S.ch[i],from:i})));
  const rows=[];
  batch.forEach(c=>{
    const k=S.letters.length,t=S.players[c.t];
    S.letters.push({p:S.p,no:k+1,type:c.type,t:c.t,seal:c.seal,from:c.from});
    S.players[c.from].used.push(c.type);
    let fx='';
    if(c.type==='expose'){const d=3+(h==='war'?1:0);t.sales-=d;fx=`銷量 −${d}`;}
    else if(c.type==='forge'){const d=2+(h==='war'?1:0);t.sales-=d;fx=`銷量 −${d}`;}
    else if(c.type==='poach'){if(t.rep>0)t.rep--;fx='失去 1 名記者';if(h==='raid'){t.sales-=2;fx+='、銷量 −2';}}
    else if(c.type==='gift'){const d=h==='charity'?4:2;t.sales+=d;fx=`銷量 +${d}`;}
    else fx='沒有效果';
    log(`${pn(c.t)} 收到第 ${k+1} 封（${cname(c.seal)}蠟）：${TYPES[c.type].n}，${fx}`,TYPES[c.type].bad?'k':'');
    rows.push(`<div class="rev"><div style="display:flex;gap:10px;align-items:center">${sealH(c.seal,true)}<div><h4>第 ${k+1} 封 → ${esc(t.name)}</h4><div class="kn">${cname(c.seal)}色蠟封</div></div></div><span class="chip ${TYPES[c.type].bad?'down':c.type==='gift'?'green':''}">${TYPES[c.type].n}・${fx}</span></div>`);
  });
  S.ch={};S.phase='deliver';render();save();
  openModal(`<h2>第 ${S.p} 期 · 投遞</h2><p class="sub">郵筒洗勻後逐封送達。內容和蠟色公開，簽名封在內層，要到終刊才翻開。</p><div class="revlist">${rows.join('')}</div>
   <div class="acts"><button class="btn primary" data-m="go">進入調查與指認</button></div>`,()=>{closeModal();S.phase='probe';S.pr={};proceed();});
  if(!humans().length)timer=setTimeout(()=>modalCb&&modalCb('go'),SPEED*2);
}
function doProbe(i,k,free){
  const p=S.players[i];if(!free)p.probes--;
  p.notes.push({k:'probe',l:k,from:S.letters[k].from,pp:S.p});
  log(`${pn(i)} 用${free?'偵探出差的免費':''}調查令偷看了第 ${k+1} 封的簽名`);
}
function applyProbe(i,r){
  Object.entries(r.acc||{}).forEach(([k,who])=>{const l=S.letters[k];if(l.t===i&&TYPES[l.type].bad)l.acc=+who;});
  (r.claims||[]).forEach(k=>{const p=S.players[i],l=S.letters[k];if(p.claims>0&&l.type==='gift'&&l.t!==i){l.cl=l.cl||[];if(!l.cl.includes(i)){l.cl.push(i);p.claims--;log(`${pn(i)} 公開認領第 ${+k+1} 封贈禮：「那是我送的。」`,'k');}}});
  if(r.stmt){S.statements.push({by:i,l:r.stmt.l,who:r.stmt.who,p:S.p});log(`${pn(i)} 放話：「我查到第 ${r.stmt.l+1} 封是 ${esc(S.players[r.stmt.who].name)} 寄的。」`,'k');}
  const n=Object.keys(r.acc||{}).length;if(n)log(`${pn(i)} 在 ${n} 封信上蓋了指認籌（內容保密）`);
}
function print(){
  const h=hl().k;
  if(h==='halt')log('停刊風波：本期不印刷','q');
  else S.players.forEach(p=>{p.sales+=Math.max(0,p.rep+(h==='extra'?1:0)-(h==='paper'?1:0));});
  if(h==='readers'){const mn=Math.min(...S.players.map(p=>p.sales));S.players.forEach((p,i)=>{if(p.sales===mn){p.sales+=3;log(`讀者投書：${pn(i)} +3`);}});}
  if(h==='tall'){const mx=Math.max(...S.players.map(p=>p.sales));S.players.forEach((p,i)=>{if(p.sales===mx){p.sales-=2;log(`樹大招風：${pn(i)} −2`);}});}
  log(`第 ${S.p} 期印刷完成`,'q');
  S.pr={};
  if(S.p>=PERIODS){finalReveal();return;}
  S.p++;S.start=(S.start+1)%NP();
  if(humans().length>1)S.viewer=null;
  headModal();
}
function finalScore(){
  const sc=S.players.map(p=>({base:p.sales,gain:0,caught:0,acc:0,claim:0,hero:0,total:0}));
  S.letters.forEach(l=>{
    const caught=l.acc!=null&&l.acc===l.from;
    if(TYPES[l.type].bad){
      if(l.acc!=null){if(caught){sc[l.t].acc+=3;sc[l.from].caught-=2;}else sc[l.t].acc-=2;}
      if(!caught)sc[l.from].gain+=TYPES[l.type].gain;
    }
    if(l.type==='gift'){(l.cl||[]).forEach(j=>{sc[j].claim+=j===l.from?2:-3;});if(!(l.cl||[]).includes(l.from))sc[l.from].hero+=1;}
  });
  sc.forEach(s=>s.total=s.base+s.gain+s.caught+s.acc+s.claim+s.hero);
  return sc;
}
function finalReveal(){
  S.phase='end';S.viewer=null;const sc=finalScore();S.final=sc;
  const best=Math.max(...sc.map(s=>s.total));
  const caughtN=i=>S.letters.filter(l=>l.from===i&&l.acc===i).length;
  let ws=sc.map((s,i)=>i).filter(i=>sc[i].total===best);
  if(ws.length>1){const mc=Math.min(...ws.map(caughtN));ws=ws.filter(i=>caughtN(i)===mc);}
  S.winners=ws;
  log(`終刊揭曉：${ws.map(i=>esc(S.players[i].name)).join('、')} 拿下最高銷量`,'q');
  clearSave();render();endModal();
}
function endModal(){
  const sc=S.final;

    (l.cl||[]).forEach(j=>tags.push(`<span class="tl ${j===l.from?'clm':'acc'}">${esc(S.players[j].name)} 認領・${j===l.from?'+2':'冒領 −3'}</span>`));
    if(l.type==='gift'&&!(l.cl||[]).includes(l.from))tags.push('<span class="tl clm">無名英雄 +1</span>');
    return `<div class="lt ${TYPES[l.type].bad?'bad':l.type==='gift'?'good':''}"><span class="no">#${l.no}</span>${sealH(l.seal)}<div class="bd"><b>${esc(S.players[l.from].name)} → ${esc(S.players[l.t].name)}・${TYPES[l.type].n}</b><small>${tags.join('')||'沒人追究'}</small></div></div>`;}).join('');
  openModal(`<h2>終刊揭曉</h2><div class="win">${S.winners.map(i=>esc(S.players[i].name)).join('、')} 勝出</div>
   <p class="sub">所有信封的內層簽名一次翻開，寄件人的好處入帳，指認和認領一起清算。</p>

   ${sc.map((s,i)=>({s,i})).sort((a,b)=>b.s.total-a.s.total).map(({s,i})=>`<tr><td>${esc(S.players[i].name)}</td><td>${s.base}</td><td>+${s.gain}</td><td>${s.caught}</td><td>${s.acc>0?'+':''}${s.acc}</td><td>${s.claim>0?'+':''}${s.claim}</td><td>+${s.hero}</td><td><b>${s.total}</b></td></tr>`).join('')}</tbody></table></div>
   <h3 style="font-size:17px;font-weight:900;margin:16px 0 8px">每一封信的真相</h3><div class="letters">${rows}</div>
   <div class="acts"><button class="btn" data-m="close">看看郵戳紀錄</button><button class="btn primary" data-m="again">再來一局</button></div>`,m=>{closeModal();if(m==='again')setupGame(S.cfgPlayers);});
}

      h+=`<div class="dhead"><h2>寫一封信</h2><span class="pill">第 ${S.p} 期</span></div><div class="dsub">${esc(p.name)}・本期頭條「${hl().n}」：${hl().d}</div>
       <div class="dsec"><div class="dlab">1. 選信件<small>每種整場只能用一次</small></div><div class="typecards">${TK.map(t=>`<button data-type="${t}" class="${UI.type===t?'on':''}" ${p.used.includes(t)?'disabled':''}>${TYPES[t].n}<small>${TYPES[t].fx}</small></button>`).join('')}</div>${UI.type?`<div class="dnote">${TYPES[UI.type].desc}</div>`:''}</div>
       <div class="dsec"><div class="dlab">2. 寄給誰</div><div class="chooser">${others.map(j=>`<button data-to="${j}" class="${UI.t===j?'on':''}">${avatar(j)}${esc(S.players[j].name)}</button>`).join('')}</div></div>
       <div class="dsec"><div class="dlab">3. 蠟封顏色<small>${forge?'偽造可用任何顏色':'只能用你的兩種顏色'}</small></div><div class="sealpick">${(forge?[0,1,2,3,4,5]:pr).map(c=>`<button data-seal="${c}" class="${UI.seal===c?'on':''}">${sealH(c)}${cname(c)}</button>`).join('')}</div></div>
       <button class="confirm" id="btnSend" ${UI.type&&UI.t!=null&&UI.seal!=null?'':'disabled'}>投進郵筒 ${ICONS.arrow}</button>`;
      h+=myIntel(cur);
    }else if(myTurn()&&S.phase==='probe'){
      const cur0=cur,mine=S.letters.filter(l=>l.p===S.p);
      const free=hl().k==='detective';
      const probedNow=p.notes.some(n=>n.k==='probe'&&n.pp===S.p);
      const hits=mine.filter(l=>l.t===cur0&&TYPES[l.type].bad);
      const gifts=mine.filter(l=>l.type==='gift'&&l.t!==cur0);
      const others=S.players.map((_,j)=>j).filter(j=>j!==cur0);
      h+=`<div class="dhead"><h2>調查與指認</h2><span class="pill">第 ${S.p} 期</span></div><div class="dsub">${esc(p.name)}，全部選好後按確認</div>
       <div class="dsec"><div class="dlab">調查令<small>${free?'本期免費一次':`剩 ${p.probes} 枚，每期最多一次`}</small></div>
        ${probedNow?'<div class="dnote">本期已經調查過了，結果在下方筆記。</div>':`<div class="chooser">${mine.filter(l=>l.from!==cur0).map(l=>`<button data-probe="${l.no-1}" ${(p.probes>0||free)?'':'disabled'}>#${l.no} ${sealH(l.seal)} ${TYPES[l.type].n}→${esc(S.players[l.t].name)}</button>`).join('')}</div>`}</div>
       <div class="dsec"><div class="dlab">指認<small>猜對 +3、猜錯 −2，終刊才揭曉</small></div>
        ${hits.length?hits.map(l=>`<div class="accrow"><div class="q">#${l.no} ${sealH(l.seal)} ${TYPES[l.type].n}，是誰寄的？</div><div class="chooser"><button data-acc="${l.no-1}:-1" class="${UI.acc[l.no-1]==null?'on':''}">不指認</button>${others.map(j=>`<button data-acc="${l.no-1}:${j}" class="${UI.acc[l.no-1]===j?'on':''}">${esc(S.players[j].name)}</button>`).join('')}</div></div>`).join(''):'<div class="dnote">這期沒有人攻擊你，不用指認。</div>'}</div>
       <div class="dsec"><div class="dlab">認領贈禮<small>剩 ${p.claims} 枚，對 +2、冒領 −3</small></div>
        ${gifts.length?`<div class="chooser">${gifts.map(l=>`<button data-claim="${l.no-1}" class="${UI.claims.includes(l.no-1)?'on':''}" ${p.claims<=0&&!UI.claims.includes(l.no-1)?'disabled':''}>#${l.no} 送給 ${esc(S.players[l.t].name)}</button>`).join('')}</div>`:'<div class="dnote">這期沒有可以認領的贈禮。</div>'}</div>
       <div class="dsec"><div class="dlab">放話<small>公開宣稱某封信是誰寄的，可以說謊</small></div>
        <div class="chooser"><button data-sl="-1" class="${UI.sl==null?'on':''}">不放話</button>${mine.map(l=>`<button data-sl="${l.no-1}" class="${UI.sl===l.no-1?'on':''}">#${l.no}</button>`).join('')}</div>
        ${UI.sl!=null?`<div class="chooser">${S.players.map((_,j)=>j).filter(j=>j!==S.letters[UI.sl].t).map(j=>`<button data-sw="${j}" class="${UI.sw===j?'on':''}">說是 ${esc(S.players[j].name)}</button>`).join('')}</div>`:''}</div>
       <button class="confirm" id="btnProbe" ${UI.sl!=null&&UI.sw==null?'disabled':''}>確認 ${ICONS.arrow}</button>`;
      h+=myIntel(cur);
    }else{
      h+=`<div class="dhead"><h2>${p.ai?'對手出招':'換人操作'}</h2><span class="pill soft">第 ${S.p} 期</span></div><div class="think">${avatar(cur)}<div><b>${esc(p.name)}</b><div>${p.ai?(S.phase==='write'?'正在寫信':'正在推理')+'<span class="dots"></span>':'等待交接裝置'}</div></div></div>`;
      if(S.viewer!=null)h+=myIntel(S.viewer);
    }
  }else if(S.phase==='end'){
    h+=`<div class="dhead"><h2>終刊</h2><span class="pill">冠軍</span></div><div class="think">${avatar(S.winners[0])}<div><b>${S.winners.map(i=>esc(S.players[i].name)).join('、')}</b><div>總分 ${S.final[S.winners[0]].total}</div></div></div>
     <button class="passbtn" id="btnResult">再看一次終刊揭曉</button><button class="confirm" id="btnAgain">再來一局 ${ICONS.arrow}</button>`;
  }else if(S.phase==='idle'){
    h+=`<div class="dhead"><h2>準備開局</h2></div><div class="empty"><b>設定玩家後開始</b>3 到 6 家報社，可以混搭 AI 對手。</div>`;
  }else{
    h+=`<div class="dhead"><h2>${S.phase==='head'?'今日頭條':'信件投遞'}</h2><span class="pill soft">第 ${S.p} 期</span></div><div class="empty"><b>${hl().n}</b>${hl().d}</div>`;
    if(S.viewer!=null)h+=myIntel(S.viewer);
  }
  $('#desk').innerHTML=h;
}
function renderPlayers(){
  const cur=curTurn();
  $('#players').innerHTML=S.players.map((p,i)=>`<div class="pl ${i===cur?'cur':''}">${avatar(i)}<div style="min-width:0"><div class="nm">${esc(p.name)}${p.ai?'<span class="tag">AI</span>':''}${i===S.start&&S.phase!=='idle'&&S.phase!=='end'?'<span class="tag">先手</span>':''}</div>
    <div class="fig"><span>銷量<b>${S.phase==='end'&&S.final?S.final[i].total:p.sales}</b></span><span>記者<b>${p.rep}</b></span><span>信<b>${5-p.used.length}</b></span></div></div></div>`).join('');
}
function heroArt(){return `<svg viewBox="0 0 640 180" preserveAspectRatio="xMaxYMid slice" aria-hidden="true">
  <defs><linearGradient id="hs" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F5EEE1"/><stop offset="1" stop-color="#F3E3CC"/></linearGradient></defs>
  <rect width="640" height="180" fill="url(#hs)"/>
  ${[[300,60,46,94,'#D9C29A'],[350,40,54,114,'#C9AE84'],[408,70,40,84,'#E2CFA8'],[452,30,60,124,'#BF9F72'],[516,56,44,98,'#D9C29A'],[564,44,56,110,'#C9AE84']].map(([x,y,w,hh,c])=>`<rect x="${x}" y="${y}" width="${w}" height="${hh}" fill="${c}"/>${Array.from({length:Math.floor(hh/18)},(_,k)=>`<rect x="${x+6}" y="${y+8+k*18}" width="${w/2-9}" height="9" fill="#F6E9CF"/><rect x="${x+w/2+3}" y="${y+8+k*18}" width="${w/2-9}" height="9" fill="#F6E9CF"/>`).join('')}`).join('')}
  <g transform="translate(250 92) rotate(-8)"><rect width="74" height="50" rx="4" fill="#FFFBF4" stroke="#6E5A3A" stroke-width="2"/><path d="M2 3l35 26 35-26" fill="none" stroke="#6E5A3A" stroke-width="2"/><circle cx="37" cy="30" r="9" fill="#C8432F"/></g>
  <g transform="translate(180 116) rotate(10)"><rect width="56" height="38" rx="3" fill="#FFFBF4" stroke="#6E5A3A" stroke-width="2"/><path d="M2 3l26 18 26-18" fill="none" stroke="#6E5A3A" stroke-width="2"/><circle cx="28" cy="22" r="7" fill="#2E6FB0"/></g>
  <rect x="160" y="154" width="480" height="26" fill="#E9DCC0"/>
 </svg>`;}

/* ================= setup & rules ================= */
function showSetup(){
  clearTimeout(timer);
  const sv=lsGet(SAVE_KEY);
  openModal(`<div class="setup-art">${heroArt()}</div><h2>無名信</h2><p class="sub">1931 年上海四馬路，幾家小報搶同一批讀者。編輯們互寄匿名信：爆料、挖角，偶爾也寄錢拉攏。信封上只有一枚蠟封，蠟的顏色是唯一的線索。</p>
   <div class="pitch"><div><b>匿名出手</b>你知道自己被打了，不知道是誰打的。</div><div><b>蠟色推理</b>每家有兩種秘密蠟色，組合不重複。看蠟封、數信件，推理寄件人。</div><div><b>終刊清算</b>寄件人的好處、指認、認領和謊話，最後一期一次算總帳。</div></div>
   ${setupSeatsHTML(setupCfg,3,6)}
   <p class="note">多位人類玩家可以共用一台裝置輪流操作，換人時秘密資訊會蓋起來。</p>
   <div class="acts"><a class="btn ghost" href="${LOBBY}">← 回大廳</a><button class="btn" data-m="rules">先看規則</button>${sv&&(sv.phase==='write'||sv.phase==='probe')?'<button class="btn" data-m="resume">繼續上一局</button>':''}<button class="btn primary" data-m="start">開始遊戲</button></div>`,
  m=>{
    if(setupSeatsHandle(setupCfg,m,showSetup))return;
    if(m==='rules')showRules();
    else if(m==='resume'){closeModal();SPEED=SPEEDS[setupCfg.speed];S=sv;const hs=humans();S.viewer=hs.length===1?S.players.indexOf(hs[0]):null;UI={};render();proceed();}
    else if(m==='start'){closeModal();SPEED=SPEEDS[setupCfg.speed];setupGame(seatsToPlayers(setupCfg,AI_NAMES));}
  });
}
function showRules(){showRulesHTML(`
  <p><b>目標：</b>${PERIODS} 期之後，總分（銷量加上終刊清算）最高的報社獲勝。平手時，被抓包次數少的贏。</p>
  <h3>配置</h3>
  <ul><li>每家報社開局銷量 ${START_SALES}、記者 ${START_REP} 名。</li>
  <li>6 種蠟色（紅藍綠金紫黑）兩兩組合共 15 組，每家秘密分到一組，彼此不重複。</li>
  <li>每家有 5 封信：爆料、挖角、贈禮、偽造爆料、白紙，整場每種用一次，剛好一期一封。</li></ul>
  <h3>信件效果</h3>
  <table><tr><th>信件</th><th>收件人（立刻）</th><th>寄件人（終刊才入帳）</th><th>蠟封</th></tr>
  <tr><td>爆料</td><td>銷量 −3</td><td>+2</td><td>自己的顏色</td></tr>
  <tr><td>挖角</td><td>失去 1 名記者</td><td>+3</td><td>自己的顏色</td></tr>
  <tr><td>贈禮</td><td>銷量 +2</td><td>可以認領</td><td>自己的顏色</td></tr>
  <tr><td>偽造爆料</td><td>銷量 −2</td><td>無</td><td>任何顏色</td></tr>
  <tr><td>白紙</td><td>無</td><td>無</td><td>自己的顏色</td></tr></table>
  <h3>每期流程</h3>
  <ol><li><b>頭條：</b>翻一張頭條卡，本期規則有變化。</li>
  <li><b>寫信：</b>每家秘密選一封信、一個收件人（不能寄給自己）和一種蠟色。</li>
  <li><b>投遞：</b>所有信洗勻後送達。收件人、信件內容和蠟色公開，寄件人的簽名封在內層。</li>
  <li><b>調查與指認：</b>依先手順序，每家可以：
   <ul><li>用一枚調查令（整場 ${PROBES} 枚，每期最多一次）偷看本期任一封信的簽名。</li>
   <li>對本期攻擊你的每封信（爆料、挖角、偽造）指認一個嫌疑人，內容保密到終刊。</li>
   <li>公開認領本期的贈禮（整場 ${CLAIMS} 枚）。同一封可以有好幾家搶著認領。</li>
   <li>放話：公開宣稱「第幾封是某某寄的」，可以說謊。</li></ul></li>
  <li><b>印刷：</b>每家銷量 + 記者人數。先手玩家輪替。</li></ol>
  <h3>終刊揭曉</h3>
  <ul><li>寄件人拿到終刊入帳（爆料 +2、挖角 +3）。</li>
  <li>指認正確：指認者 +3，寄件人被抓包，入帳作廢再 −2。指認錯誤：指認者 −2。</li>
  <li>認領正確 +2，冒領 −3。贈禮的真正寄件人如果沒有認領，得「無名英雄」+1。</li></ul>
  <h3>頭條卡</h3>
  <ul>${HEADLINES.map(h=>`<li><b>${h.n}：</b>${h.d}</li>`).join('')}</ul>
  <p>每局隨機抽 ${PERIODS} 張。</p>
  <h3>致勝心法</h3>
  <ul><li>你知道自己用了哪個顏色，所以同色的另一封信一定來自「另一個有這個顏色的人」。</li>
  <li>每種信每家只有一封。到後期，「誰的爆料還沒用」本身就是線索。</li>
  <li>一直用同一種蠟色可以藏住你的組合，但那個顏色也會變成你的標籤。</li>
  <li>偽造爆料可以栽贓別人的顏色。放話可以讓受害者指認錯人。</li></ul>
  <h3>和實體版的差別</h3>
  <p>實體版有自由交涉、可以互相轉帳。App 版把交涉收斂成「放話」和「認領」兩種公開行動。</p>`);}

/* ================= input ================= */
$('#desk').addEventListener('click',e=>{
  if(e.target.closest('#btnAgain')){setupGame(S.cfgPlayers);return;}
  if(e.target.closest('#btnResult')){endModal();return;}
  if(!myTurn())return;
  const b=e.target.closest('button');if(!b||b.disabled)return;
  const pi=curTurn();
  if(b.dataset.type)UI.type=b.dataset.type;
  else if(b.dataset.to!=null)UI.t=+b.dataset.to;
  else if(b.dataset.seal!=null)UI.seal=+b.dataset.seal;
  else if(b.id==='btnSend'){S.ch[pi]={type:UI.type,t:UI.t,seal:UI.seal};UI={};if(humans().length>1)S.viewer=null;proceed();return;}
  else if(b.dataset.probe!=null){doProbe(pi,+b.dataset.probe,hl().k==='detective');save();}
  else if(b.dataset.acc){const [k,j]=b.dataset.acc.split(':').map(Number);if(j<0)delete UI.acc[k];else UI.acc[k]=j;}
  else if(b.dataset.claim!=null){const k=+b.dataset.claim;UI.claims=UI.claims.includes(k)?UI.claims.filter(x=>x!==k):UI.claims.concat(k);}
  else if(b.dataset.sl!=null){const k=+b.dataset.sl;UI.sl=k<0?null:k;UI.sw=null;}
  else if(b.dataset.sw!=null)UI.sw=+b.dataset.sw;
  else if(b.id==='btnProbe'){const r={acc:UI.acc,claims:UI.claims,stmt:UI.sl!=null&&UI.sw!=null?{l:UI.sl,who:UI.sw}:null};applyProbe(pi,r);S.pr[pi]=r;UI={};if(humans().length>1)S.viewer=null;proceed();return;}
  else return;
  render();
});
$('#btnRules').addEventListener('click',showRules);
$('#btnNew').addEventListener('click',()=>{if(S&&S.phase!=='end'&&S.phase!=='idle'){openModal(`<h2>放棄目前這局？</h2><p class="sub">目前的進度會被清除。</p><div class="acts"><button class="btn" data-m="no">繼續玩</button><button class="btn primary" data-m="yes">開新遊戲</button></div>`,m=>{if(m==='yes'){clearTimeout(timer);clearSave();showSetup();}else{closeModal();if(S.phase==='head')headModal();else if(S.phase==='deliver'){S.phase='probe';S.pr={};proceed();}else proceed();}});}else showSetup();});

/* ================= boot ================= */
window.__un={setupGame,setSpeed:v=>{SPEED=v;},get S(){return S;},finalScore,sampleWorlds,senderProbs};
(function boot(){
  S={players:Array.from({length:4},(_,i)=>({name:'—',ai:true,pair:i,sales:START_SALES,rep:START_REP,used:[],claims:CLAIMS,probes:PROBES,notes:[]})),letters:[],p:1,start:0,phase:'idle',heads:[0,1,2,3,4],ch:{},pr:{},statements:[],log:[],viewer:null};
  render();showSetup();
})();
</script>
<script>if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("../../sw.js",{scope:"../../"}).catch(()=>{}));</script>
</body>
