<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>控股風雲</title>
<meta name="description" content="原創股權策略桌遊：內線推理、搶董事會控股權，六季後身價最高者勝。">
<meta name="theme-color" content="#1E5641">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="icon" href="../../icons/icon-192.png">
<link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="桌遊大廳">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}img.av{display:block;border-radius:50%;object-fit:cover}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Outfit:wght@600;700;800&display=swap">
<style>
/* Layout: illustrated market board — hero + company cards (with live feed in the last slot) on the left,
   a deep-green "next move" desk on the right, player strip along the bottom. Single warm-paper look by design. */
:root{
  --paper:#F5EEE1; --paper2:#EFE6D4; --card:#FFFBF4; --ink:#1F2B27; --muted:#6E7068; --line:#E5D9C3; --line2:#D9CBB1;
  --green:#1E5641; --green2:#28704F; --green-ink:#F3F7EF; --yellow:#F5C443; --yellow-ink:#2A2310;
  --orange:#E9643B; --pink:#F7DDD3; --pink2:#EFC6B8; --up:#2C8F4E; --up-bg:#D5EEDA; --down:#C8432F; --down-bg:#F7DAD3; --flat-bg:#ECE5D7;
  --c0:#7A5AD3; --c1:#D7542B; --c2:#22987A; --c3:#D19A17; --c4:#2E7DC0;
  --p0:#E58FA0; --p1:#8B67D6; --p2:#4F9E61; --p3:#E0922F; --p4:#3E9CC4;
  --scrim:rgba(40,32,20,.45);
  --f-body:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
  --f-num:'Outfit','Noto Sans TC',system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55;font-weight:500}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
  background-image:radial-gradient(rgba(120,90,40,.07) 1px,transparent 1px);background-size:5px 5px}
.wrap{position:relative;z-index:1;max-width:1600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 28px}
h1,h2,h3,h4{text-wrap:balance;margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
svg{display:block}

/* ---------- header ---------- */
.top{display:flex;align-items:center;gap:14px 22px;flex-wrap:wrap;padding-block:6px 12px;border-bottom:1.5px solid var(--line2)}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit}
.brand svg{width:44px;height:44px;flex:none}
.brand h1{font-size:clamp(26px,3.4vw,38px);font-weight:900;letter-spacing:.06em;line-height:1}
.brand small{font-family:var(--f-num);font-size:12px;letter-spacing:.42em;color:var(--ink);font-weight:600;margin-left:6px}
.homelink{display:inline-flex;align-items:center;gap:6px;font-size:15px;font-weight:900;color:var(--ink);text-decoration:none;border:1.5px solid var(--ink);border-radius:12px;padding:7px 12px;background:var(--card)}.homelink svg{width:18px;height:18px}
.homelink:hover{color:var(--ink);border-color:var(--ink)}
.vsep{width:1.5px;align-self:stretch;background:var(--line2);margin-block:6px}
.steps{display:flex;align-items:center;flex:1;min-width:0;justify-content:center}
.step{font-family:var(--f-num);font-weight:700;font-size:15px;padding:5px 14px;border-radius:999px;border:1.5px solid var(--line2);background:var(--card);color:var(--ink);white-space:nowrap}
.step.done{color:var(--muted);background:var(--paper2)}
.step.now{background:var(--green);border-color:var(--green);color:var(--green-ink);font-size:17px;padding:6px 18px}
.link{flex:1;min-width:8px;max-width:56px;height:2px;background:repeating-linear-gradient(90deg,var(--line2) 0 4px,transparent 4px 8px);position:relative}
.link.done{background:var(--green)}
.tops{display:flex;gap:10px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--ink);background:var(--card);color:var(--ink);padding:8px 16px;border-radius:12px;cursor:pointer;font-weight:700;line-height:1.2;text-decoration:none}
.btn svg{width:18px;height:18px}
.btn:hover:not(:disabled){transform:translateY(-1px)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.dark{background:var(--green);border-color:var(--green);color:var(--green-ink)}
.btn.primary{background:var(--green);border-color:var(--green);color:var(--green-ink)}
.btn.ghost{background:transparent}

/* ---------- layout ---------- */
.board{display:grid;grid-template-columns:minmax(0,1fr) minmax(340px,430px);grid-template-areas:"hero desk" "main desk";grid-template-rows:auto 1fr;gap:14px 18px;margin-top:12px;align-items:start}
.hero{grid-area:hero;position:relative;min-height:150px;display:flex;align-items:center;overflow:hidden;border-radius:18px}
.hero-txt{position:relative;z-index:2;padding:8px 0 10px}
.eyebrow{display:flex;align-items:center;gap:12px;font-family:var(--f-num);font-weight:600;letter-spacing:.32em;font-size:13px}
.eyebrow::after{content:"";width:80px;height:1.5px;background:var(--ink)}
.hero h2{font-size:clamp(30px,4.2vw,52px);font-weight:900;letter-spacing:.03em;line-height:1.15;margin-top:6px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.swoosh{display:block;width:150px;height:14px;margin-top:-2px}
.qbadge{position:relative;font-size:17px;font-weight:900;border:2px solid var(--ink);border-radius:999px;padding:3px 14px;background:var(--card);letter-spacing:.04em}
.qbadge::after{content:"";position:absolute;right:-16px;top:-14px;width:22px;height:18px;
  background:linear-gradient(var(--orange),var(--orange)) 0 100%/3px 9px no-repeat,linear-gradient(var(--orange),var(--orange)) 9px 40%/3px 11px no-repeat,linear-gradient(var(--orange),var(--orange)) 18px 100%/3px 9px no-repeat;transform:rotate(18deg)}
.hero-art{position:absolute;right:0;top:0;bottom:0;width:min(62%,640px);z-index:1;
  -webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 28%);mask-image:linear-gradient(90deg,transparent 0%,#000 28%)}
.hero-art svg{width:100%;height:100%}
main{grid-area:main;min-width:0}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:1280px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* ---------- company card ---------- */
.co{--cc:var(--c0);position:relative;background:var(--card);border:1.5px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 2px 0 var(--line),0 8px 20px rgba(90,70,30,.07);min-width:0}
.co.pick{cursor:pointer;transition:transform .15s,box-shadow .15s}
.co.pick:hover{transform:translateY(-2px);box-shadow:0 2px 0 var(--line),0 14px 26px rgba(90,70,30,.12)}
.co.sel{border:3px solid var(--green);box-shadow:0 0 0 3px rgba(30,86,65,.12),0 12px 26px rgba(30,86,65,.18)}
.co .art{height:112px;position:relative;overflow:hidden}
.co .art svg{width:100%;height:100%}
.co .art .emb{position:absolute;right:10px;top:8px;bottom:8px;height:calc(100% - 16px);aspect-ratio:1;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,.25);border:2px solid rgba(255,255,255,.7);object-fit:cover}
.check{position:absolute;right:10px;top:10px;width:30px;height:30px;border-radius:50%;background:var(--green);display:grid;place-items:center;z-index:2;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.check svg{width:18px;height:18px}
.co .body{padding:12px 16px 14px;display:flex;flex-direction:column;gap:8px}
.cohead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.co h3{font-size:26px;font-weight:900;letter-spacing:.03em;line-height:1.1}
.tick{font-family:var(--f-num);font-size:12px;font-weight:800;letter-spacing:.06em;color:#fff;background:var(--cc);border-radius:999px;padding:2px 9px}
.sector{margin-left:auto;display:inline-flex;align-items:center;gap:5px;font-weight:700;font-size:14px}
.sector svg{width:20px;height:20px;color:var(--cc)}
.prow{display:flex;align-items:center;gap:12px}
.price{font-family:var(--f-num);font-size:38px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.delta{font-family:var(--f-num);font-weight:800;font-size:17px;border-radius:999px;padding:3px 12px;display:inline-flex;gap:4px;align-items:center}
.delta.up{background:var(--up-bg);color:var(--up)} .delta.down{background:var(--down-bg);color:var(--down)} .delta.flat{background:var(--flat-bg);color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);margin:2px 0 0}
.stats div{padding:0 10px;border-left:1.5px solid var(--line2)}
.stats div:first-child{padding-left:0;border-left:none}
.stats dt{font-size:12px;color:var(--muted);font-weight:500}
.stats dd{margin:0;font-family:var(--f-num);font-weight:800;font-size:19px;font-variant-numeric:tabular-nums}
.ceo{display:flex;align-items:center;gap:8px;font-size:14px;min-height:24px;flex-wrap:wrap}
.ceo .k{font-family:var(--f-num);font-weight:600;color:var(--muted)}
.ceo b{font-weight:900}
.emb{font-size:11px;font-weight:700;color:var(--down);background:var(--down-bg);border-radius:999px;padding:1px 8px}
.holdrow{display:flex;align-items:center;gap:10px}
.hold{flex:1;display:grid;grid-template-columns:repeat(10,1fr);gap:3px}
.cell{height:12px;border-radius:4px;background:var(--flat-bg)}
.cell.f{background:var(--pc)}
.hbadge{font-size:12px;font-weight:700;background:var(--paper2);border-radius:8px;padding:2px 8px;white-space:nowrap}
.hlist{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:12px;color:var(--muted);min-height:18px}
.hlist span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--pc);margin-right:4px}

/* ---------- feed ---------- */
.feed{background:transparent;padding:6px 6px 0;display:flex;flex-direction:column;min-width:0}
.feed h3{display:flex;align-items:center;gap:10px;font-size:24px;font-weight:900;padding-bottom:10px;border-bottom:1.5px solid var(--line2)}
.feed h3 svg{width:28px;height:28px;color:var(--orange)}
.feedlist{list-style:none;margin:0;padding:0;overflow:auto;max-height:300px}
.feedlist li{display:grid;grid-template-columns:auto 40px minmax(0,1fr);gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.qtag{font-family:var(--f-num);font-weight:700;font-size:12px;border:1.5px solid var(--line2);border-radius:6px;padding:1px 6px;background:var(--card)}
.feedlist .av{width:40px;height:40px}
.feedlist .txt{font-size:13.5px;line-height:1.45;min-width:0}
.feedlist .ic{width:40px;height:40px;border-radius:50%;background:var(--paper2);display:grid;place-items:center;color:var(--green)}
.feedlist .ic svg{width:20px;height:20px}
.feedlist li.q .txt{font-weight:900;color:var(--green)}
.feedlist li.k .txt{color:#8A4A12}
.pn{font-weight:900;color:var(--ink)}
.cn{font-weight:900}

/* ---------- desk (right panel) ---------- */
.desk{grid-area:desk;position:sticky;top:max(10px,env(safe-area-inset-top,0px));background:var(--green);color:var(--green-ink);border-radius:26px;padding:24px 24px 22px;overflow:hidden;display:flex;flex-direction:column;gap:14px;box-shadow:0 18px 40px rgba(20,60,45,.25)}
.desk .leaf{position:absolute;right:-30px;top:-20px;width:190px;height:190px;opacity:.9;pointer-events:none}
.desk>*{position:relative}
.dhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.dhead h2{font-size:clamp(28px,2.8vw,40px);font-weight:900;letter-spacing:.04em;line-height:1.1}
.pill{background:var(--orange);color:#fff;font-weight:900;border-radius:999px;padding:5px 14px;font-size:16px;white-space:nowrap}
.pill.soft{background:rgba(255,255,255,.16)}
.dsub{font-weight:700;font-size:16px;margin-top:-6px;opacity:.9}
.dlab{font-size:14px;opacity:.85;font-weight:700}
.target{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:-6px}
.target svg{width:30px;height:30px}
.target b{font-size:26px;font-weight:900;letter-spacing:.03em}
.target .vs{width:1.5px;height:24px;background:rgba(255,255,255,.4)}
.target .cur{font-weight:700;font-size:17px}
.target .cur span{font-family:var(--f-num);font-size:28px;font-weight:800;margin-left:6px}
.toggle{display:grid;grid-template-columns:1fr 1fr;border:2px solid rgba(255,255,255,.85);border-radius:12px;overflow:hidden}
.toggle button{border:none;background:transparent;color:var(--green-ink);font-weight:900;font-size:17px;padding:10px;cursor:pointer}
.toggle button.on{background:var(--card);color:var(--ink)}
.qrow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.qrow>span{font-weight:700;font-size:16px}
.stepper{display:grid;grid-template-columns:52px 1fr 52px;background:var(--yellow);border-radius:12px;min-width:220px;overflow:hidden}
.stepper button{border:none;background:rgba(255,255,255,.35);color:var(--yellow-ink);font-size:24px;font-weight:700;cursor:pointer;line-height:1;padding:8px 0}
.stepper button:disabled{opacity:.4;cursor:not-allowed}
.stepper b{display:grid;place-items:center;font-family:var(--f-num);font-weight:800;font-size:24px;color:var(--yellow-ink);background:#FBE7A6}
.est{margin:0;display:flex;flex-direction:column}
.est div{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px solid rgba(255,255,255,.22)}
.est div:first-child{border-top:none}
.est dt{font-weight:700;font-size:15px}
.est dd{margin:0;font-family:var(--f-num);font-weight:800;font-size:20px}
.dnote{font-size:13px;font-weight:700;background:rgba(255,255,255,.12);border-radius:10px;padding:7px 12px}
.dnote.warn{background:rgba(233,100,59,.28)}
.confirm{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:none;border-radius:16px;background:var(--yellow);color:var(--yellow-ink);font-size:24px;font-weight:900;padding:14px;cursor:pointer;box-shadow:0 4px 0 #C99A1E;letter-spacing:.06em}
.confirm svg{width:26px;height:26px}
.confirm:active:not(:disabled){transform:translateY(2px);box-shadow:0 2px 0 #C99A1E}
.confirm:disabled{opacity:.5;cursor:not-allowed}
.passbtn{width:100%;border:2px solid rgba(255,255,255,.85);background:transparent;color:var(--green-ink);border-radius:14px;font-weight:900;font-size:18px;padding:11px;cursor:pointer}
.passbtn:hover{background:rgba(255,255,255,.08)}
.empty{border:2px dashed rgba(255,255,255,.35);border-radius:16px;padding:22px 16px;text-align:center;font-weight:700;opacity:.92}
.empty b{display:block;font-size:20px;margin-bottom:4px}
.think{display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.1);border-radius:16px;padding:14px}
.think .av{width:56px;height:56px;flex:none}
.think b{font-size:20px}
.dots::after{content:"…";display:inline-block;animation:blink 1.1s steps(3) infinite}
@keyframes blink{0%{opacity:.2}50%{opacity:1}100%{opacity:.2}}
@media (prefers-reduced-motion:reduce){.dots::after{animation:none}.co.pick,.btn{transition:none}}

/* private intel card */
.intel{position:relative;background:var(--pink);color:var(--ink);border-radius:14px;padding:16px 18px 14px;transform:rotate(-1.2deg);box-shadow:0 6px 14px rgba(0,0,0,.18);margin-top:6px}
.intel::after{content:"";position:absolute;right:0;top:0;width:30px;height:30px;background:linear-gradient(225deg,var(--green) 50%,var(--pink2) 50%);border-bottom-left-radius:8px}
.intel .ilab{display:flex;align-items:center;gap:8px;font-weight:900;color:#B24A35;font-size:17px;padding-bottom:8px;border-bottom:1.5px solid var(--pink2)}
.intel .ilab svg{width:20px;height:20px}
.intel .ititle{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 0 6px;flex-wrap:wrap}
.intel h4{font-size:24px;font-weight:900;letter-spacing:.03em}
.intel .inote{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;font-size:13px;color:#5B4A40}
.stamp{border:1.5px solid #B24A35;color:#B24A35;border-radius:8px;padding:2px 10px;font-weight:900;font-size:13px;white-space:nowrap;transform:rotate(-3deg)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:14px;font-weight:900;padding:2px 10px;border-radius:8px;background:var(--flat-bg);color:var(--ink)}
.chip.up{background:var(--up-bg);color:var(--up)}
.chip.down{background:#E8573F;color:#fff}
.chip.sp{background:#F4D58A;color:#5A4210}

/* ---------- players strip ---------- */
.players{margin-top:18px;background:var(--card);border:1.5px solid var(--line);border-radius:20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));padding:8px;gap:6px;box-shadow:0 8px 20px rgba(90,70,30,.06)}
.pl{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:14px;position:relative;min-width:0}
.pl+.pl::before{content:"";position:absolute;left:-4px;top:16px;bottom:16px;width:1.5px;background:var(--line2)}
.pl.cur{background:var(--pink)}
.pl.cur::before,.pl.cur+.pl::before{display:none}
.pl .av{width:60px;height:60px;flex:none}
.pl .nm{font-size:19px;font-weight:900;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tag{font-size:11px;font-weight:700;border:1.5px solid var(--line2);border-radius:6px;padding:0 5px;color:var(--muted);background:var(--card)}
.pl .fig{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:13px;color:var(--muted)}
.pl .fig b{font-family:var(--f-num);font-weight:800;color:var(--ink);font-size:16px;margin-left:3px}
.pl .ceos{display:flex;gap:4px;margin-top:3px}
.pl .ceos i{font-style:normal;font-size:10px;font-weight:900;color:#fff;background:var(--cc);border-radius:5px;padding:0 5px;font-family:var(--f-num)}

/* ---------- responsive ---------- */
@media (max-width:1040px){
  .board{grid-template-columns:minmax(0,1fr);grid-template-areas:"hero" "desk" "main"}
  .desk{position:relative;top:0}
  .hero-art{width:70%;opacity:.55}
}
@media (max-width:640px){
  .cards{grid-template-columns:minmax(0,1fr)}
  .vsep{display:none}
  .steps{order:3;flex-basis:100%;justify-content:flex-start;overflow-x:auto;padding-bottom:2px}
  .step{padding:4px 10px;font-size:13px}.step.now{padding:5px 12px;font-size:15px}
  .brand small{display:none}
  .stepper{min-width:170px}
  .desk{padding:20px 18px;border-radius:22px}
  .co h3{font-size:23px}
}

/* ---------- modals ---------- */
.overlay{position:fixed;inset:0;background:var(--scrim);display:grid;place-items:center;z-index:50;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--card);color:var(--ink);border-radius:24px;border:1.5px solid var(--line);width:min(640px,100%);max-height:calc(100dvh - 32px);overflow:auto;padding:26px;box-shadow:0 30px 70px rgba(40,30,10,.3)}
.modal h2{font-size:28px;font-weight:900;margin-bottom:6px;letter-spacing:.03em}
.modal .sub{color:var(--muted);margin:0 0 16px}
.modal .acts{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:20px}
.modal .acts .btn{padding:10px 20px;font-size:16px}
.modal .intel{transform:none;margin-bottom:6px}
.modal .intel::after{background:linear-gradient(225deg,var(--card) 50%,var(--pink2) 50%)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;width:100%;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line2);background:var(--paper)}
.opt:hover:not(:disabled){border-color:var(--green);background:var(--card)}
.opt b{font-size:17px;font-weight:900}
.opt span{font-size:13px;color:var(--muted)}
.opt .go{font-weight:900;color:var(--green);font-size:14px;white-space:nowrap}

<body>
<div class="wrap">
  <header class="top">
    <a class="homelink" href="../../"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg>大廳</a>
    <div class="brand"><svg viewBox="0 0 56 48" aria-hidden="true"><path d="M8 24 L15 12 H29 L36 24 L29 36 H15 Z" fill="none" stroke="#1E5641" stroke-width="6" stroke-linejoin="round"/><path d="M20 24 L27 12 H41 L48 24 L41 36 H27 Z" fill="none" stroke="#E9643B" stroke-width="6" stroke-linejoin="round" stroke-dasharray="40 6"/></svg><h1>控股風雲</h1><small>PROXY WAR</small></div>

      <button class="btn dark" id="btnNew" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>新遊戲</button>

</div>

<div class="overlay" id="rulesOv" hidden><div class="modal" id="rulesModal" role="dialog" aria-modal="true"></div></div>
<script>
'use strict';
const LOBBY='../../';
/* ================= constants ================= */
const TRACK=[0,2,3,4,5,6,7,8,9,10,12,14,16,18,20,23,26,30,35,40,45,50];
const MAXI=TRACK.length-1;
const COMPS=[
  {name:'星核科技',sec:'科技',tick:'STAR'},
  {name:'赤嶺能源',sec:'能源',tick:'REDR'},
  {name:'青嵐生技',sec:'生技',tick:'AZUR'},
  {name:'金庭金控',sec:'金融',tick:'GOLD'},
  {name:'遠帆航運',sec:'航運',tick:'SAIL'},
];
const NC=COMPS.length, SHARES=10, START_CASH=80, QUARTERS=6, APQ=2,
      EXPAND_COST=15, EXPAND_STEPS=2, EMB_STEPS=3, AUDIT_STEPS=4, START_TRE=10, RELIST_IDX=4, MAX_BUY=3, CEO_MIN=2, CTRL_MULT=2;
const EVT=[
  {n:'AI 晶片訂單爆量',fx:[[0,3]]},
  {n:'雲端服務大當機',fx:[[0,-3]]},
  {n:'半導體出口管制',fx:[[0,-2],[4,-1]]},
  {n:'旗艦手機熱賣',fx:[[0,2],[3,1]]},
  {n:'科技股泡沫疑慮',fx:[[0,-2],[3,-1]]},
  {n:'油價飆漲',fx:[[1,3],[4,-2]]},
  {n:'油價崩跌',fx:[[1,-3],[4,2]]},
  {n:'綠能補貼三讀通過',fx:[[1,2],[0,1]]},
  {n:'煉油廠大火',fx:[[1,-2]]},
  {n:'新藥三期解盲成功',fx:[[2,4]]},
  {n:'臨床試驗喊卡',fx:[[2,-4]]},
  {n:'藥價給付調降',fx:[[2,-2],[3,-1]]},
  {n:'新型流感爆發',fx:[[2,3],[4,-2]]},
  {n:'生技併購傳聞',fx:[[2,2],[3,1]]},
  {n:'央行升息一碼',fx:[[3,2],[0,-1]]},
  {n:'央行降息救市',fx:[[3,-2],[0,1],[1,1]]},
  {n:'銀行呆帳爆雷',fx:[[3,-3]]},
  {n:'數位銀行執照核發',fx:[[3,2]]},
  {n:'貨櫃運價狂飆',fx:[[4,3]]},
  {n:'運河封鎖',fx:[[4,2],[1,1]]},
  {n:'港口大罷工',fx:[[4,-3]]},
  {n:'全球景氣復甦',fx:[[4,1],[1,1],[3,1]]},
  {n:'外資大舉匯入',t:'all',v:1},
  {n:'股災恐慌蔓延',t:'all',v:-1},
  {n:'金管會監管風暴',t:'audit'},
  {n:'檢調搜索掏空案',t:'audit'},
  {n:'落後補漲',t:'low',v:3},
  {n:'高檔獲利了結',t:'high',v:-2},
  {n:'平靜無波的一季',fx:[]},
  {n:'星核發放特別股息',t:'bonus',c:0,v:2},
  {n:'金庭發放特別股息',t:'bonus',c:3,v:3},
  {n:'遠帆發放特別股息',t:'bonus',c:4,v:2},
];
const AI_NAMES=['禿鷹','老狐狸','散戶阿明','霸總'];
const SPEEDS={快:300,中:750,慢:1300};
const SAVE_KEY='proxywar-save-v1';

/* ================= state ================= */
let S=null, UI={sel:null,qty:1}, timer=null, SPEED=750;
let setupCfg={n:4,seats:[{name:'你',ai:false},{name:AI_NAMES[0],ai:true},{name:AI_NAMES[1],ai:true},{name:AI_NAMES[2],ai:true},{name:AI_NAMES[3],ai:true}],speed:'中'};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const NP=()=>S.players.length;
const humans=()=>S.players.filter(p=>!p.ai&&!p.remote);
const price=(st,c)=>TRACK[st.comps[c].idx];
const curP=()=>(S.start+S.acts)%NP();
const pn=i=>`<b class="pn" data-p="${i}">${esc(S.players[i].name)}</b>`;
const cn=c=>`<b class="cn" style="color:var(--c${c})">${COMPS[c].name}</b>`;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
function draw(){if(!S.deck.length)S.deck=shuffle(EVT.map((_,i)=>i));return S.deck.pop();}
function log(html,cls=''){const m=/data-p="(\d)"/.exec(html);S.log.unshift({h:html,c:cls,a:m?+m[1]:null,q:S.q});if(S.log.length>120)S.log.length=120;}
function clone(st){return {players:st.players.map(p=>({cash:p.cash,sh:p.sh.slice(),tr:{...p.tr},insider:p.insider})),comps:st.comps.map(c=>({idx:c.idx,pool:c.pool,tre:c.tre,ceo:c.ceo,emb:c.emb})),events:st.events,q:st.q,belief:st.belief};}
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(S));}catch(e){}}
function clearSave(){try{localStorage.removeItem(SAVE_KEY);}catch(e){}}
function loadSave(){try{const s=localStorage.getItem(SAVE_KEY);return s?JSON.parse(s):null;}catch(e){return null;}}

/* ================= core rules (pure on st) ================= */
function move(st,c,d,canBankrupt){
  const C=st.comps[c];let ni=C.idx+d;
  if(ni>MAXI)ni=MAXI;
  if(ni<=0){ if(canBankrupt){C.idx=0;return true;} ni=1; }
  C.idx=ni;return false;
}
function updCEO(st,c){
  const C=st.comps[c];let mx=0;
  st.players.forEach(p=>{if(p.sh[c]>mx)mx=p.sh[c];});
  if(mx<CEO_MIN){C.ceo=null;return;}
  const tied=st.players.map((p,i)=>p.sh[c]===mx?i:-1).filter(i=>i>=0);
  if(tied.length===1)C.ceo=tied[0];
  else C.ceo=tied.includes(C.ceo)?C.ceo:null;
}
function canBuy(st,pi,c,n){const p=st.players[pi],C=st.comps[c];return n>=1&&n<=MAX_BUY&&C.pool>=n&&p.cash>=TRACK[C.idx]*n&&p.tr[c]!=='s';}
function canSell(st,pi,c,n){const p=st.players[pi];return n>=1&&p.sh[c]>=n&&p.tr[c]!=='b';}
function opBuy(st,pi,c,n){const p=st.players[pi],C=st.comps[c],cost=TRACK[C.idx]*n;p.cash-=cost;C.tre+=cost;C.pool-=n;p.sh[c]+=n;p.tr[c]='b';move(st,c,1,false);updCEO(st,c);return cost;}
function opSell(st,pi,c,n){const p=st.players[pi],C=st.comps[c],gain=TRACK[C.idx]*n;p.cash+=gain;C.pool+=n;p.sh[c]-=n;p.tr[c]='s';move(st,c,-Math.ceil(n/2),false);updCEO(st,c);return gain;}
function divPer(st,c){const C=st.comps[c],iss=SHARES-C.pool;return iss>0?Math.floor(C.tre/iss):0;}
function boardOK(st,c,ch){const C=st.comps[c];
  if(ch==='div')return divPer(st,c)>=1;
  if(ch==='exp')return C.tre>=EXPAND_COST&&C.idx<MAXI;
  if(ch==='emb')return C.tre>0;
  return true;}
function opBoard(st,c,ch){const C=st.comps[c];
  if(ch==='div'){const per=divPer(st,c);st.players.forEach(p=>{p.cash+=p.sh[c]*per;});C.tre-=per*(SHARES-C.pool);return per;}
  if(ch==='exp'){C.tre-=EXPAND_COST;move(st,c,EXPAND_STEPS,false);return 0;}
  if(ch==='emb'){const t=C.tre;st.players[C.ceo].cash+=t;C.tre=0;move(st,c,-EMB_STEPS,false);C.emb=true;return t;}
  return 0;}
function bankrupt(st,c){st.players.forEach(p=>{p.sh[c]=0;});const C=st.comps[c];C.pool=SHARES;C.tre=START_TRE;C.idx=RELIST_IDX;C.ceo=null;}
function extremes(st,hi){let best=hi?-1:99;st.comps.forEach(C=>{if(hi?C.idx>best:C.idx<best)best=C.idx;});return st.comps.map((C,i)=>C.idx===best?i:-1).filter(i=>i>=0);}
function applyEvent(st,ev,onBk){
  const hit=(c,d)=>{if(move(st,c,d,true)){bankrupt(st,c);onBk&&onBk(c);}};
  if(ev.fx)ev.fx.forEach(([c,d])=>hit(c,d));
  else if(ev.t==='all')for(let c=0;c<NC;c++)hit(c,ev.v);
  else if(ev.t==='audit')st.comps.forEach((C,c)=>{if(C.emb)hit(c,-AUDIT_STEPS);});
  else if(ev.t==='low')extremes(st,false).forEach(c=>hit(c,ev.v));
  else if(ev.t==='high')extremes(st,true).forEach(c=>hit(c,ev.v));
  else if(ev.t==='bonus')st.players.forEach(p=>{p.cash+=p.sh[ev.c]*ev.v;});
}
function worthOf(st,pi){const p=st.players[pi];let cash=p.cash,stock=0,ctrl=0;
  for(let c=0;c<NC;c++){const pr=price(st,c);stock+=p.sh[c]*pr;if(st.comps[c].ceo===pi)ctrl+=CTRL_MULT*pr;}
  return {cash,stock,ctrl,total:cash+stock+ctrl};}

/* ================= event text ================= */
function evChips(ev){
  const ch=(t,cls)=>`<span class="chip ${cls}">${t}</span>`;
  if(ev.fx){if(!ev.fx.length)return ch('無影響','');return ev.fx.map(([c,d])=>ch(`${COMPS[c].sec} ${d>0?'▲':'▼'}${Math.abs(d)}`,d>0?'up':'down')).join('');}
  if(ev.t==='all')return ch(`全部公司 ${ev.v>0?'▲':'▼'}${Math.abs(ev.v)}`,ev.v>0?'up':'down');
  if(ev.t==='audit')return ch(`本季被掏空的公司 ▼${AUDIT_STEPS}`,'sp');
  if(ev.t==='low')return ch(`股價最低的公司 ▲${ev.v}`,'sp');
  if(ev.t==='high')return ch(`股價最高的公司 ▼${Math.abs(ev.v)}`,'sp');
  if(ev.t==='bonus')return ch(`${COMPS[ev.c].sec}股東 每股領 $${ev.v}`,'sp');
  return '';
}

/* ================= AI ================= */
function interp(fi){fi=Math.max(0,Math.min(MAXI,fi));const a=Math.floor(fi),b=Math.min(MAXI,a+1);return TRACK[a]+(TRACK[b]-TRACK[a])*(fi-a);}
function expShift(viewer,st,c){
  let s=st.belief[viewer][c],b=0;
  const ev=EVT[st.events[st.players[viewer].insider]];
  if(ev.fx)ev.fx.forEach(([cc,d])=>{if(cc===c)s+=d;});
  else if(ev.t==='all')s+=ev.v;
  else if(ev.t==='audit'){if(st.comps[c].emb)s-=AUDIT_STEPS;}
  else if(ev.t==='low'){if(extremes(st,false).includes(c))s+=ev.v;}
  else if(ev.t==='high'){if(extremes(st,true).includes(c))s+=ev.v;}
  else if(ev.t==='bonus'){if(ev.c===c)b+=ev.v;}
  return {s,b};
}
function aiWorth(st,pi,viewer){
  const p=st.players[pi];let v=p.cash;const w=0.25+0.75*(st.q/QUARTERS);
  for(let c=0;c<NC;c++){const e=expShift(viewer,st,c);const sv=interp(Math.max(0.6,st.comps[c].idx+e.s))+e.b;
    v+=p.sh[c]*sv;
    if(st.comps[c].ceo===pi)v+=w*CTRL_MULT*sv+0.3*st.comps[c].tre;}
  return v;
}
function aiScore(st,pi){let best=0;for(let j=0;j<st.players.length;j++)if(j!==pi)best=Math.max(best,aiWorth(st,j,pi));return aiWorth(st,pi,pi)-0.3*best;}
function aiAction(pi){
  const base=clone(S);base.belief=S.belief;
  const cands=[{k:'pass',sc:aiScore(base,pi)+0.5}];
  for(let c=0;c<NC;c++){
    for(let n=1;n<=MAX_BUY;n++)if(canBuy(base,pi,c,n)){const st=clone(base);opBuy(st,pi,c,n);cands.push({k:'buy',c,n,sc:aiScore(st,pi)});}
    for(let n=1;n<=S.players[pi].sh[c];n++)if(canSell(base,pi,c,n)){const st=clone(base);opSell(st,pi,c,n);cands.push({k:'sell',c,n,sc:aiScore(st,pi)});}
  }
  cands.forEach(o=>o.sc+=(Math.random()-.5)*3);
  cands.sort((a,b)=>b.sc-a.sc);
  const o=cands[0];
  if(o.k==='buy')doBuy(pi,o.c,o.n);else if(o.k==='sell')doSell(pi,o.c,o.n);else doPass(pi);
}
function aiBoard(pi,c){
  const ev=EVT[S.events[S.players[pi].insider]];
  let best='hold',bs=-1e9;
  ['hold','div','exp','emb'].forEach(ch=>{
    if(!boardOK(S,c,ch))return;
    const st=clone(S);opBoard(st,c,ch);
    if(ch==='emb'){const pen=ev.t==='audit'?AUDIT_STEPS:0.7;st.comps[c].idx=Math.max(0.6,st.comps[c].idx-pen);st.comps[c].emb=false;}
    const sc=aiScore(st,pi)+(Math.random()-.5)*1.5+(ch==='hold'?0.3:0);
    if(sc>bs){bs=sc;best=ch;}
  });
  return best;
}

/* ================= game flow ================= */
function setupGame(cfg){
  clearTimeout(timer);
  S={players:cfg.map((p,i)=>({id:i,name:p.name,ai:p.ai,remote:!!p.remote,pid:p.pid||null,cash:START_CASH,sh:Array(NC).fill(0),tr:{},insider:0})),
     comps:COMPS.map(()=>({idx:6+(Math.random()*4|0),pool:SHARES,tre:START_TRE,ceo:null,emb:false,hist:[],qStart:0})),
     q:1,start:Math.random()*cfg.length|0,acts:0,phase:'idle',events:[],deck:[],log:[],belief:cfg.map(()=>Array(NC).fill(0)),bi:0,viewer:null,cfg};
  S.comps.forEach(C=>C.hist.push(TRACK[C.idx]));
  const hs=humans();S.viewer=hs.length===1?hs[0].id:null;
  log(`新局開始：${S.players.length} 位玩家，每人起始資金 $${START_CASH}，共 ${QUARTERS} 季。`,'q');
  startQuarter();
}
function startQuarter(){
  S.phase='action';S.acts=0;S.events=[];
  for(let i=0;i<=NP();i++)S.events.push(draw());
  S.players.forEach((p,i)=>{p.insider=i;p.tr={};});
  S.comps.forEach(C=>{C.emb=false;C.qStart=C.idx;});
  S.belief=S.players.map(()=>Array(NC).fill(0));
  log(`第 ${S.q} 季開盤，起始玩家 ${pn(S.start)}`,'q');
  const hs=humans();
  render();
  if(hs.length===1)quarterModal(true);
  else if(hs.length>1)quarterModal(false);
  else proceed();
}
function proceed(){
  clearTimeout(timer);
  if(S.phase!=='action')return;
  if(S.acts>=NP()*APQ){beginBoard();return;}
  S.await=null;const pi=curP();UI.sel=null;UI.qty=1;
  save();
  const p=S.players[pi], multi=humans().length>1;
  if(p.ai){ if(multi)S.viewer=null; render(); timer=setTimeout(()=>aiAction(pi),SPEED); }
  else if(p.remote){S.await={type:'act',seat:pi};render();}
  else if(multi&&S.viewer!==pi){ S.viewer=null; render(); handoff(pi,'輪到你交易',()=>{S.viewer=pi;render();}); }
  else render();
}
function beliefUpd(pi,c,amt){S.players.forEach((p,j)=>{if(j!==pi&&p.ai)S.belief[j][c]=Math.max(-2,Math.min(2,S.belief[j][c]+amt));});}
function ceoNote(c,before){const now=S.comps[c].ceo;if(now!==before){if(now==null)log(`${cn(c)} CEO 從缺（平手或持股不足）`,'k');else log(`${pn(now)} 入主 ${cn(c)}，成為 CEO`,'k');}}
function doBuy(pi,c,n){const b=price(S,c),cb=S.comps[c].ceo;const cost=opBuy(S,pi,c,n);
  log(`${pn(pi)} 買進 ${cn(c)} ${n} 股，付 $${cost}，股價 $${b}→$${price(S,c)}`);ceoNote(c,cb);beliefUpd(pi,c,0.35*n);S.acts++;proceed();}
function doSell(pi,c,n){const b=price(S,c),cb=S.comps[c].ceo;const g=opSell(S,pi,c,n);
  log(`${pn(pi)} 賣出 ${cn(c)} ${n} 股，得 $${g}，股價 $${b}→$${price(S,c)}`);ceoNote(c,cb);beliefUpd(pi,c,-0.25*n);S.acts++;proceed();}
function doPass(pi){log(`${pn(pi)} 按兵不動`);S.acts++;proceed();}

function beginBoard(){
  S.phase='board';S.bi=0;if(humans().length>1)S.viewer=null;
  log('董事會召開：各公司 CEO 決定公司動向','q');render();
  timer=setTimeout(boardStep,SPEED*0.6);
}
const BOARD_NAMES={hold:'按兵不動',div:'配息',exp:'擴張',emb:'掏空'};
function applyBoard(c,ch){
  const C=S.comps[c],pi=C.ceo,b=price(S,c);const r=opBoard(S,c,ch);
  if(ch==='div')log(`${pn(pi)} 讓 ${cn(c)} 配息每股 $${r}`);
  else if(ch==='exp')log(`${pn(pi)} 讓 ${cn(c)} 擴張，花費 $${EXPAND_COST}，股價 $${b}→$${price(S,c)}`);
  else if(ch==='emb')log(`${pn(pi)} 掏空 ${cn(c)}！帶走 $${r}，股價 $${b}→$${price(S,c)}`,'k');
  else log(`${pn(pi)} 讓 ${cn(c)} 按兵不動，金庫保留 $${C.tre}`);
}
function boardStep(){
  clearTimeout(timer);
  if(S.bi>=NC){beginSettle();return;}
  S.await=null;const c=S.bi,C=S.comps[c];render();
  if(C.ceo==null){log(`${cn(c)} 沒有 CEO，本季不動作`);S.bi++;timer=setTimeout(boardStep,SPEED*0.4);return;}
  const pi=C.ceo;
  if(S.players[pi].remote){S.await={type:'board',seat:pi,c};render();}
  else if(S.players[pi].ai){timer=setTimeout(()=>{applyBoard(c,aiBoard(pi,c));S.bi++;boardStep();},SPEED);}
  else{const go=()=>{S.viewer=pi;render();boardModal(pi,c);};
    if(humans().length>1&&S.viewer!==pi){S.viewer=null;render();handoff(pi,`你是 ${COMPS[c].name} 的 CEO`,go);}else go();}
}
function beginSettle(){
  S.phase='settle';const before=S.comps.map(C=>C.idx);const bks=[];
  S.events.forEach(ei=>applyEvent(S,EVT[ei],c=>bks.push(c)));
  bks.forEach(c=>log(`${cn(c)} 股價歸零破產！所有持股作廢，以 $${TRACK[RELIST_IDX]} 重新上市`,'k'));
  S.comps.forEach(C=>C.hist.push(TRACK[C.idx]));
  log(`第 ${S.q} 季結算完成`,'q');S.settleInfo={before,bks};
  render();settleModal(before,bks);
}
function endQuarter(){
  closeModal();S.q++;S.start=(S.start+1)%NP();
  if(S.q>QUARTERS)endGame();else startQuarter();
}
function endGame(){
  S.phase='end';clearSave();render();
  const rows=S.players.map((p,i)=>({i,...worthOf(S,i)})).sort((a,b)=>b.total-a.total);
  const w=rows[0];
  openModal(`<h2>最終結算</h2><p class="sub">六季結束。控股溢價：每家公司的 CEO 額外獲得該公司股價 ×${CTRL_MULT}。</p>
   <div class="win">${esc(S.players[w.i].name)} 勝出</div>
   <div class="tablewrap"><table class="res"><thead><tr><th>玩家</th><th>現金</th><th>持股市值</th><th>控股溢價</th><th>總身價</th></tr></thead><tbody>
   ${rows.map((r,k)=>`<tr><td>${k+1}. ${pn(r.i)}</td><td>$${r.cash}</td><td>$${r.stock}</td><td>$${r.ctrl}</td><td><b>$${r.total}</b></td></tr>`).join('')}
   </tbody></table></div>
   <div class="acts">${LOBBY?`<a class="btn ghost" href="${LOBBY}">← 回大廳</a>`:''}<button class="btn" data-m="setup">更改設定</button><button class="btn primary" data-m="again">再來一局</button></div>`,
   m=>{if(NET.role){NET.leave();showSetup();return;}if(m==='again'){closeModal();setupGame(S.cfg);}else showSetup();});
}

/* ================= modals ================= */
let modalCb=null;
function openModal(html,cb){$('#modal').innerHTML=html;$('#overlay').hidden=false;modalCb=cb;const f=$('#modal .primary');f&&f.focus({preventScroll:true});}
function closeModal(){$('#overlay').hidden=true;$('#modal').innerHTML='';modalCb=null;}
$('#modal').addEventListener('click',e=>{const b=e.target.closest('[data-m]');if(b&&!b.disabled&&modalCb)modalCb(b.dataset.m,b);});
function handoff(pi,why,cb){
  openModal(`<div class="handoff">${avatar(pi)}</div><h2>請把裝置交給 ${esc(S.players[pi].name)}</h2><p class="sub">${why}。其他玩家請別偷看，接下來會顯示 ${esc(S.players[pi].name)} 的內線消息。</p>
   <div class="acts"><button class="btn primary" data-m="go">我是 ${esc(S.players[pi].name)}，開始</button></div>`,()=>{closeModal();cb();});
}
function quarterModal(single){
  const ins=single?insiderHTML(S.viewer):'';
  openModal(`<h2>第 ${S.q} 季</h2><p class="sub">本季共有 ${S.events.length} 張事件牌，每位玩家祕密看到其中一張，最後一張無人知曉。季末全部公開並生效。${single?'':'每位玩家會在輪到自己時看到內線。'}</p>${ins}
   <div class="acts"><button class="btn primary" data-m="go">開盤</button></div>`,()=>{closeModal();proceed();});
}
function boardModal(pi,c){
  const C=S.comps[c],pr=price(S,c),me=S.players[pi];
  const opt=(k,title,desc)=>{const ok=boardOK(S,c,k);return `<button class="btn opt" data-m="${k}" ${ok?'':'disabled'}><div><b>${title}</b><br><span>${desc}</span></div><span class="go">${ok?'選擇 →':'不可用'}</span></button>`;};
  const per=divPer(S,c);
  const ex=TRACK[Math.min(MAXI,C.idx+EXPAND_STEPS)],em=TRACK[Math.max(1,C.idx-EMB_STEPS)];
  openModal(`<h2>${COMPS[c].name} 董事會</h2><p class="sub">${esc(me.name)}，你持有 ${me.sh[c]} 股，是 CEO。公司金庫 $${C.tre}，目前股價 $${pr}，已發行 ${SHARES-C.pool} 股。</p>
   ${S.viewer===pi?insiderHTML(pi):''}
   <div class="opts">
    ${opt('div','配息',per>=1?`每股 $${per}，你拿 $${per*me.sh[c]}，其他股東也按持股領取`:'金庫不足以每股配 $1')}
    ${opt('exp','擴張',`金庫付 $${EXPAND_COST}，股價 $${pr}→$${ex}，所有股東受惠`)}
    ${opt('emb','掏空',`金庫 $${C.tre} 全進你口袋，股價 $${pr}→$${em}。小心監管風暴（再跌 ${AUDIT_STEPS} 格）`)}
    ${opt('hold','按兵不動','金庫留著，下季再說')}
   </div>`,k=>{closeModal();if(NET.role==='client'){NET.send({t:'board',c,ch:k});return;}applyBoard(c,k);S.bi++;boardStep();});
}
function settleModal(before,bks){
  const knower=i=>{const who=S.players.filter(p=>p.insider===i);return who.length?`內線持有者：${who.map(p=>esc(p.name)).join('、')}`:'無人知曉的暗牌';};
  const rows=S.comps.map((C,c)=>{const a=TRACK[C.qStart],m=TRACK[before[c]],z=TRACK[C.idx];const d=z-a;
    return `<tr><td>${cn(c)}${bks.includes(c)?' <span class="chip down">破產重整</span>':''}</td><td>$${a}</td><td>$${m}</td><td><b>$${z}</b></td><td class="${d>0?'up':d<0?'down':'flat'}">${d>0?'+':''}${d}</td></tr>`;}).join('');
  const last=S.q>=QUARTERS;
  openModal(`<h2>第 ${S.q} 季 · 揭牌結算</h2><p class="sub">所有事件牌依序生效。對照一下：誰早就知道？他們剛才怎麼交易？</p>
   <div class="evlist">${S.events.map((ei,i)=>{const ev=EVT[ei];return `<div class="ev ${i===S.events.length-1?'hidden-card':''}"><div><h4>${ev.n}</h4><div class="chips">${evChips(ev)}</div></div><div class="kn">${knower(i)}</div></div>`;}).join('')}</div>
   <div class="tablewrap"><table class="res"><thead><tr><th>公司</th><th>季初</th><th>董事會後</th><th>結算後</th><th>本季漲跌</th></tr></thead><tbody>${rows}</tbody></table></div>
   <div class="acts"><button class="btn primary" data-m="next">${NET.role==='client'?'知道了，等房主繼續':last?'查看最終結算':'進入第 '+(S.q+1)+' 季'}</button></div>`,()=>{if(NET.role==='client'){closeModal();return;}endQuarter();});
  if(!humans().length)timer=setTimeout(()=>{if(S.phase==='settle')endQuarter();},SPEED*3);
}

/* ================= setup ================= */
function showSetup(){
  clearTimeout(timer);
  const sv=loadSave();
  const n=setupCfg.n;
  const seats=setupCfg.seats.slice(0,n).map((s,i)=>`<div class="seat">${avatar(i)}<input id="seat${i}" data-seat="${i}" value="${esc(s.name)}" maxlength="10" aria-label="玩家 ${i+1} 名稱"><div class="seg"><button data-m="h:${i}" class="${s.ai?'':'on'}">人類</button><button data-m="a:${i}" class="${s.ai?'on':''}">AI</button></div></div>`).join('');
  openModal(`<div class="setup-art">${heroArt()}</div><h2>控股風雲</h2><p class="sub">六個季度，五家上市公司，每個人手上都握著一則別人不知道的內線消息。買股、搶董事席、決定配息還是掏空，最後身價最高的人贏。</p>
   <div class="pitch"><div><b>內線推理</b>每季你只看得到一張事件牌，從對手的買賣讀出他們知道什麼。</div><div><b>董事會權力</b>最大股東當 CEO，決定配息、擴張，或乾脆掏空。</div><div><b>控股溢價</b>遊戲結束時，每家公司的 CEO 多拿股價 ×2。</div></div>
   <div class="field"><span>玩家人數</span><div class="seg">${[2,3,4,5].map(k=>`<button data-m="n:${k}" class="${k===n?'on':''}">${k} 人</button>`).join('')}</div></div>
   <div class="seats">${seats}</div>
   <div class="field"><span>AI 速度</span><div class="seg">${Object.keys(SPEEDS).map(k=>`<button data-m="sp:${k}" class="${k===setupCfg.speed?'on':''}">${k}</button>`).join('')}</div></div>
   <p class="note">多位人類玩家可共用同一台裝置輪流操作（熱座模式），系統會在換人時遮住內線。</p>
   <div class="acts">${LOBBY?`<a class="btn ghost" href="${LOBBY}">← 回大廳</a>`:''}<button class="btn" data-m="rules">先看規則</button>${NET.available()?(lsGet(NET_CLIENT_KEY)?`<button class="btn" data-m="rejoin">回到房間 ${esc(lsGet(NET_CLIENT_KEY).code)}</button>`:'')+'<button class="btn" data-m="join">加入房間</button><button class="btn" data-m="host">線上開房</button>':''}${sv&&sv.phase==='action'?'<button class="btn" data-m="resume">繼續上一局</button>':''}<button class="btn primary" data-m="start">開始遊戲</button></div>`,
  (m)=>{
    readSeats();
    if(m.startsWith('n:')){setupCfg.n=+m.slice(2);showSetup();}
    else if(m.startsWith('h:')||m.startsWith('a:')){setupCfg.seats[+m.slice(2)].ai=m[0]==='a';showSetup();}
    else if(m.startsWith('sp:')){setupCfg.speed=m.slice(3);SPEED=SPEEDS[setupCfg.speed];showSetup();}
    else if(m==='rules')showRules();
    else if(m==='host')NET.hostLobby();
    else if(m==='join')NET.joinPrompt();
    else if(m==='rejoin')NET.rejoin();
    else if(m==='resume'){closeModal();SPEED=SPEEDS[setupCfg.speed];S=sv;const hs=humans();S.viewer=hs.length===1?hs[0].id:null;(S.online?NET.resumeHost():Promise.resolve()).then(()=>{render();proceed();});}
    else if(m==='start'){closeModal();SPEED=SPEEDS[setupCfg.speed];
      const cfg=setupCfg.seats.slice(0,setupCfg.n).map((s,i)=>({name:(s.name||'').trim()||(s.ai?AI_NAMES[i%4]:'玩家'+(i+1)),ai:s.ai}));
      setupGame(cfg);}
  });
}
function readSeats(){document.querySelectorAll('[data-seat]').forEach(inp=>{setupCfg.seats[+inp.dataset.seat].name=inp.value;});}

  <p><b>目標：</b>${QUARTERS} 季結束後，總身價最高者獲勝。總身價 = 現金 + 持股市值 + 控股溢價（你擔任 CEO 的每家公司，額外計算該公司股價 ×${CTRL_MULT}）。</p>
  <h3>配置</h3>
  <ul><li>5 家公司，每家 ${SHARES} 股，一開始全部未發行，公司金庫各有 $${START_TRE}。</li>
  <li>每位玩家起始現金 $${START_CASH}。所有人的現金與持股都公開。</li>
  <li>股價沿著固定的股價軌移動，▲▼ 的數字代表移動幾格：</li></ul>
  <div class="trackline">${TRACK.map(v=>`<span>$${v}</span>`).join('')}</div>
  <h3>每季流程</h3>
  <ol>
   <li><b>內線消息：</b>翻出「玩家人數 + 1」張事件牌。每位玩家祕密看其中一張，剩下一張是誰都不知道的暗牌。</li>
   <li><b>交易：</b>從起始玩家開始輪流，每季每人共 ${APQ} 次行動，每次行動擇一：
     <ul><li><b>買進</b>同一家公司 1–${MAX_BUY} 股，以現價向公司購買未發行股份，錢進入公司金庫，之後股價上漲 1 格。</li>
     <li><b>賣出</b>同一家公司任意股數，以現價賣回給市場，股份回到未發行，之後股價下跌「股數 ÷ 2（無條件進位）」格，最低跌到 $2。</li>
     <li><b>按兵不動。</b></li></ul>
     同一季內，同一家公司你只能買或只能賣，不能兩者都做。</li>
   <li><b>董事會：</b>每家公司持股最多（至少 ${CEO_MIN} 股）的玩家就是 CEO；持股平手時由現任 CEO 續任，否則從缺。CEO 為公司選一項：
     <ul><li><b>配息：</b>金庫平均分給每一股已發行股份（取整數，零頭留在金庫）。</li>
     <li><b>擴張：</b>金庫支付 $${EXPAND_COST}，股價上漲 ${EXPAND_STEPS} 格。</li>
     <li><b>掏空：</b>金庫全部進入 CEO 個人口袋，股價下跌 ${EMB_STEPS} 格。</li>
     <li><b>按兵不動：</b>金庫留到下一季。</li></ul></li>
   <li><b>揭牌結算：</b>公開所有事件牌並依序生效。「監管風暴」類事件會讓本季被掏空的公司再跌 ${AUDIT_STEPS} 格。</li>
   <li><b>破產：</b>結算時股價跌到 $0，公司破產，所有人的該公司持股作廢，公司以 $${TRACK[RELIST_IDX]} 重新上市，10 股全部未發行。</li>
   <li>起始玩家順時針輪替，進入下一季。</li>
  </ol>
  <h3>致勝心法</h3>
  <ul><li>每個人只知道一張牌。對手突然大買某家公司？他可能看到了利多。</li>
  <li>買股會推高股價，也會讓其他股東跟著賺。進場時機與控股權常常要二選一。</li>
  <li>當 CEO 才能動用金庫，但掏空會重傷你自己的持股，還可能撞上監管風暴。</li>
  <li>別人買你當 CEO 的公司，錢是進到你控制的金庫裡。</li>
  <li>最後一季的控股溢價很肥：股價 $20 的公司，CEO 等於多拿兩股。</li></ul>
  </div><div class="acts"><button class="btn primary" id="closeRules">知道了</button></div>`;
  $('#rulesOv').hidden=false;$('#closeRules').focus({preventScroll:true});
}
$('#rulesOv').addEventListener('click',e=>{if(e.target.id==='closeRules'||e.target.id==='rulesOv')$('#rulesOv').hidden=true;});
$('#btnRules').addEventListener('click',showRules);
$('#btnNew').addEventListener('click',()=>{if(S&&S.phase!=='end'&&S.phase!=='idle'){openModal(`<h2>${NET.role==='client'?'離開房間？':'放棄目前這局？'}</h2><p class="sub">${NET.role==='client'?'離開後可以從設定畫面「回到房間」重新加入。':NET.role==='host'?'房間會關閉，所有朋友都會被請出。':'目前的進度會被清除。'}</p><div class="acts"><button class="btn" data-m="no">繼續玩</button><button class="btn primary" data-m="yes">開新遊戲</button></div>`,m=>{if(m==='yes'){clearTimeout(timer);if(NET.role!=='client')clearSave();NET.leave();showSetup();}else{closeModal();resumeAfterModal();}});}else showSetup();});

function tradePreview(pi,c){
  const me=S.players[pi],C=S.comps[c],pr=TRACK[C.idx];
  if(UI.mode==='buy'){
    const n=Math.min(UI.qty,MAX_BUY);const ok=canBuy(S,pi,c,n);
    let after=null;if(ok){after=clone(S);opBuy(after,pi,c,n);}
    const why=ok?null:me.tr[c]==='s'?'本季已賣過這家公司，不能再買':C.pool<n?`未發行只剩 ${C.pool} 股`:`現金不足，需要 $${pr*n}`;
    return {n,ok,amt:pr*n,cash:me.cash-pr*n,after,why,maxQ:Math.max(1,Math.min(MAX_BUY,C.pool))};
  }
  const n=Math.min(UI.qty,me.sh[c]);const ok=n>=1&&canSell(S,pi,c,n);
  let after=null;if(ok){after=clone(S);opSell(after,pi,c,n);}
  const why=ok?null:me.sh[c]<1?'你還沒有這家公司的股票':'本季已買過這家公司，不能再賣';
  return {n:Math.max(n,0),ok,amt:pr*Math.max(n,0),cash:me.cash+pr*Math.max(n,0),after,why,maxQ:Math.max(1,me.sh[c])};
}

   Host-authoritative: the host's device runs the game engine and publishes a public snapshot.
   Remote players push actions; the host validates and applies them.
   Each remote player's insider card is end-to-end encrypted (ECDH P-256 + AES-GCM),
   so the shared room data never reveals it. Transport: Firebase Realtime Database,
   or a same-browser BroadcastChannel transport for testing (?net=local). */
const FIREBASE_CONFIG={"apiKey":"AIzaSyDX3vaUkNRwUVzY_0c_rcjlIz_cjlg_mmk","authDomain":"board-games-2c64d.firebaseapp.com","databaseURL":"https://board-games-2c64d-default-rtdb.asia-southeast1.firebasedatabase.app","projectId":"board-games-2c64d","storageBucket":"board-games-2c64d.firebasestorage.app","messagingSenderId":"1038938536228","appId":"1:1038938536228:web:931536e62f82f37fc91bb1"};

const rid=(n=12)=>Array.from(crypto.getRandomValues(new Uint8Array(n)),b=>'abcdefghijkmnpqrstuvwxyz23456789'[b%32]).join('');
const b64=u=>btoa(String.fromCharCode(...u));
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const EC={name:'ECDH',namedCurve:'P-256'};
const Crypto={
  async gen(){const k=await crypto.subtle.generateKey(EC,true,['deriveKey']);return {priv:await crypto.subtle.exportKey('jwk',k.privateKey),pub:await crypto.subtle.exportKey('jwk',k.publicKey)};},
  async derive(privJwk,pubJwk){const priv=await crypto.subtle.importKey('jwk',privJwk,EC,false,['deriveKey']);const pub=await crypto.subtle.importKey('jwk',pubJwk,EC,false,[]);
    return crypto.subtle.deriveKey({name:'ECDH',public:pub},priv,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);},
  async enc(key,obj){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(JSON.stringify(obj)));return b64(iv)+'.'+b64(new Uint8Array(ct));},
  async dec(key,s){const [iv,ct]=s.split('.');const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(iv)},key,unb64(ct));return JSON.parse(new TextDecoder().decode(pt));},
};
function lsGet(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch(e){return null;}}
function lsSet(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,JSON.stringify(v));}catch(e){}}

/* --- transports: set / on(value) / push / onAdd / remove --- */
function LocalTx(){
  const bc=new BroadcastChannel('pw-net');const subs=[];
  const K=p=>'pwnet:'+p;
  const get=p=>{try{const v=localStorage.getItem(K(p));return v==null?null:JSON.parse(v);}catch(e){return null;}};
  const fire=(m)=>subs.forEach(s=>{if(s.type==='v'&&s.path===m.path&&m.op==='set')s.cb(m.val);if(s.type==='a'&&m.op==='add'&&s.path===m.path&&!s.seen.has(m.key)){s.seen.add(m.key);s.cb(m.key,m.val);}});
  bc.onmessage=e=>fire(e.data);
  const send=m=>{fire(m);bc.postMessage(m);};
  return {
    set(p,v){localStorage.setItem(K(p),JSON.stringify(v));send({op:'set',path:p,val:v});},
    on(p,cb){const s={type:'v',path:p,cb};subs.push(s);const v=get(p);if(v!=null)setTimeout(()=>cb(v));return ()=>subs.splice(subs.indexOf(s),1);},
    push(p,v){const key=Date.now().toString(36)+rid(4);const list=get(p+'/__list')||{};list[key]=v;localStorage.setItem(K(p+'/__list'),JSON.stringify(list));send({op:'add',path:p,key,val:v});},
    onAdd(p,cb){const s={type:'a',path:p,cb,seen:new Set()};subs.push(s);const list=get(p+'/__list')||{};setTimeout(()=>Object.keys(list).forEach(k=>{if(!s.seen.has(k)){s.seen.add(k);cb(k,list[k]);}}));return ()=>subs.splice(subs.indexOf(s),1);},
    remove(p){const i=p.lastIndexOf('/');const base=p.slice(0,i),key=p.slice(i+1);const list=get(base+'/__list');if(list&&list[key]!==undefined){delete list[key];localStorage.setItem(K(base+'/__list'),JSON.stringify(list));}else localStorage.removeItem(K(p));},
  };
}
function loadScript(src){return new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>no(new Error('load '+src));document.head.appendChild(s);});}
async function FirebaseTx(){
  if(!window.firebase){
    const bases=['https://www.gstatic.com/firebasejs/10.12.2/','https://cdn.jsdelivr.net/npm/firebase@10.12.2/'];
    let lastErr;
    for(const base of bases){try{await loadScript(base+'firebase-app-compat.js');await loadScript(base+'firebase-database-compat.js');lastErr=null;break;}catch(e){lastErr=e;}}
    if(lastErr)throw new Error('無法載入連線元件');
  }
  if(!firebase.apps.length)firebase.initializeApp(FIREBASE_CONFIG);
  const db=firebase.database();
  return {
    set(p,v){return db.ref(p).set(v);},
    on(p,cb){const r=db.ref(p);const f=s=>{const v=s.val();if(v!=null)cb(v);};r.on('value',f);return ()=>r.off('value',f);},
    push(p,v){return db.ref(p).push(v);},
    onAdd(p,cb){const r=db.ref(p);const f=s=>cb(s.key,s.val());r.on('child_added',f);return ()=>r.off('child_added',f);},
    remove(p){return db.ref(p).remove();},
  };
}

      <div class="acts"><button class="btn" data-m="back">返回</button><button class="btn primary" data-m="join">加入</button></div>`,
    m=>{if(m==='back')return showSetup();const code=($('#joinCode').value||'').trim(),name=($('#joinName').value||'').trim()||'玩家';
      if(!/^\d{4}$/.test(code)){$('#joinErr').textContent='房號是 4 位數字。';return;}
      this.joinRoom(code,name);});
    setTimeout(()=>{const i=$('#joinCode');i&&i.focus();});
  },
  async joinRoom(code,name){
    try{await this.ensureTx();}catch(e){return this.fail(e);}
    this.leave();
    const kp=await Crypto.gen();
    const info={code,pid:rid(),name,kp};
    lsSet(NET_CLIENT_KEY,info);
    this.tx.push(`rooms/${code}/joins`,JSON.stringify({pid:info.pid,name,pub:kp.pub}));
    this.attachClient(info);
  },
  async rejoin(){const info=lsGet(NET_CLIENT_KEY);if(!info)return showSetup();try{await this.ensureTx();}catch(e){return this.fail(e);}this.attachClient(info);},
  attachClient(info){
    this.off();
    Object.assign(this,{role:'client',code:info.code,pid:info.pid,seat:null,secret:null,mkey:null,mopen:false,lastPub:null,info});
    let meta=null,key=null;
    this.waitModal(null);
    this.offs.push(this.tx.on(`rooms/${info.code}/meta`,async v=>{
      try{meta=JSON.parse(v);}catch(e){return;}
      if(meta.status==='closed'){this.leave();openModal(`<h2>房間已關閉</h2><p class="sub">房主結束了這個房間。</p><div class="acts"><button class="btn primary" data-m="ok">回到設定</button></div>`,()=>showSetup());return;}
      if(!key&&meta.hostPub){try{key=await Crypto.derive(info.kp.priv,meta.hostPub);this.aes=key;this.trySecret();}catch(e){console.error(e);}}
      if(this.seat==null)this.waitModal(meta);
    }));
    this.offs.push(this.tx.on(`rooms/${info.code}/sec/${info.pid}`,v=>{this.secretRaw=v;this.trySecret();}));
    this.offs.push(this.tx.on(`rooms/${info.code}/state`,v=>{let pub;try{pub=JSON.parse(v);}catch(e){return;}
      if(this.lastPub&&pub.v<=this.lastPub.v&&pub.v>2)return;
      const seat=pub.players.findIndex(p=>p.pid===info.pid);
      if(seat<0){if(pub.phase!=='idle'){this.leave();openModal(`<h2>來不及加入</h2><p class="sub">這個房間的遊戲已經開始，沒有你的座位。</p><div class="acts"><button class="btn primary" data-m="ok">回到設定</button></div>`,()=>showSetup());}return;}
      const first=this.seat==null;this.seat=seat;this.lastPub=pub;if(first&&!$('#overlay').hidden)closeModal();this.sync();}));
  },
  async trySecret(){if(!this.aes||!this.secretRaw)return;try{this.secret=await Crypto.dec(this.aes,this.secretRaw);if(this.lastPub)this.sync();}catch(e){console.error(e);}},
  waitModal(meta){
    if(this.seat!=null)return;
    const list=meta&&meta.players?meta.players.map((n,i)=>`<div class="seat">${avatar(i)}<b>${esc(n)}</b><span class="tag">${i===0?'房主':'已加入'}</span></div>`).join(''):'<p class="note">連線中……</p>';
    openModal(`<h2>已加入房間 ${esc(this.code)}</h2><p class="sub">等房主按下開始。遊戲開始後，你的內線只會出現在這支手機上。</p><div class="seats">${list}</div>
      <div class="acts"><button class="btn" data-m="leave">離開房間</button></div>`,()=>{this.leave();showSetup();});
  },
  sync(){
    const pub=JSON.parse(JSON.stringify(this.lastPub));const prev=S&&S.online&&S.online.client?S:null;
    S=pub;S.online={code:this.code,client:true};S.viewer=this.seat;S.deck=[];S.belief=S.players.map(()=>Array(NC).fill(0));
    if(this.secret&&this.secret.q===S.q&&(S.phase==='action'||S.phase==='board'))S.events[S.players[this.seat].insider]=this.secret.ev;
    if(!prev||prev.acts!==S.acts||prev.phase!==S.phase||prev.q!==S.q||prev.bi!==S.bi){UI.sel=null;UI.qty=1;UI.pending=false;}
    const w=S.await;
    const key=(S.phase==='board'&&w&&w.type==='board'&&w.seat===this.seat)?`b${S.q}-${w.c}`:S.phase==='settle'?`s${S.q}`:S.phase==='end'?'end':null;
    if(key!==this.mkey){
      if(this.mopen&&!$('#overlay').hidden)closeModal();
      this.mkey=key;this.mopen=false;
    }
    render();
    if(key&&!this.mopen){this.mopen=true;
      if(key[0]==='b')boardModal(this.seat,w.c);
      else if(key[0]==='s')settleModal(S.settleInfo?S.settleInfo.before:S.comps.map(C=>C.idx),S.settleInfo?S.settleInfo.bks:[]);
      else endGame();
    }
  },
  resync(){if(this.role==='client'&&this.lastPub){this.mkey=null;this.mopen=false;this.sync();}},
  send(a){if(this.role!=='client')return;UI.pending=true;render();this.tx.push(`rooms/${this.code}/actions`,JSON.stringify({...a,pid:this.pid,ts:Date.now()}));},
};
function act(t,c,n){
  if(NET.role==='client'){NET.send({t,c,n});return;}
  const pi=curP();
  if(t==='buy')doBuy(pi,c,n);else if(t==='sell')doSell(pi,c,n);else doPass(pi);
}

/* ================= boot ================= */
window.__pw={setupGame,setSpeed:v=>{SPEED=v;},get S(){return S;}};
(function boot(){
  S={players:[{name:'—',ai:true,cash:START_CASH,sh:Array(NC).fill(0),tr:{}}],comps:COMPS.map((_,i)=>({idx:7+(i%3),pool:SHARES,tre:START_TRE,ceo:null,emb:false,hist:[TRACK[7+(i%3)]],qStart:7+(i%3)})),q:1,start:0,acts:0,phase:'idle',events:[],log:[],belief:[[0,0,0,0,0]],viewer:null};
  render();showSetup();
})();
</script>
