<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>夾娃娃大師</title>
<meta name="description" content="原創手眼協調遊戲：按住按鈕移動爪子，放手就往下夾。不同娃娃分數不同，碰倒旁邊的娃娃要扣分，落後的人會拿到保夾、強力爪等救援卡。">
<meta name="theme-color" content="#1E5641">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="icon" href="../../icons/icon-192.png">
<link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="遊戲群島">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Outfit:wght@600;700;800&display=swap">
<style>
:root{
  --paper:#F5EEE1; --paper2:#EFE6D4; --card:#FFFBF4; --ink:#1F2B27; --muted:#6E7068; --line:#E5D9C3; --line2:#D9CBB1;
  --green:#1E5641; --green2:#28704F; --green-ink:#F3F7EF; --yellow:#F5C443; --yellow-ink:#2A2310;
  --orange:#E9643B; --pink:#F7DDD3; --pink2:#EFC6B8; --up:#2C8F4E; --up-bg:#D5EEDA; --down:#C8432F; --down-bg:#F7DAD3; --flat-bg:#ECE5D7;
  --red:#D7542B; --red-bg:#F8DCCF; --blue:#2E7DC0; --blue-bg:#D6E7F5; --violet:#7A5AD3; --violet-bg:#E4DCF7; --gold:#D19A17; --gold-bg:#F6E7BE;
  --p0:#E58FA0; --p1:#8B67D6; --p2:#4F9E61; --p3:#E0922F; --p4:#3E9CC4; --p5:#C8573E; --p6:#6C7A3A; --p7:#5C6BC0;
  --scrim:rgba(40,32,20,.45);
  --f-body:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
  --f-num:'Outfit','Noto Sans TC',system-ui,sans-serif;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55;font-weight:500}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
  background-image:radial-gradient(rgba(120,90,40,.07) 1px,transparent 1px);background-size:5px 5px}
.wrap{position:relative;z-index:1;max-width:1600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 28px}
h1,h2,h3,h4{text-wrap:balance;margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
svg{display:block}

/* header */
.top{display:flex;align-items:center;gap:14px 22px;flex-wrap:wrap;padding-block:6px 12px;border-bottom:1.5px solid var(--line2)}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit}
.brand svg{width:44px;height:44px;flex:none}
.brand h1{font-size:clamp(26px,3.4vw,38px);font-weight:900;letter-spacing:.06em;line-height:1}
.brand small{font-family:var(--f-num);font-size:12px;letter-spacing:.42em;color:var(--ink);font-weight:600;margin-left:6px}
.homelink{display:inline-flex;align-items:center;gap:6px;font-size:15px;font-weight:900;color:var(--ink);text-decoration:none;border:1.5px solid var(--ink);border-radius:12px;padding:7px 12px;background:var(--card)}.homelink svg{width:18px;height:18px}
.vsep{width:1.5px;align-self:stretch;background:var(--line2);margin-block:6px}
.steps{display:flex;align-items:center;flex:1;min-width:0;justify-content:center}
.step{font-family:var(--f-num);font-weight:700;font-size:15px;padding:5px 14px;border-radius:999px;border:1.5px solid var(--line2);background:var(--card);color:var(--ink);white-space:nowrap}
.step.done{color:var(--muted);background:var(--paper2)}
.step.now{background:var(--green);border-color:var(--green);color:var(--green-ink);font-size:17px;padding:6px 18px}
.link{flex:1;min-width:8px;max-width:56px;height:2px;background:repeating-linear-gradient(90deg,var(--line2) 0 4px,transparent 4px 8px)}
.link.done{background:var(--green)}
.tops{display:flex;gap:10px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--ink);background:var(--card);color:var(--ink);padding:8px 16px;border-radius:12px;cursor:pointer;font-weight:700;line-height:1.2;text-decoration:none}
.btn svg{width:18px;height:18px}
.btn:hover:not(:disabled){transform:translateY(-1px)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.dark,.btn.primary{background:var(--green);border-color:var(--green);color:var(--green-ink)}
.btn.ghost{background:transparent}

/* layout */
.board{display:grid;grid-template-columns:minmax(0,1fr) minmax(340px,430px);grid-template-areas:"hero desk" "main desk";grid-template-rows:auto 1fr;gap:14px 18px;margin-top:12px;align-items:start}
.hero{grid-area:hero;position:relative;min-height:140px;display:flex;align-items:center;overflow:hidden;border-radius:18px}
.hero-txt{position:relative;z-index:2;padding:8px 0 10px}
.eyebrow{display:flex;align-items:center;gap:12px;font-family:var(--f-num);font-weight:600;letter-spacing:.32em;font-size:13px}
.eyebrow::after{content:"";width:80px;height:1.5px;background:var(--ink)}
.hero h2{font-size:clamp(28px,4vw,48px);font-weight:900;letter-spacing:.03em;line-height:1.15;margin-top:6px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.swoosh{display:block;width:150px;height:14px;margin-top:-2px}
.qbadge{position:relative;font-size:17px;font-weight:900;border:2px solid var(--ink);border-radius:999px;padding:3px 14px;background:var(--card);letter-spacing:.04em}
.hero-art{position:absolute;right:0;top:0;bottom:0;width:min(62%,640px);z-index:1;
  -webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 28%);mask-image:linear-gradient(90deg,transparent 0%,#000 28%)}
.hero-art svg{width:100%;height:100%}
main{grid-area:main;min-width:0}
.sect{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:900;padding-bottom:10px;border-bottom:1.5px solid var(--line2);margin:0 0 12px}
.sect svg{width:26px;height:26px;color:var(--orange)}
.sect{flex-wrap:wrap}
.sect small{font-size:13px;color:var(--muted);font-weight:700;margin-left:auto}
@media (max-width:640px){.sect small{flex-basis:100%;margin-left:0}}

/* desk */
.desk{grid-area:desk;position:sticky;top:max(10px,env(safe-area-inset-top,0px));background:var(--green);color:var(--green-ink);border-radius:26px;padding:24px 24px 22px;overflow:hidden;display:flex;flex-direction:column;gap:14px;box-shadow:0 18px 40px rgba(20,60,45,.25)}
.desk .leaf{position:absolute;right:-30px;top:-20px;width:190px;height:190px;opacity:.9;pointer-events:none}
.desk>*{position:relative}
.dhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.dhead h2{font-size:clamp(26px,2.6vw,36px);font-weight:900;letter-spacing:.04em;line-height:1.1}
.pill{background:var(--orange);color:#fff;font-weight:900;border-radius:999px;padding:5px 14px;font-size:15px;white-space:nowrap}
.pill.soft{background:rgba(255,255,255,.16)}
.dsub{font-weight:700;font-size:15px;margin-top:-6px;opacity:.9}
.dlab{font-size:14px;opacity:.9;font-weight:900;display:flex;align-items:center;gap:8px;justify-content:space-between}
.dlab small{font-weight:700;opacity:.8;font-size:12px}
.dnote{font-size:13px;font-weight:700;background:rgba(255,255,255,.12);border-radius:10px;padding:7px 12px}
.dnote.warn{background:rgba(233,100,59,.28)}
.confirm{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:none;border-radius:16px;background:var(--yellow);color:var(--yellow-ink);font-size:22px;font-weight:900;padding:13px;cursor:pointer;box-shadow:0 4px 0 #C99A1E;letter-spacing:.06em}
.confirm svg{width:24px;height:24px}
.confirm:active:not(:disabled){transform:translateY(2px);box-shadow:0 2px 0 #C99A1E}
.confirm:disabled{opacity:.5;cursor:not-allowed}
.passbtn{width:100%;border:2px solid rgba(255,255,255,.85);background:transparent;color:var(--green-ink);border-radius:14px;font-weight:900;font-size:17px;padding:10px;cursor:pointer}
.passbtn:hover{background:rgba(255,255,255,.08)}
.empty{border:2px dashed rgba(255,255,255,.35);border-radius:16px;padding:20px 16px;text-align:center;font-weight:700;opacity:.92}
.empty b{display:block;font-size:19px;margin-bottom:4px}
.think{display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.1);border-radius:16px;padding:14px}
.think .av{width:56px;height:56px;flex:none}
.think b{font-size:19px}
.dots::after{content:"…";display:inline-block;animation:blink 1.1s steps(3) infinite}
@keyframes blink{0%{opacity:.2}50%{opacity:1}100%{opacity:.2}}
.chooser{display:flex;flex-wrap:wrap;gap:6px}
.chooser button{border:2px solid rgba(255,255,255,.55);background:transparent;color:var(--green-ink);border-radius:12px;padding:7px 12px;font-weight:900;cursor:pointer;display:inline-flex;align-items:center;gap:6px;min-height:40px}
.chooser button .av{width:24px;height:24px}
.chooser button.on{background:var(--card);color:var(--ink);border-color:var(--card)}
.chooser button:disabled{opacity:.35;cursor:not-allowed}
.chooser button.red.on{background:var(--red);border-color:var(--red);color:#fff}
.chooser button.blue.on{background:var(--blue);border-color:var(--blue);color:#fff}
.chooser.big button{flex:1;justify-content:center;font-size:16px}
.opt2{display:flex;flex-direction:column;gap:6px}
.opt2 button{display:flex;justify-content:space-between;gap:10px;align-items:center;text-align:left;border:2px solid rgba(255,255,255,.4);background:transparent;color:var(--green-ink);border-radius:12px;padding:9px 12px;cursor:pointer}
.opt2 button b{font-weight:900;font-size:15px}
.opt2 button span{font-size:12px;opacity:.85}
.opt2 button.on{background:var(--card);color:var(--ink);border-color:var(--card)}
.opt2 button.on span{opacity:1;color:var(--muted)}
.opt2 button:disabled{opacity:.35;cursor:not-allowed}
.dsec{display:flex;flex-direction:column;gap:8px;padding-top:12px;border-top:1px solid rgba(255,255,255,.2)}

/* private note card */
.intel{position:relative;background:var(--pink);color:var(--ink);border-radius:14px;padding:14px 16px 12px;box-shadow:0 6px 14px rgba(0,0,0,.18)}
.intel::after{content:"";position:absolute;right:0;top:0;width:28px;height:28px;background:linear-gradient(225deg,var(--green) 50%,var(--pink2) 50%);border-bottom-left-radius:8px}
.intel .ilab{display:flex;align-items:center;gap:8px;font-weight:900;color:#B24A35;font-size:16px;padding-bottom:8px;border-bottom:1.5px solid var(--pink2)}
.intel .ilab svg{width:20px;height:20px}
.intel ul{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:260px;overflow:auto}
.intel li{font-size:13.5px;line-height:1.45;display:flex;gap:8px;align-items:flex-start}
.intel li .rt{font-family:var(--f-num);font-weight:700;font-size:11px;border:1.5px solid var(--pink2);border-radius:6px;padding:0 5px;background:var(--card);white-space:nowrap;margin-top:1px}
.intel li.void{opacity:.45;text-decoration:line-through}
.intel .inote{font-size:12.5px;color:#5B4A40;margin-top:8px}
.intel .big{font-size:22px;font-weight:900;margin:8px 0 2px}
.stamp{border:1.5px solid #B24A35;color:#B24A35;border-radius:8px;padding:1px 9px;font-weight:900;font-size:12px;white-space:nowrap;display:inline-block;transform:rotate(-3deg)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:900;padding:1px 9px;border-radius:8px;background:var(--flat-bg);color:var(--ink);white-space:nowrap}
.chip.red{background:var(--red);color:#fff}.chip.blue{background:var(--blue);color:#fff}.chip.violet{background:var(--violet);color:#fff}
.chip.gold{background:var(--gold-bg);color:#6B4D07}.chip.green{background:var(--up-bg);color:var(--up)}.chip.down{background:var(--down-bg);color:var(--down)}

/* feed */
.feed{margin-top:18px}
.feedlist{list-style:none;margin:0;padding:0;overflow:auto;max-height:320px}
.feedlist li{display:grid;grid-template-columns:auto 34px minmax(0,1fr);gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.qtag{font-family:var(--f-num);font-weight:700;font-size:12px;border:1.5px solid var(--line2);border-radius:6px;padding:1px 6px;background:var(--card)}
.feedlist .av{width:34px;height:34px}
.feedlist .txt{font-size:13.5px;line-height:1.45;min-width:0}
.feedlist .ic{width:34px;height:34px;border-radius:50%;background:var(--paper2);display:grid;place-items:center;color:var(--green)}
.feedlist .ic svg{width:18px;height:18px}
.feedlist li.q .txt{font-weight:900;color:var(--green)}
.feedlist li.k .txt{color:#8A4A12}
.pn{font-weight:900;color:var(--ink)}

/* players strip */
.players{margin-top:18px;background:var(--card);border:1.5px solid var(--line);border-radius:20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));padding:8px;gap:6px;box-shadow:0 8px 20px rgba(90,70,30,.06)}
.pl{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:14px;position:relative;min-width:0}
.pl.cur{background:var(--pink)}
.pl .av{width:52px;height:52px;flex:none}
.pl .nm{font-size:17px;font-weight:900;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tag{font-size:11px;font-weight:700;border:1.5px solid var(--line2);border-radius:6px;padding:0 5px;color:var(--muted);background:var(--card)}
.pl .fig{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:13px;color:var(--muted)}
.pl .fig b{font-family:var(--f-num);font-weight:800;color:var(--ink);font-size:16px;margin-left:3px}

/* responsive */
@media (max-width:1040px){
  .board{grid-template-columns:minmax(0,1fr);grid-template-areas:"hero" "desk" "main"}
  .desk{position:relative;top:0}
  .hero-art{width:70%;opacity:.55}
}
@media (max-width:640px){
  .vsep{display:none}
  .steps{order:3;flex-basis:100%;justify-content:flex-start;overflow-x:auto;padding-bottom:2px}
  .step{padding:4px 10px;font-size:13px}.step.now{padding:5px 12px;font-size:15px}
  .brand small{display:none}
  .desk{padding:20px 16px;border-radius:22px}
  .tops .btn{padding:8px 11px}
}

/* modals */
.overlay{position:fixed;inset:0;background:var(--scrim);display:grid;place-items:center;z-index:50;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--card);color:var(--ink);border-radius:24px;border:1.5px solid var(--line);width:min(660px,100%);max-height:calc(100dvh - 32px);overflow:auto;padding:24px;box-shadow:0 30px 70px rgba(40,30,10,.3)}
.modal h2{font-size:27px;font-weight:900;margin-bottom:6px;letter-spacing:.03em}
.modal .sub{color:var(--muted);margin:0 0 14px}
.modal .acts{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}
.modal .acts .btn{padding:10px 20px;font-size:16px}
.modal .intel::after{background:linear-gradient(225deg,var(--card) 50%,var(--pink2) 50%)}
.seats{display:flex;flex-direction:column;gap:10px}
.seat{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center}
.seat .av{width:44px;height:44px}
.seat input{font:inherit;font-weight:700;padding:9px 12px;border:1.5px solid var(--line2);border-radius:12px;background:var(--paper);color:var(--ink);min-width:0;width:100%}
.seg{display:inline-flex;border:1.5px solid var(--line2);border-radius:12px;overflow:hidden;background:var(--paper);flex-wrap:wrap}
.seg button{border:none;background:transparent;color:var(--muted);padding:8px 12px;cursor:pointer;font-weight:700}
.seg button.on{background:var(--green);color:var(--green-ink)}
.field{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:14px 0;flex-wrap:wrap}
.field>span{font-weight:900;font-size:16px}
.note{font-size:12px;color:var(--muted)}
.pitch{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:0 0 6px}
.pitch div{background:var(--paper);border-radius:14px;padding:12px;font-size:13px;color:var(--muted)}
.pitch b{display:block;color:var(--ink);font-size:15px;font-weight:900;margin-bottom:2px}
.setup-art{height:120px;margin:-24px -24px 16px;overflow:hidden;border-radius:24px 24px 0 0}
.setup-art svg{width:100%;height:100%}
.rules{font-size:15px;line-height:1.8}
.rules h3{font-size:19px;font-weight:900;margin:18px 0 6px;color:var(--green)}
.rules p,.rules li{max-width:64ch}
.rules ol,.rules ul{padding-left:1.3em;margin:6px 0}
.rules table{border-collapse:collapse;font-size:14px;margin:6px 0;width:100%}
.rules td,.rules th{border-top:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.rules th{font-size:12px;color:var(--muted)}
.handoff .av{width:84px;height:84px;margin-bottom:10px}
table.res{width:100%;border-collapse:collapse;margin-top:12px;font-size:14px}
table.res th{font-size:12px;color:var(--muted);text-align:right;font-weight:700;padding:4px 6px}
table.res td{text-align:right;padding:8px 6px;border-top:1px solid var(--line);font-family:var(--f-num);font-weight:700;font-variant-numeric:tabular-nums}
table.res th:first-child,table.res td:first-child{text-align:left;font-family:var(--f-body)}
.tablewrap{overflow-x:auto}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--muted)}
.win{font-size:32px;font-weight:900;color:var(--green);margin:4px 0}
.revlist{display:flex;flex-direction:column;gap:8px}
.rev{border:1.5px solid var(--line2);border-radius:14px;padding:10px 14px;background:var(--paper);display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.rev h4{font-size:16px;font-weight:900}
.rev .kn{font-size:12.5px;color:var(--muted);font-weight:700}
@media (prefers-reduced-motion:reduce){.dots::after{animation:none}.btn{transition:none}}

/* Layout: a claw-machine cabinet with the top-down canvas on the left; the hold button and rescue cards on the right desk. */
.machine{background:linear-gradient(180deg,#E58FA0,#D96F86);border-radius:26px;padding:12px;box-shadow:0 10px 0 #B5566C,0 18px 30px rgba(120,40,60,.25);max-width:720px;margin:0 auto}
.mtop,.mbot{display:flex;justify-content:space-between;align-items:center;color:#fff;font-family:var(--f-num);font-weight:800;letter-spacing:.2em;padding:2px 8px 8px;font-size:13px}
.mtop b{font-size:20px;letter-spacing:.05em;background:#2A2320;color:#FF6B5A;border-radius:8px;padding:0 10px;min-width:64px;text-align:center}
.mbot{padding:8px 8px 2px}
.chute{background:#2A2320;color:#F5C443;border-radius:8px;padding:2px 10px;letter-spacing:.1em}
#cv{width:100%;height:auto;display:block;border-radius:16px;background:#FFF6EA;touch-action:none;border:4px solid #fff}
.hold{width:100%;border:none;border-radius:22px;background:var(--yellow);color:var(--yellow-ink);font-size:24px;font-weight:900;padding:26px 12px;cursor:pointer;box-shadow:0 6px 0 #C99A1E;user-select:none;-webkit-user-select:none;touch-action:none;display:flex;flex-direction:column;align-items:center;gap:4px}
.hold small{font-size:13px;font-weight:700;opacity:.8}
.hold.down{transform:translateY(4px);box-shadow:0 2px 0 #C99A1E;background:#FFD866}
.hold:disabled{opacity:.5;cursor:not-allowed}
.cardsrow{display:flex;flex-wrap:wrap;gap:6px}
.cardsrow button{border:2px solid rgba(255,255,255,.55);background:rgba(255,255,255,.06);color:var(--green-ink);border-radius:12px;padding:7px 11px;font-weight:900;cursor:pointer;text-align:left;display:flex;flex-direction:column}
.cardsrow button small{font-weight:700;font-size:11px;opacity:.85}
.cardsrow button.on{background:var(--card);color:var(--ink);border-color:var(--card)}
.cardsrow button:disabled{opacity:.4;cursor:not-allowed}
.prize{display:flex;flex-wrap:wrap;gap:3px;margin-top:3px}
.prize span{font-size:11px;font-weight:900;border-radius:6px;padding:0 5px;background:var(--paper2)}

<script>

const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

const ICONS={

 `<circle cx="32" cy="32" r="32" fill="#CFE6CB"/><path d="M14 14l9 12h18l9-12 1 18c0 12-9 20-19 20s-19-8-19-20z" fill="#E98A3A"/><path d="M17 18l5 7M47 18l-5 7" stroke="#B85A1E" stroke-width="3" stroke-linecap="round"/><path d="M15 33c4 0 11 4 17 13 6-9 13-13 17-13-1 11-8 19-17 19S16 44 15 33z" fill="#fff"/><circle cx="25" cy="33" r="2.4" fill="#2A2320"/><circle cx="39" cy="33" r="2.4" fill="#2A2320"/><circle cx="32" cy="45" r="2.6" fill="#2A2320"/>`,

 `<circle cx="32" cy="32" r="32" fill="#C3E2EE"/><path d="M14 22l6 6M50 22l-6 6" stroke="#6B5444" stroke-width="4" stroke-linecap="round"/><ellipse cx="32" cy="40" rx="18" ry="19" fill="#8C6E58"/><ellipse cx="32" cy="46" rx="11" ry="11" fill="#D9C2A5"/><circle cx="24.5" cy="34" r="7" fill="#fff"/><circle cx="39.5" cy="34" r="7" fill="#fff"/><circle cx="25" cy="34" r="3.2" fill="#2A2320"/><circle cx="39" cy="34" r="3.2" fill="#2A2320"/><path d="M29.5 39l2.5 4 2.5-4z" fill="#F0A93B"/>`,
 `<circle cx="32" cy="32" r="32" fill="#F3C9A8"/><path d="M14 14l8 14M50 14l-8 14" stroke="#4A4A4A" stroke-width="7" stroke-linecap="round"/><ellipse cx="32" cy="38" rx="18" ry="16" fill="#5A5A5E"/><ellipse cx="32" cy="43" rx="9" ry="7" fill="#EDE6DC"/><circle cx="25" cy="35" r="2.6" fill="#F4D35E"/><circle cx="39" cy="35" r="2.6" fill="#F4D35E"/><path d="M29.5 41.5h5l-2.5 2.5z" fill="#E77F8B"/><path d="M14 42h8M14 46h8M42 42h8M42 46h8" stroke="#DCD6CC" stroke-width="1.2"/>`,
 `<circle cx="32" cy="32" r="32" fill="#D8E6B5"/><circle cx="18" cy="20" r="7" fill="#8A5E3C"/><circle cx="46" cy="20" r="7" fill="#8A5E3C"/><circle cx="32" cy="36" r="18" fill="#A9774E"/><ellipse cx="32" cy="43" rx="9" ry="7" fill="#E6C9A3"/><circle cx="25" cy="33" r="2.4" fill="#2A2320"/><circle cx="39" cy="33" r="2.4" fill="#2A2320"/><ellipse cx="32" cy="40" rx="3.2" ry="2.3" fill="#2A2320"/>`,
 `<circle cx="32" cy="32" r="32" fill="#BFD0F2"/><ellipse cx="32" cy="38" rx="17" ry="19" fill="#2E3440"/><ellipse cx="32" cy="42" rx="11" ry="13" fill="#fff"/><circle cx="26" cy="32" r="2.4" fill="#2A2320"/><circle cx="38" cy="32" r="2.4" fill="#2A2320"/><path d="M28.5 37l3.5 3 3.5-3z" fill="#F0A93B"/><circle cx="26.7" cy="31.3" r=".8" fill="#fff"/><circle cx="38.7" cy="31.3" r=".8" fill="#fff"/>`,
];
const avatar=i=>`<img class="av" src="../../assets/avatars/avatar-${i%8+1}.webp" alt="" aria-hidden="true"${i>=8?` style="filter:hue-rotate(${150*Math.floor(i/8)}deg) saturate(1.2)"`:''}>`;
const swoosh='<svg class="swoosh" viewBox="0 0 150 14" aria-hidden="true"><path d="M3 10 Q60 1 147 6" stroke="#E9643B" stroke-width="4.5" fill="none" stroke-linecap="round"/></svg>';
const leafDeco='<svg class="leaf" viewBox="0 0 200 200" aria-hidden="true"><g fill="#2E7553"><path d="M120 10c40 10 70 40 74 80-40-6-70-36-74-80z"/><path d="M60 0c30 20 44 54 36 90-30-22-44-56-36-90z" fill="#2A6B4C"/><path d="M190 120c-30 10-64 4-86-20 32-12 64-6 86 20z" fill="#327C59"/></g><g stroke="#24614A" stroke-width="2" fill="none"><path d="M124 16c20 24 40 44 66 70"/><path d="M64 8c10 26 20 50 30 76"/></g></svg>';
function tree(x,y,r,col,trunk='#8A6A4A'){return `<rect x="${x-1.6}" y="${y}" width="3.2" height="${r*1.3}" fill="${trunk}"/><circle cx="${x}" cy="${y-r*.2}" r="${r}" fill="${col}"/><circle cx="${x-r*.6}" cy="${y+r*.25}" r="${r*.7}" fill="${col}"/><circle cx="${x+r*.65}" cy="${y+r*.2}" r="${r*.72}" fill="${col}"/>`;}

/* modals */
let modalCb=null;
function openModal(html,cb){$('#modal').innerHTML=html;$('#overlay').hidden=false;$('#modal').scrollTop=0;modalCb=cb;const f=$('#modal .primary');f&&f.focus({preventScroll:true});}
function closeModal(){$('#overlay').hidden=true;$('#modal').innerHTML='';modalCb=null;}
$('#modal').addEventListener('click',e=>{const b=e.target.closest('[data-m]');if(b&&!b.disabled&&modalCb)modalCb(b.dataset.m,b);});
function showRulesHTML(html){
  $('#rulesModal').innerHTML=`<h2>遊戲規則</h2><div class="rules">${html}</div><div class="acts"><button class="btn primary" id="closeRules">知道了</button></div>`;
  $('#rulesOv').hidden=false;$('#rulesModal').scrollTop=0;$('#closeRules').focus({preventScroll:true});
}
$('#rulesOv').addEventListener('click',e=>{if(e.target.id==='closeRules'||e.target.id==='rulesOv')$('#rulesOv').hidden=true;});
function feedHTML(log,tag,emptyTxt){
  const items=log.slice(0,40).map(l=>{
    const who=l.a!=null&&S.players[l.a]?avatar(l.a):`<span class="ic">${l.c==='q'?ICONS.spark:l.c==='k'?ICONS.gavel:ICONS.bars}</span>`;
    return `<li class="${l.c||''}"><span class="qtag">${tag(l)}</span>${who}<span class="txt">${l.h}</span></li>`;}).join('');
  return `<ul class="feedlist">${items||`<li><span class="txt" style="grid-column:1/-1;color:var(--muted)">${emptyTxt}</span></li>`}</ul>`;
}
function setupSeatsHTML(cfg,min,max){
  return `<div class="field"><span>玩家人數</span><div class="seg">${Array.from({length:max-min+1},(_,k)=>k+min).map(k=>`<button data-m="n:${k}" class="${k===cfg.n?'on':''}">${k} 人</button>`).join('')}</div></div>
   <div class="seats">${cfg.seats.slice(0,cfg.n).map((s,i)=>`<div class="seat">${avatar(i)}<input data-seat="${i}" value="${esc(s.name)}" maxlength="10" aria-label="玩家 ${i+1} 名稱"><div class="seg"><button data-m="h:${i}" class="${s.ai?'':'on'}">人類</button><button data-m="a:${i}" class="${s.ai?'on':''}">AI</button></div></div>`).join('')}</div>
   <div class="field"><span>AI 速度</span><div class="seg">${Object.keys(SPEEDS).map(k=>`<button data-m="sp:${k}" class="${k===cfg.speed?'on':''}">${k}</button>`).join('')}</div></div>`;
}
function setupSeatsHandle(cfg,m,redraw){
  document.querySelectorAll('[data-seat]').forEach(inp=>{cfg.seats[+inp.dataset.seat].name=inp.value;});
  if(m.startsWith('n:')){cfg.n=+m.slice(2);redraw();return true;}
  if(m.startsWith('h:')||m.startsWith('a:')){cfg.seats[+m.slice(2)].ai=m[0]==='a';redraw();return true;}
  if(m.startsWith('sp:')){cfg.speed=m.slice(3);SPEED=SPEEDS[cfg.speed];redraw();return true;}
  return false;
}
function seatsToPlayers(cfg,aiNames){return cfg.seats.slice(0,cfg.n).map((s,i)=>({name:(s.name||'').trim()||(s.ai?aiNames[i%aiNames.length]:'玩家'+(i+1)),ai:s.ai}));}
function scrollDeskIntoView(){if(innerWidth<=1040){const d=$('#desk');const r=d.getBoundingClientRect();if(r.top<0||r.top>innerHeight*.6)d.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'});}}


/* ================= constants ================= */
const ROUNDS=5, TURN_SEC=15, W=720, H=560, CHUTE=120, REACH=34, SPEED_PX=170, BASE_GRIP=.8, KNOCK_PEN=1, REFILL=12;
const DOLLS={
  chick:{n:'小雞',v:1,r:30,ease:1,w:.6,c:'#F5C443',cnt:4},
  bear:{n:'小熊',v:2,r:38,ease:.9,w:1,c:'#B07A42',cnt:3},
  bunny:{n:'兔兔',v:3,r:32,ease:.8,w:.8,c:'#F6C6CF',cnt:3},
  dino:{n:'恐龍',v:4,r:40,ease:.7,w:1.3,c:'#6FBF73',cnt:2},
  cat:{n:'招財貓',v:6,r:24,ease:.6,w:.9,c:'#FFFBF4',cnt:1},
  egg:{n:'神秘扭蛋',v:0,r:22,ease:.75,w:.5,c:'#8B67D6',cnt:1},
};
const DK=Object.keys(DOLLS);
const DIMG={};DK.forEach(k=>{const im=new Image();im.src=`img/${k}.webp`;DIMG[k]=im;});
const CARDS={
  slow:{n:'慢動作',d:'這次爪子移動速度減半'},
  strong:{n:'強力爪',d:'這次抓力全滿，夾起來不會掉'},
  big:{n:'大爪子',d:'這次爪子範圍變 1.5 倍'},
  again:{n:'再來一次',d:'這次夾完再多夾一次'},
  shake:{n:'搖一搖',d:'馬上把機台裡的娃娃搖亂重排'},
  guarantee:{n:'保夾',d:'這次沒夾到的話，直接送你最近的那隻'},
};
const CK=Object.keys(CARDS);
const AI_NAMES=['夾娃娃店長','手殘阿弟','台客小胖','保夾達人','情侶檔','國中生'];
const SAVE_KEY='claw-master-save-v1';

/* ================= state ================= */
let S=null, UI={}, A=null; // A = live attempt (not saved)
let setupCfg={n:3,seats:[{name:'你',ai:false}].concat(AI_NAMES.slice(0,5).map(n=>({name:n,ai:true}))),speed:'中'};
const NP=()=>S.players.length;
const humans=()=>S.players.filter(p=>!p.ai&&!p.remote); // humans on this device
const pn=i=>`<b class="pn" data-p="${i}">${esc(S.players[i].name)}</b>`;
function log(html,cls=''){const m=/data-p="(\d)"/.exec(html);S.log.unshift({h:html,c:cls,a:m?+m[1]:null,r:S.round});if(S.log.length>200)S.log.length=200;}
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(S));}catch(e){}}
function clearSave(){lsSet(SAVE_KEY,null);}
const rnd=(a,b)=>a+Math.random()*(b-a);
function gauss(){let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}

/* ================= dolls ================= */
function freeSpot(r,dolls){
  for(let t=0;t<300;t++){
    const x=rnd(r+6,W-r-6),y=rnd(r+6,H-r-6);
    if(x<CHUTE+r&&y>H-CHUTE-r)continue;
    if(dolls.every(d=>Math.hypot(d.x-x,d.y-y)>d.r+DOLLS[d.t].r*0+r+4))return {x,y};
  }
  return {x:rnd(CHUTE+r,W-r),y:rnd(r,H-CHUTE)};
}
function addDoll(t,dolls){const r=DOLLS[t].r;const p=freeSpot(r,dolls);dolls.push({t,x:p.x,y:p.y,r,id:Math.random().toString(36).slice(2,8),v:t==='egg'?1+(Math.random()*8|0):DOLLS[t].v});}
function initDolls(){const d=[];DK.forEach(t=>{for(let i=0;i<DOLLS[t].cnt;i++)addDoll(t,d);});return d;}
function refill(){const pool=['chick','chick','chick','bear','bear','bunny','bunny','dino','cat','egg'];while(S.dolls.length<REFILL)addDoll(pick(pool),S.dolls);}
function shakeDolls(){const ts=S.dolls.map(d=>d.t),vs=S.dolls.map(d=>d.v);S.dolls=[];ts.forEach((t,k)=>{addDoll(t,S.dolls);S.dolls[k].v=vs[k];});}

/* ================= setup & flow ================= */
function setupGame(players){
  clearTimeout(timer);A=null;
  S={players:players.map(p=>({name:p.name,ai:p.ai,remote:!!p.remote,pid:p.pid||null,prizes:[],knocks:0,cards:[]})),dolls:initDolls(),round:1,start:Math.random()*players.length|0,cur:0,turns:0,phase:'turn',log:[],cfgPlayers:players,gid:rid(6)};
  if(NET.host)S.online={code:NET.code};
  S.cur=S.start;
  log('娃娃機投幣！每人每輪夾一次。','q');
  UI={};startTurn();
}
const scoreOf=i=>S.players[i].prizes.reduce((a,p)=>a+p.v,0)-S.players[i].knocks*KNOCK_PEN;
function dealRescue(){
  const sc=S.players.map((_,i)=>scoreOf(i)),mn=Math.min(...sc);
  if(sc.every(v=>v===mn))return;
  S.players.forEach((p,i)=>{if(sc[i]===mn&&p.cards.length<2){const c=pick(CK);p.cards.push(c);log(`${pn(i)} 墊底，店長送一張救援卡「${CARDS[c].n}」`,'k');}});
}
function startTurn(){
  clearTimeout(timer);save();
  const p=S.players[S.cur];
  A={phase:'ready',x:CHUTE/2,y:H-CHUTE/2,timeLeft:TURN_SEC,use:{},extra:0,drop:0,msg:'',key:rid(5)};
  UI={};
  if(p.ai){render();timer=setTimeout(aiPlan,humans().length?500:120);return;}
  if(p.remote){render();return;} // a friend aims on their own phone and sends the final spot
  if(humans().length>1){
    render();
    openModal(`<div class="handoff">${avatar(S.cur)}</div><h2>輪到 ${esc(p.name)}</h2><p class="sub">請把裝置交給 ${esc(p.name)}。按住按鈕讓爪子往右，放開；再按住讓爪子往後，放開就會夾下去。限時 ${TURN_SEC} 秒。</p>
      <div class="acts"><button class="btn primary" data-m="go">投幣開始</button></div>`,()=>{closeModal();render();scrollDeskIntoView();});
    return;
  }
  render();scrollDeskIntoView();
}
function endTurn(){
  clearTimeout(timer);
  const p=S.players[S.cur];
  if(A&&A.extra>0){A.extra--;const keep=A.extra;A={phase:'ready',x:CHUTE/2,y:H-CHUTE/2,timeLeft:TURN_SEC,use:{},extra:keep,drop:0,msg:'',key:rid(5)};log(`${pn(S.cur)} 再來一次！`);render();if(p.ai)timer=setTimeout(aiPlan,humans().length?500:120);return;}
  S.turns++;S.cur=(S.cur+1)%NP();
  if(S.cur===S.start){
    if(S.round>=ROUNDS){finish();return;}
    S.round++;refill();log(`第 ${S.round} 輪，店長補貨到 ${S.dolls.length} 隻`,'q');dealRescue();
  }
  startTurn();
}

/* ================= attempt ================= */
function useCard(c){
  const p=S.players[S.cur];if(!p.cards.includes(c)||A.phase!=='ready')return;
  p.cards.splice(p.cards.indexOf(c),1);
  if(c==='shake'){shakeDolls();log(`${pn(S.cur)} 用力搖機台，娃娃全部換位置`,'k');}
  else if(c==='again'){A.extra++;log(`${pn(S.cur)} 用了「再來一次」`);}
  else{A.use[c]=true;log(`${pn(S.cur)} 用了「${CARDS[c].n}」`);}
  save();render();
}
const reach=()=>REACH*(A.use.big?1.5:1);
const moveSpeed=()=>SPEED_PX*(A.use.slow?.5:1);
function press(){if(!A)return;if(A.phase==='ready'){A.phase='x';A.holding=true;A.started=performance.now();}else if(A.phase==='x2'){A.phase='y';A.holding=true;}}
function release(){if(!A||!A.holding)return;A.holding=false;if(A.phase==='x')A.phase='x2';else if(A.phase==='y')startDrop();}
function startDrop(){A.phase='drop';A.t=0;A.holding=false;}
function resolveGrab(){
  const R=reach();
  let best=null,bs=1e9;
  S.dolls.forEach(d=>{const dd=Math.hypot(d.x-A.x,d.y-A.y);const s=dd/d.r;if(dd<R+d.r*.4&&s<bs){bs=s;best=d;}});
  // knocks: prongs land on neighbours
  const knocked=S.dolls.filter(d=>d!==best&&Math.hypot(d.x-A.x,d.y-A.y)<REACH+d.r*.6);
  let got=null,p=0;
  if(best){const dd=Math.hypot(best.x-A.x,best.y-A.y),tol=best.r*.55+R*.35;
    if(dd<tol){p=(A.use.strong?1:BASE_GRIP)*(1-(dd/tol)**2*.6)*DOLLS[best.t].ease*(A.use.strong?1.3:1);if(Math.random()<p)got=best;}}
  if(!got&&A.use.guarantee){if(best)got=best;else{S.players[S.cur].cards.push('guarantee');A.msg='爪子下面沒有娃娃，保夾卡退還';}}
  knocked.forEach(d=>{if(d===got)return;const a=Math.atan2(d.y-A.y,d.x-A.x)||rnd(0,6.28);d.x=Math.min(W-d.r,Math.max(d.r,d.x+Math.cos(a)*30));d.y=Math.min(H-d.r,Math.max(d.r,d.y+Math.sin(a)*30));});
  A.knocked=knocked.filter(d=>d!==got).length;
  S.players[S.cur].knocks+=A.knocked;
  A.got=got;A.p=p;
  if(got){S.dolls=S.dolls.filter(d=>d!==got);A.carry=got;A.dropAt=!A.use.strong&&Math.random()<(1-BASE_GRIP)*DOLLS[got.t].w*.9?rnd(.2,.8):null;A.from={x:A.x,y:A.y};}
}
function finishAttempt(){
  const i=S.cur,p=S.players[i];
  let txt;
  if(A.carry){const d=A.carry;p.prizes.push({t:d.t,v:d.v});txt=`${pn(i)} 夾到 ${DOLLS[d.t].n}！+${d.v}${d.t==='egg'?'（扭蛋開出 '+d.v+' 分）':''}`;A.msg=`夾到 ${DOLLS[d.t].n} +${d.v}`;}
  else if(A.dropped){txt=`${pn(i)} 的 ${DOLLS[A.dropped.t].n} 在半路掉下去了`;A.msg=A.msg||'半路掉了！';}
  else{txt=`${pn(i)} 沒夾到`;A.msg=A.msg||'沒夾到';}
  if(A.knocked)txt+=`，碰倒 ${A.knocked} 隻 −${A.knocked*KNOCK_PEN}`;
  log(txt,A.carry?'k':'');
  A.phase='result';save();render();
  timer=setTimeout(endTurn,humans().length?1400:SPEED);
}
function step(dt){
  if(!A||!S||S.phase!=='turn')return;
  if(NET.client){clientStep(dt);return;}
  const sp=moveSpeed()*dt;
  if(['ready','x','x2','y'].includes(A.phase)&&!S.players[S.cur].ai&&A.phase!=='ready'){
    A.timeLeft-=dt;if(A.timeLeft<=0){A.timeLeft=0;startDrop();}
  }
  if(A.phase==='x'&&A.holding)A.x=Math.min(W-20,A.x+sp);
  if(A.phase==='y'&&A.holding)A.y=Math.max(20,A.y-sp);
  if(A.phase==='aix'){const tx=A.tx;A.x=Math.min(tx,A.x+sp);if(A.x>=tx)A.phase='aiy';}
  if(A.phase==='aiy'){const ty=A.ty;A.y=Math.max(ty,A.y-sp);if(A.y<=ty)startDrop();}
  if(A.phase==='drop'){A.t+=dt;if(A.t>=.7){resolveGrab();A.phase='lift';A.t=0;}}
  else if(A.phase==='lift'){A.t+=dt;if(A.t>=.45){if(A.carry){A.phase='carry';A.t=0;A.len=Math.hypot(A.x-CHUTE/2,A.y-(H-CHUTE/2));}else finishAttempt();}}
  else if(A.phase==='carry'){
    const tx=CHUTE/2,ty=H-CHUTE/2,dx=tx-A.from.x,dy=ty-A.from.y;
    A.t+=dt*220/Math.max(60,A.len);const k=Math.min(1,A.t);
    A.x=A.from.x+dx*k;A.y=A.from.y+dy*k;
    if(A.dropAt!=null&&k>=A.dropAt){const d=A.carry;A.carry=null;A.dropped=d;d.x=Math.max(CHUTE+d.r,A.x);d.y=Math.min(H-d.r,Math.max(d.r,A.y));S.dolls.push(d);A.dropAt=null;finishAttempt();return;}
    if(k>=1)finishAttempt();
  }
}

/* ================= AI ================= */
function evalTarget(d,R){
  const tol=d.r*.55+R*.35;
  const p=BASE_GRIP*(1-.15)*DOLLS[d.t].ease;
  const keep=1-(1-BASE_GRIP)*DOLLS[d.t].w*.9*.5;
  const nb=S.dolls.filter(o=>o!==d&&Math.hypot(o.x-d.x,o.y-d.y)<REACH+o.r*.6).length;
  const v=d.t==='egg'?4.5:d.v;
  return v*p*keep*Math.min(1,tol/18)-nb*KNOCK_PEN*.8;
}
function aiPlan(){
  if(!A||A.phase!=='ready')return;
  const p=S.players[S.cur];
  // cards: use when behind
  if(p.cards.length){const c=p.cards[0];if(c!=='shake'||Math.random()<.5){useCard(c);}}
  if(!S.dolls.length){A.tx=A.x+40;A.ty=A.y-40;A.phase='aix';return;}
  let best=null,bv=-1e9;S.dolls.forEach(d=>{const v=evalTarget(d,reach())+Math.random()*.3;if(v>bv){bv=v;best=d;}});
  const sigma=A.use.slow?8:14;
  A.tx=Math.max(A.x,Math.min(W-20,best.x+gauss()*sigma));A.ty=Math.min(A.y,Math.max(20,best.y+gauss()*sigma));
  A.phase='aix';render();
}

/* ================= scoring ================= */
function finish(){
  S.phase='end';A=null;
  const sc=S.players.map((p,i)=>({prize:p.prizes.reduce((a,x)=>a+x.v,0),knock:-p.knocks*KNOCK_PEN,total:scoreOf(i),n:p.prizes.length}));S.final=sc;
  const best=Math.max(...sc.map(s=>s.total));
  let ws=sc.map((s,i)=>i).filter(i=>sc[i].total===best);
  if(ws.length>1){const mk=Math.min(...ws.map(i=>S.players[i].knocks));ws=ws.filter(i=>S.players[i].knocks===mk);}
  S.winners=ws;log(`打烊！${ws.map(i=>esc(S.players[i].name)).join('、')} 是夾娃娃大師`,'q');
  clearSave();render();endModal();
}
function endModal(){
  const sc=S.final;
  openModal(`<h2>打烊結算</h2><div class="win">${S.winners.map(i=>esc(S.players[i].name)).join('、')} 勝出</div>
   <p class="sub">娃娃分數減掉碰倒的扣分。平手時碰倒比較少的人贏。</p>
   <div class="tablewrap"><table class="res"><thead><tr><th>玩家</th><th>夾到</th><th>娃娃分</th><th>碰倒</th><th>總分</th></tr></thead><tbody>
   ${sc.map((s,i)=>({s,i})).sort((a,b)=>b.s.total-a.s.total).map(({s,i})=>`<tr><td>${esc(S.players[i].name)}</td><td>${s.n} 隻</td><td>${s.prize}</td><td>${s.knock}</td><td><b>${s.total}</b></td></tr>`).join('')}</tbody></table></div>
   <div class="acts"><button class="btn${NET.client?' primary':''}" data-m="close">看看機台</button>${NET.client?'':'<button class="btn primary" data-m="again">再來一局</button>'}</div>`,m=>{closeModal();if(m==='again')setupGame(S.cfgPlayers);});
}

/* ================= drawing ================= */
const cv=$('#cv'),ctx=cv.getContext('2d');
function drawDoll(d,x,y,s=1){
  const t=DOLLS[d.t],r=d.r*s;
  ctx.save();ctx.translate(x,y);
  ctx.fillStyle='rgba(60,40,20,.15)';ctx.beginPath();ctx.ellipse(4,6,r,r*.9,0,0,7);ctx.fill();
  const im=DIMG[d.t];
  if(im&&im.complete&&im.naturalWidth){
    ctx.save();ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.clip();ctx.fillStyle='#FFF8EC';ctx.fill();ctx.drawImage(im,-r*1.08,-r*1.08,r*2.16,r*2.16);ctx.restore();
    ctx.strokeStyle=t.c||'rgba(60,40,20,.35)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.stroke();
    ctx.font=`800 ${Math.max(13,r*.42)}px Outfit,sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
    const tx=d.t==='egg'?'?':d.v;ctx.fillStyle='rgba(255,255,255,.92)';ctx.beginPath();ctx.arc(r*.72,r*.72,r*.3,0,7);ctx.fill();ctx.fillStyle='#1F2B27';ctx.fillText(tx,r*.72,r*.74);
    ctx.restore();return;
  }
  if(d.t==='bear'){ctx.fillStyle=t.c;[[-.7,-.75],[.7,-.75]].forEach(([a,b])=>{ctx.beginPath();ctx.arc(a*r,b*r,r*.35,0,7);ctx.fill();});}
  if(d.t==='bunny'){ctx.fillStyle='#fff';[[-.35],[.35]].forEach(([a])=>{ctx.beginPath();ctx.ellipse(a*r,-r*.95,r*.2,r*.55,a*.6,0,7);ctx.fill();});}
  if(d.t==='cat'){ctx.fillStyle='#fff';ctx.strokeStyle='#E9643B';ctx.lineWidth=2;[[-1],[1]].forEach(([a])=>{ctx.beginPath();ctx.moveTo(a*r*.85,-r*.2);ctx.lineTo(a*r*.55,-r*1.05);ctx.lineTo(a*r*.15,-r*.7);ctx.fill();ctx.stroke();});}
  if(d.t==='dino'){ctx.fillStyle='#4F9E61';for(let k=-2;k<=2;k++){ctx.beginPath();ctx.moveTo(k*r*.3-6,-r*.8);ctx.lineTo(k*r*.3,-r*1.15);ctx.lineTo(k*r*.3+6,-r*.8);ctx.fill();}}
  if(d.t==='egg'){const g=ctx.createLinearGradient(-r,-r,r,r);g.addColorStop(0,'#E58FA0');g.addColorStop(.5,'#8B67D6');g.addColorStop(1,'#3E9CC4');ctx.fillStyle=g;}else ctx.fillStyle=t.c;
  ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.fill();
  ctx.strokeStyle='rgba(60,40,20,.35)';ctx.lineWidth=2;ctx.stroke();
  if(d.t==='egg'){ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-r,0);ctx.lineTo(r,0);ctx.stroke();ctx.fillStyle='#fff';ctx.font=`900 ${r*.9}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('?',0,-r*.35);}
  else{
    ctx.fillStyle='#2A2320';[-1,1].forEach(a=>{ctx.beginPath();ctx.arc(a*r*.32,-r*.08,r*.1,0,7);ctx.fill();});
    if(d.t==='chick'){ctx.fillStyle='#E9643B';ctx.beginPath();ctx.moveTo(-r*.15,r*.15);ctx.lineTo(r*.15,r*.15);ctx.lineTo(0,r*.38);ctx.fill();}
    else{ctx.strokeStyle='#2A2320';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,r*.18,r*.16,.2,Math.PI-.2);ctx.stroke();}
    ctx.fillStyle='rgba(233,121,143,.45)';[-1,1].forEach(a=>{ctx.beginPath();ctx.arc(a*r*.55,r*.2,r*.13,0,7);ctx.fill();});
    if(d.t==='cat'){ctx.fillStyle='#D19A17';ctx.beginPath();ctx.arc(0,r*.75,r*.18,0,7);ctx.fill();}
  }
  ctx.fillStyle='#1F2B27';ctx.font=`800 ${Math.max(13,r*.42)}px Outfit,sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
  if(d.t!=='egg'){ctx.fillStyle='rgba(255,255,255,.85)';ctx.beginPath();ctx.arc(r*.72,r*.72,r*.3,0,7);ctx.fill();ctx.fillStyle='#1F2B27';ctx.fillText(d.v,r*.72,r*.74);}
  ctx.restore();
}
function drawClaw(x,y,open,lift){
  const R=A&&A.use&&A.use.big?REACH*1.5:REACH,s=1-lift*.25;
  ctx.save();ctx.translate(x,y);
  ctx.fillStyle='rgba(30,30,30,.18)';ctx.beginPath();ctx.arc(0,0,R*(1-lift*.3),0,7);ctx.fill();
  ctx.strokeStyle='#5C6470';ctx.lineWidth=4;ctx.setLineDash([6,6]);ctx.beginPath();ctx.arc(0,0,R,0,7);ctx.stroke();ctx.setLineDash([]);
  ctx.translate(0,-lift*26);ctx.scale(1+lift*.15,1+lift*.15);
  for(let k=0;k<3;k++){const a=-Math.PI/2+k*2*Math.PI/3;const o=open*R*.9+(1-open)*R*.35;
    ctx.strokeStyle='#8C93A3';ctx.lineWidth=7*s;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(Math.cos(a)*10,Math.sin(a)*10);ctx.lineTo(Math.cos(a)*o,Math.sin(a)*o);ctx.stroke();
    ctx.fillStyle='#5C6470';ctx.beginPath();ctx.arc(Math.cos(a)*o,Math.sin(a)*o,5,0,7);ctx.fill();}
  ctx.fillStyle='#C8432F';ctx.beginPath();ctx.arc(0,0,12,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-3,-3,3,0,7);ctx.fill();
  ctx.restore();
}
function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#FFF6EA';ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(229,143,160,.25)';ctx.lineWidth=1;for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}for(let y=0;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  ctx.fillStyle='#2A2320';ctx.fillRect(0,H-CHUTE,CHUTE,CHUTE);ctx.fillStyle='#F5C443';ctx.font='900 22px "Noto Sans TC",sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('出口',CHUTE/2,H-CHUTE/2);
  if(!S)return;
  S.dolls.forEach(d=>drawDoll(d,d.x,d.y));
  if(A&&S.phase==='turn'){
    let open=1,lift=1;
    if(A.phase==='drop'){lift=1-Math.min(1,A.t/.5);open=A.t>.5?1-(A.t-.5)/.2:1;}
    else if(A.phase==='lift'){lift=Math.min(1,A.t/.45);open=0;}
    else if(A.phase==='carry'){lift=1;open=0;}
    else if(A.phase==='result'){lift=1;open=1;}
    if(A.carry&&(A.phase==='lift'||A.phase==='carry'))drawDoll(A.carry,A.x,A.y-lift*26,1+lift*.1);
    if(['ready','x','x2','y','aix','aiy'].includes(A.phase)){ctx.strokeStyle='rgba(200,67,47,.35)';ctx.setLineDash([4,8]);ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(A.x,0);ctx.lineTo(A.x,H);ctx.moveTo(0,A.y);ctx.lineTo(W,A.y);ctx.stroke();ctx.setLineDash([]);}
    drawClaw(A.x,A.y,open,lift);
    if(A.phase==='result'&&A.msg){ctx.fillStyle='rgba(31,43,39,.85)';const w=Math.max(220,A.msg.length*26);ctx.fillRect(W/2-w/2,H/2-34,w,68);ctx.fillStyle='#F5C443';ctx.font='900 30px "Noto Sans TC",sans-serif';ctx.fillText(A.msg,W/2,H/2);}
  }
}
let lastT=0;
let lastPubT=0;
function loop(t){const dt=Math.min(.05,(t-lastT)/1000||0);lastT=t;const before=A&&A.phase;step(dt);draw();if(A&&A.phase!==before){renderDesk();NET.publish();}else if(NET.host&&A&&A.holding&&t-lastPubT>300){lastPubT=t;NET.publish();}updTimer();requestAnimationFrame(loop);}
function updTimer(){const el=$('#mtimer');if(!el)return;el.textContent=A&&S&&S.phase==='turn'?`${Math.ceil(A.timeLeft)}s`:'--';}

/* ================= view ================= */
const myTurn=()=>S&&S.phase==='turn'&&A&&!S.players[S.cur].ai&&$('#overlay').hidden&&(NET.client?!!A.local&&S.cur===NET.seat&&!UI.sent:!S.players[S.cur].remote);
function render(){

function renderDesk(){

    }else{
      const far=p.remote||NET.client;
      h+=`<div class="dhead"><h2>${p.ai||far?'對手出手':'換人中'}</h2><span class="pill soft">第 ${S.round} 輪</span></div><div class="think">${avatar(S.cur)}<div><b>${esc(p.name)}</b><div>${A.phase==='result'?esc(A.msg||''):p.ai?'瞄準中<span class="dots"></span>':far?(['ready','x','x2','y'].includes(A.phase)?'在自己的手機上瞄準<span class="dots"></span>':'爪子動作中…'):'等待交接裝置'}</div></div></div>`;
      if(p.cards.length)h+=`<div class="dnote">手上救援卡：${p.cards.map(c=>CARDS[c].n).join('、')}</div>`;
    }
  }else if(S.phase==='end'){
    h+=`<div class="dhead"><h2>打烊</h2><span class="pill">大師</span></div><div class="think">${avatar(S.winners[0])}<div><b>${S.winners.map(i=>esc(S.players[i].name)).join('、')}</b><div>總分 ${S.final[S.winners[0]].total}</div></div></div>
     <button class="passbtn" id="btnResult">再看一次結算</button>${NET.client?'':`<button class="confirm" id="btnAgain">再來一局 ${ICONS.arrow}</button>`}`;
  }else{
    h+=`<div class="dhead"><h2>準備開局</h2></div><div class="empty"><b>設定玩家後開始</b>2 到 6 人，可以混搭 AI。</div>`;
  }
  $('#desk').innerHTML=h+NET.barHTML();
}
function renderPlayers(){
  $('#players').innerHTML=S.players.map((p,i)=>`<div class="pl ${i===S.cur&&S.phase==='turn'?'cur':''}">${avatar(i)}<div style="min-width:0"><div class="nm">${esc(p.name)}${p.ai?'<span class="tag">AI</span>':''}</div>
    <div class="fig"><span>分數<b>${scoreOf(i)}</b></span><span>娃娃<b>${p.prizes.length}</b></span><span>碰倒<b>${p.knocks}</b></span></div>
    <div class="prize">${p.prizes.map(x=>`<span>${DOLLS[x.t].n}${x.t==='egg'?x.v:''}</span>`).join('')}${p.cards.map(c=>`<span style="background:var(--gold-bg)">${CARDS[c].n}</span>`).join('')}</div></div></div>`).join('');
}
function heroArt(){return `<svg viewBox="0 0 640 180" preserveAspectRatio="xMaxYMid slice" aria-hidden="true">

  <rect x="200" y="166" width="440" height="14" fill="#E2CFA8"/>
 </svg>`;}

/* ================= setup & rules ================= */
function showSetup(){
  clearTimeout(timer);A=null;
  const sv=lsGet(SAVE_KEY);
  openModal(`<div class="setup-art">${heroArt()}</div><h2>夾娃娃大師</h2><p class="sub">深夜的夾娃娃店，大家輪流投幣。按住按鈕讓爪子往右、再往後，放手就夾下去。對準中心才夾得起來，爪子碰到旁邊的娃娃還要扣分。</p>
   <div class="pitch"><div><b>手眼協調</b>按多久就移多遠，看準時機放手。</div><div><b>小的比較值錢</b>招財貓 6 分但很難夾，小雞好夾但只有 1 分。</div><div><b>手殘也能翻盤</b>墊底的人會拿到保夾、強力爪、慢動作等救援卡。</div></div>
   ${setupSeatsHTML(setupCfg,2,6)}
   <p class="note">多人共用一台裝置輪流夾，也可以開線上房間各自用手機夾。手機直接用手指按住按鈕，電腦可以按住空白鍵。</p>
   <div class="acts"><a class="btn ghost" href="${LOBBY}">← 回大廳</a><button class="btn" data-m="rules">先看規則</button>${NET.setupBtns()}${sv&&sv.phase==='turn'?'<button class="btn" data-m="resume">繼續上一局</button>':''}<button class="btn primary" data-m="start">開始遊戲</button></div>`,
  m=>{
    if(setupSeatsHandle(setupCfg,m,showSetup))return;
    if(NET.setupHandle(m))return;
    if(m==='rules')showRules();
    else if(m==='resume')resumeGame(sv);
    else if(m==='start'){NET.leave();closeModal();SPEED=SPEEDS[setupCfg.speed];setupGame(seatsToPlayers(setupCfg,AI_NAMES));}
  });
}
function showRules(){showRulesHTML(`
  <p><b>目標：</b>${ROUNDS} 輪之後，娃娃分數減掉碰倒扣分最高的人獲勝。平手時碰倒比較少的人贏。</p>
  <h3>夾一次</h3>
  <ol><li>按住按鈕，爪子往右移；放開就停。</li><li>再按住，爪子往後移；放開就夾下去。</li>
  <li>第一次按下後有 ${TURN_SEC} 秒，時間到會直接夾下去。</li>
  <li>爪子中心離娃娃中心越近，越容易夾起來。大隻的娃娃比較好對準，但比較重，搬到出口的路上可能會掉。</li>
  <li>爪子的三根爪尖如果壓到旁邊的娃娃，每隻 −${KNOCK_PEN}，被碰到的娃娃會滾開。</li></ol>
  <h3>娃娃</h3>
  <table><tr><th>娃娃</th><th>分數</th><th>好不好夾</th></tr>${DK.map(k=>`<tr><td>${DOLLS[k].n}</td><td>${k==='egg'?'夾到才開，1–8':DOLLS[k].v}</td><td>${DOLLS[k].ease>=.9?'好夾':DOLLS[k].ease>=.75?'普通':'難夾'}${DOLLS[k].w>=1.2?'，很重':''}</td></tr>`).join('')}</table>
  <p>每輪開始時店長會補貨到 ${REFILL} 隻。</p>
  <h3>救援卡</h3>
  <p>從第 2 輪起，每輪開始時分數最低的人拿 1 張（手上最多 2 張）。開始移動前使用。</p>
  <ul>${CK.map(k=>`<li><b>${CARDS[k].n}：</b>${CARDS[k].d}</li>`).join('')}</ul>
  <h3>實體版原型做法</h3>
  <ul><li><b>機台：</b>鞋盒去掉蓋子，左下角剪一個 6 cm 見方的洞當出口，底下接一個紙杯。盒底鋪一層碎紙或棉花，讓娃娃不會亂滾。</li>
  <li><b>爪子：</b>兩支免洗筷用橡皮筋綁成夾子，前端黏上曬衣夾，或直接用料理夾。限制只能拿著筷子末端，難度剛好。</li>
  <li><b>娃娃：</b>扭蛋殼、毛球、橡皮擦、瓶蓋，貼上分數貼紙。小顆值錢、大顆便宜。</li>
  <li><b>計時：</b>手機計時 ${TURN_SEC} 秒；碰倒（讓別的娃娃翻面或掉出位置）就扣分。</li>
  <li><b>量產版：</b>瓦楞紙盒內襯一張印好格線的底板、塑膠夾爪一支、20 個軟膠公仔、6 種救援卡各 2 張，可裝進標準中盒。</li></ul>`);}

/* ================= input ================= */
function isHoldTarget(e){return e.target.closest('#hold')||e.target===cv;}
document.addEventListener('pointerdown',e=>{if(!myTurn()||!isHoldTarget(e))return;e.preventDefault();press();renderDesk();});
document.addEventListener('pointerup',()=>{if(myTurn()&&A.holding){release();renderDesk();}});
document.addEventListener('pointercancel',()=>{if(myTurn()&&A.holding){release();renderDesk();}});
document.addEventListener('keydown',e=>{if(e.code==='Space'&&myTurn()&&!e.repeat&&$('#rulesOv').hidden){e.preventDefault();press();renderDesk();}});
document.addEventListener('keyup',e=>{if(e.code==='Space'&&myTurn()){e.preventDefault();release();renderDesk();}});
$('#desk').addEventListener('click',e=>{
  if(e.target.closest('#btnAgain')){setupGame(S.cfgPlayers);return;}
  if(e.target.closest('#btnResult')){endModal();return;}
  const b=e.target.closest('[data-card]');if(b&&myTurn()&&!b.disabled){if(NET.client){NET.send({t:'card',c:b.dataset.card});UI={sent:true};renderDesk();}else useCard(b.dataset.card);}
});
$('#desk').addEventListener('contextmenu',e=>{if(e.target.closest('#hold'))e.preventDefault();});
$('#btnRules').addEventListener('click',showRules);
$('#btnNew').addEventListener('click',()=>{if(NET.online){NET.confirmLeave();return;}if(S&&S.phase!=='end'&&S.phase!=='idle'){openModal(`<h2>放棄目前這局？</h2><p class="sub">目前的進度會被清除。</p><div class="acts"><button class="btn" data-m="no">繼續玩</button><button class="btn primary" data-m="yes">開新遊戲</button></div>`,m=>{if(m==='yes'){clearTimeout(timer);clearSave();showSetup();}else{closeModal();render();}});}else showSetup();});

/* ================= online ================= */
// The friend whose turn it is moves the claw on their own phone (no lag while holding),
// streams the position so everyone can watch, then sends the final spot. The host rolls the grab.
const AIMING=['ready','x','x2','y'];
let posT=0;
function clientStep(dt){
  const sp=moveSpeed()*dt;
  if(A.local){
    if(A.phase!=='ready'&&AIMING.includes(A.phase)){A.timeLeft-=dt;if(A.timeLeft<=0){A.timeLeft=0;startDrop();}}
    if(A.phase==='x'&&A.holding)A.x=Math.min(W-20,A.x+sp);
    if(A.phase==='y'&&A.holding)A.y=Math.max(20,A.y-sp);
    if(A.holding&&performance.now()-posT>300){posT=performance.now();NET.send({t:'pos',x:A.x,y:A.y});}
    if(A.phase==='drop'&&!A.sentAim){A.sentAim=true;NET.send({t:'aim',x:A.x,y:A.y});UI={sent:true};renderDesk();}
  }
  // replay the host's animation locally; the outcome always comes from the host
  if(A.phase==='aix')A.x=Math.min(A.tx,A.x+sp);
  if(A.phase==='aiy')A.y=Math.max(A.ty,A.y-sp);
  if(A.phase==='drop')A.t=Math.min(.7,A.t+dt);
  else if(A.phase==='lift')A.t=Math.min(.45,A.t+dt);
  else if(A.phase==='carry'&&A.from){const tx=CHUTE/2,ty=H-CHUTE/2;A.t+=dt*220/Math.max(60,A.len||60);const k=Math.min(1,A.t);A.x=A.from.x+(tx-A.from.x)*k;A.y=A.from.y+(ty-A.from.y)*k;}
}
function syncA(){
  const P=S.A;delete S.A;
  if(!P||S.phase!=='turn'){A=null;return;}
  const mine=S.cur===NET.seat&&!S.players[S.cur].ai;
  if(A&&A.key===P.key){
    if(A.local&&P.phase==='ready'&&(A.phase!=='drop'||UI.sent)){A.use=P.use;A.extra=P.extra;return;} // still aiming here
    if(A.phase===P.phase){if(!A.local&&AIMING.includes(P.phase)){A.x=P.x;A.y=P.y;}A.use=P.use;A.extra=P.extra;A.msg=P.msg;return;}
  }
  A={...P,t:0};
  if(mine&&P.phase==='ready'){A.local=true;A.timeLeft=TURN_SEC;}
}
function applyAct(i,a){
  if(S.phase!=='turn'||i!==S.cur||!A||S.players[i].ai)return;
  const x=Math.max(CHUTE/2,Math.min(W-20,+a.x||0)),y=Math.min(H-CHUTE/2,Math.max(20,+a.y||0));
  if(a.t==='card'&&A.phase==='ready'&&CARDS[a.c])useCard(a.c);
  else if(a.t==='pos'&&A.phase==='ready'){A.x=x;A.y=y;NET.publish();}
  else if(a.t==='aim'&&A.phase==='ready'){A.x=x;A.y=y;startDrop();render();}
}
async function resumeGame(sv){
  closeModal();SPEED=SPEEDS[setupCfg.speed];NET.leave();
  if(sv.online&&!(await NET.resumeHost(sv))){sv.players.forEach(p=>{if(p.remote){p.remote=false;p.ai=true;}});delete sv.online;}
  S=sv;startTurn();
}
const GAME={id:'claw-master',name:'夾娃娃大師',hostKey:'claw-net-host',clientKey:'claw-net-client',min:2,max:6,aiNames:AI_NAMES,
  secretHint:'輪到你時，爪子直接在你的手機上操作。',
  start(cfg){setupGame(cfg);},
  strip(pub){pub.A=A?JSON.parse(JSON.stringify(A)):null;},
  secret(){return null;},
  applySecret(){},
  waiting(){if(!S||S.phase!=='turn'||!A||S.players[S.cur].ai||!AIMING.includes(A.phase))return [];return [S.cur];},
  action(seat,a){applyAct(seat,a);},
  afterTakeover(ws){ws.forEach(i=>{S.cfgPlayers[i]={name:S.players[i].name,ai:true};});if(A&&A.phase==='ready'&&S.players[S.cur].ai){clearTimeout(timer);timer=setTimeout(aiPlan,500);}render();},
  resumeUI(){if(S.phase==='end')endModal();else render();},
  clientReset(prev){
    const pa=prev&&prev.A0,na=S.A;
    if(!prev||prev.gid!==S.gid||!pa!==!na||(pa&&na&&(pa.key!==na.key||pa.phase!==na.phase||JSON.stringify(pa.use)!==JSON.stringify(na.use)))||JSON.stringify(prev.players[NET.seat].cards)!==JSON.stringify(S.players[NET.seat].cards))UI={};
    S.A0=na?{key:na.key,phase:na.phase,use:na.use}:null;
    syncA();
  },
  clientModal(){if(S.phase==='end')return {key:'end'+S.gid,open:endModal};return null;},
};

/* ================= boot ================= */
window.__game={setupGame,setSpeed:v=>{SPEED=v;},get S(){return S;},get A(){return A;},press,release,step};
(function boot(){
  S={players:Array.from({length:3},()=>({name:'—',ai:true,prizes:[],knocks:0,cards:[]})),dolls:initDolls(),round:1,start:0,cur:0,phase:'idle',log:[]};
  render();showSetup();requestAnimationFrame(loop);
})();
</script>
