<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>財富自由之路</title>
<meta name="description" content="原創理財桌遊：從 22 歲玩到 62 歲，用有限的時間賺錢、學習、投資，讓被動收入蓋過支出，同時活得快樂。">
<meta name="theme-color" content="#1E5641">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="icon" href="../../icons/icon-192.png">
<link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="遊戲群島">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}.opt .jobpic{width:72px;height:72px;border-radius:12px;object-fit:cover;flex:none;margin-right:10px}
img.av{display:block;border-radius:50%;object-fit:cover}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Outfit:wght@600;700;800&display=swap">
<style>
/* Layout: illustrated life board — hero + market board + action spaces + market row on the left,
      a deep-green "next move" desk on the right, statement + player strip along the bottom. Single warm-paper look by design. */
:root{
  --paper:#F5EEE1; --paper2:#EFE6D4; --card:#FFFBF4; --ink:#1F2B27; --muted:#6E7068; --line:#E5D9C3; --line2:#D9CBB1;
  --green:#1E5641; --green2:#28704F; --green-ink:#F3F7EF; --yellow:#F5C443; --yellow-ink:#2A2310;
  --orange:#E9643B; --pink:#F7DDD3; --pink2:#EFC6B8; --up:#2C8F4E; --up-bg:#D5EEDA; --down:#C8432F; --down-bg:#F7DAD3; --flat-bg:#ECE5D7;
  --c0:#7A5AD3; --c1:#D7542B; --c2:#22987A; --c3:#D19A17; --c4:#2E7DC0;
  --p0:#E58FA0; --p1:#8B67D6; --p2:#4F9E61; --p3:#E0922F; --p4:#3E9CC4;
  --scrim:rgba(40,32,20,.45);
  --f-body:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
  --f-num:'Outfit','Noto Sans TC',system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55;font-weight:500}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
  background-image:radial-gradient(rgba(120,90,40,.07) 1px,transparent 1px);background-size:5px 5px}
.wrap{position:relative;z-index:1;max-width:1600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 28px}
h1,h2,h3,h4{text-wrap:balance;margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
svg{display:block}

/* ---------- header ---------- */
.top{display:flex;align-items:center;gap:14px 22px;flex-wrap:wrap;padding-block:6px 12px;border-bottom:1.5px solid var(--line2)}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit}
.brand svg{width:44px;height:44px;flex:none}
.brand h1{font-size:clamp(26px,3.4vw,38px);font-weight:900;letter-spacing:.06em;line-height:1}
.brand small{font-family:var(--f-num);font-size:12px;letter-spacing:.42em;color:var(--ink);font-weight:600;margin-left:6px}
.homelink{display:inline-flex;align-items:center;gap:6px;font-size:15px;font-weight:900;color:var(--ink);text-decoration:none;border:1.5px solid var(--ink);border-radius:12px;padding:7px 12px;background:var(--card)}.homelink svg{width:18px;height:18px}
.homelink:hover{color:var(--ink);border-color:var(--ink)}
.vsep{width:1.5px;align-self:stretch;background:var(--line2);margin-block:6px}
.steps{display:flex;align-items:center;flex:1;min-width:0;justify-content:center}
.step{font-family:var(--f-num);font-weight:700;font-size:15px;padding:5px 14px;border-radius:999px;border:1.5px solid var(--line2);background:var(--card);color:var(--ink);white-space:nowrap}
.step.done{color:var(--muted);background:var(--paper2)}
.step.now{background:var(--green);border-color:var(--green);color:var(--green-ink);font-size:17px;padding:6px 18px}
.link{flex:1;min-width:8px;max-width:56px;height:2px;background:repeating-linear-gradient(90deg,var(--line2) 0 4px,transparent 4px 8px);position:relative}
.link.done{background:var(--green)}
.tops{display:flex;gap:10px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--ink);background:var(--card);color:var(--ink);padding:8px 16px;border-radius:12px;cursor:pointer;font-weight:700;line-height:1.2;text-decoration:none}
.btn svg{width:18px;height:18px}
.btn:hover:not(:disabled){transform:translateY(-1px)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.dark{background:var(--green);border-color:var(--green);color:var(--green-ink)}
.btn.primary{background:var(--green);border-color:var(--green);color:var(--green-ink)}
.btn.ghost{background:transparent}

/* ---------- layout ---------- */
.board{display:grid;grid-template-columns:minmax(0,1fr) minmax(340px,430px);grid-template-areas:"hero desk" "main desk";grid-template-rows:auto 1fr;gap:14px 18px;margin-top:12px;align-items:start}
.hero{grid-area:hero;position:relative;min-height:150px;display:flex;align-items:center;overflow:hidden;border-radius:18px}
.hero-txt{position:relative;z-index:2;padding:8px 0 10px}
.eyebrow{display:flex;align-items:center;gap:12px;font-family:var(--f-num);font-weight:600;letter-spacing:.32em;font-size:13px}
.eyebrow::after{content:"";width:80px;height:1.5px;background:var(--ink)}
.hero h2{font-size:clamp(30px,4.2vw,52px);font-weight:900;letter-spacing:.03em;line-height:1.15;margin-top:6px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.swoosh{display:block;width:150px;height:14px;margin-top:-2px}
.qbadge{position:relative;font-size:17px;font-weight:900;border:2px solid var(--ink);border-radius:999px;padding:3px 14px;background:var(--card);letter-spacing:.04em}
.qbadge::after{content:"";position:absolute;right:-16px;top:-14px;width:22px;height:18px;
  background:linear-gradient(var(--orange),var(--orange)) 0 100%/3px 9px no-repeat,linear-gradient(var(--orange),var(--orange)) 9px 40%/3px 11px no-repeat,linear-gradient(var(--orange),var(--orange)) 18px 100%/3px 9px no-repeat;transform:rotate(18deg)}
.hero-art{position:absolute;right:0;top:0;bottom:0;width:min(62%,640px);z-index:1;
  -webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 28%);mask-image:linear-gradient(90deg,transparent 0%,#000 28%)}
.hero-art svg{width:100%;height:100%}
main{grid-area:main;min-width:0}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:1280px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* ---------- company card ---------- */
.co{--cc:var(--c0);position:relative;background:var(--card);border:1.5px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 2px 0 var(--line),0 8px 20px rgba(90,70,30,.07);min-width:0}
.co.pick{cursor:pointer;transition:transform .15s,box-shadow .15s}
.co.pick:hover{transform:translateY(-2px);box-shadow:0 2px 0 var(--line),0 14px 26px rgba(90,70,30,.12)}
.co.sel{border:3px solid var(--green);box-shadow:0 0 0 3px rgba(30,86,65,.12),0 12px 26px rgba(30,86,65,.18)}
.co .art{height:112px;position:relative;overflow:hidden}
.co .art svg{width:100%;height:100%}
.check{position:absolute;right:10px;top:10px;width:30px;height:30px;border-radius:50%;background:var(--green);display:grid;place-items:center;z-index:2;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.check svg{width:18px;height:18px}
.co .body{padding:12px 16px 14px;display:flex;flex-direction:column;gap:8px}
.cohead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.co h3{font-size:26px;font-weight:900;letter-spacing:.03em;line-height:1.1}
.tick{font-family:var(--f-num);font-size:12px;font-weight:800;letter-spacing:.06em;color:#fff;background:var(--cc);border-radius:999px;padding:2px 9px}
.sector{margin-left:auto;display:inline-flex;align-items:center;gap:5px;font-weight:700;font-size:14px}
.sector svg{width:20px;height:20px;color:var(--cc)}
.prow{display:flex;align-items:center;gap:12px}
.price{font-family:var(--f-num);font-size:38px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.delta{font-family:var(--f-num);font-weight:800;font-size:17px;border-radius:999px;padding:3px 12px;display:inline-flex;gap:4px;align-items:center}
.delta.up{background:var(--up-bg);color:var(--up)} .delta.down{background:var(--down-bg);color:var(--down)} .delta.flat{background:var(--flat-bg);color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);margin:2px 0 0}
.stats div{padding:0 10px;border-left:1.5px solid var(--line2)}
.stats div:first-child{padding-left:0;border-left:none}
.stats dt{font-size:12px;color:var(--muted);font-weight:500}
.stats dd{margin:0;font-family:var(--f-num);font-weight:800;font-size:19px;font-variant-numeric:tabular-nums}
.ceo{display:flex;align-items:center;gap:8px;font-size:14px;min-height:24px;flex-wrap:wrap}
.ceo .k{font-family:var(--f-num);font-weight:600;color:var(--muted)}
.ceo b{font-weight:900}
.emb{font-size:11px;font-weight:700;color:var(--down);background:var(--down-bg);border-radius:999px;padding:1px 8px}
.holdrow{display:flex;align-items:center;gap:10px}
.hold{flex:1;display:grid;grid-template-columns:repeat(10,1fr);gap:3px}
.cell{height:12px;border-radius:4px;background:var(--flat-bg)}
.cell.f{background:var(--pc)}
.hbadge{font-size:12px;font-weight:700;background:var(--paper2);border-radius:8px;padding:2px 8px;white-space:nowrap}
.hlist{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:12px;color:var(--muted);min-height:18px}
.hlist span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--pc);margin-right:4px}

/* ---------- feed ---------- */
.feed{background:transparent;padding:6px 6px 0;display:flex;flex-direction:column;min-width:0}
.feed h3{display:flex;align-items:center;gap:10px;font-size:24px;font-weight:900;padding-bottom:10px;border-bottom:1.5px solid var(--line2)}
.feed h3 svg{width:28px;height:28px;color:var(--orange)}
.feedlist{list-style:none;margin:0;padding:0;overflow:auto;max-height:300px}
.feedlist li{display:grid;grid-template-columns:auto 40px minmax(0,1fr);gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.qtag{font-family:var(--f-num);font-weight:700;font-size:12px;border:1.5px solid var(--line2);border-radius:6px;padding:1px 6px;background:var(--card)}
.feedlist .av{width:40px;height:40px}
.feedlist .txt{font-size:13.5px;line-height:1.45;min-width:0}
.feedlist .ic{width:40px;height:40px;border-radius:50%;background:var(--paper2);display:grid;place-items:center;color:var(--green)}
.feedlist .ic svg{width:20px;height:20px}
.feedlist li.q .txt{font-weight:900;color:var(--green)}
.feedlist li.k .txt{color:#8A4A12}
.pn{font-weight:900;color:var(--ink)}
.cn{font-weight:900}

/* ---------- desk (right panel) ---------- */
.desk{grid-area:desk;position:sticky;top:max(10px,env(safe-area-inset-top,0px));background:var(--green);color:var(--green-ink);border-radius:26px;padding:24px 24px 22px;overflow:hidden;display:flex;flex-direction:column;gap:14px;box-shadow:0 18px 40px rgba(20,60,45,.25)}
.desk .leaf{position:absolute;right:-30px;top:-20px;width:190px;height:190px;opacity:.9;pointer-events:none}
.desk>*{position:relative}
.dhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.dhead h2{font-size:clamp(28px,2.8vw,40px);font-weight:900;letter-spacing:.04em;line-height:1.1}
.pill{background:var(--orange);color:#fff;font-weight:900;border-radius:999px;padding:5px 14px;font-size:16px;white-space:nowrap}
.pill.soft{background:rgba(255,255,255,.16)}
.dsub{font-weight:700;font-size:16px;margin-top:-6px;opacity:.9}
.dlab{font-size:14px;opacity:.85;font-weight:700}
.target{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:-6px}
.target svg{width:30px;height:30px}
.target b{font-size:26px;font-weight:900;letter-spacing:.03em}
.target .vs{width:1.5px;height:24px;background:rgba(255,255,255,.4)}
.target .cur{font-weight:700;font-size:17px}
.target .cur span{font-family:var(--f-num);font-size:28px;font-weight:800;margin-left:6px}
.toggle{display:grid;grid-template-columns:1fr 1fr;border:2px solid rgba(255,255,255,.85);border-radius:12px;overflow:hidden}
.toggle button{border:none;background:transparent;color:var(--green-ink);font-weight:900;font-size:17px;padding:10px;cursor:pointer}
.toggle button.on{background:var(--card);color:var(--ink)}
.qrow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.qrow>span{font-weight:700;font-size:16px}
.stepper{display:grid;grid-template-columns:52px 1fr 52px;background:var(--yellow);border-radius:12px;min-width:220px;overflow:hidden}
.stepper button{border:none;background:rgba(255,255,255,.35);color:var(--yellow-ink);font-size:24px;font-weight:700;cursor:pointer;line-height:1;padding:8px 0}
.stepper button:disabled{opacity:.4;cursor:not-allowed}
.stepper b{display:grid;place-items:center;font-family:var(--f-num);font-weight:800;font-size:24px;color:var(--yellow-ink);background:#FBE7A6}
.est{margin:0;display:flex;flex-direction:column}
.est div{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px solid rgba(255,255,255,.22)}
.est div:first-child{border-top:none}
.est dt{font-weight:700;font-size:15px}
.est dd{margin:0;font-family:var(--f-num);font-weight:800;font-size:20px}
.dnote{font-size:13px;font-weight:700;background:rgba(255,255,255,.12);border-radius:10px;padding:7px 12px}
.dnote.warn{background:rgba(233,100,59,.28)}
.confirm{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:none;border-radius:16px;background:var(--yellow);color:var(--yellow-ink);font-size:24px;font-weight:900;padding:14px;cursor:pointer;box-shadow:0 4px 0 #C99A1E;letter-spacing:.06em}
.confirm svg{width:26px;height:26px}
.confirm:active:not(:disabled){transform:translateY(2px);box-shadow:0 2px 0 #C99A1E}
.confirm:disabled{opacity:.5;cursor:not-allowed}
.passbtn{width:100%;border:2px solid rgba(255,255,255,.85);background:transparent;color:var(--green-ink);border-radius:14px;font-weight:900;font-size:18px;padding:11px;cursor:pointer}
.passbtn:hover{background:rgba(255,255,255,.08)}
.empty{border:2px dashed rgba(255,255,255,.35);border-radius:16px;padding:22px 16px;text-align:center;font-weight:700;opacity:.92}
.empty b{display:block;font-size:20px;margin-bottom:4px}
.think{display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.1);border-radius:16px;padding:14px}
.think .av{width:56px;height:56px;flex:none}
.think b{font-size:20px}
.dots::after{content:"…";display:inline-block;animation:blink 1.1s steps(3) infinite}
@keyframes blink{0%{opacity:.2}50%{opacity:1}100%{opacity:.2}}
@media (prefers-reduced-motion:reduce){.dots::after{animation:none}.co.pick,.btn{transition:none}}

/* private intel card */
.intel{position:relative;background:var(--pink);color:var(--ink);border-radius:14px;padding:16px 18px 14px;transform:rotate(-1.2deg);box-shadow:0 6px 14px rgba(0,0,0,.18);margin-top:6px}
.intel::after{content:"";position:absolute;right:0;top:0;width:30px;height:30px;background:linear-gradient(225deg,var(--green) 50%,var(--pink2) 50%);border-bottom-left-radius:8px}
.intel .ilab{display:flex;align-items:center;gap:8px;font-weight:900;color:#B24A35;font-size:17px;padding-bottom:8px;border-bottom:1.5px solid var(--pink2)}
.intel .ilab svg{width:20px;height:20px}
.intel .ititle{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 0 6px;flex-wrap:wrap}
.intel h4{font-size:24px;font-weight:900;letter-spacing:.03em}
.intel .inote{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;font-size:13px;color:#5B4A40}
.stamp{border:1.5px solid #B24A35;color:#B24A35;border-radius:8px;padding:2px 10px;font-weight:900;font-size:13px;white-space:nowrap;transform:rotate(-3deg)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:14px;font-weight:900;padding:2px 10px;border-radius:8px;background:var(--flat-bg);color:var(--ink)}
.chip.up{background:var(--up-bg);color:var(--up)}
.chip.down{background:#E8573F;color:#fff}
.chip.sp{background:#F4D58A;color:#5A4210}

/* ---------- players strip ---------- */
.players{margin-top:18px;background:var(--card);border:1.5px solid var(--line);border-radius:20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));padding:8px;gap:6px;box-shadow:0 8px 20px rgba(90,70,30,.06)}
.pl{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:14px;position:relative;min-width:0}
.pl+.pl::before{content:"";position:absolute;left:-4px;top:16px;bottom:16px;width:1.5px;background:var(--line2)}
.pl.cur{background:var(--pink)}
.pl.cur::before,.pl.cur+.pl::before{display:none}
.pl .av{width:60px;height:60px;flex:none}
.pl .nm{font-size:19px;font-weight:900;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tag{font-size:11px;font-weight:700;border:1.5px solid var(--line2);border-radius:6px;padding:0 5px;color:var(--muted);background:var(--card)}
.pl .fig{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:13px;color:var(--muted)}
.pl .fig b{font-family:var(--f-num);font-weight:800;color:var(--ink);font-size:16px;margin-left:3px}
.pl .ceos{display:flex;gap:4px;margin-top:3px}
.pl .ceos i{font-style:normal;font-size:10px;font-weight:900;color:#fff;background:var(--cc);border-radius:5px;padding:0 5px;font-family:var(--f-num)}

/* ---------- responsive ---------- */
@media (max-width:1040px){
  .board{grid-template-columns:minmax(0,1fr);grid-template-areas:"hero" "desk" "main"}
  .desk{position:relative;top:0}
  .hero-art{width:70%;opacity:.55}
}
@media (max-width:640px){
  .cards{grid-template-columns:minmax(0,1fr)}
  .vsep{display:none}
  .steps{order:3;flex-basis:100%;justify-content:flex-start;overflow-x:auto;padding-bottom:2px}
  .step{padding:4px 10px;font-size:13px}.step.now{padding:5px 12px;font-size:15px}
  .brand small{display:none}
  .stepper{min-width:170px}
  .desk{padding:20px 18px;border-radius:22px}
  .co h3{font-size:23px}
}

/* ---------- modals ---------- */
.overlay{position:fixed;inset:0;background:var(--scrim);display:grid;place-items:center;z-index:50;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--card);color:var(--ink);border-radius:24px;border:1.5px solid var(--line);width:min(640px,100%);max-height:calc(100dvh - 32px);overflow:auto;padding:26px;box-shadow:0 30px 70px rgba(40,30,10,.3)}
.modal h2{font-size:28px;font-weight:900;margin-bottom:6px;letter-spacing:.03em}
.modal .sub{color:var(--muted);margin:0 0 16px}
.modal .acts{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:20px}
.modal .acts .btn{padding:10px 20px;font-size:16px}
.modal .intel{transform:none;margin-bottom:6px}
.modal .intel::after{background:linear-gradient(225deg,var(--card) 50%,var(--pink2) 50%)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;width:100%;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line2);background:var(--paper)}
.opt:hover:not(:disabled){border-color:var(--green);background:var(--card)}
.opt b{font-size:17px;font-weight:900}
.opt span{font-size:13px;color:var(--muted)}
.opt .go{font-weight:900;color:var(--green);font-size:14px;white-space:nowrap}
.evlist{display:grid;gap:8px}

function baseSal(p){const j=job(p);
  if(p.job==='sales')return 3+(p.lvl-1)*2+3;
  if(p.job==='creator')return 6+(p.lvl-1)+styleCount(p);
  return j.sal+(p.lvl-1)*j.inc;}
function otGain(p){return Math.floor(baseSal(p)/2)+(isBoom()?1:0);}
function rollSalary(p){
  if(p.job==='sales'){const r=d6();return {v:3+(p.lvl-1)*2+r+(isBoom()?2:0),r};}
  if(p.job==='creator'){const r=d6();return {v:3+r+(p.lvl-1)+styleCount(p),r};}
  return {v:baseSal(p),r:null};
}
const studyCost=p=>p.lvl>=MAX_LVL?3:3*(p.lvl+1);
const loanCap=p=>baseSal(p)*(p.job==='civil'?3:2);
function expenses(p){
  const j=job(p),rows=[];
  rows.push(['生活費',j.live+S.infl]);
  const st=p.style.reduce((a,k)=>a+STYLE[k].exp,0);if(st)rows.push(['生活風格',st]);
  if(p.married)rows.push(['家庭開銷',1]);
  if(p.kids)rows.push(['小孩',p.kids]);
  const mi=p.props.reduce((a,x)=>a+Math.floor(x.loan/10),0);if(mi)rows.push(['房貸利息',mi]);
  if(p.loan)rows.push(['信貸利息',Math.floor(p.loan/10)*2]);
  if(p.cc)rows.push(['卡債利息',Math.ceil(p.cc/10)*4]);
  const ins=Object.keys(INS).filter(k=>p.ins[k]&&!(k==='med'&&p.job==='nurse')).length;if(ins)rows.push(['保費',ins]);
  const fee=p.biz.reduce((a,b)=>a+(b.mgr?INV[b.c].fee:0),0);if(fee)rows.push(['經理費',fee]);
  if(p.policy)rows.push(['投資型保單',2]);
  if(p.care)rows.push(['照顧父母',p.care]);
  return {rows,total:rows.reduce((a,r)=>a+r[1],0)};
}
function passive(p,forSettle){
  const rows=[];
  if(p.bond)rows.push(['債券配息',p.bond]);
  if(p.fund)rows.push(['基金配息',p.fund]);
  if(p.reit)rows.push(['REITs 配息',p.reit]);
  const rent=p.props.reduce((a,x)=>a+((x.vac||x.occ)&&forSettle?0:INV[x.c].rent),0);if(rent)rows.push(['租金',rent]);
  const bz=p.biz.reduce((a,b)=>a+(b.mgr?b.inc:0),0);if(bz)rows.push(['小生意（請經理）',bz]);
  return {rows,total:rows.reduce((a,r)=>a+r[1],0)};
}
const activeBiz=p=>p.biz.reduce((a,b)=>a+(b.mgr?0:b.inc),0);
const selfManaging=p=>p.biz.some(b=>!b.mgr);
function netWorth(p,final){
  let v=p.cash+p.bond*10+p.fund*S.mkt+p.gro*S.gro+p.reit*reitP()+p.gold*S.gold;
  p.props.forEach(x=>{v+=propVal(x.c)-x.loan;});
  p.biz.forEach(b=>{const c=INV[b.c];v+=c.t==='pat'?(final?0:Math.floor(c.p/2)):Math.floor(c.p/2);});
  p.style.forEach(k=>{v+=STYLE[k].res||0;});
  p.recv.forEach(x=>{v+=x.amt;});
  if(p.policy)v+=p.policy.t===false?Math.floor(p.policy.paid/2):Math.floor(p.policy.paid*1.1);
  if(p.job==='teach')v+=4;
  v-=p.loan+p.cc;
  return v;
}
function assetClasses(p){return [p.bond>0,p.fund>0,p.gro>0,p.reit>0,p.gold>0,p.props.length>0,p.biz.some(b=>INV[b.c].t==='biz')].filter(Boolean).length;}
function dreamOK(p,id){
  switch(id){
    case 'early':return p.firstFree>0&&p.firstFree<=6;
    case 'land':return p.props.length>=3;
    case 'boss':return p.biz.filter(b=>INV[b.c].t==='biz').length>=2;
    case 'world':return p.travel>=2;
    case 'nodebt':return !p.loan&&!p.cc&&!p.props.some(x=>x.loan>0);
    case 'family':return p.married&&p.kids>=1;
    case 'master':return assetClasses(p)>=4;
    case 'give':return p.donated>=10;
  }return false;
}
function score(i){
  const p=S.players[i],nw=netWorth(p,true),ex=expenses(p).total,pa=passive(p).total;
  const free=pa>=ex;
  const dreams=p.dreams.map(id=>({id,ok:dreamOK(p,id)}));
  const r={nw,nwPts:Math.floor(nw/5),free:free?10:0,first:S.firstFree===i?3:0,happy:p.happy,
    dreamPts:dreams.reduce((a,d)=>a+(d.ok?DREAMS[DI[d.id]].pts:0),0),dreams,retire:nw<30?-8:0,bk:-10*p.bk};
  r.total=r.nwPts+r.free+r.first+r.happy+r.dreamPts+r.retire+r.bk;
  return r;
}

/* ================= placement rules ================= */
function spCap(sp){
  switch(sp){case 'study':case 'realty':case 'research':case 'opp':return 2;case 'startup':return 1;case 'broker':return NP();default:return 99;}
}
function spFull(sp,pi){const n=(S.occ[sp]||[]).length;if(sp==='opp'&&S.players[pi]&&S.players[pi].job==='design')return false;return n>=spCap(sp);}
function rowCards(t){return S.row.map((c,i)=>({c,i})).filter(x=>x.c!=null&&(Array.isArray(t)?t.includes(INV[x.c].t):INV[x.c].t===t));}
function canPlace(pi,sp){
  const p=S.players[pi];
  if(spFull(sp,pi))return {ok:false,why:'名額已滿'};
  switch(sp){
    case 'study':if(p.cash<studyCost(p))return {ok:false,why:`需要 $${studyCost(p)}`};if(p.lvl>=MAX_LVL&&p.know>=MAX_KNOW)return {ok:false,why:'已到頂'};break;
    case 'realty':if(p.know<1)return {ok:false,why:'需要知識 1'};if(!p.props.length&&!rowCards('prop').length)return {ok:false,why:'市場上沒有房子'};break;
    case 'startup':if(p.know<2)return {ok:false,why:'需要知識 2'};if(!rowCards(['biz','pat']).length)return {ok:false,why:'市場上沒有生意'};break;
    case 'research':if(S.np>=S.news.length)return {ok:false,why:'沒有新聞了'};break;
    case 'opp':if(!S.opp.some(o=>o))return {ok:false,why:'沒有機會卡'};break;
  }
  return {ok:true};
}
const ASSETS=[
  {k:'bond',n:'債券',price:()=>10,sell:()=>bondSell(),inc:'配息 1'},
  {k:'fund',n:'指數基金',price:()=>S.mkt,sell:()=>S.mkt,inc:'配息 1'},
  {k:'gro',n:'成長股',price:()=>S.gro,sell:()=>S.gro,inc:'不配息、波動大'},
  {k:'reit',n:'REITs',price:()=>reitP(),sell:()=>reitP(),inc:'配息 1、跟著房市'},
  {k:'gold',n:'黃金',price:()=>S.gold,sell:()=>S.gold,inc:'不配息、景氣差時漲'},
];
function brokerCalc(pi,d,first){
  const p=S.players[pi];let net=0,any=false,why=null;
  for(const a of ASSETS){const n=d[a.k]|0;if(!n)continue;any=true;
    if(n<0){if(-n>p[a.k]){why=`${a.n}持有不足`;}net+=(-n)*a.sell();}
    else{if(a.k==='gro'&&p.know<1&&p.job!=='eng')why='買成長股需要知識 1';net-=n*a.price();}}
  const fee=any&&!first?1:0;net-=fee;
  if(!any)why='還沒選要買賣什麼';
  else if(!why&&p.cash+net<0)why=`現金不足，還差 $${-(p.cash+net)}`;
  return {net,fee,ok:!why,why,after:p.cash+net};
}
function validArgs(pi,sp,a){
  const p=S.players[pi];a=a||{};
  switch(sp){
    case 'work':case 'study':case 'research':return {ok:true};
    case 'broker':{const first=!(S.occ.broker||[]).length;return brokerCalc(pi,a.d||{},first);}
    case 'realty':{
      if(a.mode==='sell'){const x=p.props[a.idx|0];return x?{ok:true}:{ok:false,why:'請選一間房子'};}
      const c=S.row[a.slot];if(c==null||INV[c].t!=='prop')return {ok:false,why:'請選一間房子'};
      const C=INV[c],L=a.loan|0,max=Math.floor(C.p*0.8/10)*10;
      if(p.know<C.k)return {ok:false,why:`需要知識 ${C.k}`};
      if(L<0||L>max||L%10)return {ok:false,why:'貸款金額不對'};
      if(L&&p.cc)return {ok:false,why:'有卡債不能辦房貸'};
      if(p.cash<C.p-L)return {ok:false,why:`頭期款不足，需要 $${C.p-L}`};
      return {ok:true,cost:C.p-L};}
    case 'startup':{const c=S.row[a.slot];if(c==null||!['biz','pat'].includes(INV[c].t))return {ok:false,why:'請選一間生意'};
      const C=INV[c];if(p.know<C.k)return {ok:false,why:`需要知識 ${C.k}`};if(p.cash<C.p)return {ok:false,why:`需要 $${C.p}`};return {ok:true};}
    case 'bank':{const L=a.loan|0;if(L<0||L%10)return {ok:false,why:'金額不對'};if(L&&p.cc)return {ok:false,why:'有卡債不能借信貸'};
      if(p.loan+L>loanCap(p))return {ok:false,why:`信貸上限 $${loanCap(p)}`};if(!L&&!!a.dca===p.dca)return {ok:false,why:'沒有任何變更'};return {ok:true};}
    case 'insure':{const ins=a.ins||{};const ch=Object.keys(INS).some(k=>!!ins[k]!==!!p.ins[k]);return ch?{ok:true}:{ok:false,why:'沒有任何變更'};}
    case 'opp':{const o=S.opp[a.slot];return o?{ok:true}:{ok:false,why:'請選一張機會卡'};}
    case 'leisure':{
      if(a.kind==='relax')return p.cash>=1?{ok:true}:{ok:false,why:'需要 $1'};
      if(a.kind==='donate')return p.cash>=5?{ok:true}:{ok:false,why:'需要 $5'};
      if(a.kind==='style'){const s=STYLE[a.item];if(!s)return {ok:false,why:'請選一項'};if(s.once&&p.style.includes(a.item))return {ok:false,why:'已經有了'};if(p.cash<s.cost)return {ok:false,why:`需要 $${s.cost}`};return {ok:true};}
      return {ok:false,why:'請選一項'};}
  }
  return {ok:false,why:'未知的行動'};
}

/* ================= paying & defaults ================= */
function liquid(p){return p.bond*7+Math.floor(p.fund*S.mkt*0.7)+Math.floor(p.gro*S.gro*0.7)+Math.floor(p.reit*reitP()*0.7)+Math.floor(p.gold*S.gold*0.7)+p.props.reduce((a,x)=>a+Math.max(0,Math.floor(propVal(x.c)*0.7)-x.loan),0);}
function panicSell(pi,need){
  const p=S.players[pi];let got=0;const sold=[];
  const order=[['bond',()=>7,'債券'],['reit',()=>Math.floor(reitP()*0.7),'REITs'],['fund',()=>Math.floor(S.mkt*0.7),'基金'],['gold',()=>Math.floor(S.gold*0.7),'黃金'],['gro',()=>Math.floor(S.gro*0.7),'成長股']];
  for(const [k,f,n] of order){let c=0;while(got<need&&p[k]>0){p[k]--;got+=f();c++;}if(c)sold.push(`${n}×${c}`);}
  while(got<need&&p.props.length){let bi=0,bv=1e9;p.props.forEach((x,i)=>{const v=Math.floor(propVal(x.c)*0.7)-x.loan;if(v>0&&v<bv){bv=v;bi=i;}});
    if(bv===1e9)break;const x=p.props.splice(bi,1)[0];got+=bv;sold.push(INV[x.c].n);}
  p.cash+=got;p.st.panic+=got?1:0;
  return {got,sold};
}
// pay amt; if short, owner chooses panic sale (70%) or credit-card debt
function pay(pi,amt,why,done){
  const p=S.players[pi];
  if(amt<=0)return done();
  if(p.cash>=amt){p.cash-=amt;return done();}
  const short=amt-p.cash;const liq=liquid(p);
  const finish=(mode)=>{
    if(mode==='sell'){const r=panicSell(pi,short);if(r.sold.length)log(`${pn(pi)} 現金不夠付${why}，7 折拋售 ${r.sold.join('、')}，拿到 $${r.got}`,'k');}
    if(p.cash>=amt){p.cash-=amt;}else{const d=amt-p.cash;p.cash=0;p.cc+=d;log(`${pn(pi)} 現金不夠付${why}，差額 $${d} 變成卡債（每 10 收 4 利息）`,'k');}
    done();
  };
  if(liq<=0)return finish('cc');
  askChoice(pi,{title:'現金不夠了',body:`${esc(p.name)} 要付${esc(why)} $${amt}，但只有 $${p.cash}，還差 $${short}。`,
    opts:[{l:'7 折拋售資產',d:`從債券、REITs、基金……依序賣到夠為止（可賣約 $${liq}）`},{l:'記成卡債',d:`欠 $${short}，每輪利息 ${Math.ceil((p.cc+short)/10)*4-Math.ceil(p.cc/10)*4}，有卡債就不能借房貸和信貸`}],
    tip:'手邊留一筆緊急預備金，遇到意外就不必被迫賤賣資產或欠高利卡債。',
    ai:()=>{const ccCost=Math.ceil((p.cc+short)/10)*4;return (p.cc+short>12||ccCost>=4&&liq>=short)?0:1;}},
    v=>finish(v===0?'sell':'cc'));
}
function bankrupt(pi){
  const p=S.players[pi];
  Object.assign(p,{cash:5,bond:0,fund:0,gro:0,reit:0,gold:0,props:[],biz:[],loan:0,cc:0,dca:false,policy:null,recv:[]});
  p.know=Math.min(MAX_KNOW,p.know+1);p.bk++;
  log(`${pn(pi)} 卡債超過 ${BANKRUPT_CC}，宣告破產重生：資產與負債全部清空，現金重設為 $5，知識 +1，扣 10 分`,'k');
}

/* ================= choices (AI / local / remote) ================= */
function askChoice(pi,spec,cb){
  const p=S.players[pi];
  if(SIM||p.ai){let v=0;try{v=spec.ai?spec.ai():0;}catch(e){v=0;}if(spec.opts[v]&&spec.opts[v].dis)v=spec.opts.findIndex(o=>!o.dis);return cb(Math.max(0,v));}
  if(p.remote)return NET.ask(pi,spec,cb);
  choiceModal(pi,spec,cb);
}
function seq(list,fn,done){let i=0;const next=()=>{if(i>=list.length)return done();const x=list[i++];fn(x,next);};next();}

/* ================= actions ================= */
const SPN=sp=>SPACES[SPI[sp]].n;
function doPlace(pi,sp,a){
  a=a||{};const p=S.players[pi];
  const first=!(S.occ[sp]||[]).length;
  (S.occ[sp]=S.occ[sp]||[]).push(pi);p.left--;
  const after=()=>{S.ti=(S.ti+1)%NP();UI.sp=null;UI.a={};UI.pending=false;proceed();};
  switch(sp){
    case 'work':{const g=otGain(p);p.ot++;const h=p.ot>=2?2:1;p.cash+=g;p.happy-=h;log(`${pn(pi)} 加班，賺 $${g}，幸福 −${h}`);break;}
    case 'study':{const c=studyCost(p);p.cash-=c;const up=p.lvl<MAX_LVL;if(up)p.lvl++;p.know=Math.min(MAX_KNOW,p.know+1);
      log(`${pn(pi)} 進修花 $${c}${up?`，升到 Lv${p.lvl}（薪水 $${baseSal(p)}）`:''}，知識 ${p.know}`);break;}
    case 'broker':{const d=a.d||{};const r=brokerCalc(pi,d,first);const parts=[];
      for(const as of ASSETS){const n=d[as.k]|0;if(n<0){p[as.k]+=n;p.cash+=(-n)*as.sell();parts.push(`賣 ${as.n}×${-n}`);}}
      for(const as of ASSETS){const n=d[as.k]|0;if(n>0){p[as.k]+=n;p.cash-=n*as.price();parts.push(`買 ${as.n}×${n}`);}}
      p.cash-=r.fee;p.st.fees+=r.fee;log(`${pn(pi)} 在證券行${parts.join('、')}${r.fee?'，手續費 $1':'（第一位免手續費）'}`);break;}
    case 'realty':{
      if(a.mode==='sell'){const x=p.props.splice(a.idx|0,1)[0];const v=propVal(x.c);p.cash+=v-x.loan;log(`${pn(pi)} 賣掉${INV[x.c].n}，成交 $${v}，還清房貸 $${x.loan}，拿回 $${v-x.loan}`);}
      else{const c=S.row[a.slot],C=INV[c],L=a.loan|0;S.row[a.slot]=null;p.cash-=C.p-L;p.props.push({c,loan:L});
        log(`${pn(pi)} 買下${C.n}（$${C.p}），頭期 $${C.p-L}${L?`、房貸 $${L}`:''}，每輪租金 ${C.rent}`);}
      break;}
    case 'startup':{const c=S.row[a.slot],C=INV[c];S.row[a.slot]=null;p.cash-=C.p;
      if(C.t==='pat'){p.biz.push({c,inc:C.inc,mgr:true});log(`${pn(pi)} 買下${C.n}，每輪收入 ${C.inc}`);break;}
      let r=d6();const bonus=C.food&&p.job==='chef'?1:0;const rr=Math.min(6,r+bonus);const inc=C.tiers[rr-1];
      if(!inc){p.know=Math.min(MAX_KNOW,p.know+1);log(`${pn(pi)} 開了${C.n}，擲出 ${r}${bonus?'+1':''}……倒閉了，損失 $${C.p}，但學到教訓（知識 +1）`,'k');}
      else{p.biz.push({c,inc,mgr:!!a.mgr});log(`${pn(pi)} 開了${C.n}，擲出 ${r}${bonus?'+1':''}，每輪收入 ${inc}（${a.mgr?`請經理，經理費 ${C.fee}，算被動收入`:'自己經營，下輪少 1 個時間棋'}）`);}
      break;}
    case 'bank':{const L=a.loan|0;if(L){p.loan+=L;p.cash+=L;}const dch=!!a.dca!==p.dca;p.dca=!!a.dca;
      log(`${pn(pi)} 到銀行${L?`借了信貸 $${L}（每 10 收 2）`:''}${L&&dch?'，':''}${dch?(p.dca?'開啟定期定額（每輪自動買 1 份基金）':'關閉定期定額'):''}`);break;}
    case 'insure':{const ins=a.ins||{};const on=[],off=[];Object.keys(INS).forEach(k=>{const v=!!ins[k];if(v!==!!p.ins[k]){(v?on:off).push(INS[k].n);p.ins[k]=v;}});
      log(`${pn(pi)} ${on.length?'投保 '+on.join('、'):''}${on.length&&off.length?'，':''}${off.length?'退保 '+off.join('、'):''}`);break;}
    case 'research':{p.peek={from:S.np,cards:[S.news[S.np],S.news[S.np+1]].filter(x=>x!=null)};p.know=Math.min(MAX_KNOW,p.know+1);
      log(`${pn(pi)} 到財經研究室做功課，知識 ${p.know}`);break;}
    case 'opp':{const o=S.opp[a.slot];S.opp[a.slot]=null;log(`${pn(pi)} 在機會市集拿了「${OPP[o.c].n}」`);
      if(!SIM)render();return runOpp(pi,o,after);}
    case 'leisure':{
      if(a.kind==='relax'){p.cash-=1;p.happy+=2;log(`${pn(pi)} 花 $1 好好休息，幸福 +2`);}
      else if(a.kind==='donate'){p.cash-=5;p.happy+=3;p.donated+=5;log(`${pn(pi)} 捐款 $5，幸福 +3`);}
      else{const s=STYLE[a.item];p.cash-=s.cost;p.happy+=s.h;if(s.trip)p.travel++;else p.style.push(a.item);
        log(`${pn(pi)} 買了${s.n}（$${s.cost}），幸福 +${s.h}${s.exp?`，之後每輪支出 +${s.exp}`:''}`);}
      break;}
  }
  after();
}
function repay(pi,kind,amt,idx){
  const p=S.players[pi];amt=amt|0;if(amt<=0||amt>p.cash)return false;
  if(kind==='cc'){if(amt>p.cc)return false;p.cc-=amt;}
  else if(kind==='loan'){if(amt>p.loan||(amt%10&&amt!==p.loan))return false;p.loan-=amt;}
  else if(kind==='mort'){const x=p.props[idx|0];if(!x||amt>x.loan||(amt%10&&amt!==x.loan))return false;x.loan-=amt;}
  else return false;
  p.cash-=amt;log(`${pn(pi)} 還款 $${amt}（${kind==='cc'?'卡債':kind==='loan'?'信貸':'房貸'}）`);return true;
}

/* ================= opportunity cards ================= */
function oppOptions(pi,def){
  const p=S.players[pi],c=p.cash,half=Math.floor(c/2);
  const amt=(l,v)=>({l,v,dis:v<=0||v>c,d:v>c?`現金不足`:''});
  switch(def.id){
    case 'robot':return [{l:'放棄',v:0},amt('投入 $5',5),amt('投入 $10',10),amt(`投入一半現金 $${half}`,half)];
    case 'lottery':return [{l:'放棄',v:0},amt('付 $2 手續費領獎',2)];
    case 'stockgrp':return [{l:'放棄',v:0},amt('付 $5 入會',5)];
    case 'mlm':return [{l:'放棄',v:0},amt('投入 $10',10)];
    case 'crypto':return [{l:'放棄',v:0},amt('投入 $2',2),amt('投入 $5',5),amt('投入 $10',10),amt(`投入一半現金 $${half}`,half)];
    case 'cafe':return [{l:'放棄',v:0},amt('投入 $8',8)];
    case 'lend':return [{l:'婉拒',v:0,d:'幸福 −1'},amt('借出 $5',5)];
    case 'esop':return [{l:'放棄',v:0},amt('付 $8 認股',8)];
    case 'fore':return [{l:'放棄',v:0},amt('付現 $18',18),{...amt('付現 $8＋房貸 $10',8),dis:c<8||p.cc>0,d:p.cc>0?'有卡債不能辦房貸':c<8?'現金不足':'房貸每輪利息 1'}];
    case 'policy':return [{l:'拒絕',v:0},{l:'簽約',v:1,d:'之後每輪付 2'}];
    case 'lecture':return [{l:'放棄',v:0},amt('付 $3 上課',3)];
    case 'usedcar':return [{l:'放棄',v:0},{...amt('付 $4 買車',4),dis:c<4||p.style.includes('car'),d:p.style.includes('car')?'已經有車了':''}];
  }return [{l:'放棄',v:0}];
}
function aiOpp(pi,def,o,opts){
  const p=S.players[pi],pers=p.pers,known=p.know>=2,buf=aiBuffer(p);
  const ok=i=>opts[i]&&!opts[i].dis;
  if(def.kind==='scam')return pers==='naive'&&Math.random()<0.6&&ok(1)?1:0;
  if(def.kind==='spec'){if(pers==='agg')return ok(2)&&p.cash-5>=buf?2:ok(1)?1:0;if(pers==='naive')return ok(4)?4:ok(1)?1:0;return p.cash-2>=buf+6&&ok(1)?1:0;}
  if(known&&o.t===false)return 0;
  const sure=known&&o.t;
  switch(def.id){
    case 'cafe':return ok(1)&&(p.cash-8>=buf*0.5)?1:0;
    case 'lend':return ok(1)&&(pers!=='cons'||sure)?1:0;
    case 'esop':return ok(1)&&(sure||S.gro>=10)&&p.cash-8>=buf*0.5?1:0;
    case 'fore':return ok(1)&&p.cash-18>=buf*0.5?1:ok(2)&&p.cash-8>=buf*0.5?2:0;
    case 'policy':return pers==='naive'?1:0;
    case 'lecture':return ok(1)&&p.know<4?1:0;
    case 'usedcar':return pers==='naive'&&ok(1)?1:0;
  }return 0;
}
function runOpp(pi,o,done){
  const p=S.players[pi],def=OPP[o.c],known=def.kind==='gen'&&p.know>=2;
  const opts=oppOptions(pi,def);
  askChoice(pi,{title:def.n,body:def.d,flags:def.flags,truth:known?o.t:null,unknown:def.kind==='gen'&&!known,opts:opts.map(x=>({l:x.l,d:x.d||'',dis:!!x.dis})),tip:def.tip,ai:()=>aiOpp(pi,def,o,opts),opp:true},v=>{
    const x=opts[v]||opts[0];const amt=x.v|0;
    if(!amt&&def.id!=='policy'){if(def.id==='lend'){p.happy-=1;log(`${pn(pi)} 婉拒了親戚，幸福 −1`);}else log(`${pn(pi)} 放棄了「${def.n}」`);return done();}
    switch(def.id){
      case 'robot':case 'lottery':case 'stockgrp':case 'mlm':p.cash-=amt;p.st.scam+=amt;log(`${pn(pi)} 投入 $${amt}……「${def.n}」是詐騙，錢全部飛了`,'k');break;
      case 'crypto':{p.cash-=amt;const r=d6();const m=r<=3?0:r<=5?2:4;p.cash+=amt*m;log(`${pn(pi)} 投入 $${amt} 買加密幣，擲出 ${r}：${m?`變成 $${amt*m}`:'歸零'}`,m?'':'k');break;}
      case 'cafe':p.cash-=8;if(o.t){p.biz.push({c:CAFE,inc:3,mgr:true});log(`${pn(pi)} 和朋友合開咖啡廳成功，每輪被動收入 3`);}else{p.cash+=2;log(`${pn(pi)} 合開的咖啡廳經營不善，只拿回 $2`,'k');}break;
      case 'lend':p.cash-=5;if(o.t){p.recv.push({r:S.r+3,amt:7});log(`${pn(pi)} 借給親戚 $5，約好 3 輪後還 $7`);}else{p.happy+=2;log(`${pn(pi)} 借給親戚 $5，錢要不回來了，但幸福 +2`);}break;
      case 'esop':p.cash-=8;if(o.t){p.gro++;log(`${pn(pi)} 員工認股，用 $8 拿到 1 股成長股（市價 $${S.gro}）`);}else{p.st.scam+=8;log(`${pn(pi)} 員工認股後公司下市，$8 歸零`,'k');}break;
      case 'fore':{const L=v===2?10:0;p.cash-=18-L;p.props.push({c:FORECLOSE,loan:L,occ:!o.t});log(`${pn(pi)} 買下法拍公寓（市價 30）${L?'，房貸 $10':''}${o.t?'':'，但裡面有占用戶，這輪收不到租'}`,o.t?'':'k');break;}
      case 'policy':if(v===1){p.policy={paid:0,t:o.t};log(`${pn(pi)} 簽了投資型保單，之後每輪付 2`);}else log(`${pn(pi)} 拒絕了保單推銷`);break;
      case 'lecture':p.cash-=3;if(o.t){p.know=Math.min(MAX_KNOW,p.know+2);log(`${pn(pi)} 上了扎實的財商課，知識 +2`);}else log(`${pn(pi)} 上的財商講座只是推銷課，白花 $3`,'k');break;
      case 'usedcar':p.cash-=4;p.style.push('car');p.happy+=4;if(!o.t){log(`${pn(pi)} 買到泡水車，還得付 $3 修理`,'k');return pay(pi,3,'修車費',done);}log(`${pn(pi)} 用 $4 買到便宜二手車，幸福 +4，之後每輪支出 +1`);break;
    }
    done();
  });
}

/* ================= game flow ================= */
function newPlayer(i,c,jobs,dreams){

    job:null,jobOpts:jobs,lvl:1,cash:0,know:1,happy:3,bond:0,fund:0,gro:0,reit:0,gold:0,props:[],biz:[],
    ins:{med:false,acc:false,prop:false,life:false},style:[],kids:0,married:false,cc:0,loan:0,dca:false,
    badge:false,firstFree:0,quit:false,bk:0,dreams:[],dreamOpts:dreams,left:0,peek:null,travel:0,donated:0,recv:[],policy:null,
    unemp:false,laid:false,care:0,ot:0,cf:0,hist:[],picked:false,st:{scam:0,ccInt:0,ins:0,fees:0,panic:0}};
}
function setupGame(cfg){

  const players=cfg.map((c,i)=>{const jobs=[jobDeck[(i*2)%8],jobDeck[(i*2+1)%8]];const ds=shuffle(DREAMS.map(d=>d.id)).slice(0,3);return newPlayer(i,c,jobs,ds);});
  S={players,r:0,pos:7,mkt:10,gro:10,house:0,gold:10,infl:0,news:shuffle(NEWS_DEF.map((_,i)=>i)),np:0,inv:invDeck,row:[],oppDeck,opp:[],
     log:[],firstFree:null,phase:'pick',viewer:null,cfg,dl:{mkt:0,gro:0,house:0,gold:0},curNews:null,occ:{},order:players.map((_,i)=>i),ti:0,evRes:[],setRes:[],cur:null,await:null,evDeck:[]};
  for(let i=0;i<5;i++)S.row.push(S.inv.pop());
  for(let i=0;i<2;i++)S.opp.push({c:S.oppDeck.pop(),t:Math.random()<0.7});
  const hs=humans();S.viewer=hs.length===1?hs[0].id:null;

function applyPick(pi,jid,dreams){
  const p=S.players[pi];if(!p.jobOpts.includes(jid))jid=p.jobOpts[0];
  dreams=(dreams||[]).filter(d=>p.dreamOpts.includes(d));if(dreams.length!==2)dreams=p.dreamOpts.slice(0,2);
  p.job=jid;p.dreams=dreams;p.cash=job(p).cash;p.know=job(p).know||1;p.picked=true;if(jid==='nurse')p.ins.med=true;
}
function aiPick(pi){const p=S.players[pi];if(window.__wrRJ){applyPick(pi,p.jobOpts[Math.random()*2|0],shuffle(p.dreamOpts.slice()).slice(0,2));return;}const sc=id=>{const j=JOBS[JI[id]];return j.sal-j.live+j.cash*0.3+j.inc*1.5+(id==='sales'?3:0)+(id==='creator'?2:0)+Math.random()*2;};
  const jid=sc(p.jobOpts[0])>=sc(p.jobOpts[1])?p.jobOpts[0]:p.jobOpts[1];applyPick(pi,jid,shuffle(p.dreamOpts.slice()).slice(0,2));}
function pickPhase(){
  S.phase='pick';
  seq(S.players.map((_,i)=>i),(pi,next)=>{
    const p=S.players[pi];if(p.picked)return next();
    if(SIM||p.ai){aiPick(pi);return next();}
    if(p.remote)return NET.askPick(pi,next);
    const go=()=>{S.viewer=pi;render();pickModal(pi,next);};
    if(humans().length>1){S.viewer=null;render();handoff(pi,'選擇你的職業和人生夢想',go);}else go();
  },()=>{S.players.forEach((p,i)=>log(`${pn(i)} 成為${job(p).n}，起始現金 $${p.cash}，薪水 $${baseSal(p)}，生活費 ${job(p).live}`));
    const hs=humans();S.viewer=hs.length===1?hs[0].id:null;startRound();});
}
function workersFor(p){return Math.max(1,BASE_W+(p.badge?1:0)+(p.quit?1:0)-(p.happy<0?1:0)-(selfManaging(p)?1:0));}
function startRound(){
  S.r++;S.occ={};S.await=null;
  S.players.forEach(p=>{p.ot=0;p.unemp=false;p.laid=false;p.props.forEach(x=>{x.vac=false;});});
  // order: lowest cash flow last round goes first
  if(S.r===1){const s=Math.random()*NP()|0;S.order=S.players.map((_,i)=>(s+i)%NP());}
  else S.order=S.players.map((_,i)=>i).sort((a,b)=>S.players[a].cf-S.players[b].cf||((a-S.r+NP()*9)%NP())-((b-S.r+NP()*9)%NP()));
  S.players.forEach(p=>{p.left=workersFor(p);});
  // news
  const before={mkt:S.mkt,gro:S.gro,house:S.house,gold:S.gold};
  const nd=NEWS_DEF[S.news[S.np++]];
  if(nd.swan)S.pos=S.pos<6?6:S.pos;else S.pos=(S.pos+nd.mv)%8;
  const z=zone();
  S.mkt=clamp(S.mkt+z.mkt,RANGE.mkt);S.gro=clamp(S.gro+z.gro,RANGE.gro);S.house=clamp(S.house+z.house,RANGE.house);S.gold=clamp(S.gold+z.gold,RANGE.gold);
  S.dl={mkt:S.mkt-before.mkt,gro:S.gro-before.gro,house:S.house-before.house,gold:S.gold-before.gold};
  S.curNews={n:nd.n,mv:nd.mv,swan:!!nd.swan,zone:z.n,pos:S.pos};
  const unemp=[];
  if(isDep()){S.players.forEach((p,i)=>{if(p.job!=='civil'&&!p.quit&&d6()===1){p.unemp=true;unemp.push(i);}p.props.forEach(x=>{if(INV[x.c].shop&&d6()<=2)x.vac=true;});});}
  S.curNews.unemp=unemp;
  log(`第 ${S.r} 輪（${ageOf(S.r)} 歲）新聞：「${nd.n}」，景氣${nd.swan?'直接跌到':'來到'}${z.n}`,'q');
  unemp.forEach(i=>log(`${pn(i)} 在蕭條中失業，這輪領不到薪水`,'k'));
  S.phase='action';S.ti=0;
  if(SIM)return proceed();
  render();
  if(humans().length)roundModal();else timer=setTimeout(proceed,SPEED);
}
function proceed(){
  clearTimeout(timer);
  if(S.phase!=='action')return;
  let pi=-1;
  for(let k=0;k<NP();k++){const idx=(S.ti+k)%NP();const q=S.order[idx];if(S.players[q].left>0){pi=q;S.ti=idx;break;}}
  if(pi<0)return eventPhase();
  S.cur=pi;S.await=null;UI.sp=null;UI.a={};
  if(SIM){aiTurn(pi);return;}
  save();
  const p=S.players[pi],multi=humans().length>1;
  if(p.ai){if(multi)S.viewer=null;render();timer=setTimeout(()=>aiTurn(pi),SPEED);}
  else if(p.remote){S.await={type:'act',seat:pi};render();}
  else if(multi&&S.viewer!==pi){S.viewer=null;render();handoff(pi,'輪到你放時間棋',()=>{S.viewer=pi;render();});}
  else render();
}
function eventPhase(){
  S.phase='event';S.evDone=false;S.evRes=[];S.cur=null;S.await=null;if(humans().length>1)S.viewer=null;
  S.evDraw=[];
  if(!SIM){log('人生事件：每個人抽一張','q');render();}
  seq(S.order.slice(),(pi,next)=>{
    if(!S.evDeck.length)S.evDeck=shuffle(EVENTS.map((_,i)=>i));
    const ei=S.evDeck.pop();S.evDraw[pi]=ei;const E=EVENTS[ei];
    E.f(pi,()=>{log(`${pn(pi)}【${E.cat}】${E.n}：${S.evRes[pi]||''}`);next();});
  },()=>{
    S.evDone=true;
    if(SIM)return settlePhase();
    render();
    if(humans().length)eventsModal();else timer=setTimeout(settlePhase,SPEED*2);
  });
}
function settlePhase(){
  S.phase='settle';S.setDone=false;S.setRes=[];S.await=null;
  seq(S.order.slice(),(pi,next)=>{
    const p=S.players[pi];
    const sal=(p.unemp||p.laid||p.quit)?{v:0,r:null}:rollSalary(p);
    const pa=passive(p,true),ab=activeBiz(p),fam=p.married?2:0;
    const income=sal.v+pa.total+ab+fam;
    const ex=expenses(p);
    p.st.ccInt+=p.cc?Math.ceil(p.cc/10)*4:0;
    p.cash+=income;
    const cash0=p.cash-income;
    pay(pi,ex.total,'這輪支出',()=>{
      const got=[];
      p.recv=p.recv.filter(x=>{if(x.r<=S.r){p.cash+=x.amt;got.push(x.amt);return false;}return true;});
      if(p.kids)p.happy+=p.kids;
      if(p.policy)p.policy.paid+=2;
      if(p.careLeft){p.careLeft--;if(!p.careLeft)p.care=0;}
      let dca=false;if(p.dca&&p.cash>=S.mkt){p.cash-=S.mkt;p.fund++;dca=true;}
      p.cf=income-ex.total;
      p.props.forEach(x=>{x.occ=false;});
      S.setRes[pi]={sal:sal.v,roll:sal.r,unemp:p.unemp,laid:p.laid,pa:pa.total,ab,fam,income,ex:ex.total,cf:income-ex.total,dca,got,cash0,cash:p.cash};
      log(`${pn(pi)} 結算：收入 $${income}、支出 $${ex.total}，現金流 ${income-ex.total>=0?'+':''}${income-ex.total}${dca?`，定期定額買進 1 份基金（$${S.mkt}）`:''}`);
      next();
    });
  },()=>{
    if(INFL_ROUNDS.includes(S.r)){S.infl++;log(`通膨來了：所有人生活費 +1（累計 +${S.infl}）`,'k');}
    const newly=[];
    S.players.forEach((p,i)=>{
      const free=passive(p).total>=expenses(p).total;
      if(free&&!p.badge){p.badge=true;if(!p.firstFree)p.firstFree=S.r;if(S.firstFree==null)S.firstFree=i;newly.push(i);log(`${pn(i)} 達成財務自由！被動收入 $${passive(p).total} ≥ 支出 $${expenses(p).total}，之後每輪多 1 個時間棋`,'k');}
      else if(!free&&p.badge){p.badge=false;log(`${pn(i)} 的被動收入跌回支出以下，財務自由徽章失效`,'k');}
      S.setRes[i].free=free;
      if(p.cc>BANKRUPT_CC)bankrupt(i);
    });
    seq(newly.filter(i=>!S.players[i].quit&&S.r<ROUNDS),(pi,next)=>{
      const p=S.players[pi],pa=passive(p).total,ex=expenses(p).total;
      askChoice(pi,{title:'財務自由了！要辭職嗎？',body:`${esc(p.name)} 的被動收入 $${pa}，支出 $${ex}。辭職後不再領薪水 $${baseSal(p)}，但每輪再多 1 個時間棋。辭職後不能再回去上班。`,
        opts:[{l:'繼續上班',d:'薪水照領，比較保險'},{l:'辭職',d:'多 1 個時間棋，但收入只剩被動收入'}],tip:'財務自由不代表一定要辭職，被動收入要比支出多一段安全距離才穩。',ai:()=>pa>=ex+4?1:0},
      v=>{if(v===1){p.quit=true;log(`${pn(pi)} 辭職了，從此靠被動收入生活`,'k');}next();});
    },()=>{
      // refresh markets: oldest card leaves, refill
      if(S.row[0]!=null)S.row[0]=null;S.row=S.row.filter(c=>c!=null);while(S.row.length<5&&S.inv.length)S.row.push(S.inv.pop());while(S.row.length<5)S.row.push(null);
      if(S.opp[0])S.opp[0]=null;S.opp=S.opp.filter(o=>o);while(S.opp.length<2&&S.oppDeck.length)S.opp.push({c:S.oppDeck.pop(),t:Math.random()<0.7});while(S.opp.length<2)S.opp.push(null);
      S.players.forEach(p=>p.hist.push(netWorth(p)));
      S.setDone=true;
      if(SIM)return endRound();
      render();
      if(humans().length)settleModal();else timer=setTimeout(endRound,SPEED*2);
    });
  });
}
function endRound(){if(!SIM)closeModal();if(S.r>=ROUNDS)endGame();else startRound();}

/* ================= AI ================= */
function aiBuffer(p){return expenses(p).total+({cons:6,bal:3,agg:1,naive:0}[p.pers]||3);}
function peekBad(p){if(!p.peek)return false;const up=p.peek.cards.filter((_,k)=>p.peek.from+k>=S.np);if(!up.length)return false;
  let pos=S.pos;const n=NEWS_DEF[up[0]];if(n.swan)pos=pos<6?6:pos;else pos=(pos+n.mv)%8;return (pos>>1)>=2;}
function peekGood(p){if(!p.peek)return false;const up=p.peek.cards.filter((_,k)=>p.peek.from+k>=S.np);if(!up.length)return false;
  let pos=S.pos;const n=NEWS_DEF[up[0]];if(n.swan)return false;pos=(pos+n.mv)%8;return (pos>>1)<=1;}
function aiRepay(pi){
  const p=S.players[pi],buf=aiBuffer(p);
  if(p.cc&&p.cash>0)repay(pi,'cc',Math.min(p.cc,p.cash));
  while(p.loan>=10&&p.cash-10>=buf+4)repay(pi,'loan',10);
}
function aiTurn(pi){
  const p=S.players[pi];
  aiRepay(pi);
  const c=aiChoose(pi);
  doPlace(pi,c.sp,c.a);
}
function aiChoose(pi){
  const p=S.players[pi],pers=p.pers,buf=aiBuffer(p),left=ROUNDS-S.r+1,cands=[];
  const add=(sp,a,s)=>{if(!canPlace(pi,sp).ok)return;if(!validArgs(pi,sp,a).ok)return;cands.push({sp,a,s:s+Math.random()*0.8});};
  const bad=peekBad(p),good=peekGood(p);
  // work
  add('work',{},otGain(p)-(p.ot?2.5:1.3)-(p.happy<=1?2:0));
  // study
  if(p.lvl<MAX_LVL){const gain=job(p).inc*(left-0.5)-studyCost(p);const room=p.cash-studyCost(p);add('study',{},room>=0?gain*0.6+(p.know<2?1.5:0.5)-(room<buf*0.4?2:0):-9);}
  else if(p.know<3)add('study',{},1.2);
  // research
  add('research',{},pers==='naive'?0.3:(p.know<2?3.2:1.4)+(left>2?0.6:0)+(pers==='bal'?0.6:0));
  // broker
  {const d={};const excess=p.cash-buf;let s=0;
    if(bad&&(pers==='bal'||pers==='agg'||pers==='cons')&&p.gro>0){d.gro=-p.gro;s+=4+p.gro;}
    if(good&&p.gold>0){d.gold=-p.gold;s+=2;}
    if(excess>=8){let money=excess-(S.occ.broker&&S.occ.broker.length?1:0);
      const pref=bad?(pers==='naive'?['gro']:['bond','gold']):pers==='cons'?['bond','fund','reit']:pers==='bal'?['fund','reit','bond']:pers==='agg'?(p.know>=1||p.job==='eng'?['gro','fund']:['fund']):['gro','fund'];
      const usable=pref.filter(k=>!(k==='gro'&&p.know<1&&p.job!=='eng'));
      let k=0;let guard=0;while(usable.length&&guard++<20){const as=ASSETS.find(a=>a.k===usable[k%usable.length]);if(money<as.price())break;d[as.k]=(d[as.k]||0)+1;money-=as.price();k++;}
      const bought=Object.values(d).filter(v=>v>0).reduce((a,v)=>a+v,0);s+=bought*2.2+(left<=1?-1:0);}
    if(Object.keys(d).length)add('broker',{d},s);}
  // realty
  if(p.know>=1){rowCards('prop').forEach(({c,i})=>{const C=INV[c];if(p.know<C.k)return;const max=p.cc?0:Math.floor(C.p*0.8/10)*10;
    let L=max;if(pers==='cons'){while(L>0&&p.cash-(C.p-(L-10))>=buf)L-=10;}
    const down=C.p-L;if(p.cash-down<buf*0.4)return;const net=C.rent-Math.floor(L/10);
    add('realty',{mode:'buy',slot:i,loan:L},net*left*0.75+(p.dreams.includes('land')?3:0)+(bad?-2:0)+(left<=1?-4:0)+(isDep()?1.5:0));});}
  // startup
  if(p.know>=2){rowCards(['biz','pat']).forEach(({c,i})=>{const C=INV[c];if(p.know<C.k||p.cash-C.p<buf*0.4)return;
    if(C.t==='pat'){add('startup',{slot:i,mgr:true},(C.inc*left-C.p)*0.6);return;}
    const ev=C.tiers.reduce((a,v,k)=>a+C.tiers[Math.min(5,k+(C.food&&p.job==='chef'?1:0))],0)/6;
    add('startup',{slot:i,mgr:true},(ev-C.fee)*left*0.65-C.p*0.35+(p.dreams.includes('boss')?3:0)+(pers==='agg'?1:pers==='cons'?-1:0));});}
  // bank

        <div class="frow"><div class="fl"><b>定期定額</b><span>每輪結算自動用大盤價買 1 份指數基金，免手續費</span></div><div class="sw"><button data-dca="1" class="${a.dca?'on':''}">開</button><button data-dca="0" class="${a.dca?'':'on'}">關</button></div></div>`;

      const n=Object.keys(INS).filter(k=>a.ins[k]&&!(k==='med'&&p.job==='nurse')).length;sum=`之後每輪保費 <b>$${n}</b>`;break;}

      sum='拿到卡後再決定要不要做';break;}

function chartSVG(){
  const W=600,H=220,pad=34,n=ROUNDS;const all=S.players.flatMap(p=>p.hist);const mx=Math.max(20,...all),mn=Math.min(0,...all);
  const X=i=>pad+i*(W-pad-12)/(n-1),Y=v=>H-24-(v-mn)/(mx-mn)*(H-44);
  const cols=['var(--p0)','var(--p1)','var(--p2)','var(--p3)','var(--p4)'];
  const grid=[0,0.25,0.5,0.75,1].map(t=>{const v=Math.round(mn+(mx-mn)*t);return `<line x1="${pad}" x2="${W-12}" y1="${Y(v)}" y2="${Y(v)}" stroke="#E5D9C3"/><text x="${pad-6}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="#6E7068">${v}</text>`;}).join('');
  const xs=Array.from({length:n},(_,i)=>`<text x="${X(i)}" y="${H-6}" text-anchor="middle" font-size="11" fill="#6E7068">${ageOf(i+1)}</text>`).join('');

  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="每位玩家的淨資產變化">${grid}${xs}${lines}</svg><div class="chips" style="margin-top:4px">${S.players.map((p,k)=>`<span class="chip" style="background:${cols[k]};color:#fff">${esc(p.name)}</span>`).join('')}</div>`;

const NET_HOST_KEY='wealthroad-net-host', NET_CLIENT_KEY='wealthroad-net-client';

// host-side prompts for remote players (choices and the opening job/dream pick)
Object.assign(NET,{pending:null,pendingPick:null,askId:0,curT:{},newsSeen:0,
  ask(pi,spec,cb){
    const id=++this.askId;this.pending={id,seat:pi,cb,spec};
    if(spec.truth!=null)this.curT[pi]={id,t:spec.truth};
    S.await={type:'choice',seat:pi,id,title:spec.title,body:spec.body,flags:spec.flags||[],unknown:!!spec.unknown,opts:spec.opts,tip:spec.tip||'',opp:!!spec.opp};
    render();
  },
  askPick(pi,next){this.pendingPick={seat:pi,next};S.await={type:'pick',seat:pi};render();},
  resolveChoice(v){const P=this.pending;if(!P)return;this.pending=null;delete this.curT[P.seat];S.await=null;P.cb(v);if(!SIM)render();},
});
const GAME={id:GAME_ID,name:'財富自由之路',hostKey:NET_HOST_KEY,clientKey:NET_CLIENT_KEY,min:2,max:5,aiNames:AI_NAMES,
  secretHint:'每個人的夢想和研究情報只會出現在自己的手機上。',
  start(cfg){cfg.forEach((c,i)=>{if(c.ai&&!c.pers)c.pers=AI_PERS[(i+3)%4];});setupGame(cfg);S.online={code:NET.code};save();},
  onLeave(){Object.assign(NET,{pending:null,pendingPick:null,curT:{},newsSeen:0});},
  strip(pub){delete pub.cfg;delete pub.inv;delete pub.oppDeck;delete pub.evDeck;
    if(pub.phase!=='end'){pub.news=pub.news.map((x,i)=>i<pub.np?x:null);pub.opp=pub.opp.map(o=>o&&{c:o.c,t:null});
      pub.players.forEach(p=>{p.peek=null;p.dreams=p.dreams.map(()=>null);p.dreamOpts=[];if(p.policy)p.policy.t=null;});}},
  secret(i){const p=S.players[i];return {peek:p.peek,dreams:p.dreams,dreamOpts:p.dreamOpts,oppT:p.know>=2?S.opp.map(o=>o?o.t:null):null,curT:NET.curT[i]||null,policyT:p.policy?p.policy.t:null};},
  applySecret(seat,sec){if(S.phase==='end')return;const me=S.players[seat];me.peek=sec.peek;me.dreams=sec.dreams||[];me.dreamOpts=sec.dreamOpts||[];if(sec.oppT)S.opp.forEach((o,i)=>{if(o)o.t=sec.oppT[i];});if(me.policy)me.policy.t=sec.policyT;},
  waiting(){if(!S)return [];const w=S.await;if(!w||!S.players[w.seat]||S.players[w.seat].ai)return [];return [w.seat];},
  action(seat,a){
    const w=S.await;
    if(a.t==='repay'&&S.phase==='action'){if(repay(seat,a.kind,a.amt,a.idx))render();return;}
    if(!w||w.seat!==seat)return;
    if(w.type==='act'&&a.t==='place'&&S.phase==='action'&&S.cur===seat){
      const sp=String(a.sp);if(SPI[sp]==null||!canPlace(seat,sp).ok||!validArgs(seat,sp,a.a).ok)return;
      S.await=null;doPlace(seat,sp,a.a||{});
    }else if(w.type==='choice'&&a.t==='choice'&&NET.pending&&+a.id===NET.pending.id){
      const v=+a.v,o=NET.pending.spec.opts[v];if(!o||o.dis)return;NET.resolveChoice(v);
    }else if(w.type==='pick'&&a.t==='pick'&&NET.pendingPick&&NET.pendingPick.seat===seat){
      const P=NET.pendingPick;NET.pendingPick=null;S.await=null;applyPick(seat,String(a.job),Array.isArray(a.dreams)?a.dreams.map(String):[]);P.next();
    }
  },
  afterTakeover(ws){
    const w=S.await;ws.forEach(i=>{S.players[i].pers=S.players[i].pers||'bal';});if(!w)return;
    if(w.type==='act'){S.await=null;proceed();}
    else if(w.type==='choice'&&NET.pending){const sp=NET.pending.spec;let v=0;try{v=sp.ai?sp.ai():0;}catch(e){}NET.resolveChoice(v);}
    else if(w.type==='pick'&&NET.pendingPick){const P=NET.pendingPick;NET.pendingPick=null;S.await=null;aiPick(w.seat);P.next();}
  },
  afterReclaim(){save();},
  resumeUI(){render();proceed();},
  clientReset(prev){
    S.inv=[];S.oppDeck=[];S.evDeck=[];
    const me=S.players[NET.seat];
    if(!prev||prev.phase!==S.phase||prev.r!==S.r||prev.cur!==S.cur||(prev.players[NET.seat]&&prev.players[NET.seat].left!==me.left)){UI.sp=null;UI.a={};UI.pending=false;}
    if(UI.pending&&!(S.await&&S.await.type==='act'&&S.await.seat===NET.seat))UI.pending=false;
  },
  clientModal(){
    const w=S.await,seat=NET.seat,sec=NET.secret;
    if(w&&w.seat===seat&&w.type==='choice')return {key:'c'+w.id,open:()=>{const spec={...w,truth:sec&&sec.curT&&sec.curT.id===w.id?sec.curT.t:null};choiceModal(seat,spec,v=>{NET.send({t:'choice',id:w.id,v});});}};
    if(w&&w.seat===seat&&w.type==='pick')return (sec&&sec.dreamOpts&&sec.dreamOpts.length)?{key:'p',open:()=>{UI.pj=null;UI.pd=null;pickModal(seat,()=>{});}}:null;
    if(S.phase==='event'&&S.evDone)return {key:'e'+S.r,open:eventsModal};
    if(S.phase==='settle'&&S.setDone)return {key:'s'+S.r,open:settleModal};
    if(S.phase==='end')return {key:'end',open:endGame};
    if(S.phase==='action'&&NET.newsSeen!==S.r)return {key:'n'+S.r,open:()=>{NET.newsSeen=S.r;roundModal();}};
    return null;
  },
};

/* ================= boot ================= */
window.__wr={setupGame,setSpeed:v=>{SPEED=v;},get S(){return S;},
  sim(n,opt){ // headless AI-only games for balance testing
    const saved=S,savedSim=SIM;SIM=true;const out=[];
    try{for(let g=0;g<n;g++){
      const np=(opt&&opt.np)||4;const pers=(opt&&opt.pers)||AI_PERS;
      setupGame(Array.from({length:np},(_,i)=>({name:'AI'+i,ai:true,pers:pers[i%pers.length]})));
      const sc=S.players.map((p,i)=>({i,pers:p.pers,job:p.job,...score(i),pa:passive(p).total,ex:expenses(p).total,firstFree:p.firstFree,bk:p.bk,happyV:p.happy,cc:p.cc,props:p.props.length,biz:p.biz.length,fund:p.fund,bond:p.bond,gro:p.gro,lvl:p.lvl,know:p.know,quit:p.quit,st:p.st}));
      out.push({sc,winner:sc.slice().sort((a,b)=>b.total-a.total)[0].i,mkt:S.mkt,gro:S.gro,house:S.house,pos:S.pos});
    }}finally{SIM=savedSim;S=saved;}
    return out;}};
(function boot(){
  S={players:[newPlayer(0,{name:'—',ai:true},['eng','nurse'],[])],r:0,pos:0,mkt:10,gro:10,house:0,gold:10,infl:0,news:[],np:0,inv:[],row:[2,5,0,8,10],oppDeck:[],opp:[{c:5,t:null},{c:0,t:null}],
     log:[],firstFree:null,phase:'idle',viewer:null,dl:{mkt:0,gro:0,house:0,gold:0},curNews:null,occ:{},order:[0],ti:0,cur:null,evRes:[],setRes:[],evDeck:[]};
  render();showSetup();
})();
