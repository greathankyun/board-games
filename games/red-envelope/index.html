<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>紅包心機</title>
<meta name="description" content="原創吹牛派對桌遊：喜宴上輪流包紅包、喊金額，下一家要決定抓不抓。被抓包罰酒，沒人抓就賺面子。">
<meta name="theme-color" content="#1E5641">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="icon" href="../../icons/icon-192.png">
<link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="桌遊大廳">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Outfit:wght@600;700;800&display=swap">
<style>
:root{
  --paper:#F5EEE1; --paper2:#EFE6D4; --card:#FFFBF4; --ink:#1F2B27; --muted:#6E7068; --line:#E5D9C3; --line2:#D9CBB1;
  --green:#1E5641; --green2:#28704F; --green-ink:#F3F7EF; --yellow:#F5C443; --yellow-ink:#2A2310;
  --orange:#E9643B; --pink:#F7DDD3; --pink2:#EFC6B8; --up:#2C8F4E; --up-bg:#D5EEDA; --down:#C8432F; --down-bg:#F7DAD3; --flat-bg:#ECE5D7;
  --red:#D7542B; --red-bg:#F8DCCF; --blue:#2E7DC0; --blue-bg:#D6E7F5; --violet:#7A5AD3; --violet-bg:#E4DCF7; --gold:#D19A17; --gold-bg:#F6E7BE;
  --p0:#E58FA0; --p1:#8B67D6; --p2:#4F9E61; --p3:#E0922F; --p4:#3E9CC4; --p5:#C8573E; --p6:#6C7A3A; --p7:#5C6BC0;
  --scrim:rgba(40,32,20,.45);
  --f-body:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
  --f-num:'Outfit','Noto Sans TC',system-ui,sans-serif;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55;font-weight:500}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
  background-image:radial-gradient(rgba(120,90,40,.07) 1px,transparent 1px);background-size:5px 5px}
.wrap{position:relative;z-index:1;max-width:1600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 28px}
h1,h2,h3,h4{text-wrap:balance;margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
svg{display:block}

/* header */
.top{display:flex;align-items:center;gap:14px 22px;flex-wrap:wrap;padding-block:6px 12px;border-bottom:1.5px solid var(--line2)}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit}
.brand svg{width:44px;height:44px;flex:none}
.brand h1{font-size:clamp(26px,3.4vw,38px);font-weight:900;letter-spacing:.06em;line-height:1}
.brand small{font-family:var(--f-num);font-size:12px;letter-spacing:.42em;color:var(--ink);font-weight:600;margin-left:6px}
.homelink{display:inline-flex;align-items:center;gap:6px;font-size:15px;font-weight:900;color:var(--ink);text-decoration:none;border:1.5px solid var(--ink);border-radius:12px;padding:7px 12px;background:var(--card)}.homelink svg{width:18px;height:18px}
.vsep{width:1.5px;align-self:stretch;background:var(--line2);margin-block:6px}
.steps{display:flex;align-items:center;flex:1;min-width:0;justify-content:center}
.step{font-family:var(--f-num);font-weight:700;font-size:15px;padding:5px 14px;border-radius:999px;border:1.5px solid var(--line2);background:var(--card);color:var(--ink);white-space:nowrap}
.step.done{color:var(--muted);background:var(--paper2)}
.step.now{background:var(--green);border-color:var(--green);color:var(--green-ink);font-size:17px;padding:6px 18px}
.link{flex:1;min-width:8px;max-width:56px;height:2px;background:repeating-linear-gradient(90deg,var(--line2) 0 4px,transparent 4px 8px)}
.link.done{background:var(--green)}
.tops{display:flex;gap:10px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--ink);background:var(--card);color:var(--ink);padding:8px 16px;border-radius:12px;cursor:pointer;font-weight:700;line-height:1.2;text-decoration:none}
.btn svg{width:18px;height:18px}
.btn:hover:not(:disabled){transform:translateY(-1px)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.dark,.btn.primary{background:var(--green);border-color:var(--green);color:var(--green-ink)}
.btn.ghost{background:transparent}

/* layout */
.board{display:grid;grid-template-columns:minmax(0,1fr) minmax(340px,430px);grid-template-areas:"hero desk" "main desk";grid-template-rows:auto 1fr;gap:14px 18px;margin-top:12px;align-items:start}
.hero{grid-area:hero;position:relative;min-height:140px;display:flex;align-items:center;overflow:hidden;border-radius:18px}
.hero-txt{position:relative;z-index:2;padding:8px 0 10px}
.eyebrow{display:flex;align-items:center;gap:12px;font-family:var(--f-num);font-weight:600;letter-spacing:.32em;font-size:13px}
.eyebrow::after{content:"";width:80px;height:1.5px;background:var(--ink)}
.hero h2{font-size:clamp(28px,4vw,48px);font-weight:900;letter-spacing:.03em;line-height:1.15;margin-top:6px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.swoosh{display:block;width:150px;height:14px;margin-top:-2px}
.qbadge{position:relative;font-size:17px;font-weight:900;border:2px solid var(--ink);border-radius:999px;padding:3px 14px;background:var(--card);letter-spacing:.04em}
.hero-art{position:absolute;right:0;top:0;bottom:0;width:min(62%,640px);z-index:1;
  -webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 28%);mask-image:linear-gradient(90deg,transparent 0%,#000 28%)}
.hero-art svg{width:100%;height:100%}
main{grid-area:main;min-width:0}
.sect{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:900;padding-bottom:10px;border-bottom:1.5px solid var(--line2);margin:0 0 12px}
.sect svg{width:26px;height:26px;color:var(--orange)}
.sect{flex-wrap:wrap}
.sect small{font-size:13px;color:var(--muted);font-weight:700;margin-left:auto}
@media (max-width:640px){.sect small{flex-basis:100%;margin-left:0}}

/* desk */
.desk{grid-area:desk;position:sticky;top:max(10px,env(safe-area-inset-top,0px));background:var(--green);color:var(--green-ink);border-radius:26px;padding:24px 24px 22px;overflow:hidden;display:flex;flex-direction:column;gap:14px;box-shadow:0 18px 40px rgba(20,60,45,.25)}
.desk .leaf{position:absolute;right:-30px;top:-20px;width:190px;height:190px;opacity:.9;pointer-events:none}
.desk>*{position:relative}
.dhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.dhead h2{font-size:clamp(26px,2.6vw,36px);font-weight:900;letter-spacing:.04em;line-height:1.1}
.pill{background:var(--orange);color:#fff;font-weight:900;border-radius:999px;padding:5px 14px;font-size:15px;white-space:nowrap}
.pill.soft{background:rgba(255,255,255,.16)}
.dsub{font-weight:700;font-size:15px;margin-top:-6px;opacity:.9}
.dlab{font-size:14px;opacity:.9;font-weight:900;display:flex;align-items:center;gap:8px;justify-content:space-between}
.dlab small{font-weight:700;opacity:.8;font-size:12px}
.dnote{font-size:13px;font-weight:700;background:rgba(255,255,255,.12);border-radius:10px;padding:7px 12px}
.dnote.warn{background:rgba(233,100,59,.28)}
.confirm{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:none;border-radius:16px;background:var(--yellow);color:var(--yellow-ink);font-size:22px;font-weight:900;padding:13px;cursor:pointer;box-shadow:0 4px 0 #C99A1E;letter-spacing:.06em}
.confirm svg{width:24px;height:24px}
.confirm:active:not(:disabled){transform:translateY(2px);box-shadow:0 2px 0 #C99A1E}
.confirm:disabled{opacity:.5;cursor:not-allowed}
.passbtn{width:100%;border:2px solid rgba(255,255,255,.85);background:transparent;color:var(--green-ink);border-radius:14px;font-weight:900;font-size:17px;padding:10px;cursor:pointer}
.passbtn:hover{background:rgba(255,255,255,.08)}
.empty{border:2px dashed rgba(255,255,255,.35);border-radius:16px;padding:20px 16px;text-align:center;font-weight:700;opacity:.92}
.empty b{display:block;font-size:19px;margin-bottom:4px}
.think{display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.1);border-radius:16px;padding:14px}
.think .av{width:56px;height:56px;flex:none}
.think b{font-size:19px}
.dots::after{content:"…";display:inline-block;animation:blink 1.1s steps(3) infinite}
@keyframes blink{0%{opacity:.2}50%{opacity:1}100%{opacity:.2}}
.chooser{display:flex;flex-wrap:wrap;gap:6px}
.chooser button{border:2px solid rgba(255,255,255,.55);background:transparent;color:var(--green-ink);border-radius:12px;padding:7px 12px;font-weight:900;cursor:pointer;display:inline-flex;align-items:center;gap:6px;min-height:40px}
.chooser button .av{width:24px;height:24px}
.chooser button.on{background:var(--card);color:var(--ink);border-color:var(--card)}
.chooser button:disabled{opacity:.35;cursor:not-allowed}
.chooser button.red.on{background:var(--red);border-color:var(--red);color:#fff}
.chooser button.blue.on{background:var(--blue);border-color:var(--blue);color:#fff}
.chooser.big button{flex:1;justify-content:center;font-size:16px}
.opt2{display:flex;flex-direction:column;gap:6px}
.opt2 button{display:flex;justify-content:space-between;gap:10px;align-items:center;text-align:left;border:2px solid rgba(255,255,255,.4);background:transparent;color:var(--green-ink);border-radius:12px;padding:9px 12px;cursor:pointer}
.opt2 button b{font-weight:900;font-size:15px}
.opt2 button span{font-size:12px;opacity:.85}
.opt2 button.on{background:var(--card);color:var(--ink);border-color:var(--card)}
.opt2 button.on span{opacity:1;color:var(--muted)}
.opt2 button:disabled{opacity:.35;cursor:not-allowed}
.dsec{display:flex;flex-direction:column;gap:8px;padding-top:12px;border-top:1px solid rgba(255,255,255,.2)}

/* private note card */
.intel{position:relative;background:var(--pink);color:var(--ink);border-radius:14px;padding:14px 16px 12px;box-shadow:0 6px 14px rgba(0,0,0,.18)}
.intel::after{content:"";position:absolute;right:0;top:0;width:28px;height:28px;background:linear-gradient(225deg,var(--green) 50%,var(--pink2) 50%);border-bottom-left-radius:8px}
.intel .ilab{display:flex;align-items:center;gap:8px;font-weight:900;color:#B24A35;font-size:16px;padding-bottom:8px;border-bottom:1.5px solid var(--pink2)}
.intel .ilab svg{width:20px;height:20px}
.intel ul{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:260px;overflow:auto}
.intel li{font-size:13.5px;line-height:1.45;display:flex;gap:8px;align-items:flex-start}
.intel li .rt{font-family:var(--f-num);font-weight:700;font-size:11px;border:1.5px solid var(--pink2);border-radius:6px;padding:0 5px;background:var(--card);white-space:nowrap;margin-top:1px}
.intel li.void{opacity:.45;text-decoration:line-through}
.intel .inote{font-size:12.5px;color:#5B4A40;margin-top:8px}
.intel .big{font-size:22px;font-weight:900;margin:8px 0 2px}
.stamp{border:1.5px solid #B24A35;color:#B24A35;border-radius:8px;padding:1px 9px;font-weight:900;font-size:12px;white-space:nowrap;display:inline-block;transform:rotate(-3deg)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:900;padding:1px 9px;border-radius:8px;background:var(--flat-bg);color:var(--ink);white-space:nowrap}
.chip.red{background:var(--red);color:#fff}.chip.blue{background:var(--blue);color:#fff}.chip.violet{background:var(--violet);color:#fff}
.chip.gold{background:var(--gold-bg);color:#6B4D07}.chip.green{background:var(--up-bg);color:var(--up)}.chip.down{background:var(--down-bg);color:var(--down)}

/* feed */
.feed{margin-top:18px}
.feedlist{list-style:none;margin:0;padding:0;overflow:auto;max-height:320px}
.feedlist li{display:grid;grid-template-columns:auto 34px minmax(0,1fr);gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.qtag{font-family:var(--f-num);font-weight:700;font-size:12px;border:1.5px solid var(--line2);border-radius:6px;padding:1px 6px;background:var(--card)}
.feedlist .av{width:34px;height:34px}
.feedlist .txt{font-size:13.5px;line-height:1.45;min-width:0}
.feedlist .ic{width:34px;height:34px;border-radius:50%;background:var(--paper2);display:grid;place-items:center;color:var(--green)}
.feedlist .ic svg{width:18px;height:18px}
.feedlist li.q .txt{font-weight:900;color:var(--green)}
.feedlist li.k .txt{color:#8A4A12}
.pn{font-weight:900;color:var(--ink)}

/* players strip */
.players{margin-top:18px;background:var(--card);border:1.5px solid var(--line);border-radius:20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));padding:8px;gap:6px;box-shadow:0 8px 20px rgba(90,70,30,.06)}
.pl{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:14px;position:relative;min-width:0}
.pl.cur{background:var(--pink)}
.pl .av{width:52px;height:52px;flex:none}
.pl .nm{font-size:17px;font-weight:900;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tag{font-size:11px;font-weight:700;border:1.5px solid var(--line2);border-radius:6px;padding:0 5px;color:var(--muted);background:var(--card)}
.pl .fig{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:13px;color:var(--muted)}
.pl .fig b{font-family:var(--f-num);font-weight:800;color:var(--ink);font-size:16px;margin-left:3px}

/* responsive */
@media (max-width:1040px){
  .board{grid-template-columns:minmax(0,1fr);grid-template-areas:"hero" "desk" "main"}
  .desk{position:relative;top:0}
  .hero-art{width:70%;opacity:.55}
}
@media (max-width:640px){
  .vsep{display:none}
  .steps{order:3;flex-basis:100%;justify-content:flex-start;overflow-x:auto;padding-bottom:2px}
  .step{padding:4px 10px;font-size:13px}.step.now{padding:5px 12px;font-size:15px}
  .brand small{display:none}
  .desk{padding:20px 16px;border-radius:22px}
  .tops .btn{padding:8px 11px}
}

/* modals */
.overlay{position:fixed;inset:0;background:var(--scrim);display:grid;place-items:center;z-index:50;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--card);color:var(--ink);border-radius:24px;border:1.5px solid var(--line);width:min(660px,100%);max-height:calc(100dvh - 32px);overflow:auto;padding:24px;box-shadow:0 30px 70px rgba(40,30,10,.3)}
.modal h2{font-size:27px;font-weight:900;margin-bottom:6px;letter-spacing:.03em}
.modal .sub{color:var(--muted);margin:0 0 14px}
.modal .acts{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}
.modal .acts .btn{padding:10px 20px;font-size:16px}
.modal .intel::after{background:linear-gradient(225deg,var(--card) 50%,var(--pink2) 50%)}
.seats{display:flex;flex-direction:column;gap:10px}
.seat{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center}
.seat .av{width:44px;height:44px}
.seat input{font:inherit;font-weight:700;padding:9px 12px;border:1.5px solid var(--line2);border-radius:12px;background:var(--paper);color:var(--ink);min-width:0;width:100%}
.seg{display:inline-flex;border:1.5px solid var(--line2);border-radius:12px;overflow:hidden;background:var(--paper);flex-wrap:wrap}
.seg button{border:none;background:transparent;color:var(--muted);padding:8px 12px;cursor:pointer;font-weight:700}
.seg button.on{background:var(--green);color:var(--green-ink)}
.field{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:14px 0;flex-wrap:wrap}
.field>span{font-weight:900;font-size:16px}
.note{font-size:12px;color:var(--muted)}
.pitch{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:0 0 6px}
.pitch div{background:var(--paper);border-radius:14px;padding:12px;font-size:13px;color:var(--muted)}
.pitch b{display:block;color:var(--ink);font-size:15px;font-weight:900;margin-bottom:2px}
.setup-art{height:120px;margin:-24px -24px 16px;overflow:hidden;border-radius:24px 24px 0 0}
.setup-art svg{width:100%;height:100%}
.rules{font-size:15px;line-height:1.8}
.rules h3{font-size:19px;font-weight:900;margin:18px 0 6px;color:var(--green)}
.rules p,.rules li{max-width:64ch}
.rules ol,.rules ul{padding-left:1.3em;margin:6px 0}
.rules table{border-collapse:collapse;font-size:14px;margin:6px 0;width:100%}
.rules td,.rules th{border-top:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.rules th{font-size:12px;color:var(--muted)}
.handoff .av{width:84px;height:84px;margin-bottom:10px}
table.res{width:100%;border-collapse:collapse;margin-top:12px;font-size:14px}
table.res th{font-size:12px;color:var(--muted);text-align:right;font-weight:700;padding:4px 6px}
table.res td{text-align:right;padding:8px 6px;border-top:1px solid var(--line);font-family:var(--f-num);font-weight:700;font-variant-numeric:tabular-nums}
table.res th:first-child,table.res td:first-child{text-align:left;font-family:var(--f-body)}
.tablewrap{overflow-x:auto}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--muted)}
.win{font-size:32px;font-weight:900;color:var(--green);margin:4px 0}
.revlist{display:flex;flex-direction:column;gap:8px}
.rev{border:1.5px solid var(--line2);border-radius:14px;padding:10px 14px;background:var(--paper);display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.rev h4{font-size:16px;font-weight:900}
.rev .kn{font-size:12.5px;color:var(--muted);font-weight:700}
@media (prefers-reduced-motion:reduce){.dots::after{animation:none}.btn{transition:none}}


/* ---- game ---- */
/* Layout: the red guest book (envelopes on the table) on the left, the green desk with your hand on the right. */
.envs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.env{position:relative;border-radius:14px;padding:10px 12px 12px;background:#C8432F;color:#FFF3DA;min-height:118px;display:flex;flex-direction:column;gap:4px;box-shadow:0 3px 0 #8E2A1C;overflow:hidden}
.env::before{content:"";position:absolute;left:0;right:0;top:0;height:36px;background:#B73A27;clip-path:polygon(0 0,100% 0,100% 40%,50% 100%,0 40%)}
.env>*{position:relative}
.env .who{display:flex;align-items:center;gap:6px;font-weight:900;font-size:13.5px}
.env .who .av{width:26px;height:26px}
.env .amt{font-family:var(--f-num);font-weight:800;font-size:26px;letter-spacing:.02em;color:#F5C443;margin-top:auto}
.env .st{font-size:12px;font-weight:900;border-radius:8px;padding:1px 8px;align-self:flex-start;background:rgba(0,0,0,.18)}
.env.lie{background:#5B5B5B;box-shadow:0 3px 0 #333}.env.lie::before{background:#4A4A4A}
.env.ok .st{background:#F5C443;color:#5A2A10}
.env.lie .st{background:#fff;color:#C8432F}
.env.pass{background:var(--paper2);color:var(--ink);box-shadow:0 3px 0 var(--line2)}.env.pass::before{display:none}
.env.pass .amt{color:var(--muted);font-size:18px}
.env.empty{background:transparent;border:2px dashed var(--line2);box-shadow:none;color:var(--muted);justify-content:center;align-items:center}
.env.empty::before{display:none}
.env.now{outline:3px solid var(--yellow);outline-offset:2px}
.hist{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.hist .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;border-top:1px solid var(--line);padding-top:6px}
.hist .row b{font-weight:900;margin-right:4px}
.hand{display:flex;flex-wrap:wrap;gap:6px}

/* ================= setup ================= */
function setupGame(players){
  clearTimeout(timer);
  const deck=[];DECK.forEach(([n,v,c])=>{for(let k=0;k<c;k++)deck.push({v});});shuffle(deck);
  const ids=shuffle(IDK.slice());
  S={players:players.map((p,i)=>({name:p.name,ai:p.ai,id:ids[i%ids.length],hand:deck.splice(0,HAND).sort((a,b)=>a.v-b.v),score:0,drinks:0,peeks:2,cousin:1,known:{}})),
     w:1,start:Math.random()*players.length|0,evs:shuffle(EVENTS.map((_,k)=>k)).slice(0,WEDDINGS),
     t:0,sub:'play',envs:[],thr:0,hist:[],phase:'head',log:[],viewer:null,last:null,cfgPlayers:players};
  const hs=humans();S.viewer=hs.length===1?S.players.indexOf(hs[0]):null;
  log('喜宴開始！大家各自拿到 7 個紅包袋。','q');
  UI={};render();headModal();
}
function headModal(){
  S.phase='head';render();save();
  const e=ev();
  openModal(`<h2>第 ${S.w} 場喜宴</h2><div class="intel" style="margin:6px 0 4px"><div class="ilab">${ICONS.spark}本場狀況</div><div class="big">${e.n}</div><div class="inote">${e.d}</div></div>
   <p class="sub">由 ${esc(S.players[order()[0]].name)} 先包。每一家都要喊得比上一家高，下一家決定要不要抓。</p>
   <div class="acts"><button class="btn primary" data-m="go">開席</button></div>`,()=>{closeModal();S.phase='turn';S.t=0;S.envs=[];S.thr=0;S.sub='play';S.last=null;proceed();});
  if(!humans().length)timer=setTimeout(()=>modalCb&&modalCb('go'),SPEED*2);
}

/* ================= rules helpers ================= */
function allowed(i,useCousin){
  if(useCousin)return VALS.slice();
  const eq=hasId(i,'elder')||ev().k==='flow';
  let a=VALS.filter(v=>eq?v>=S.thr:v>S.thr);
  if(S.t===0&&ev().k==='auntie')a=a.filter(v=>v>=1600);
  return a;
}
function prevEnv(){if(S.t===0)return null;const e=S.envs[S.envs.length-1];return e&&e.status==='hid'?e:null;}
function curPlayer(){if(S.phase!=='turn')return null;const o=order();return S.t>=NP()?o[0]:o[S.t];}

/* ================= resolution ================= */
function resolveChallenge(ch,e,auto){
  const lie=e.card.v<e.dec, white=e.card.v<0;
  const d=e.p, P=S.players;
  e.chal=ch;
  if(lie){
    e.status='lie';
    let pen=hasId(d,'matchmaker')?1:3; if(white)pen+=3;
    P[d].score-=pen;P[d].drinks++;
    let gain=0;
    if(ch!=null){gain=(hasId(ch,'uncle')?4:2)+(ev().k==='party'?3:0);P[ch].score+=gain;}
    S.thr=Math.max(0,e.card.v);
    S.last={ok:false,d,ch,card:e.card.v,dec:e.dec,pen,gain};
    log(`${ch!=null?pn(ch)+' 抓包':'新娘點禮金'}！${pn(d)} 喊 ${money(e.dec)}，裡面其實是 <b>${cardName(e.card)}</b>。${pn(d)} −${pen} 並罰喝一杯${ch!=null?`，${pn(ch)} +${gain}`:''}。`,'k');
  }else{
    e.status='ok';
    const pts=PTS[e.dec]+2;P[d].score+=pts;
    let pen=0;
    if(ch!=null){pen=ev().k==='cold'?0:(hasId(d,'bridesmaid')?6:3);P[ch].score-=pen;P[ch].drinks++;}
    S.last={ok:true,d,ch,card:e.card.v,dec:e.dec,pen,gain:pts};
    log(`${ch!=null?pn(ch)+' 抓錯了':'新娘點禮金'}：${pn(d)} 的紅包真的有 <b>${cardName(e.card)}</b>，證明清白 +${pts}${ch!=null?`。${pn(ch)} ${pen?'−'+pen+' 並':''}罰喝一杯`:''}。`,ch!=null?'k':'');
  }
  S.players.forEach(p=>{p.known[e.no]=e.card.v;});
}
function doPlay(i,ci,dec,useCousin){
  const p=S.players[i];
  if(ci==null){
    const free=hasId(i,'ex')||ev().k==='toast';
    if(!free)p.drinks++;
    S.envs.push({p:i,pass:true,status:'pass',no:S.hist.length*10+S.envs.length});
    S.thr=0;
    log(`${pn(i)} 舉杯敬酒，這輪不包${free?'（不用喝）':'，喝一杯'}。下一家重新喊起。`);
    return;
  }
  const card=p.hand.splice(ci,1)[0];
  if(useCousin)p.cousin=0;
  const e={p:i,card,dec,status:'hid',no:S.hist.length*10+S.envs.length};
  p.known[e.no]=card.v;
  S.envs.push(e);S.thr=dec;
  log(`${pn(i)} 包了一個紅包，喊 <b>${money(dec)}</b>${useCousin?'（遠房表哥特權）':''}。`);
}
function peek(i){const e=prevEnv();if(!e||S.players[i].peeks<=0)return;S.players[i].peeks--;S.players[i].known[e.no]=e.card.v;log(`${pn(i)} 動用阿嬤特權，偷看了 ${pn(e.p)} 的紅包。`);}
function endWedding(){
  const E=S.envs;
  if(ev().k==='count'){
    const hid=E.filter(e=>e.status==='hid');
    if(hid.length){const top=hid.reduce((a,b)=>b.dec>a.dec?b:a);resolveChallenge(null,top,true);}
  }
  E.forEach(e=>{
    if(e.status==='hid'){const pts=PTS[e.dec]+(ev().k==='double'?1:0);S.players[e.p].score+=pts;e.status='safe';e.got=pts;}
  });
  S.players.forEach((p,i)=>{if(hasId(i,'colleague')){const mine=E.find(e=>e.p===i);if(mine&&!mine.pass&&mine.status!=='lie'){p.score++;}}});
  S.hist.push({w:S.w,ev:S.evs[S.w-1],envs:E.map(e=>({...e}))});
  log(`第 ${S.w} 場喜宴散席，沒被抓的紅包都算面子分。`,'q');
  if(S.w>=WEDDINGS){finish();return;}
  S.w++;S.envs=[];headModal();
}
function finalScore(){
  return S.players.map((p,i)=>{
    const cash=p.hand.filter(c=>c.v>0).reduce((a,c)=>a+c.v,0);
    const cashPts=Math.floor(cash/2000), whites=p.hand.filter(c=>c.v<0).length*-2;
    const dr=-p.drinks;
    return {face:p.score,cash:cashPts,white:whites,drink:dr,total:p.score+cashPts+whites+dr,raw:cash};
  });
}
function finish(){
  S.phase='end';S.final=finalScore();
  const best=Math.max(...S.final.map(s=>s.total));
  let w=S.final.map((s,i)=>i).filter(i=>S.final[i].total===best);
  if(w.length>1){const m=Math.max(...w.map(i=>S.final[i].raw));w=w.filter(i=>S.final[i].raw===m);}
  S.winners=w;
  log(`散場！${w.map(pn).join('、')} 最有面子。`,'q');
  clearSave();render();endModal();
}
function endModal(){
  const sc=S.final;
  openModal(`<h2>散場結算</h2><div class="win">${S.winners.map(i=>esc(S.players[i].name)).join('、')} 最有面子</div>
   <p class="sub">面子分加上手上剩的現金（每 2,000 算 1 分），留著白包每個 −2，每喝一杯 −1。</p>
   <div class="tablewrap"><table class="res"><thead><tr><th>賓客</th><th>身分</th><th>面子</th><th>剩餘現金</th><th>白包</th><th>酒</th><th>總分</th></tr></thead><tbody>
   ${sc.map((s,i)=>({s,i})).sort((a,b)=>b.s.total-a.s.total).map(({s,i})=>`<tr><td>${esc(S.players[i].name)}</td><td style="font-family:var(--f-body)">${IDS[S.players[i].id].n}</td><td>${s.face}</td><td>+${s.cash}</td><td>${s.white}</td><td>${s.drink}</td><td><b>${s.total}</b></td></tr>`).join('')}</tbody></table></div>
   <div class="acts"><button class="btn" data-m="close">看看禮金簿</button><button class="btn primary" data-m="again">再來一局</button></div>`,m=>{closeModal();if(m==='again')setupGame(S.cfgPlayers);});
}

/* ================= AI ================= */
function unseen(i){
  const cnt={};DECK.forEach(([n,v,c])=>cnt[v]=(cnt[v]||0)+c);
  S.players[i].hand.forEach(c=>cnt[c.v]--);
  const allE=S.hist.flatMap(h=>h.envs).concat(S.envs);
  allE.forEach(e=>{if(e.pass)return;const k=S.players[i].known[e.no];if(k!=null&&e.p!==i)cnt[k]--;else if(e.p===i)cnt[e.card.v]--;});
  return cnt;
}
function pHas(i,j,D){
  const cnt=unseen(i);let tot=0,ok=0;for(const v in cnt){const c=Math.max(0,cnt[v]);tot+=c;if(+v>=D)ok+=c;}
  if(!tot)return .5;
  const f=ok/tot,h=S.players[j].hand.length+1;
  return 1-Math.pow(1-f,h);
}
function aiWantsChallenge(i,e){
  const k=S.players[i].known[e.no];
  if(k!=null)return k<e.dec;
  const pT=Math.min(.97,pHas(i,e.p,e.dec)*.9+.08);
  const pL=1-pT;
  const own=(hasId(i,'uncle')?4:2)+(ev().k==='party'?3:0);
  const canBeat=S.players[i].hand.some(c=>c.v>e.dec);
  const gain=own+.35*((hasId(e.p,'matchmaker')?1:3)+PTS[e.dec])+(S.t<NP()&&!canBeat?2.5:0);
  const loss=(ev().k==='cold'?0:hasId(e.p,'bridesmaid')?6:3)+1+.35*2;
  return pL*gain>pT*loss+.6+Math.random()*.8;
}
function aiChal(i){
  const e=prevEnv()||(S.t>=NP()?lastHid():null);
  if(!e)return;
  if(hasId(i,'grandma')&&S.players[i].peeks>0&&S.players[i].known[e.no]==null&&PTS[e.dec]>=4)peek(i);
  if(aiWantsChallenge(i,e))resolveChallenge(i,e);
}
function lastHid(){const e=S.envs[S.envs.length-1];return e&&e.status==='hid'?e:null;}
function aiPlay(i){
  const p=S.players[i];
  const best={ev:-(hasId(i,'ex')||ev().k==='toast'?0:1)-.6+Math.random()*.4,ci:null,dec:null,cz:false};
  const tryOpts=cz=>{
    const A=allowed(i,cz);
    p.hand.forEach((c,ci)=>{
      const cost=c.v>0?c.v/2000*.8:c.v<0?-1.6:0;
      A.forEach(V=>{
        const idx=VALS.indexOf(V);
        const q=Math.min(.95,.1+.1*idx+(idx>=5?.3:0)+(S.t===NP()-1?.05:0));
        const pen=(hasId(i,'matchmaker')?1:3)+1+(c.v<0?3:0);
        const e=c.v>=V?PTS[V]+q*2-cost:(1-q)*PTS[V]-q*pen-cost;
        const sc=e+Math.random()*.9-(cz?1.2:0);
        if(sc>best.ev){best.ev=sc;best.ci=ci;best.dec=V;best.cz=cz;}
      });
    });
  };
  tryOpts(false);
  if(p.cousin&&hasId(i,'cousin')&&allowed(i,false).length<3)tryOpts(true);
  doPlay(i,best.ci,best.dec,best.cz);
}

/* ================= flow ================= */
function proceed(){
  clearTimeout(timer);save();
  if(!S||!$('#overlay').hidden)return;
  if(S.phase!=='turn')return render();
  if(S.t>=NP()){ // first player may challenge the last envelope
    const e=lastHid();
    if(!e||S.sub==='done'){endWedding();return;}
    S.sub='chal';
  }
  const cur=curPlayer();
  const p=S.players[cur];
  if(S.sub==='start'||S.sub==null)S.sub=prevEnv()?'chal':'play';
  if(p.ai){
    render();
    timer=setTimeout(()=>{
      if(S.sub==='chal'){aiChal(cur);if(S.t>=NP()){S.sub='done';proceed();return;}S.sub='play';render();timer=setTimeout(()=>{aiPlay(cur);nextTurn();},humans().length?Math.min(SPEED,400):SPEED/3);return;}
      aiPlay(cur);nextTurn();
    },humans().length?Math.min(SPEED,450):SPEED/3);
    return;
  }
  if(S.viewer!==cur){
    S.viewer=null;UI={};render();
    openModal(`<div class="handoff">${avatar(cur)}</div><h2>請把裝置交給 ${esc(p.name)}</h2><p class="sub">輪到你${S.sub==='chal'?'決定要不要抓上一家，然後':''}包紅包。其他人請別偷看：畫面會顯示 ${esc(p.name)} 的手牌。</p>
     <div class="acts"><button class="btn primary" data-m="go">我是 ${esc(p.name)}，開始</button></div>`,()=>{closeModal();S.viewer=cur;UI={};render();scrollDeskIntoView();});
    return;
  }
  render();
}
function nextTurn(){S.t++;S.sub='start';if(S.t>=NP())S.sub='final';proceed();}

/* ================= view ================= */
function myTurn(){const c=curPlayer();return c!=null&&!S.players[c].ai&&S.viewer===c&&$('#overlay').hidden;}
function render(){
  if(!S)return;
  let st='';for(let i=1;i<=WEDDINGS;i++){if(i>1)st+=`<span class="link ${i<=S.w?'done':''}"></span>`;st+=`<span class="step ${i<S.w||S.phase==='end'?'done':i===S.w&&S.phase!=='idle'?'now':''}">第${i}場</span>`;}
  $('#steps').innerHTML=st;
  const head={idle:'喜宴紅包大作戰',head:'新人進場',turn:'包紅包、喊金額',end:'散場結算'}[S.phase];
  $('#hero').innerHTML=`<div class="hero-art">${heroArt()}</div><div class="hero-txt"><div class="eyebrow">WEDDING BANQUET</div><h2>${head}<span class="qbadge">${S.phase==='idle'?'準備開席':S.phase==='end'?'散場':'第 '+S.w+' 場 · '+ev().n}</span></h2>${swoosh}</div>`;
  renderBook();renderDesk();renderPlayers();
  $('#feed').innerHTML=feedHTML(S.log,l=>l.w?'第'+l.w+'場':'—','每一包紅包和每一次抓包都會記在這裡。');
}
function envHTML(e,viewer,isNow){
  if(e.pass)return `<div class="env pass"><div class="who">${avatar(e.p)}${esc(S.players[e.p].name)}</div><div class="amt">敬酒跳過</div></div>`;
  const known=viewer!=null&&S.players[viewer].known[e.no]!=null&&e.status==='hid';
  const st=e.status==='lie'?`被抓包・其實是 ${cardName(e.card)}`:e.status==='ok'?`驗過・真的有 ${cardName(e.card)}`:e.status==='safe'?`沒人抓 +${e.got}`:known?`你知道是 ${cardName(e.card)}`:'蓋著';
  return `<div class="env ${e.status==='lie'?'lie':e.status==='ok'?'ok':''} ${isNow?'now':''}"><div class="who">${avatar(e.p)}${esc(S.players[e.p].name)}</div><span class="st">${st}</span><div class="amt num">${money(e.dec)}</div></div>`;

function renderBook(){
  const o=order();const V=S.viewer;

  else{

    if(S.phase==='end'&&S.hist.length)h=`<div class="envs">${S.hist[S.hist.length-1].envs.map(e=>envHTML(e,V,false)).join('')}</div>`;

function lastNote(){

      h+=myIntel(cur);
    }else{
      h+=`<div class="dhead"><h2>${p.ai?'對手出招':'換人操作'}</h2><span class="pill soft">第 ${S.w} 場</span></div><div class="think">${avatar(cur)}<div><b>${esc(p.name)}</b><div>${p.ai?(S.sub==='chal'?'盯著上一包紅包':'正在包紅包')+'<span class="dots"></span>':'等待交接裝置'}</div></div></div>${lastNote()}`;
      if(S.viewer!=null)h+=myIntel(S.viewer);
    }
  }else if(S.phase==='end'){
    h+=`<div class="dhead"><h2>散場</h2><span class="pill">最有面子</span></div><div class="think">${avatar(S.winners[0])}<div><b>${S.winners.map(i=>esc(S.players[i].name)).join('、')}</b><div>總分 ${S.final[S.winners[0]].total}</div></div></div>
     <button class="passbtn" id="btnResult">再看一次結算</button><button class="confirm" id="btnAgain">再來一局 ${ICONS.arrow}</button>`;
  }else if(S.phase==='idle'){
    h+=`<div class="dhead"><h2>準備開席</h2></div><div class="empty"><b>設定賓客後開始</b>3 到 8 人，可以混搭 AI 對手。</div>`;
  }else{
    h+=`<div class="dhead"><h2>新人進場</h2><span class="pill soft">第 ${S.w} 場</span></div><div class="empty"><b>${ev().n}</b>${ev().d}</div>`;
    if(S.viewer!=null)h+=myIntel(S.viewer);
  }
  $('#desk').innerHTML=h;
}
function renderPlayers(){
  const cur=curPlayer();
  $('#players').innerHTML=S.players.map((p,i)=>`<div class="pl ${i===cur?'cur':''}"><img class="av" src="img/${p.id}.webp" alt="${IDS[p.id].n}"><div style="min-width:0"><div class="nm">${esc(p.name)}${p.ai?'<span class="tag">AI</span>':''}<span class="tag">${IDS[p.id].n}</span></div>
    <div class="fig"><span>面子<b>${S.phase==='end'&&S.final?S.final[i].total:p.score}</b></span><span>紅包<b>${p.hand.length}</b></span><span>酒<b>${p.drinks}</b></span></div></div></div>`).join('');
}
function heroArt(){return `<svg viewBox="0 0 640 180" preserveAspectRatio="xMaxYMid slice" aria-hidden="true">
  <rect width="640" height="180" fill="#F6E6D2"/>
  ${[0,1,2,3,4,5,6].map(k=>`<path d="M${200+k*64} 0 v26" stroke="#C8432F" stroke-width="2"/><g transform="translate(${200+k*64} 26)"><ellipse cx="0" cy="14" rx="13" ry="16" fill="#D7542B"/><rect x="-7" y="-2" width="14" height="5" fill="#F5C443"/><path d="M-3 30 v12 M3 30 v12" stroke="#F5C443" stroke-width="2"/></g>`).join('')}
  <ellipse cx="470" cy="168" rx="190" ry="26" fill="#E2CCA8"/>
  <ellipse cx="470" cy="150" rx="150" ry="22" fill="#FFFBF4" stroke="#D9C29A" stroke-width="3"/>
  ${[[380,128,-10],[430,122,6],[490,126,-4],[545,130,12]].map(([x,y,r])=>`<g transform="translate(${x} ${y}) rotate(${r})"><rect width="26" height="36" rx="3" fill="#C8432F"/><circle cx="13" cy="14" r="5" fill="#F5C443"/></g>`).join('')}
  <text x="300" y="120" font-size="64" font-weight="900" fill="#C8432F" opacity=".85">囍</text>
 </svg>`;}

/* ================= setup & rules ================= */
function showSetup(){
  clearTimeout(timer);
  const sv=lsGet(SAVE_KEY);
  openModal(`<div class="setup-art">${heroArt()}</div><h2>紅包心機</h2><p class="sub">表弟結婚，整個家族都到了。禮金不能輸人，前一家包多少，你就得喊得更多。可是紅包是封起來的，裡面到底有沒有錢，只有你知道。</p>
   <div class="pitch"><div><b>只能越喊越高</b>每一家都要喊得比上一家多，越後面越難說真話。</div><div><b>抓或不抓</b>下一家可以抓包。抓對他罰酒，抓錯你罰酒，不抓就得接著喊更高。</div><div><b>親戚身分</b>大舅、阿嬤、媒人婆、新郎前任……每個人都有一招。</div></div>
   ${setupSeatsHTML(setupCfg,3,8)}
   <p class="note">多位人類玩家可以共用一台裝置輪流操作，換人時手牌會蓋起來。</p>
   <div class="acts"><a class="btn ghost" href="${LOBBY}">← 回大廳</a><button class="btn" data-m="rules">先看規則</button>${sv&&sv.phase==='turn'?'<button class="btn" data-m="resume">繼續上一局</button>':''}<button class="btn primary" data-m="start">開始遊戲</button></div>`,
  m=>{
    if(setupSeatsHandle(setupCfg,m,showSetup))return;
    if(m==='rules')showRules();
    else if(m==='resume'){closeModal();SPEED=SPEEDS[setupCfg.speed];S=sv;const hs=humans();S.viewer=hs.length===1?S.players.indexOf(hs[0]):null;UI={};render();proceed();}
    else if(m==='start'){closeModal();SPEED=SPEEDS[setupCfg.speed];setupGame(seatsToPlayers(setupCfg,AI_NAMES));}
  });
}
function showRules(){showRulesHTML(`
  <p><b>一句話：</b>喜宴上輪流包紅包、喊金額，每一家都要喊得比上一家高。下一家可以抓包，抓對了說謊的人罰酒，抓錯了自己罰酒。</p>
  <p>3–8 人・15–20 分鐘・10 歲以上</p>
  <h3>準備</h3>
  <ul><li>每人發 7 個紅包袋（手牌）。紅包袋裡可能是真鈔（600～8,800）、空包，或不吉利的白包。</li>
  <li>每人隨機拿一張親戚身分，身分是公開的。</li>
  <li>共 ${WEDDINGS} 場喜宴，每場翻一張狀況卡。</li></ul>
  <h3>每一場喜宴</h3>
  <ol><li>從起始玩家開始，每人輪流<b>選一個紅包袋蓋著放上桌，並喊一個金額</b>：600、1,200、1,600、2,000、3,600、6,600、8,800（台灣喜宴避開 4，所以沒有 4 字頭）。</li>
  <li>喊的金額<b>必須比上一家高</b>。喊的可以和紅包裡的真實金額不一樣，這就是吹牛。</li>
  <li>輪到你時，你可以先<b>抓包上一家</b>：
    <ul><li>打開他的紅包。真實金額比喊的少，就是說謊：他 −3 並喝一杯，你 +2。門檻降回紅包裡的實際金額（空包或白包就是重新喊起）。</li>
    <li>如果是真的：他當場得到喊的分數再 +2，你 −3 並喝一杯，門檻不變。</li></ul></li>
  <li>不想包也喊不下去，可以<b>敬酒跳過</b>：這輪不包、喝一杯，下一家重新喊起。</li>
  <li>所有人都出手後，<b>本場第一個出手的人</b>可以抓最後一包。</li>
  <li>散席：沒被抓的紅包，照喊的金額拿面子分。</li></ol>
  <table><tr><th>金額</th>${VALS.map(v=>`<th>${money(v)}</th>`).join('')}</tr><tr><td>面子分</td>${VALS.map(v=>`<td>${PTS[v]}</td>`).join('')}</tr></table>
  <h3>白包</h3><p>白包是喪事用的。被打開時，除了說謊的罰分，再額外 −3。留在手上到散場，每個也要 −2。</p>
  <h3>散場計分</h3>
  <p>面子分 + 手上剩下的真鈔（每 2,000 算 1 分）− 留著的白包（每個 2 分）− 喝的酒（每杯 1 分）。同分時手上現金多的人勝。</p>
  <p>7 個紅包袋只打 6 場，所以一定會剩下至少一個。吹牛成功，就能把真鈔留著。</p>
  <h3>親戚身分</h3><ul>${IDK.map(k=>`<li><b>${IDS[k].n}：</b>${IDS[k].d}</li>`).join('')}</ul>
  <h3>喜宴狀況卡</h3><ul>${EVENTS.map(e=>`<li><b>${e.n}：</b>${e.d}</li>`).join('')}</ul>
  <h3>先手補償</h3><p>每場起始玩家依序輪替。第一個出手的人門檻最低，但最後還能抓最後一包；最後出手的人門檻最高，但手上資訊最多。</p>
  <h3>致勝心法</h3>
  <ul><li>越後面越難說真話。手上有大鈔時，搶在門檻還低的時候用掉不一定划算，留到最後剩餘現金也算分。</li>
  <li>算牌：8,800 全場只有 2 張、6,600 只有 4 張。有人喊 8,800，先看看桌上有沒有開過。</li>
  <li>抓包會把門檻拉回來。下一家喊太高、你又喊不上去時，抓他常常是最好的出路。</li></ul>`);}

/* ================= input ================= */
$('#desk').addEventListener('click',e=>{
  if(e.target.closest('#btnAgain')){setupGame(S.cfgPlayers);return;}
  if(e.target.closest('#btnResult')){endModal();return;}
  if(!myTurn())return;
  const b=e.target.closest('button');if(!b||b.disabled)return;
  const cur=curPlayer();
  if(b.id==='btnPeek'){peek(cur);save();}
  else if(b.id==='btnCatch'||b.id==='btnLet'){
    const ev0=S.t>=NP()?lastHid():prevEnv();
    if(b.id==='btnCatch')resolveChallenge(cur,ev0);
    else log(`${pn(cur)} 放過了 ${pn(ev0.p)}。`);
    if(S.t>=NP()){S.sub='done';UI={};if(humans().length>1)S.viewer=null;proceed();return;}
    S.sub='play';UI={};save();
  }
  else if(b.dataset.ci!=null)UI.ci=+b.dataset.ci;
  else if(b.dataset.dec!=null)UI.dec=+b.dataset.dec;
  else if(b.id==='btnCousin')UI.cz=!UI.cz;
  else if(b.id==='btnPlay'){doPlay(cur,UI.ci,UI.dec,!!UI.cz);UI={};if(humans().length>1)S.viewer=null;nextTurn();return;}
  else if(b.id==='btnPass'){doPlay(cur,null);UI={};if(humans().length>1)S.viewer=null;nextTurn();return;}
  else return;
  render();
});
$('#btnRules').addEventListener('click',showRules);
$('#btnNew').addEventListener('click',()=>{if(S&&S.phase!=='end'&&S.phase!=='idle'){openModal(`<h2>放棄目前這局？</h2><p class="sub">目前的進度會被清除。</p><div class="acts"><button class="btn" data-m="no">繼續玩</button><button class="btn primary" data-m="yes">開新遊戲</button></div>`,m=>{if(m==='yes'){clearTimeout(timer);clearSave();showSetup();}else{closeModal();if(S.phase==='head')headModal();else proceed();}});}else showSetup();});

/* ================= boot ================= */
window.__game={setupGame,setSpeed:v=>{SPEED=v;},get S(){return S;},finalScore};
(function boot(){
  S={players:Array.from({length:5},(_,i)=>({name:'—',ai:true,id:IDK[i],hand:[],score:0,drinks:0,peeks:2,cousin:1,known:{}})),w:1,start:0,evs:[0,1,2,3,4,5],t:0,sub:'play',envs:[],thr:0,hist:[],phase:'idle',log:[],viewer:null,last:null};
  render();showSetup();
})();

</script>
