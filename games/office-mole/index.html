<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>尾牙內鬼</title>
<meta name="description" content="原創社交推理派對遊戲：尾牙抽獎被動手腳，靠監視器線索和人資調查揪出內鬼。不需要主持人，被請走的人也能繼續投票。">
<meta name="theme-color" content="#1E5641">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="icon" href="../../icons/icon-192.png">
<link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="桌遊大廳">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Outfit:wght@600;700;800&display=swap">
<style>
:root{
  --paper:#F5EEE1; --paper2:#EFE6D4; --card:#FFFBF4; --ink:#1F2B27; --muted:#6E7068; --line:#E5D9C3; --line2:#D9CBB1;
  --green:#1E5641; --green2:#28704F; --green-ink:#F3F7EF; --yellow:#F5C443; --yellow-ink:#2A2310;
  --orange:#E9643B; --pink:#F7DDD3; --pink2:#EFC6B8; --up:#2C8F4E; --up-bg:#D5EEDA; --down:#C8432F; --down-bg:#F7DAD3; --flat-bg:#ECE5D7;
  --red:#D7542B; --red-bg:#F8DCCF; --blue:#2E7DC0; --blue-bg:#D6E7F5; --violet:#7A5AD3; --violet-bg:#E4DCF7; --gold:#D19A17; --gold-bg:#F6E7BE;
  --p0:#E58FA0; --p1:#8B67D6; --p2:#4F9E61; --p3:#E0922F; --p4:#3E9CC4; --p5:#C8573E; --p6:#6C7A3A; --p7:#5C6BC0;
  --scrim:rgba(40,32,20,.45);
  --f-body:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
  --f-num:'Outfit','Noto Sans TC',system-ui,sans-serif;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55;font-weight:500}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
  background-image:radial-gradient(rgba(120,90,40,.07) 1px,transparent 1px);background-size:5px 5px}
.wrap{position:relative;z-index:1;max-width:1600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 28px}
h1,h2,h3,h4{text-wrap:balance;margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
svg{display:block}

/* header */
.top{display:flex;align-items:center;gap:14px 22px;flex-wrap:wrap;padding-block:6px 12px;border-bottom:1.5px solid var(--line2)}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit}
.brand svg{width:44px;height:44px;flex:none}
.brand h1{font-size:clamp(26px,3.4vw,38px);font-weight:900;letter-spacing:.06em;line-height:1}
.brand small{font-family:var(--f-num);font-size:12px;letter-spacing:.42em;color:var(--ink);font-weight:600;margin-left:6px}
.homelink{display:inline-flex;align-items:center;gap:6px;font-size:15px;font-weight:900;color:var(--ink);text-decoration:none;border:1.5px solid var(--ink);border-radius:12px;padding:7px 12px;background:var(--card)}.homelink svg{width:18px;height:18px}
.vsep{width:1.5px;align-self:stretch;background:var(--line2);margin-block:6px}
.steps{display:flex;align-items:center;flex:1;min-width:0;justify-content:center}
.step{font-family:var(--f-num);font-weight:700;font-size:15px;padding:5px 14px;border-radius:999px;border:1.5px solid var(--line2);background:var(--card);color:var(--ink);white-space:nowrap}
.step.done{color:var(--muted);background:var(--paper2)}
.step.now{background:var(--green);border-color:var(--green);color:var(--green-ink);font-size:17px;padding:6px 18px}
.link{flex:1;min-width:8px;max-width:56px;height:2px;background:repeating-linear-gradient(90deg,var(--line2) 0 4px,transparent 4px 8px)}
.link.done{background:var(--green)}
.tops{display:flex;gap:10px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--ink);background:var(--card);color:var(--ink);padding:8px 16px;border-radius:12px;cursor:pointer;font-weight:700;line-height:1.2;text-decoration:none}
.btn svg{width:18px;height:18px}
.btn:hover:not(:disabled){transform:translateY(-1px)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.dark,.btn.primary{background:var(--green);border-color:var(--green);color:var(--green-ink)}
.btn.ghost{background:transparent}

/* layout */
.board{display:grid;grid-template-columns:minmax(0,1fr) minmax(340px,430px);grid-template-areas:"hero desk" "main desk";grid-template-rows:auto 1fr;gap:14px 18px;margin-top:12px;align-items:start}
.hero{grid-area:hero;position:relative;min-height:140px;display:flex;align-items:center;overflow:hidden;border-radius:18px}
.hero-txt{position:relative;z-index:2;padding:8px 0 10px}
.eyebrow{display:flex;align-items:center;gap:12px;font-family:var(--f-num);font-weight:600;letter-spacing:.32em;font-size:13px}
.eyebrow::after{content:"";width:80px;height:1.5px;background:var(--ink)}
.hero h2{font-size:clamp(28px,4vw,48px);font-weight:900;letter-spacing:.03em;line-height:1.15;margin-top:6px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.swoosh{display:block;width:150px;height:14px;margin-top:-2px}
.qbadge{position:relative;font-size:17px;font-weight:900;border:2px solid var(--ink);border-radius:999px;padding:3px 14px;background:var(--card);letter-spacing:.04em}
.hero-art{position:absolute;right:0;top:0;bottom:0;width:min(62%,640px);z-index:1;
  -webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 28%);mask-image:linear-gradient(90deg,transparent 0%,#000 28%)}
.hero-art svg{width:100%;height:100%}
main{grid-area:main;min-width:0}
.sect{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:900;padding-bottom:10px;border-bottom:1.5px solid var(--line2);margin:0 0 12px}
.sect svg{width:26px;height:26px;color:var(--orange)}
.sect{flex-wrap:wrap}
.sect small{font-size:13px;color:var(--muted);font-weight:700;margin-left:auto}
@media (max-width:640px){.sect small{flex-basis:100%;margin-left:0}}

/* desk */
.desk{grid-area:desk;position:sticky;top:max(10px,env(safe-area-inset-top,0px));background:var(--green);color:var(--green-ink);border-radius:26px;padding:24px 24px 22px;overflow:hidden;display:flex;flex-direction:column;gap:14px;box-shadow:0 18px 40px rgba(20,60,45,.25)}
.desk .leaf{position:absolute;right:-30px;top:-20px;width:190px;height:190px;opacity:.9;pointer-events:none}
.desk>*{position:relative}
.dhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.dhead h2{font-size:clamp(26px,2.6vw,36px);font-weight:900;letter-spacing:.04em;line-height:1.1}
.pill{background:var(--orange);color:#fff;font-weight:900;border-radius:999px;padding:5px 14px;font-size:15px;white-space:nowrap}
.pill.soft{background:rgba(255,255,255,.16)}
.dsub{font-weight:700;font-size:15px;margin-top:-6px;opacity:.9}
.dlab{font-size:14px;opacity:.9;font-weight:900;display:flex;align-items:center;gap:8px;justify-content:space-between}
.dlab small{font-weight:700;opacity:.8;font-size:12px}
.dnote{font-size:13px;font-weight:700;background:rgba(255,255,255,.12);border-radius:10px;padding:7px 12px}
.dnote.warn{background:rgba(233,100,59,.28)}
.confirm{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:none;border-radius:16px;background:var(--yellow);color:var(--yellow-ink);font-size:22px;font-weight:900;padding:13px;cursor:pointer;box-shadow:0 4px 0 #C99A1E;letter-spacing:.06em}
.confirm svg{width:24px;height:24px}
.confirm:active:not(:disabled){transform:translateY(2px);box-shadow:0 2px 0 #C99A1E}
.confirm:disabled{opacity:.5;cursor:not-allowed}
.passbtn{width:100%;border:2px solid rgba(255,255,255,.85);background:transparent;color:var(--green-ink);border-radius:14px;font-weight:900;font-size:17px;padding:10px;cursor:pointer}
.passbtn:hover{background:rgba(255,255,255,.08)}
.empty{border:2px dashed rgba(255,255,255,.35);border-radius:16px;padding:20px 16px;text-align:center;font-weight:700;opacity:.92}
.empty b{display:block;font-size:19px;margin-bottom:4px}
.think{display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.1);border-radius:16px;padding:14px}
.think .av{width:56px;height:56px;flex:none}
.think b{font-size:19px}
.dots::after{content:"…";display:inline-block;animation:blink 1.1s steps(3) infinite}
@keyframes blink{0%{opacity:.2}50%{opacity:1}100%{opacity:.2}}
.chooser{display:flex;flex-wrap:wrap;gap:6px}
.chooser button{border:2px solid rgba(255,255,255,.55);background:transparent;color:var(--green-ink);border-radius:12px;padding:7px 12px;font-weight:900;cursor:pointer;display:inline-flex;align-items:center;gap:6px;min-height:40px}
.chooser button .av{width:24px;height:24px}
.chooser button.on{background:var(--card);color:var(--ink);border-color:var(--card)}
.chooser button:disabled{opacity:.35;cursor:not-allowed}
.chooser button.red.on{background:var(--red);border-color:var(--red);color:#fff}
.chooser button.blue.on{background:var(--blue);border-color:var(--blue);color:#fff}
.chooser.big button{flex:1;justify-content:center;font-size:16px}
.opt2{display:flex;flex-direction:column;gap:6px}
.opt2 button{display:flex;justify-content:space-between;gap:10px;align-items:center;text-align:left;border:2px solid rgba(255,255,255,.4);background:transparent;color:var(--green-ink);border-radius:12px;padding:9px 12px;cursor:pointer}
.opt2 button b{font-weight:900;font-size:15px}
.opt2 button span{font-size:12px;opacity:.85}
.opt2 button.on{background:var(--card);color:var(--ink);border-color:var(--card)}
.opt2 button.on span{opacity:1;color:var(--muted)}
.opt2 button:disabled{opacity:.35;cursor:not-allowed}
.dsec{display:flex;flex-direction:column;gap:8px;padding-top:12px;border-top:1px solid rgba(255,255,255,.2)}

/* private note card */
.intel{position:relative;background:var(--pink);color:var(--ink);border-radius:14px;padding:14px 16px 12px;box-shadow:0 6px 14px rgba(0,0,0,.18)}
.intel::after{content:"";position:absolute;right:0;top:0;width:28px;height:28px;background:linear-gradient(225deg,var(--green) 50%,var(--pink2) 50%);border-bottom-left-radius:8px}
.intel .ilab{display:flex;align-items:center;gap:8px;font-weight:900;color:#B24A35;font-size:16px;padding-bottom:8px;border-bottom:1.5px solid var(--pink2)}
.intel .ilab svg{width:20px;height:20px}
.intel ul{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:260px;overflow:auto}
.intel li{font-size:13.5px;line-height:1.45;display:flex;gap:8px;align-items:flex-start}
.intel li .rt{font-family:var(--f-num);font-weight:700;font-size:11px;border:1.5px solid var(--pink2);border-radius:6px;padding:0 5px;background:var(--card);white-space:nowrap;margin-top:1px}
.intel li.void{opacity:.45;text-decoration:line-through}
.intel .inote{font-size:12.5px;color:#5B4A40;margin-top:8px}
.intel .big{font-size:22px;font-weight:900;margin:8px 0 2px}
.stamp{border:1.5px solid #B24A35;color:#B24A35;border-radius:8px;padding:1px 9px;font-weight:900;font-size:12px;white-space:nowrap;display:inline-block;transform:rotate(-3deg)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:900;padding:1px 9px;border-radius:8px;background:var(--flat-bg);color:var(--ink);white-space:nowrap}
.chip.red{background:var(--red);color:#fff}.chip.blue{background:var(--blue);color:#fff}.chip.violet{background:var(--violet);color:#fff}
.chip.gold{background:var(--gold-bg);color:#6B4D07}.chip.green{background:var(--up-bg);color:var(--up)}.chip.down{background:var(--down-bg);color:var(--down)}

/* feed */
.feed{margin-top:18px}
.feedlist{list-style:none;margin:0;padding:0;overflow:auto;max-height:320px}
.feedlist li{display:grid;grid-template-columns:auto 34px minmax(0,1fr);gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.qtag{font-family:var(--f-num);font-weight:700;font-size:12px;border:1.5px solid var(--line2);border-radius:6px;padding:1px 6px;background:var(--card)}
.feedlist .av{width:34px;height:34px}
.feedlist .txt{font-size:13.5px;line-height:1.45;min-width:0}
.feedlist .ic{width:34px;height:34px;border-radius:50%;background:var(--paper2);display:grid;place-items:center;color:var(--green)}
.feedlist .ic svg{width:18px;height:18px}
.feedlist li.q .txt{font-weight:900;color:var(--green)}
.feedlist li.k .txt{color:#8A4A12}
.pn{font-weight:900;color:var(--ink)}

/* players strip */
.players{margin-top:18px;background:var(--card);border:1.5px solid var(--line);border-radius:20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));padding:8px;gap:6px;box-shadow:0 8px 20px rgba(90,70,30,.06)}
.pl{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:14px;position:relative;min-width:0}
.pl.cur{background:var(--pink)}
.pl .av{width:52px;height:52px;flex:none}
.pl .nm{font-size:17px;font-weight:900;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tag{font-size:11px;font-weight:700;border:1.5px solid var(--line2);border-radius:6px;padding:0 5px;color:var(--muted);background:var(--card)}
.pl .fig{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:13px;color:var(--muted)}
.pl .fig b{font-family:var(--f-num);font-weight:800;color:var(--ink);font-size:16px;margin-left:3px}

/* responsive */
@media (max-width:1040px){
  .board{grid-template-columns:minmax(0,1fr);grid-template-areas:"hero" "desk" "main"}
  .desk{position:relative;top:0}
  .hero-art{width:70%;opacity:.55}
}
@media (max-width:640px){
  .vsep{display:none}
  .steps{order:3;flex-basis:100%;justify-content:flex-start;overflow-x:auto;padding-bottom:2px}
  .step{padding:4px 10px;font-size:13px}.step.now{padding:5px 12px;font-size:15px}
  .brand small{display:none}
  .desk{padding:20px 16px;border-radius:22px}
  .tops .btn{padding:8px 11px}
}

/* modals */
.overlay{position:fixed;inset:0;background:var(--scrim);display:grid;place-items:center;z-index:50;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--card);color:var(--ink);border-radius:24px;border:1.5px solid var(--line);width:min(660px,100%);max-height:calc(100dvh - 32px);overflow:auto;padding:24px;box-shadow:0 30px 70px rgba(40,30,10,.3)}
.modal h2{font-size:27px;font-weight:900;margin-bottom:6px;letter-spacing:.03em}
.modal .sub{color:var(--muted);margin:0 0 14px}
.modal .acts{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}
.modal .acts .btn{padding:10px 20px;font-size:16px}
.modal .intel::after{background:linear-gradient(225deg,var(--card) 50%,var(--pink2) 50%)}
.seats{display:flex;flex-direction:column;gap:10px}
.seat{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center}
.seat .av{width:44px;height:44px}
.seat input{font:inherit;font-weight:700;padding:9px 12px;border:1.5px solid var(--line2);border-radius:12px;background:var(--paper);color:var(--ink);min-width:0;width:100%}
.seg{display:inline-flex;border:1.5px solid var(--line2);border-radius:12px;overflow:hidden;background:var(--paper);flex-wrap:wrap}
.seg button{border:none;background:transparent;color:var(--muted);padding:8px 12px;cursor:pointer;font-weight:700}
.seg button.on{background:var(--green);color:var(--green-ink)}
.field{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:14px 0;flex-wrap:wrap}
.field>span{font-weight:900;font-size:16px}
.note{font-size:12px;color:var(--muted)}
.pitch{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:0 0 6px}
.pitch div{background:var(--paper);border-radius:14px;padding:12px;font-size:13px;color:var(--muted)}
.pitch b{display:block;color:var(--ink);font-size:15px;font-weight:900;margin-bottom:2px}
.setup-art{height:120px;margin:-24px -24px 16px;overflow:hidden;border-radius:24px 24px 0 0}
.setup-art svg{width:100%;height:100%}
.rules{font-size:15px;line-height:1.8}
.rules h3{font-size:19px;font-weight:900;margin:18px 0 6px;color:var(--green)}
.rules p,.rules li{max-width:64ch}
.rules ol,.rules ul{padding-left:1.3em;margin:6px 0}
.rules table{border-collapse:collapse;font-size:14px;margin:6px 0;width:100%}
.rules td,.rules th{border-top:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.rules th{font-size:12px;color:var(--muted)}
.handoff .av{width:84px;height:84px;margin-bottom:10px}
table.res{width:100%;border-collapse:collapse;margin-top:12px;font-size:14px}
table.res th{font-size:12px;color:var(--muted);text-align:right;font-weight:700;padding:4px 6px}
table.res td{text-align:right;padding:8px 6px;border-top:1px solid var(--line);font-family:var(--f-num);font-weight:700;font-variant-numeric:tabular-nums}
table.res th:first-child,table.res td:first-child{text-align:left;font-family:var(--f-body)}
.tablewrap{overflow-x:auto}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--muted)}
.win{font-size:32px;font-weight:900;color:var(--green);margin:4px 0}
.revlist{display:flex;flex-direction:column;gap:8px}
.rev{border:1.5px solid var(--line2);border-radius:14px;padding:10px 14px;background:var(--paper);display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.rev h4{font-size:16px;font-weight:900}
.rev .kn{font-size:12.5px;color:var(--muted);font-weight:700}
@media (prefers-reduced-motion:reduce){.dots::after{animation:none}.btn{transition:none}}


/* ---- game ---- */
/* Layout: prize stage, CCTV clues and the staff roster on the left; the green desk on the right handles night actions, talk and votes. */
.prz{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.pz{border-radius:14px;background:var(--card);border:1.5px solid var(--line2);padding:10px 8px;text-align:center;display:flex;flex-direction:column;gap:2px;align-items:center;min-width:0}
.pz .rk{font-weight:900;font-size:13px;color:var(--muted)}
.pz .ic{font-size:26px;line-height:1.1}
.pz b{font-size:13.5px;font-weight:900;line-height:1.25}
.pz .vv{font-family:var(--f-num);font-weight:800;font-size:12px;color:var(--muted)}
.pz.stolen{background:#4A4A4A;border-color:#4A4A4A;color:#eee}.pz.stolen .rk,.pz.stolen .vv{color:#ccc}
.pz.safe{background:var(--up-bg);border-color:var(--up-bg)}
.pz.now{outline:3px solid var(--yellow);outline-offset:2px}
.pz .st{font-size:11px;font-weight:900;border-radius:6px;padding:0 6px;background:var(--paper2)}
.pz.stolen .st{background:#fff;color:#C8432F}
@media (max-width:560px){.prz{grid-template-columns:repeat(3,minmax(0,1fr))}}
.cluelist{display:flex;flex-wrap:wrap;gap:8px}
.clue{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line2);background:var(--card);border-radius:12px;padding:6px 10px;font-size:13.5px;font-weight:700}
.clue .tv{background:#1F2B27;color:#fff;border-radius:8px;padding:1px 8px;font-weight:900}
.clue.blk{border-style:dashed}
.ros{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.emp{border:1.5px solid var(--line2);background:var(--card);border-radius:14px;padding:8px 10px;display:flex;flex-direction:column;gap:5px;min-width:0;position:relative}
.emp .hd{display:flex;align-items:center;gap:8px;font-weight:900}
.emp .hd .av{width:36px;height:36px;flex:none}
.emp .hd span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  const roles=[];for(let k=0;k<rc.mole;k++)roles.push('mole');roles.push('hr');if(rc.guard)roles.push('guard');if(rc.rookie)roles.push('rookie');
  while(roles.length<n-(rc.boss?1:0))roles.push('staff');
  shuffle(roles);
  let bossSeat=-1;
  if(rc.boss){bossSeat=Math.random()*n|0;roles.splice(bossSeat,0,'boss');}
  const combos=shuffle([0,1,2,3,4,5,6,7].concat([0,1,2,3,4,5,6,7]));
  S={players:players.map((p,i)=>({name:p.name,ai:p.ai,remote:!!p.remote,pid:p.pid||null,role:roles[i],team:roles[i]==='mole'?'mole':'staff',tr:[combos[i]&1,(combos[i]>>1)&1,(combos[i]>>2)&1],alive:true,notes:[],claim:null,said:[]})),
     r:1,phase:'night',score:0,wrong:0,scape:1,clues:[],prizes:PRIZES.map(()=>({st:'wait'})),night:{},talk:{},votes:{},lastGuard:{},start:Math.random()*n|0,log:[],viewer:null,cfgPlayers:players,gid:rid(6)};
  if(NET.host)S.online={code:NET.code};
  const hs=humans();S.viewer=hs.length===1?S.players.indexOf(hs[0]):null;
  log(`尾牙開始！員工 ${n} 人，其中藏著 ${rc.mole} 個內鬼。內鬼要偷到 ${TARGET} 分的獎品才算得逞。`,'q');
  if(bossSeat>=0)log(`${pn(bossSeat)} 是老闆，身分公開，投票算 2 票。`);
  UI={};render();
  if(S.viewer!=null)roleModal(S.viewer,()=>startNight());else startNight();
}
function roleModal(i,cb){
  const p=P(i);
  const mates=p.team==='mole'?S.players.map((_,j)=>j).filter(j=>j!==i&&P(j).team==='mole'):[];
  openModal(`<div class="handoff">${avatar(i)}</div><h2>${esc(p.name)}，你的身分是「${ROLES[p.role].n}」</h2>
   <div class="intel"><div class="ilab">${ICONS.lock}機密</div><img class="rolepic" src="img/${p.role}.webp" alt=""><div class="big">${ROLES[p.role].n}</div><div class="inote">${ROLES[p.role].d}${mates.length?`<br>你的同夥：<b>${mates.map(j=>esc(P(j).name)).join('、')}</b>`:''}</div></div>
   <p class="sub">${p.team==='mole'?`內鬼的目標：偷換的獎品分數加上冤枉好人的次數，累積到 ${TARGET} 分。`:'員工的目標：在內鬼得逞之前把他們全部請走，或撐過五輪抽獎。'}</p>
   <div class="acts"><button class="btn primary" data-m="go">記住了</button></div>`,()=>{closeModal();cb&&cb();});
}

/* ================= helpers ================= */
const order=()=>Array.from({length:NP()},(_,k)=>(S.start+S.r-1+k)%NP());
function nightActors(){
  // who must act tonight, in seat order: every living human (so nobody can tell roles by timing) + AIs with a role
  const firstMole=order().find(i=>P(i).alive&&P(i).team==='mole');
  return order().filter(i=>P(i).alive&&(!P(i).ai||(P(i).role==='hr'||P(i).role==='guard'||i===firstMole)));
}
function curTurn(){
  if(S.phase==='night'){
    // night moves are secret and independent: friends on their own phones act at the same time
    if(NET.client){const me=P(NET.seat);return me&&me.alive&&S.night[NET.seat]==null?NET.seat:null;}
    const pend=nightActors().filter(i=>S.night[i]==null);return pend.find(i=>!P(i).remote)??pend[0]??null;}
  if(S.phase==='talk'){return order().find(i=>S.talk[i]==null)??null;}
  if(S.phase==='vote'){return order().find(i=>S.votes[i]==null)??null;}
  return null;
}
const firstMole=()=>order().find(i=>P(i).alive&&P(i).team==='mole');

/* ================= knowledge / AI ================= */
function knownTeam(i,j){ // what i knows for certain about j: 'mole'|'staff'|null
  if(i===j)return P(i).team;
  const pj=P(j);
  if(!pj.alive&&pj.revealed)return pj.team;
  if(pj.publicTeam)return pj.publicTeam;
  if(pj.role==='boss')return 'staff';
  if(P(i).team==='mole')return pj.team;
  const n=P(i).notes.find(n=>n.j===j);return n?n.t:null;
}
function suspicion(i,j,publicOnly){
  if(!publicOnly){const k=knownTeam(i,j);if(k)return k==='mole'?99:-99;}
  else{const pj=P(j);if(!pj.alive&&pj.revealed)return pj.team==='mole'?99:-99;if(pj.publicTeam)return pj.publicTeam==='mole'?99:-99;if(pj.role==='boss')return -99;}
  let s=0;
  S.clues.forEach(c=>{s+=P(j).tr[c.t]===c.v?.9:-1.1;});
  const claimers=alive().concat(S.players.map((_,k)=>k).filter(k=>!P(k).alive)).filter(k=>P(k).claim);
  S.players.forEach((pk,k)=>{
    if(k===j||k===i)return;
    let trust=1;const hrClaims=S.players.filter(x=>x.claimHR).length;
    if(!pk.claimHR)trust=.35;else if(hrClaims>1)trust=.5;
    if(!pk.alive&&pk.revealed)trust=pk.team==='mole'?-.6:trust*1.2;
    if(pk.publicTeam==='mole')trust=-.6;
    pk.said.forEach(st=>{if(st.j!==j)return;if(st.k==='mole')s+=1.4*trust*(st.r===S.r?1:.8);else if(st.k==='staff')s-=1.2*trust;else if(st.k==='sus')s+=.35*trust;});
  });
  // people who accuse a confirmed staff member look a bit shady
  P(j).said.forEach(st=>{const t=P(st.j);if(st.k==='mole'&&((!t.alive&&t.revealed&&t.team==='staff')||t.role==='boss'||t.publicTeam==='staff'))s+=1.2;});
  return s+(Math.random()-.5)*.3;
}
function rankSus(i,pool,publicOnly){return pool.filter(j=>j!==i).map(j=>({j,s:suspicion(i,j,publicOnly)})).sort((a,b)=>b.s-a.s);}
function aiNight(i){
  const p=P(i),pool=alive().filter(j=>j!==i);
  if(p.team==='mole'){
    const v=PRIZES[S.r-1].v,need=TARGET-S.score-S.wrong;
    let steal=v>=need||v>=4||(v===3&&Math.random()<.75)||(v===2&&Math.random()<.4)||(v===1&&Math.random()<.15);
    if(!steal)return {steal:false};
    const ms=molesAlive();
    const thief=ms.map(m=>({m,s:suspicion(i,m,true)+Math.random()*.6})).sort((a,b)=>a.s-b.s)[0].m;
    const matches=S.clues.filter(c=>P(thief).tr[c.t]===c.v).length;
    const scape=S.scape>0&&(v>=4||matches>=2)&&Math.random()<.8;
    return {steal:true,thief,scape};
  }
  if(p.role==='hr'){const cand=pool.filter(j=>!knownTeam(i,j));const r=rankSus(i,cand.length?cand:pool);return {check:r[0].j};}
  if(p.role==='guard'){const r=rankSus(i,pool.filter(j=>knownTeam(i,j)!=='staff')).filter(x=>x.j!==S.lastGuard[i]);return {watch:(r[0]||rankSus(i,pool)[0]).j};}
  return {};
}
function aiTalk(i){
  const p=P(i);const pool=alive().filter(j=>j!==i);
  if(!pool.length)return {k:'quiet'};
  if(p.team==='mole'){
    const inno=rankSus(i,pool.filter(j=>P(j).team!=='mole'),true);
    // counter-claim if a mole was outed by an HR claim this round
    const outed=S.players.some(x=>x.said.some(st=>st.r===S.r&&st.k==='mole'&&P(st.j).team==='mole'));
    const accuser=S.players.map((x,k)=>k).find(k=>P(k).said.some(st=>st.r===S.r&&st.k==='mole'&&P(st.j).team==='mole'));
    if(outed&&accuser!=null&&P(accuser).team!=='mole'&&P(accuser).alive&&Math.random()<.7)return {k:'mole',j:accuser,hr:true};
    if(!S.players.some(x=>x.claimHR)&&S.r>=2&&Math.random()<.25&&inno[0])return {k:'mole',j:inno[0].j,hr:true};
    if(inno[0]&&inno[0].s>.4)return {k:'sus',j:inno[0].j};
    return {k:'quiet'};
  }
  if(p.role==='hr'&&p.alive){
    const found=p.notes.filter(n=>n.t==='mole'&&P(n.j).alive);
    if(found.length)return {k:'mole',j:found[found.length-1].j,hr:true};
    const last=p.notes[p.notes.length-1];
    if(last&&S.r>=2&&Math.random()<.55&&P(last.j).alive)return {k:'staff',j:last.j,hr:true};
  }
  if(p.role==='guard'){const f=p.notes.find(n=>n.t==='mole'&&P(n.j).alive);if(f)return {k:'mole',j:f.j};}
  const r=rankSus(i,pool);
  if(r[0]&&r[0].s>=1)return {k:'sus',j:r[0].j};
  return {k:'quiet'};
}
function aiVote(i){
  const pool=alive().filter(j=>j!==i);
  if(P(i).team==='mole'){
    const inno=rankSus(i,pool.filter(j=>P(j).team!=='mole'),true);
    // jump on the bandwagon if a teammate is not the leader
    const tally=voteTally();const lead=Object.entries(tally).sort((a,b)=>b[1]-a[1])[0];
    if(lead&&P(+lead[0]).team!=='mole'&&Math.random()<.6)return +lead[0];
    return inno[0]&&inno[0].s>.2?inno[0].j:-1;
  }
  const r=rankSus(i,pool);
  const tally=voteTally();
  if(r[0]&&r[0].s>=.9)return r[0].j;
  const lead=Object.entries(tally).sort((a,b)=>b[1]-a[1])[0];
  if(lead&&+lead[0]!==i&&suspicion(i,+lead[0])>.2)return +lead[0];
  return -1;
}
function voteTally(){const t={};for(const k in S.votes){const j=S.votes[k];if(j>=0)t[j]=(t[j]||0)+(P(+k).role==='boss'?2:1);}return t;}

/* ================= flow ================= */
function startNight(){S.phase='night';S.night={};S.nightRes=null;render();save();
  log(`第 ${S.r} 晚：今晚準備的是${PRIZES[S.r-1].rk}「${PRIZES[S.r-1].n}」。大家下班了……`,'q');proceed();}
function proceed(){
  clearTimeout(timer);save();
  if(!S||!$('#overlay').hidden)return;
  if(S.phase!=='night'&&S.phase!=='talk'&&S.phase!=='vote')return render();
  const cur=curTurn();
  if(cur==null){if(S.phase==='night')resolveNight();else if(S.phase==='talk'){S.phase='vote';S.votes={};log('發言結束，開始投票。誰要被請去倉庫盤點？','q');proceed();}else resolveVote();return;}
  const p=P(cur);
  if(p.remote){render();return;}
  if(p.ai){render();timer=setTimeout(()=>{
    if(S.phase==='night'){S.night[cur]=aiNight(cur);}
    else if(S.phase==='talk'){applyTalk(cur,aiTalk(cur));}
    else{applyVote(cur,aiVote(cur));}
    proceed();},S.phase==='night'?(humans().length?120:SPEED/4):(humans().length?(S.phase==='talk'?Math.max(SPEED,1300):S.phase==='vote'?Math.max(SPEED,700):Math.min(SPEED,500)):S.phase==='talk'?Math.max(SPEED,900):SPEED/3));return;}
  if(S.phase==='night'&&S.viewer!==cur){
    S.viewer=null;UI={};render();
    openModal(`<div class="handoff">${avatar(cur)}</div><h2>請把裝置交給 ${esc(p.name)}</h2><p class="sub">夜晚行動是秘密的。其他人請轉頭，不要看畫面。</p>
     <div class="acts"><button class="btn primary" data-m="go">我是 ${esc(p.name)}，開始</button></div>`,()=>{closeModal();S.viewer=cur;UI={};render();scrollDeskIntoView();});
    return;
  }
  if(S.phase!=='night'&&humans().length>1)S.viewer=null;
  render();
}
function resolveNight(){
  const r=S.r-1,pz=PRIZES[r];
  const fm=Object.keys(S.night).map(Number).find(i=>P(i).team==='mole'&&S.night[i].steal!=null);
  const mv=fm!=null?S.night[fm]:{steal:false};
  const res={steal:false};
  // HR checks
  S.players.forEach((p,i)=>{const a=S.night[i];if(!a)return;
    if(a.check!=null){p.notes.push({j:a.check,t:P(a.check).team,r:S.r,how:'調查'});}
    if(a.watch!=null)S.lastGuard[i]=a.watch;});
  if(mv.steal){
    const thief=mv.thief;
    const guarded=S.players.map((_,g)=>g).filter(g=>S.night[g]&&S.night[g].watch===thief);
    const t=Math.random()*3|0;let v=P(thief).tr[t];
    if(mv.scape&&S.scape>0){v=1-v;S.scape=0;}
    const blocked=guarded.length>0;
    S.clues.push({t,v,r:S.r,blocked,fake:mv.scape&&!blocked?true:!!mv.scape,thief});
    guarded.forEach(g=>P(g).notes.push({j:thief,t:'mole',r:S.r,how:'當場逮到'}));
    if(blocked){S.prizes[r].st='safe';res.blocked=true;}
    else{S.prizes[r].st='stolen';S.score+=pz.v;res.steal=true;}
    res.clue={t,v};
  }else S.prizes[r].st='safe';
  S.nightRes=res;S.phase='morning';
  const winner=pick(alive());
  if(res.steal)log(`早上抽${pz.rk}，結果抽出來是「銘謝惠顧」！${pz.n}被偷換了（內鬼 +${pz.v}）。監視器拍到動手的人<b>${trTxt(res.clue.t,res.clue.v)}</b>。`,'k');
  else if(res.blocked)log(`有人想偷換${pz.rk}，被保全攔下了！${pz.n}順利抽出。監視器拍到那個人<b>${trTxt(res.clue.t,res.clue.v)}</b>。`,'k');
  else log(`${pz.rk}「${pz.n}」順利抽出，由 ${pn(winner)} 抽中。昨晚好像很平靜。`);
  render();save();
  if(checkWin())return;
  const body=res.steal?`<div class="big">銘謝惠顧！</div><div class="inote">${pz.rk}「${pz.n}」被偷換了，內鬼 +${pz.v} 分。<br>監視器拍到：動手的人<b>${trTxt(res.clue.t,res.clue.v)}</b>。</div>`:res.blocked?`<div class="big">保全攔下了！</div><div class="inote">${pz.n}保住了。<br>監視器拍到：想動手的人<b>${trTxt(res.clue.t,res.clue.v)}</b>。</div>`:`<div class="big">${pz.ic} ${pz.n}</div><div class="inote">順利抽出，昨晚沒有人動手。</div>`;
  openModal(`<h2>第 ${S.r} 天早上</h2><div class="intel" style="margin:6px 0 4px"><div class="ilab">${ICONS.spark}抽獎結果</div>${body}</div>
   <p class="sub">內鬼目前 ${S.score+S.wrong} / ${TARGET} 分。接下來每個人輪流發言一次，再投票。</p>
   <div class="acts"><button class="btn primary" data-m="go">開始發言</button></div>`,()=>{closeModal();S.phase='talk';S.talk={};S.viewer=humans().length===1?S.players.indexOf(humans()[0]):null;proceed();});
  if(!humans().length)timer=setTimeout(()=>modalCb&&modalCb('go'),SPEED*2);
}
function applyTalk(i,t){
  S.talk[i]=t;
  if(t.k==='quiet'){log(`${pn(i)}：「我先聽聽大家怎麼說。」`);return;}
  P(i).said.push({j:t.j,k:t.k,r:S.r});
  if(t.hr)P(i).claimHR=true;
  if(t.k==='sus')log(`${pn(i)}：「我覺得 ${pn(t.j)} 怪怪的。」`);
  else if(t.k==='mole')log(`${pn(i)}：「${t.hr?'我是人資，我查過了，':''}${pn(t.j)} 就是內鬼！」`,'k');
  else log(`${pn(i)}：「${t.hr?'我是人資，':''}${pn(t.j)} 是清白的。」`);
}
function applyVote(i,j){S.votes[i]=j;if(TBL)TBL.say(i,j>=0?`我投 ${P(j).name}`:'我棄票','v');log(j>=0?`${pn(i)} 投給 ${pn(j)}${P(i).role==='boss'?'（老闆 2 票）':''}。`:`${pn(i)} 棄票。`);}
function resolveVote(){
  const t=voteTally();const arr=Object.entries(t).sort((a,b)=>b[1]-a[1]);
  let out=null;
  if(arr.length&&arr[0][1]>=2&&(!arr[1]||arr[1][1]<arr[0][1]))out=+arr[0][0];
  if(out==null){log('票數不夠集中，今天沒有人被請走。','q');return endDay();}
  const p=P(out);p.alive=false;p.revealed=true;
  if(p.team==='mole')log(`${pn(out)} 被請去倉庫盤點……身分翻開：<b>內鬼</b>！`,'k');
  else{S.wrong++;log(`${pn(out)} 被請去倉庫盤點……身分翻開：${ROLES[p.role].n}。冤枉好人，內鬼 +1。`,'k');}
  render();save();
  if(checkWin())return;
  if(p.role==='rookie'){
    if(p.ai){const r=rankSus(out,alive());rookieReveal(out,r[0].j);return;}
    S.phase='rookie';S.rk=out;render();
    if(p.remote)return;
    openModal(`<div class="handoff">${avatar(out)}</div><h2>新人的委屈</h2><p class="sub">${esc(p.name)}，你是新人。指定一位還在場的同事，公開他的陣營。</p>
     <div class="chooser big" style="flex-wrap:wrap">${alive().map(j=>`<button class="btn" data-m="${j}">${esc(P(j).name)}</button>`).join('')}</div>`,m=>{closeModal();rookieReveal(out,+m);});
    return;
  }
  endDay();
}
function rookieReveal(i,j){P(j).publicTeam=P(j).team;log(`新人 ${pn(i)} 臨走前指著 ${pn(j)}：他的陣營是 <b>${P(j).team==='mole'?'內鬼':'員工'}</b>。`,'k');if(!checkWin())endDay();}
function endDay(){
  if(S.r>=ROUNDS){finish('staff','五輪抽獎撐完了，內鬼沒能得逞。');return;}
  S.r++;S.phase='night';render();save();
  timer=setTimeout(()=>startNight(),humans().length?300:SPEED/2);
}
function checkWin(){
  if(!molesAlive().length){finish('staff','所有內鬼都被揪出來了！');return true;}
  if(S.score+S.wrong>=TARGET){finish('mole',`內鬼累積 ${S.score+S.wrong} 分，得逞了。`);return true;}
  return false;
}
function finish(team,why){
  S.phase='end';S.win=team;S.why=why;
  log(`遊戲結束：${team==='mole'?'內鬼':'員工'}獲勝。${why}`,'q');
  clearSave();render();endModal();
}
function endModal(){
  openModal(`<h2>尾牙落幕</h2><div class="win">${S.win==='mole'?'內鬼得逞':'員工獲勝'}</div><p class="sub">${S.why}</p>
   <div class="tablewrap"><table class="res"><thead><tr><th>同事</th><th>身分</th><th>陣營</th><th>狀態</th></tr></thead><tbody>
   ${S.players.map((p,i)=>`<tr><td>${esc(p.name)}</td><td style="font-family:var(--f-body)">${ROLES[p.role].n}</td><td style="font-family:var(--f-body)" class="${p.team==='mole'?'down':'up'}">${p.team==='mole'?'內鬼':'員工'}</td><td style="font-family:var(--f-body)">${p.alive?'在場':'被請走'}</td></tr>`).join('')}</tbody></table></div>
   <h3 style="font-size:17px;font-weight:900;margin:16px 0 8px">每一條線索的真相</h3>
   <div class="cluelist">${S.clues.map(c=>`<div class="clue">第 ${c.r} 晚・${esc(P(c.thief).name)} 動手・線索「${trTxt(c.t,c.v)}」${c.fake?'<span class="chip down">甩鍋假線索</span>':''}${c.blocked?'<span class="chip green">被保全攔下</span>':''}</div>`).join('')||'<div class="clue">內鬼一次都沒有動手。</div>'}</div>
   <div class="acts"><button class="btn${NET.client?' primary':''}" data-m="close">看看名冊</button>${NET.client?'':'<button class="btn primary" data-m="again">再來一局</button>'}</div>`,m=>{closeModal();if(m==='again')setupGame(S.cfgPlayers);});
}

/* ================= view ================= */
function myTurn(){const c=curTurn();if(c==null||P(c).ai||!$('#overlay').hidden||UI.sent)return false;if(NET.client)return c===NET.seat;if(P(c).remote)return false;return S.phase==='night'?S.viewer===c:true;}
function render(){
  if(!S)return;
  let st='';for(let i=1;i<=ROUNDS;i++){if(i>1)st+=`<span class="link ${i<=S.r?'done':''}"></span>`;st+=`<span class="step ${i<S.r||S.phase==='end'?'done':i===S.r&&S.phase!=='idle'?'now':''}">${PRIZES[i-1].rk}</span>`;}
  $('#steps').innerHTML=st;
  const head={idle:'抽獎箱被動了手腳',night:'深夜的辦公室',morning:'抽獎時間',talk:'大家輪流發言',vote:'投票請人去盤點',rookie:'新人的委屈',end:'尾牙落幕'}[S.phase];

  <h3>甩鍋</h3><p>內鬼全隊整場只有一次，可以讓當晚的監視器線索變成相反的特徵。所以每條線索都不一定可靠。</p>
  <h3>致勝心法</h3>
  <ul><li>員工：把所有線索疊起來，看誰的特徵最吻合。但記得可能有一條是假的。</li>
  <li>內鬼：前面的小獎不偷也沒關係，頭獎和二獎加起來就有 9 分。動手越少，線索越少。</li>
  <li>人資：太早跳出來會被內鬼反咬，太晚又來不及。保全攔到人時，可以直接指控。</li></ul>
  <h3>和實體版的差別</h3><p>實體版用閉眼和傳卡處理夜晚，沒有主持人時由大家輪流翻線索卡。App 版由程式代替主持，白天的自由討論改成每人一句結構化發言，真人之間仍然可以直接聊。</p>`);}

/* ================= input ================= */
$('#desk').addEventListener('click',e=>{
  if(e.target.closest('#btnAgain')){setupGame(S.cfgPlayers);return;}
  if(e.target.closest('#btnResult')){endModal();return;}
  if(!myTurn())return;
  const b=e.target.closest('button');if(!b||b.disabled)return;
  const cur=curTurn();
  if(b.dataset.steal!=null){UI.steal=b.dataset.steal==='1';if(!UI.steal){UI.thief=null;UI.scape=false;}}
  else if(b.dataset.thief!=null)UI.thief=+b.dataset.thief;
  else if(b.id==='btnScape')UI.scape=!UI.scape;
  else if(b.dataset.tgt!=null)UI.tgt=+b.dataset.tgt;
  else if(b.dataset.k){UI.k=b.dataset.k;if(UI.k==='sus')UI.hr=false;}
  else if(b.id==='btnHR')UI.hr=!UI.hr;
  else if(b.id==='btnCheck'){if(NET.client){act({t:'night',a:{check:UI.tgt}});return;}UI.res=P(UI.tgt).team;}
  else if(b.id==='btnPeek'){roleModal(cur,()=>{render();});return;}
  else if(b.id==='btnNight'){
    const p=P(cur);let a={};
    if(p.team==='mole'&&cur===firstMole())a=UI.steal?{steal:true,thief:UI.thief,scape:!!UI.scape}:{steal:false};
    else if(p.role==='hr')a={check:UI.tgt};
    else if(p.role==='guard')a={watch:UI.tgt};
    act({t:'night',a});return;
  }
  else if(b.id==='btnTalk'){const k=UI.k||'quiet';act({t:'talk',v:k==='quiet'?{k}:{k,j:UI.tgt,hr:!!UI.hr&&k!=='sus'}});return;}
  else if(b.id==='btnVote'){act({t:'vote',j:UI.tgt});return;}
  else return;
  render();
});
$('#btnRules').addEventListener('click',showRules);
$('#btnNew').addEventListener('click',()=>{if(NET.online){NET.confirmLeave();return;}if(S&&S.phase!=='end'&&S.phase!=='idle'){openModal(`<h2>放棄目前這局？</h2><p class="sub">目前的進度會被清除。</p><div class="acts"><button class="btn" data-m="no">繼續玩</button><button class="btn primary" data-m="yes">開新遊戲</button></div>`,m=>{if(m==='yes'){clearTimeout(timer);clearSave();showSetup();}else{closeModal();if(S.phase==='morning'){S.phase='talk';S.talk={};}else if(S.phase==='rookie'){endDay();return;}proceed();}});}else showSetup();});

// one entry point for a seat's move: this device, or the host applying a move sent from a friend's phone
function act(a){
  if(NET.client){NET.send(a);UI={sent:true};render();return;}
  applyAct(curTurn(),a);
}
function applyAct(cur,a){
  if(cur==null)return;
  const p=P(cur),ok=j=>Number.isInteger(j)&&j>=0&&j<NP()&&j!==cur&&P(j).alive;
  if(a.t==='night'&&S.phase==='night'){
    if(S.night[cur]!=null||!nightActors().includes(cur))return;
    const x=a.a||{};let v={};
    if(p.team==='mole'&&cur===firstMole())v=x.steal&&molesAlive().includes(+x.thief)?{steal:true,thief:+x.thief,scape:!!x.scape&&S.scape>0}:{steal:false};
    else if(p.role==='hr'&&ok(+x.check))v={check:+x.check};
    else if(p.role==='guard'&&ok(+x.watch)&&S.lastGuard[cur]!==+x.watch)v={watch:+x.watch};
    S.night[cur]=v;UI={};if(humans().length>1)S.viewer=null;
  }else if(a.t==='talk'&&S.phase==='talk'&&curTurn()===cur){
    const x=a.v||{},k=['quiet','sus','mole','staff'].includes(x.k)?x.k:'quiet';
    if(k!=='quiet'&&!ok(+x.j))return;
    applyTalk(cur,k==='quiet'?{k}:{k,j:+x.j,hr:!!x.hr&&k!=='sus'});UI={};
  }else if(a.t==='vote'&&S.phase==='vote'&&curTurn()===cur){
    const j=+a.j;if(j!==-1&&!ok(j))return;
    applyVote(cur,j);UI={};
  }else return;
  if($('#overlay').hidden)proceed();else{save();render();}
}
const GAME={id:'office-mole',name:'尾牙內鬼',hostKey:'office-mole-net-host',clientKey:'office-mole-net-client',min:5,max:12,aiNames:AI_NAMES,
  secretHint:'你的身分、同夥和調查結果只會出現在你自己的手機上。',
  start(cfg){setupGame(cfg);},
  strip(pub){
    if(pub.phase==='end')return;
    pub.players.forEach(p=>{if(!p.revealed&&p.role!=='boss'){p.role=null;p.team=null;}p.notes=[];});
    pub.clues.forEach(c=>{c.thief=null;c.fake=null;});
    for(const k in pub.night)pub.night[k]=1;
    pub.lastGuard={};pub.scape=null;
  },
  secret(i){const p=S.players[i];return {role:p.role,team:p.team,notes:p.notes,mates:p.team==='mole'?S.players.map((q,j)=>q.team==='mole'?j:-1).filter(j=>j>=0):[],scape:p.team==='mole'?S.scape:null,lg:S.lastGuard[i]??null};},
  applySecret(seat,sec){
    if(S.phase==='end')return;const p=S.players[seat];p.role=sec.role;p.team=sec.team;p.notes=sec.notes||[];
    (sec.mates||[]).forEach(j=>{if(S.players[j]){S.players[j].team='mole';if(!S.players[j].role)S.players[j].role='mole';}});
    if(sec.scape!=null)S.scape=sec.scape;if(sec.lg!=null)S.lastGuard[seat]=sec.lg;
  },
  waiting(){if(!S)return [];
    if(S.phase==='night')return nightActors().filter(i=>S.night[i]==null&&!P(i).ai);
    if(S.phase==='talk'||S.phase==='vote'){const c=curTurn();return c!=null&&!P(c).ai?[c]:[];}
    if(S.phase==='rookie'&&S.rk!=null&&!P(S.rk).ai)return [S.rk];
    return [];},
  action(seat,a){
    if(a.t==='rookie'){if(S.phase!=='rookie'||S.rk!==seat)return;const j=+a.j;if(!alive().includes(j))return;S.phase='vote';S.rk=null;rookieReveal(seat,j);return;}
    applyAct(seat,a);
  },
  afterTakeover(ws){ws.forEach(i=>{S.cfgPlayers[i]={name:S.players[i].name,ai:true};});
    if(S.phase==='rookie'&&ws.includes(S.rk)){const out=S.rk;S.rk=null;const r=rankSus(out,alive());rookieReveal(out,r[0].j);return;}
    if($('#overlay').hidden)proceed();else render();},
  resumeUI(){if(S.phase==='end')endModal();else if(S.phase==='morning'){S.phase='talk';S.talk={};proceed();}else proceed();},
  clientReset(prev){if(!prev||prev.gid!==S.gid||prev.phase!==S.phase||prev.r!==S.r||JSON.stringify(prev.talk)!==JSON.stringify(S.talk)||JSON.stringify(prev.votes)!==JSON.stringify(S.votes)||prev.night[NET.seat]!==S.night[NET.seat])UI={};},
  clientModal(){
    const g=S.gid;
    if(S.phase==='end')return {key:'end'+g,open:endModal};
    if(S.secOK&&this.seenRole!==g)return {key:'role'+g,open:()=>roleModal(NET.seat,()=>{this.seenRole=g;NET.resync();})};
    if(S.phase==='morning'){const l=S.log.find(x=>x.r===S.r&&/抽/.test(x.h));return {key:'m'+g+S.r,open:()=>openModal(`<h2>第 ${S.r} 天早上</h2><div class="intel" style="margin:6px 0 4px"><div class="ilab">${ICONS.spark}抽獎結果</div><div class="inote">${l?l.h:''}</div></div><p class="sub">內鬼目前 ${S.score+S.wrong} / ${TARGET} 分。等房主開始發言。</p><div class="acts"><button class="btn primary" data-m="ok">知道了</button></div>`,()=>closeModal())};}
    if(S.phase==='rookie'&&S.rk===NET.seat)return {key:'rk'+g+S.r,open:()=>openModal(`<div class="handoff">${avatar(NET.seat)}</div><h2>新人的委屈</h2><p class="sub">你是新人。指定一位還在場的同事，公開他的陣營。</p><div class="chooser big" style="flex-wrap:wrap">${alive().map(j=>`<button class="btn" data-m="${j}">${esc(P(j).name)}</button>`).join('')}</div>`,m=>{closeModal();NET.send({t:'rookie',j:+m});})};
    return null;
  },
};

window.__game={setupGame,setSpeed:v=>{SPEED=v;},get S(){return S;}};
(function boot(){
  S={players:Array.from({length:7},(_,i)=>({name:'—',ai:true,role:'staff',team:'staff',tr:[i&1,(i>>1)&1,(i>>2)&1],alive:true,notes:[],said:[]})),r:1,phase:'idle',score:0,wrong:0,scape:1,clues:[],prizes:PRIZES.map(()=>({st:'wait'})),night:{},talk:{},votes:{},lastGuard:{},start:0,log:[],viewer:null};
  render();showSetup();
})();
