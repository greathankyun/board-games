<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>貓咪咖啡廳</title>
<meta name="description" content="原創板塊拼放桌遊：挑家具板塊拼出自己的咖啡廳，排對位置才能吸引 10 種個性不同的貓咪入住，每局隨機計分目標。">
<meta name="theme-color" content="#1E5641">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="icon" href="../../icons/icon-192.png">
<link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="桌遊大廳">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Outfit:wght@600;700;800&display=swap">
<style>
:root{
  --paper:#F5EEE1; --paper2:#EFE6D4; --card:#FFFBF4; --ink:#1F2B27; --muted:#6E7068; --line:#E5D9C3; --line2:#D9CBB1;
  --green:#1E5641; --green2:#28704F; --green-ink:#F3F7EF; --yellow:#F5C443; --yellow-ink:#2A2310;
  --orange:#E9643B; --pink:#F7DDD3; --pink2:#EFC6B8; --up:#2C8F4E; --up-bg:#D5EEDA; --down:#C8432F; --down-bg:#F7DAD3; --flat-bg:#ECE5D7;
  --red:#D7542B; --red-bg:#F8DCCF; --blue:#2E7DC0; --blue-bg:#D6E7F5; --violet:#7A5AD3; --violet-bg:#E4DCF7; --gold:#D19A17; --gold-bg:#F6E7BE;
  --p0:#E58FA0; --p1:#8B67D6; --p2:#4F9E61; --p3:#E0922F; --p4:#3E9CC4; --p5:#C8573E; --p6:#6C7A3A; --p7:#5C6BC0;
  --scrim:rgba(40,32,20,.45);
  --f-body:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
  --f-num:'Outfit','Noto Sans TC',system-ui,sans-serif;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55;font-weight:500}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
  background-image:radial-gradient(rgba(120,90,40,.07) 1px,transparent 1px);background-size:5px 5px}
.wrap{position:relative;z-index:1;max-width:1600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 28px}
h1,h2,h3,h4{text-wrap:balance;margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
svg{display:block}

/* header */
.top{display:flex;align-items:center;gap:14px 22px;flex-wrap:wrap;padding-block:6px 12px;border-bottom:1.5px solid var(--line2)}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit}
.brand svg{width:44px;height:44px;flex:none}
.brand h1{font-size:clamp(26px,3.4vw,38px);font-weight:900;letter-spacing:.06em;line-height:1}
.brand small{font-family:var(--f-num);font-size:12px;letter-spacing:.42em;color:var(--ink);font-weight:600;margin-left:6px}
.homelink{display:inline-flex;align-items:center;gap:6px;font-size:15px;font-weight:900;color:var(--ink);text-decoration:none;border:1.5px solid var(--ink);border-radius:12px;padding:7px 12px;background:var(--card)}.homelink svg{width:18px;height:18px}
.vsep{width:1.5px;align-self:stretch;background:var(--line2);margin-block:6px}
.steps{display:flex;align-items:center;flex:1;min-width:0;justify-content:center}
.step{font-family:var(--f-num);font-weight:700;font-size:15px;padding:5px 14px;border-radius:999px;border:1.5px solid var(--line2);background:var(--card);color:var(--ink);white-space:nowrap}
.step.done{color:var(--muted);background:var(--paper2)}
.step.now{background:var(--green);border-color:var(--green);color:var(--green-ink);font-size:17px;padding:6px 18px}
.link{flex:1;min-width:8px;max-width:56px;height:2px;background:repeating-linear-gradient(90deg,var(--line2) 0 4px,transparent 4px 8px)}
.link.done{background:var(--green)}
.tops{display:flex;gap:10px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--ink);background:var(--card);color:var(--ink);padding:8px 16px;border-radius:12px;cursor:pointer;font-weight:700;line-height:1.2;text-decoration:none}
.btn svg{width:18px;height:18px}
.btn:hover:not(:disabled){transform:translateY(-1px)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.dark,.btn.primary{background:var(--green);border-color:var(--green);color:var(--green-ink)}
.btn.ghost{background:transparent}

/* layout */
.board{display:grid;grid-template-columns:minmax(0,1fr) minmax(340px,430px);grid-template-areas:"hero desk" "main desk";grid-template-rows:auto 1fr;gap:14px 18px;margin-top:12px;align-items:start}
.hero{grid-area:hero;position:relative;min-height:140px;display:flex;align-items:center;overflow:hidden;border-radius:18px}
.hero-txt{position:relative;z-index:2;padding:8px 0 10px}
.eyebrow{display:flex;align-items:center;gap:12px;font-family:var(--f-num);font-weight:600;letter-spacing:.32em;font-size:13px}
.eyebrow::after{content:"";width:80px;height:1.5px;background:var(--ink)}
.hero h2{font-size:clamp(28px,4vw,48px);font-weight:900;letter-spacing:.03em;line-height:1.15;margin-top:6px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.swoosh{display:block;width:150px;height:14px;margin-top:-2px}
.qbadge{position:relative;font-size:17px;font-weight:900;border:2px solid var(--ink);border-radius:999px;padding:3px 14px;background:var(--card);letter-spacing:.04em}
.hero-art{position:absolute;right:0;top:0;bottom:0;width:min(62%,640px);z-index:1;
  -webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 28%);mask-image:linear-gradient(90deg,transparent 0%,#000 28%)}
.hero-art svg{width:100%;height:100%}
main{grid-area:main;min-width:0}
.sect{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:900;padding-bottom:10px;border-bottom:1.5px solid var(--line2);margin:0 0 12px}
.sect svg{width:26px;height:26px;color:var(--orange)}
.sect{flex-wrap:wrap}
.sect small{font-size:13px;color:var(--muted);font-weight:700;margin-left:auto}
@media (max-width:640px){.sect small{flex-basis:100%;margin-left:0}}

/* desk */
.desk{grid-area:desk;position:sticky;top:max(10px,env(safe-area-inset-top,0px));background:var(--green);color:var(--green-ink);border-radius:26px;padding:24px 24px 22px;overflow:hidden;display:flex;flex-direction:column;gap:14px;box-shadow:0 18px 40px rgba(20,60,45,.25)}
.desk .leaf{position:absolute;right:-30px;top:-20px;width:190px;height:190px;opacity:.9;pointer-events:none}
.desk>*{position:relative}
.dhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.dhead h2{font-size:clamp(26px,2.6vw,36px);font-weight:900;letter-spacing:.04em;line-height:1.1}
.pill{background:var(--orange);color:#fff;font-weight:900;border-radius:999px;padding:5px 14px;font-size:15px;white-space:nowrap}
.pill.soft{background:rgba(255,255,255,.16)}
.dsub{font-weight:700;font-size:15px;margin-top:-6px;opacity:.9}
.dlab{font-size:14px;opacity:.9;font-weight:900;display:flex;align-items:center;gap:8px;justify-content:space-between}
.dlab small{font-weight:700;opacity:.8;font-size:12px}
.dnote{font-size:13px;font-weight:700;background:rgba(255,255,255,.12);border-radius:10px;padding:7px 12px}
.dnote.warn{background:rgba(233,100,59,.28)}
.confirm{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:none;border-radius:16px;background:var(--yellow);color:var(--yellow-ink);font-size:22px;font-weight:900;padding:13px;cursor:pointer;box-shadow:0 4px 0 #C99A1E;letter-spacing:.06em}
.confirm svg{width:24px;height:24px}
.confirm:active:not(:disabled){transform:translateY(2px);box-shadow:0 2px 0 #C99A1E}
.confirm:disabled{opacity:.5;cursor:not-allowed}
.passbtn{width:100%;border:2px solid rgba(255,255,255,.85);background:transparent;color:var(--green-ink);border-radius:14px;font-weight:900;font-size:17px;padding:10px;cursor:pointer}
.passbtn:hover{background:rgba(255,255,255,.08)}
.empty{border:2px dashed rgba(255,255,255,.35);border-radius:16px;padding:20px 16px;text-align:center;font-weight:700;opacity:.92}
.empty b{display:block;font-size:19px;margin-bottom:4px}
.think{display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.1);border-radius:16px;padding:14px}
.think .av{width:56px;height:56px;flex:none}
.think b{font-size:19px}
.dots::after{content:"…";display:inline-block;animation:blink 1.1s steps(3) infinite}
@keyframes blink{0%{opacity:.2}50%{opacity:1}100%{opacity:.2}}
.chooser{display:flex;flex-wrap:wrap;gap:6px}
.chooser button{border:2px solid rgba(255,255,255,.55);background:transparent;color:var(--green-ink);border-radius:12px;padding:7px 12px;font-weight:900;cursor:pointer;display:inline-flex;align-items:center;gap:6px;min-height:40px}
.chooser button .av{width:24px;height:24px}
.chooser button.on{background:var(--card);color:var(--ink);border-color:var(--card)}
.chooser button:disabled{opacity:.35;cursor:not-allowed}
.chooser button.red.on{background:var(--red);border-color:var(--red);color:#fff}
.chooser button.blue.on{background:var(--blue);border-color:var(--blue);color:#fff}
.chooser.big button{flex:1;justify-content:center;font-size:16px}
.opt2{display:flex;flex-direction:column;gap:6px}
.opt2 button{display:flex;justify-content:space-between;gap:10px;align-items:center;text-align:left;border:2px solid rgba(255,255,255,.4);background:transparent;color:var(--green-ink);border-radius:12px;padding:9px 12px;cursor:pointer}
.opt2 button b{font-weight:900;font-size:15px}
.opt2 button span{font-size:12px;opacity:.85}
.opt2 button.on{background:var(--card);color:var(--ink);border-color:var(--card)}
.opt2 button.on span{opacity:1;color:var(--muted)}
.opt2 button:disabled{opacity:.35;cursor:not-allowed}
.dsec{display:flex;flex-direction:column;gap:8px;padding-top:12px;border-top:1px solid rgba(255,255,255,.2)}

/* private note card */
.intel{position:relative;background:var(--pink);color:var(--ink);border-radius:14px;padding:14px 16px 12px;box-shadow:0 6px 14px rgba(0,0,0,.18)}
.intel::after{content:"";position:absolute;right:0;top:0;width:28px;height:28px;background:linear-gradient(225deg,var(--green) 50%,var(--pink2) 50%);border-bottom-left-radius:8px}
.intel .ilab{display:flex;align-items:center;gap:8px;font-weight:900;color:#B24A35;font-size:16px;padding-bottom:8px;border-bottom:1.5px solid var(--pink2)}
.intel .ilab svg{width:20px;height:20px}
.intel ul{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:260px;overflow:auto}
.intel li{font-size:13.5px;line-height:1.45;display:flex;gap:8px;align-items:flex-start}
.intel li .rt{font-family:var(--f-num);font-weight:700;font-size:11px;border:1.5px solid var(--pink2);border-radius:6px;padding:0 5px;background:var(--card);white-space:nowrap;margin-top:1px}
.intel li.void{opacity:.45;text-decoration:line-through}
.intel .inote{font-size:12.5px;color:#5B4A40;margin-top:8px}
.intel .big{font-size:22px;font-weight:900;margin:8px 0 2px}
.stamp{border:1.5px solid #B24A35;color:#B24A35;border-radius:8px;padding:1px 9px;font-weight:900;font-size:12px;white-space:nowrap;display:inline-block;transform:rotate(-3deg)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:900;padding:1px 9px;border-radius:8px;background:var(--flat-bg);color:var(--ink);white-space:nowrap}
.chip.red{background:var(--red);color:#fff}.chip.blue{background:var(--blue);color:#fff}.chip.violet{background:var(--violet);color:#fff}
.chip.gold{background:var(--gold-bg);color:#6B4D07}.chip.green{background:var(--up-bg);color:var(--up)}.chip.down{background:var(--down-bg);color:var(--down)}

/* feed */
.feed{margin-top:18px}
.feedlist{list-style:none;margin:0;padding:0;overflow:auto;max-height:320px}
.feedlist li{display:grid;grid-template-columns:auto 34px minmax(0,1fr);gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.qtag{font-family:var(--f-num);font-weight:700;font-size:12px;border:1.5px solid var(--line2);border-radius:6px;padding:1px 6px;background:var(--card)}
.feedlist .av{width:34px;height:34px}
.feedlist .txt{font-size:13.5px;line-height:1.45;min-width:0}
.feedlist .ic{width:34px;height:34px;border-radius:50%;background:var(--paper2);display:grid;place-items:center;color:var(--green)}
.feedlist .ic svg{width:18px;height:18px}
.feedlist li.q .txt{font-weight:900;color:var(--green)}
.feedlist li.k .txt{color:#8A4A12}
.pn{font-weight:900;color:var(--ink)}

/* players strip */
.players{margin-top:18px;background:var(--card);border:1.5px solid var(--line);border-radius:20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));padding:8px;gap:6px;box-shadow:0 8px 20px rgba(90,70,30,.06)}
.pl{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:14px;position:relative;min-width:0}
.pl.cur{background:var(--pink)}
.pl .av{width:52px;height:52px;flex:none}
.pl .nm{font-size:17px;font-weight:900;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tag{font-size:11px;font-weight:700;border:1.5px solid var(--line2);border-radius:6px;padding:0 5px;color:var(--muted);background:var(--card)}
.pl .fig{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:13px;color:var(--muted)}
.pl .fig b{font-family:var(--f-num);font-weight:800;color:var(--ink);font-size:16px;margin-left:3px}

/* responsive */
@media (max-width:1040px){
  .board{grid-template-columns:minmax(0,1fr);grid-template-areas:"hero" "desk" "main"}
  .desk{position:relative;top:0}
  .hero-art{width:70%;opacity:.55}
}
@media (max-width:640px){
  .vsep{display:none}
  .steps{order:3;flex-basis:100%;justify-content:flex-start;overflow-x:auto;padding-bottom:2px}
  .step{padding:4px 10px;font-size:13px}.step.now{padding:5px 12px;font-size:15px}
  .brand small{display:none}
  .desk{padding:20px 16px;border-radius:22px}
  .tops .btn{padding:8px 11px}
}

/* modals */
.overlay{position:fixed;inset:0;background:var(--scrim);display:grid;place-items:center;z-index:50;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--card);color:var(--ink);border-radius:24px;border:1.5px solid var(--line);width:min(660px,100%);max-height:calc(100dvh - 32px);overflow:auto;padding:24px;box-shadow:0 30px 70px rgba(40,30,10,.3)}
.modal h2{font-size:27px;font-weight:900;margin-bottom:6px;letter-spacing:.03em}
.modal .sub{color:var(--muted);margin:0 0 14px}
.modal .acts{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}
.modal .acts .btn{padding:10px 20px;font-size:16px}
.modal .intel::after{background:linear-gradient(225deg,var(--card) 50%,var(--pink2) 50%)}
.seats{display:flex;flex-direction:column;gap:10px}
.seat{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center}
.seat .av{width:44px;height:44px}
.seat input{font:inherit;font-weight:700;padding:9px 12px;border:1.5px solid var(--line2);border-radius:12px;background:var(--paper);color:var(--ink);min-width:0;width:100%}
.seg{display:inline-flex;border:1.5px solid var(--line2);border-radius:12px;overflow:hidden;background:var(--paper);flex-wrap:wrap}
.seg button{border:none;background:transparent;color:var(--muted);padding:8px 12px;cursor:pointer;font-weight:700}
.seg button.on{background:var(--green);color:var(--green-ink)}
.field{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:14px 0;flex-wrap:wrap}
.field>span{font-weight:900;font-size:16px}
.note{font-size:12px;color:var(--muted)}
.pitch{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:0 0 6px}
.pitch div{background:var(--paper);border-radius:14px;padding:12px;font-size:13px;color:var(--muted)}
.pitch b{display:block;color:var(--ink);font-size:15px;font-weight:900;margin-bottom:2px}
.setup-art{height:120px;margin:-24px -24px 16px;overflow:hidden;border-radius:24px 24px 0 0}
.setup-art svg{width:100%;height:100%}
.rules{font-size:15px;line-height:1.8}
.rules h3{font-size:19px;font-weight:900;margin:18px 0 6px;color:var(--green)}
.rules p,.rules li{max-width:64ch}
.rules ol,.rules ul{padding-left:1.3em;margin:6px 0}
.rules table{border-collapse:collapse;font-size:14px;margin:6px 0;width:100%}
.rules td,.rules th{border-top:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.rules th{font-size:12px;color:var(--muted)}
.handoff .av{width:84px;height:84px;margin-bottom:10px}
table.res{width:100%;border-collapse:collapse;margin-top:12px;font-size:14px}
table.res th{font-size:12px;color:var(--muted);text-align:right;font-weight:700;padding:4px 6px}
table.res td{text-align:right;padding:8px 6px;border-top:1px solid var(--line);font-family:var(--f-num);font-weight:700;font-variant-numeric:tabular-nums}
table.res th:first-child,table.res td:first-child{text-align:left;font-family:var(--f-body)}
.tablewrap{overflow-x:auto}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--muted)}
.win{font-size:32px;font-weight:900;color:var(--green);margin:4px 0}
.revlist{display:flex;flex-direction:column;gap:8px}
.rev{border:1.5px solid var(--line2);border-radius:14px;padding:10px 14px;background:var(--paper);display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.rev h4{font-size:16px;font-weight:900}
.rev .kn{font-size:12.5px;color:var(--muted);font-weight:700}
@media (prefers-reduced-motion:reduce){.dots::after{animation:none}.btn{transition:none}}


/* ---- game ---- */
/* Layout: shared market, cats and goals across the top of the left column, everyone's café grid below; the desk holds your own big grid. */
.tile{position:relative;aspect-ratio:1;border-radius:10px;display:grid;place-items:center;overflow:hidden;box-shadow:inset 0 -3px 0 rgba(0,0,0,.08)}
.tile svg{width:78%;height:78%}
.tile .cat{position:absolute;inset:6%;width:88%;height:88%}
.tc0{background:#E6CFA9}.tc1{background:#F6CBD3}.tc2{background:#BFE3CF}.tc3{background:#F7E4A6}
.mk{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;max-width:520px}
.mk button{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:4px;align-items:center;font-size:12.5px;font-weight:900;color:var(--muted)}
.mk button .tile{width:100%}
.mk button.on .tile{outline:4px solid var(--green);outline-offset:2px}
.mk button:focus-visible .tile{outline:3px solid var(--yellow)}
.mk button:disabled{cursor:default}
.catrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.catc{background:var(--card);border:1.5px solid var(--line2);border-radius:16px;padding:10px;display:flex;gap:10px;align-items:center;min-width:0}
.catc svg{width:58px;height:58px;flex:none}
.catc b{font-size:15px;font-weight:900;display:block}
.catc span{font-size:12.5px;color:var(--muted);font-weight:700;line-height:1.4;display:block}
.catc .pts{font-family:var(--f-num);font-weight:800;font-size:13px;color:var(--orange)}
.catc.ok{border-color:var(--green);background:#EAF3EC}
@media (max-width:700px){.catrow{grid-template-columns:minmax(0,1fr)}}
.goalrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.goal{background:var(--gold-bg);border-radius:14px;padding:9px 12px;font-size:12.5px;font-weight:700;color:#6B4D07}
.goal b{display:block;font-size:14.5px;color:var(--ink)}
@media (max-width:700px){.goalrow{grid-template-columns:minmax(0,1fr)}}
.cafes{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}

.desk .sc{color:rgba(255,255,255,.8)}.desk .sc b{color:#fff}

  {k:'british',n:'灰灰',breed:'英國短毛貓',pts:6,d:'貓窩在四個角落之一',fur:'#9AA3AD',ear:'#6E7780',eye:'#E0922F'},
  {k:'blue',n:'藍藍',breed:'俄羅斯藍貓',pts:6,d:'貓窩旁邊同時有書櫃和植物',fur:'#7D8C9E',ear:'#5A6878',eye:'#7BC67B'},
  {k:'sphynx',n:'光光',breed:'無毛貓',pts:5,d:'貓窩旁邊至少 2 件暖呼呼的家具：沙發或其他貓窩（怕冷）',fur:'#F1C9B4',ear:'#D99D86'},
];
const GOALS=[
  {k:'green',n:'綠意盎然',d:'每一橫排至少有 1 盆植物：每排 +2'},
  {k:'books',n:'書香角落',d:'每個放了書櫃的角落 +2'},
  {k:'sofa',n:'沙發區',d:'相連的沙發 3 張以上：+6'},
  {k:'rainbow',n:'彩虹窗邊',d:'最上面一排 4 格顏色都不同：+5'},
  {k:'towers',n:'貓跳台天際線',d:'3 座以上貓跳台而且彼此都不相鄰：+6'},
  {k:'full',n:'客滿',d:'至少 3 張桌子，而且每張桌子旁邊都有貓：+5'},
  {k:'family',n:'貓咪大家庭',d:'入住的貓 4 隻 +3，5 隻以上 +6'},
  {k:'mix',n:'混搭風',d:'每個 2×2 區塊裡 4 種家具都不同：每塊 +1'},
];
const AI_NAMES=['咪咪店長','阿肥','小雨','橘子'];
const SAVE_KEY='cat-cafe-save-v1';

/* ================= state ================= */
let S=null, UI={};
let setupCfg={n:2,seats:[{name:'你',ai:false}].concat(AI_NAMES.slice(0,3).map(n=>({name:n,ai:true}))),speed:'中'};
const NP=()=>S.players.length;
const humans=()=>S.players.filter(p=>!p.ai);
const pn=i=>`<b class="pn" data-p="${i}">${esc(S.players[i].name)}</b>`;
function log(html,cls=''){const m=/data-p="(\d+)"/.exec(html);S.log.unshift({h:html,c:cls,a:m?+m[1]:null,t:S.turnNo});if(S.log.length>220)S.log.length=220;}
function save(){lsSet(SAVE_KEY,S);}
function clearSave(){lsSet(SAVE_KEY,null);}
const nb=k=>{const r=k/W|0,c=k%W,o=[];if(r>0)o.push(k-W);if(r<W-1)o.push(k+W);if(c>0)o.push(k-1);if(c<W-1)o.push(k+1);return o;};
const isEdge=k=>{const r=k/W|0,c=k%W;return r===0||c===0||r===W-1||c===W-1;};
const CORNERS=[0,3,12,15];

/* ================= setup ================= */
function setupGame(players){
  clearTimeout(timer);
  const bag=[];FK.forEach(f=>{for(let k=0;k<FURN[f].c;k++)bag.push({f,c:k%4});});shuffle(bag);
  const cd=[];CATS.forEach((c,k)=>{cd.push(k,k);});shuffle(cd);
  S={players:players.map(p=>({name:p.name,ai:p.ai,grid:Array(CELLS).fill(null)})),bag,market:[],catDeck:cd,catRow:[],goals:shuffle(GOALS.map((_,k)=>k)).slice(0,3),
     cur:Math.random()*players.length|0,turnNo:1,adoptedThisRound:false,roundStart:0,phase:'place',log:[],cfgPlayers:players};
  S.roundStart=S.cur;
  S.players.forEach((p,i)=>{p.bonus=(i-S.cur+players.length)%players.length;});
  refill();
  log(`咖啡廳開張！本局目標：${S.goals.map(g=>GOALS[g].n).join('、')}。`,'q');
  UI={};proceed();
}
function refill(){
  while(S.market.length<MARKET&&S.bag.length)S.market.push(S.bag.pop());
  while(S.catRow.length<CATROW&&S.catDeck.length)S.catRow.push(S.catDeck.pop());
}

/* ================= scoring ================= */
function catOK(g,k,ci){
  const t=g[k];if(!t||t.f!=='bed'||t.cat!=null)return false;
  const ns=nb(k).map(j=>g[j]).filter(Boolean);
  const cnt=f=>ns.filter(x=>x.f===f).length;
  switch(CATS[ci].k){
    case 'orange':return cnt('table')>=2;
    case 'black':return isEdge(k)&&cnt('shelf')>=1;
    case 'calico':return new Set(ns.map(x=>x.c)).size>=3;
    case 'ragdoll':return ns.some(x=>x.f==='sofa'&&x.c===t.c);
    case 'siamese':return ns.some(x=>x.f==='bed'&&x.cat!=null);
    case 'tabby':return cnt('tower')>=1;
    case 'munchkin':return cnt('plant')>=1&&cnt('tower')===0;
    case 'british':return CORNERS.includes(k);
    case 'blue':return cnt('shelf')>=1&&cnt('plant')>=1;
    case 'sphynx':return cnt('sofa')+cnt('bed')>=2;
  }
  return false;
}
function groups(g,pred){
  const seen=new Set(),out=[];
  for(let k=0;k<CELLS;k++){if(seen.has(k)||!g[k]||!pred(g[k]))continue;const st=[k];seen.add(k);let n=0;while(st.length){const x=st.pop();n++;nb(x).forEach(j=>{if(!seen.has(j)&&g[j]&&pred(g[j])&&(pred.same?pred.same(g[x],g[j]):true)){seen.add(j);st.push(j);}});}out.push(n);}
  return out;
}
function colorScore(g){
  let s=0;for(let c=0;c<4;c++){const gs=groups(g,t=>t.c===c);const m=gs.length?Math.max(...gs):0;if(m>=3)s+=m;}return s;
}
function goalScore(g,k){
  const cats=g.filter(t=>t&&t.cat!=null).length;
  switch(GOALS[k].k){
    case 'green':{let s=0;for(let r=0;r<W;r++)if([0,1,2,3].some(c=>g[r*W+c]&&g[r*W+c].f==='plant'))s+=2;return s;}
    case 'books':return CORNERS.filter(k=>g[k]&&g[k].f==='shelf').length*2;
    case 'sofa':{const gs=groups(g,t=>t.f==='sofa');return gs.some(x=>x>=3)?6:0;}
    case 'rainbow':{const row=[0,1,2,3].map(c=>g[c]);return row.every(Boolean)&&new Set(row.map(t=>t.c)).size===4?5:0;}
    case 'towers':{const ts=[];g.forEach((t,k)=>{if(t&&t.f==='tower')ts.push(k);});return ts.length>=3&&ts.every(k=>nb(k).every(j=>!(g[j]&&g[j].f==='tower')))?6:0;}
    case 'full':{const tb=[];g.forEach((t,k)=>{if(t&&t.f==='table')tb.push(k);});return tb.length>=3&&tb.every(k=>nb(k).some(j=>g[j]&&g[j].cat!=null))?5:0;}
    case 'family':return cats>=5?6:cats>=4?3:0;
    case 'mix':{let s=0;for(let r=0;r<W-1;r++)for(let c=0;c<W-1;c++){const q=[r*W+c,r*W+c+1,(r+1)*W+c,(r+1)*W+c+1].map(k=>g[k]);if(q.every(Boolean)&&new Set(q.map(t=>t.f)).size===4)s+=1;}return s;}
  }
  return 0;
}
function scoreGrid(g){
  const cats=g.reduce((a,t)=>a+(t&&t.cat!=null?CATS[t.cat].pts:0),0);
  let guests=0;g.forEach((t,k)=>{if(t&&t.f==='table'&&nb(k).some(j=>g[j]&&g[j].cat!=null))guests+=2;});
  const color=colorScore(g);
  const goals=S.goals.map(k=>goalScore(g,k));
  return {cats,guests,color,goals,total:cats+guests+color+goals.reduce((a,b)=>a+b,0),n:g.filter(t=>t&&t.cat!=null).length};
}
function scoreP(i){const p=S.players[i];const s=scoreGrid(p.grid);s.bonus=p.bonus||0;s.total+=s.bonus;return s;
}

/* ================= actions ================= */
function adoptions(i){
  const g=S.players[i].grid,out=[];
  S.catRow.forEach((ci,ri)=>{for(let k=0;k<CELLS;k++)if(catOK(g,k,ci))out.push({ri,ci,k});});
  return out;
}
function place(i,mi,k){
  const p=S.players[i],t=S.market.splice(mi,1)[0];
  p.grid[k]={f:t.f,c:t.c,cat:null};
  log(`${pn(i)} 擺了一個${COLORS[t.c]}${FURN[t.f].n}。`);
}
function adopt(i,ri,k){
  const p=S.players[i],ci=S.catRow[ri];
  p.grid[k].cat=ci;S.catRow.splice(ri,1);S.adoptedThisRound=true;
  log(`${CATS[ci].breed}「${CATS[ci].n}」搬進 ${pn(i)} 的咖啡廳！+${CATS[ci].pts}`,'q');
}
function endTurn(){
  refill();
  S.cur=(S.cur+1)%NP();S.turnNo++;
  if(S.cur===S.roundStart){
    if(!S.adoptedThisRound&&S.catRow.length){const ci=S.catRow.shift();S.catDeck.unshift(ci);refill();log(`一整輪沒有貓被領養，${CATS[ci].breed}「${CATS[ci].n}」先回中途之家，換一隻新的來。`);}
    S.adoptedThisRound=false;
  }
  if(S.players.every(p=>p.grid.every(Boolean))){finish();return;}
  S.phase='place';UI={};proceed();
}
function finish(){
  S.phase='end';S.final=S.players.map((p,i)=>scoreP(i));
  const best=Math.max(...S.final.map(s=>s.total));
  let w=S.final.map((_,i)=>i).filter(i=>S.final[i].total===best);
  if(w.length>1){const m=Math.max(...w.map(i=>S.final[i].n));w=w.filter(i=>S.final[i].n===m);}
  S.winners=w;log(`打烊！${w.map(pn).join('、')} 的咖啡廳最受歡迎。`,'q');
  clearSave();render();endModal();
}
function endModal(){
  const sc=S.final;
  openModal(`<h2>打烊結算</h2><div class="win">${S.winners.map(i=>esc(S.players[i].name)).join('、')} 最受歡迎</div>
   <div class="tablewrap"><table class="res"><thead><tr><th>店長</th><th>貓咪</th><th>客人</th><th>配色</th>${S.goals.map(g=>`<th>${GOALS[g].n}</th>`).join('')}<th>開店補助</th><th>總分</th></tr></thead><tbody>
   ${sc.map((s,i)=>({s,i})).sort((a,b)=>b.s.total-a.s.total).map(({s,i})=>`<tr><td>${esc(S.players[i].name)}</td><td>${s.cats}（${s.n} 隻）</td><td>${s.guests}</td><td>${s.color}</td>${s.goals.map(x=>`<td>${x}</td>`).join('')}<td>+${s.bonus}</td><td><b>${s.total}</b></td></tr>`).join('')}</tbody></table></div>
   <div class="acts"><button class="btn" data-m="close">看看咖啡廳</button><button class="btn primary" data-m="again">再來一局</button></div>`,m=>{closeModal();if(m==='again')setupGame(S.cfgPlayers);});
}

/* ================= AI ================= */
function evalGrid(g,catRow){
  // current score + value of best adoptable cat + a little potential for open beds
  const base=scoreGrid(g).total;
  let best=0;catRow.forEach(ci=>{for(let k=0;k<CELLS;k++)if(catOK(g,k,ci)){const v=CATS[ci].pts+(g.some((t,j)=>t&&t.f==='table'&&nb(j).includes(k))?2:0);if(v>best)best=v;}});
  let open=0;g.forEach((t,k)=>{if(t&&t.f==='bed'&&t.cat==null)open+=nb(k).filter(j=>!g[j]).length>0?.9:.2;});
  const empties=g.filter(t=>!t).length;
  return base+best*.95+open*(empties>2?1:.2);
}
function aiTurn(i){
  const p=S.players[i];let best=null;
  S.market.forEach((t,mi)=>{
    for(let k=0;k<CELLS;k++){if(p.grid[k])continue;
      const g=p.grid.slice();g[k]={f:t.f,c:t.c,cat:null};
      const rest=S.catRow;
      const v=evalGrid(g,rest)+Math.random()*.6;
      if(!best||v>best.v)best={v,mi,k};
    }});
  place(i,best.mi,best.k);
  const ad=adoptions(i);
  if(ad.length){
    let b=null;ad.forEach(a=>{const g=p.grid.map(t=>t&&{...t});g[a.k].cat=a.ci;const v=scoreGrid(g).total+Math.random()*.2;if(!b||v>b.v)b={...a,v};});
    adopt(i,b.ri,b.k);
  }
}

/* ================= flow ================= */
function proceed(){
  clearTimeout(timer);save();
  if(!S||!$('#overlay').hidden)return;
  if(S.phase==='end'||S.phase==='idle')return render();
  const p=S.players[S.cur];
  if(p.ai){render();timer=setTimeout(()=>{aiTurn(S.cur);endTurn();},humans().length?Math.min(SPEED,600):SPEED/4);return;}
  render();
}

function tileHTML(t,extra=''){if(!t)return '<div class="cell"></div>';return `<div class="tile tc${t.c} ${extra}">${furnSVG(t.f)}${t.cat!=null?catSVG(t.cat,'cat'):''}</div>`;}

/* ================= view ================= */
function myTurn(){return S.phase!=='end'&&S.phase!=='idle'&&!S.players[S.cur].ai&&$('#overlay').hidden;}
function render(){
  if(!S)return;
  const filled=S.players.reduce((a,p)=>a+p.grid.filter(Boolean).length,0),tot=NP()*CELLS;
  const pct=filled/tot;const stages=['開張','早班','午茶','晚班','打烊'];
  const at=S.phase==='end'?4:Math.min(3,Math.floor(pct*4));
  $('#steps').innerHTML=stages.map((s,k)=>`${k?`<span class="link ${k<=at?'done':''}"></span>`:''}<span class="step ${k<at?'done':k===at&&S.phase!=='idle'?'now':''}">${s}</span>`).join('');
  const head={idle:'拼出療癒咖啡廳',place:'挑家具、擺位置',adopt:'領養貓咪',end:'打烊結算'}[S.phase];
  $('#hero').innerHTML=`<div class="hero-art">${heroArt()}</div><div class="hero-txt"><div class="eyebrow">CAT CAFÉ</div><h2>${head}<span class="qbadge">${S.phase==='idle'?'準備開店':S.phase==='end'?'打烊':'輪到 '+esc(S.players[S.cur].name)}</span></h2>${swoosh}</div>`;
  renderShared();renderDesk();renderPlayers();
  $('#feed').innerHTML=feedHTML(S.log,l=>l.t?'#'+l.t:'—','每一件家具和每一隻貓都會記在這裡。');
}
function renderShared(){
  if(S.phase==='idle'){['#market','#cats','#goals','#cafes'].forEach(s=>$(s).innerHTML='');return;}
  const can=myTurn()&&S.phase==='place';
  $('#market').innerHTML=`<div class="mk">${S.market.map((t,mi)=>`<button data-mi="${mi}" class="${UI.mi===mi?'on':''}" ${can?'':'disabled'}>${tileHTML(t)}<span>${COLORS[t.c]}・${FURN[t.f].n}</span></button>`).join('')}</div>`;
  $('#bagnote').textContent=`袋子裡還有 ${S.bag.length} 片`;
  const g=S.players[S.cur].grid;
  $('#cats').innerHTML=`<div class="catrow">${S.catRow.map(ci=>{const ok=S.phase!=='end'&&Array.from({length:CELLS}).some((_,k)=>catOK(g,k,ci));return `<div class="catc ${ok?'ok':''}">${catSVG(ci)}<div><b>${CATS[ci].breed}「${CATS[ci].n}」 <span class="pts" style="display:inline">${CATS[ci].pts} 分</span></b><span>${CATS[ci].d}</span></div></div>`;}).join('')}</div>`;
  $('#goals').innerHTML=`<div class="goalrow">${S.goals.map(k=>`<div class="goal"><b>${GOALS[k].n}</b>${GOALS[k].d}</div>`).join('')}</div>`;
  $('#cafes').innerHTML=`<div class="cafes">${S.players.map((p,i)=>{const sc=scoreP(i);return `<div class="cafe ${i===S.cur&&S.phase!=='end'?'cur':''}"><div class="hd">${avatar(i)}${esc(p.name)}<small>${sc.total} 分</small></div><div class="grid">${p.grid.map(t=>tileHTML(t)).join('')}</div><div class="sc"><span>貓<b>${sc.n}</b></span><span>客人<b>${sc.guests}</b></span><span>配色<b>${sc.color}</b></span></div></div>`;}).join('')}</div>`;
}
function renderDesk(){
  let h=leafDeco;
  if(S.phase==='place'||S.phase==='adopt'){
    const i=S.cur,p=S.players[i];

      const sc=scoreGrid(p.grid);
      if(S.phase==='place'){
        const t=UI.mi!=null?S.market[UI.mi]:null;
        h+=`<div class="dhead"><h2>擺家具</h2><span class="pill">${esc(p.name)}</span></div><div class="dsub">${t?`拿著${COLORS[t.c]}${FURN[t.f].n}，點一個空格擺下去`:'先在左邊的市場挑一片家具'}</div>
         <div class="grid">${p.grid.map((x,k)=>x?tileHTML(x):`<button class="cellb ${UI.k===k?'prev':''}" data-k="${k}" ${t?'':'disabled'} aria-label="第 ${k+1} 格">${UI.k===k&&t?'':'＋'}</button>`).join('')}</div>
         <div class="sc"><span>目前<b>${sc.total}</b>分</span><span>貓<b>${sc.n}</b></span><span>空格<b>${p.grid.filter(x=>!x).length}</b></span></div>
         ${!S.market.length?'':`<div class="dnote">小提示：擺完之後，如果有貓窩符合上方貓咪的條件，就能馬上領養一隻。</div>`}
         <button class="confirm" id="btnPlace" ${t&&UI.k!=null?'':'disabled'}>就擺這裡 ${ICONS.arrow}</button>`;
      }else{
        const ad=adoptions(i);
        const sel=UI.ad!=null?ad[UI.ad]:null;
        h+=`<div class="dhead"><h2>有貓想搬進來！</h2><span class="pill">${esc(p.name)}</span></div><div class="dsub">每回合最多領養一隻，選貓和貓窩</div>
         <div class="adoptlist">${ad.map((a,x)=>`<button data-ad="${x}" class="${UI.ad===x?'on':''}">${catSVG(a.ci)}<div><b>${CATS[a.ci].breed}「${CATS[a.ci].n}」+${CATS[a.ci].pts}</b><br><span>住進第 ${(a.k/W|0)+1} 排第 ${a.k%W+1} 格的貓窩</span></div></button>`).join('')}</div>
         <div class="grid">${p.grid.map((x,k)=>x?tileHTML(sel&&sel.k===k?{...x,cat:sel.ci}:x,ad.some(a=>a.k===k)?'adopt':''):'<div class="cell"></div>').join('')}</div>
         <button class="confirm" id="btnAdopt" ${sel?'':'disabled'}>歡迎入住 ${ICONS.arrow}</button><button class="passbtn" id="btnSkip">這回合先不領養</button>`;
      }
    }else{
      h+=`<div class="dhead"><h2>${p.ai?'對手佈置中':'換人操作'}</h2></div><div class="think">${avatar(i)}<div><b>${esc(p.name)}</b><div>${p.ai?'正在挑家具<span class="dots"></span>':''}</div></div></div>`;
    }
  }else if(S.phase==='end'){
    h+=`<div class="dhead"><h2>打烊</h2><span class="pill">最受歡迎</span></div><div class="think">${avatar(S.winners[0])}<div><b>${S.winners.map(i=>esc(S.players[i].name)).join('、')}</b><div>${S.final[S.winners[0]].total} 分</div></div></div>
     <button class="passbtn" id="btnResult">再看一次結算</button><button class="confirm" id="btnAgain">再來一局 ${ICONS.arrow}</button>`;
  }else{
    h+=`<div class="dhead"><h2>準備開店</h2></div><div class="empty"><b>設定店長後開始</b>2 到 4 人，可以混搭 AI 對手。</div>`;
  }
  $('#desk').innerHTML=h;
}
function renderPlayers(){
  $('#players').innerHTML=S.players.map((p,i)=>{const sc=S.phase==='end'&&S.final?S.final[i]:scoreP(i);return `<div class="pl ${i===S.cur&&S.phase!=='end'?'cur':''}">${avatar(i)}<div style="min-width:0"><div class="nm">${esc(p.name)}${p.ai?'<span class="tag">AI</span>':''}</div>
    <div class="fig"><span>分數<b>${sc.total}</b></span><span>貓<b>${sc.n}</b></span><span>空格<b>${p.grid.filter(x=>!x).length}</b></span></div></div></div>`;}).join('');
}
function heroArt(){return `<svg viewBox="0 0 640 180" preserveAspectRatio="xMaxYMid slice" aria-hidden="true">
  <rect width="640" height="180" fill="#F6E6D2"/>
  <rect x="240" y="18" width="150" height="96" rx="8" fill="#BFE3F2" stroke="#8A5A2E" stroke-width="6"/><path d="M315 18v96M240 66h150" stroke="#8A5A2E" stroke-width="4"/>
  <rect x="420" y="40" width="180" height="20" rx="4" fill="#8A5A2E"/><text x="510" y="56" font-size="14" font-weight="900" fill="#F5C443" text-anchor="middle" letter-spacing="4">CAT CAFÉ</text>
  <g transform="translate(270 98) scale(.9)">${catVec(0).replace('<svg','<svg width="64" height="64"')}</g>
  <g transform="translate(450 96)">${furnSVG('tower').replace('<svg','<svg width="80" height="80"')}</g>
  <g transform="translate(530 104)">${catVec(7).replace('<svg','<svg width="64" height="64"')}</g>
  <rect x="200" y="162" width="440" height="18" fill="#E2CCA8"/>
 </svg>`;}

/* ================= setup & rules ================= */
function showSetup(){
  clearTimeout(timer);
  const sv=lsGet(SAVE_KEY);
  openModal(`<div class="setup-art">${heroArt()}</div><h2>貓咪咖啡廳</h2><p class="sub">你剛頂下一間小店面，要把它佈置成貓咪咖啡廳。每一隻貓都有自己的脾氣：橘貓要靠近餐桌、黑貓喜歡書櫃、無毛貓怕冷要窩在沙發旁。擺對了，牠們就會搬進來，客人也會跟著來。</p>
   <div class="pitch"><div><b>挑一片、擺一格</b>每回合從市場挑一片家具，放進自己 4×4 的店裡。</div><div><b>10 種貓咪</b>每種貓有不同的入住條件，條件達成就能領養。</div><div><b>每局不一樣</b>從 8 張計分目標隨機抽 3 張。</div></div>
   ${setupSeatsHTML(setupCfg,2,4)}
   <p class="note">沒有秘密資訊，多人共用一台裝置時直接輪流操作就好。</p>
   <div class="acts"><a class="btn ghost" href="${LOBBY}">← 回大廳</a><button class="btn" data-m="rules">先看規則</button>${sv&&(sv.phase==='place'||sv.phase==='adopt')?'<button class="btn" data-m="resume">繼續上一局</button>':''}<button class="btn primary" data-m="start">開始遊戲</button></div>`,
  m=>{
    if(setupSeatsHandle(setupCfg,m,showSetup))return;
    if(m==='rules')showRules();
    else if(m==='resume'){closeModal();SPEED=SPEEDS[setupCfg.speed];S=sv;UI={};proceed();}
    else if(m==='start'){closeModal();SPEED=SPEEDS[setupCfg.speed];setupGame(seatsToPlayers(setupCfg,AI_NAMES));}
  });
}
function showRules(){showRulesHTML(`
  <p><b>一句話：</b>輪流挑家具板塊，拼出自己的 4×4 咖啡廳。排對位置，貓咪就會搬進來。</p>
  <p>2–4 人・30–40 分鐘・8 歲以上</p>
  <h3>配件</h3><p>72 片家具板塊：貓窩 16、桌子 16、沙發、書櫃、植物、貓跳台各 10。每片有一種地板顏色（原木、櫻花粉、薄荷綠、奶油黃）。貓咪卡 10 種各 2 張。計分目標卡 8 張。</p>
  <h3>回合流程</h3>
  <ol><li><b>挑家具：</b>從市場 4 片中挑 1 片。</li>
  <li><b>擺放：</b>放進自己咖啡廳任何一個空格，擺了就不能移動。</li>
  <li><b>領養（可選）：</b>如果你有空的貓窩符合任何一隻待領養貓咪的條件，可以領養一隻，放在那個貓窩上。每回合最多一隻。</li>
  <li><b>補滿：</b>市場補回 4 片、貓咪補回 3 隻。</li></ol>
  <p>如果一整輪都沒有人領養，最左邊的貓咪回到牌庫底，換一隻新的。所有人的 16 格都擺滿時遊戲結束。</p>
  <h3>貓咪（條件只看上下左右相鄰的格子）</h3>
  <table><tr><th>貓咪</th><th>分數</th><th>入住條件</th></tr>${CATS.map(c=>`<tr><td>${c.breed}「${c.n}」</td><td>${c.pts}</td><td>${c.d}</td></tr>`).join('')}</table>
  <h3>結束計分</h3>
  <ul><li><b>貓咪：</b>每隻入住的貓的分數。</li>
  <li><b>客人：</b>每張旁邊有貓的桌子 +2。</li>
  <li><b>配色：</b>每種顏色最大一塊相連區域，3 格以上就算格數。</li>
  <li><b>計分目標：</b>本局抽到的 3 張。</li>
  <li><b>開店補助：</b>第 2 位出手的玩家 +1、第 3 位 +2、第 4 位 +3。</li></ul>
  <p>同分時，貓比較多的人勝。</p>
  <h3>計分目標（每局抽 3 張）</h3><ul>${GOALS.map(g=>`<li><b>${g.n}：</b>${g.d}</li>`).join('')}</ul>
  <h3>先手補償</h3><p>先手可以最早搶到想要的貓，所以後面出手的人有開店補助：第 2 位 +1、第 3 位 +2、第 4 位 +3。</p>
  <h3>致勝心法</h3><ul><li>貓窩旁邊留空格，等之後放對的家具，彈性最大。</li><li>桌子擺在貓旁邊，客人分就會一直累積。</li><li>注意別人需要什麼，有時候拿走對手要的那片也很重要。</li></ul>`);}

/* ================= input ================= */
document.querySelector('main').addEventListener('click',e=>{
  const b=e.target.closest('[data-mi]');if(!b||b.disabled||!myTurn()||S.phase!=='place')return;
  UI.mi=+b.dataset.mi;render();if(innerWidth<=1040)scrollDeskIntoView();
});
$('#desk').addEventListener('click',e=>{
  if(e.target.closest('#btnAgain')){setupGame(S.cfgPlayers);return;}
  if(e.target.closest('#btnResult')){endModal();return;}
  if(!myTurn())return;
  const b=e.target.closest('button');if(!b||b.disabled)return;
  const i=S.cur;
  if(b.dataset.k!=null)UI.k=+b.dataset.k;
  else if(b.id==='btnPlace'){place(i,UI.mi,UI.k);UI={};if(adoptions(i).length){S.phase='adopt';save();}else{endTurn();return;}}
  else if(b.dataset.ad!=null)UI.ad=+b.dataset.ad;
  else if(b.id==='btnAdopt'){const a=adoptions(i)[UI.ad];adopt(i,a.ri,a.k);UI={};endTurn();return;}
  else if(b.id==='btnSkip'){UI={};endTurn();return;}
  else return;
  render();
});
$('#btnRules').addEventListener('click',showRules);
$('#btnNew').addEventListener('click',()=>{if(S&&S.phase!=='end'&&S.phase!=='idle'){openModal(`<h2>放棄目前這局？</h2><p class="sub">目前的進度會被清除。</p><div class="acts"><button class="btn" data-m="no">繼續玩</button><button class="btn primary" data-m="yes">開新遊戲</button></div>`,m=>{if(m==='yes'){clearTimeout(timer);clearSave();showSetup();}else{closeModal();proceed();}});}else showSetup();});

/* ================= boot ================= */
window.__game={setupGame,setSpeed:v=>{SPEED=v;},get S(){return S;}};
(function boot(){
  S={players:[{name:'—',ai:true,grid:Array(CELLS).fill(null)},{name:'—',ai:true,grid:Array(CELLS).fill(null)}],bag:[],market:[],catDeck:[],catRow:[],goals:[0,1,2],cur:0,turnNo:0,phase:'idle',log:[]};
  render();showSetup();
})();

</script>
<script>if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("../../sw.js",{scope:"../../"}).catch(()=>{}));</script>
</body>
