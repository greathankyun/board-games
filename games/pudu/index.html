<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>中元普渡</title>
<meta name="description" content="原創推運氣桌遊：從供桌一張張翻供品，翻越多分越高，好兄弟一不爽就翻桌歸零。乖乖、泡麵、罐頭塔，見好就收。">
<meta name="theme-color" content="#1E5641">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="icon" href="../../icons/icon-192.png">
<link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="桌遊大廳">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Outfit:wght@600;700;800&display=swap">
<style>
:root{
  --paper:#F5EEE1; --paper2:#EFE6D4; --card:#FFFBF4; --ink:#1F2B27; --muted:#6E7068; --line:#E5D9C3; --line2:#D9CBB1;
  --green:#1E5641; --green2:#28704F; --green-ink:#F3F7EF; --yellow:#F5C443; --yellow-ink:#2A2310;
  --orange:#E9643B; --pink:#F7DDD3; --pink2:#EFC6B8; --up:#2C8F4E; --up-bg:#D5EEDA; --down:#C8432F; --down-bg:#F7DAD3; --flat-bg:#ECE5D7;
  --red:#D7542B; --red-bg:#F8DCCF; --blue:#2E7DC0; --blue-bg:#D6E7F5; --violet:#7A5AD3; --violet-bg:#E4DCF7; --gold:#D19A17; --gold-bg:#F6E7BE;
  --p0:#E58FA0; --p1:#8B67D6; --p2:#4F9E61; --p3:#E0922F; --p4:#3E9CC4; --p5:#C8573E; --p6:#6C7A3A; --p7:#5C6BC0;
  --scrim:rgba(40,32,20,.45);
  --f-body:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
  --f-num:'Outfit','Noto Sans TC',system-ui,sans-serif;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55;font-weight:500}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
  background-image:radial-gradient(rgba(120,90,40,.07) 1px,transparent 1px);background-size:5px 5px}
.wrap{position:relative;z-index:1;max-width:1600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 28px}
h1,h2,h3,h4{text-wrap:balance;margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
svg{display:block}

/* header */
.top{display:flex;align-items:center;gap:14px 22px;flex-wrap:wrap;padding-block:6px 12px;border-bottom:1.5px solid var(--line2)}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit}
.brand svg{width:44px;height:44px;flex:none}
.brand h1{font-size:clamp(26px,3.4vw,38px);font-weight:900;letter-spacing:.06em;line-height:1}
.brand small{font-family:var(--f-num);font-size:12px;letter-spacing:.42em;color:var(--ink);font-weight:600;margin-left:6px}
.homelink{display:inline-flex;align-items:center;gap:6px;font-size:15px;font-weight:900;color:var(--ink);text-decoration:none;border:1.5px solid var(--ink);border-radius:12px;padding:7px 12px;background:var(--card)}.homelink svg{width:18px;height:18px}
.vsep{width:1.5px;align-self:stretch;background:var(--line2);margin-block:6px}
.steps{display:flex;align-items:center;flex:1;min-width:0;justify-content:center}
.step{font-family:var(--f-num);font-weight:700;font-size:15px;padding:5px 14px;border-radius:999px;border:1.5px solid var(--line2);background:var(--card);color:var(--ink);white-space:nowrap}
.step.done{color:var(--muted);background:var(--paper2)}
.step.now{background:var(--green);border-color:var(--green);color:var(--green-ink);font-size:17px;padding:6px 18px}
.link{flex:1;min-width:8px;max-width:56px;height:2px;background:repeating-linear-gradient(90deg,var(--line2) 0 4px,transparent 4px 8px)}
.link.done{background:var(--green)}
.tops{display:flex;gap:10px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--ink);background:var(--card);color:var(--ink);padding:8px 16px;border-radius:12px;cursor:pointer;font-weight:700;line-height:1.2;text-decoration:none}
.btn svg{width:18px;height:18px}
.btn:hover:not(:disabled){transform:translateY(-1px)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.dark,.btn.primary{background:var(--green);border-color:var(--green);color:var(--green-ink)}
.btn.ghost{background:transparent}

/* layout */
.board{display:grid;grid-template-columns:minmax(0,1fr) minmax(340px,430px);grid-template-areas:"hero desk" "main desk";grid-template-rows:auto 1fr;gap:14px 18px;margin-top:12px;align-items:start}
.hero{grid-area:hero;position:relative;min-height:140px;display:flex;align-items:center;overflow:hidden;border-radius:18px}
.hero-txt{position:relative;z-index:2;padding:8px 0 10px}
.eyebrow{display:flex;align-items:center;gap:12px;font-family:var(--f-num);font-weight:600;letter-spacing:.32em;font-size:13px}
.eyebrow::after{content:"";width:80px;height:1.5px;background:var(--ink)}
.hero h2{font-size:clamp(28px,4vw,48px);font-weight:900;letter-spacing:.03em;line-height:1.15;margin-top:6px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.swoosh{display:block;width:150px;height:14px;margin-top:-2px}
.qbadge{position:relative;font-size:17px;font-weight:900;border:2px solid var(--ink);border-radius:999px;padding:3px 14px;background:var(--card);letter-spacing:.04em}
.hero-art{position:absolute;right:0;top:0;bottom:0;width:min(62%,640px);z-index:1;
  -webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 28%);mask-image:linear-gradient(90deg,transparent 0%,#000 28%)}
.hero-art svg{width:100%;height:100%}
main{grid-area:main;min-width:0}
.sect{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:900;padding-bottom:10px;border-bottom:1.5px solid var(--line2);margin:0 0 12px}
.sect svg{width:26px;height:26px;color:var(--orange)}
.sect{flex-wrap:wrap}
.sect small{font-size:13px;color:var(--muted);font-weight:700;margin-left:auto}
@media (max-width:640px){.sect small{flex-basis:100%;margin-left:0}}

/* desk */
.desk{grid-area:desk;position:sticky;top:max(10px,env(safe-area-inset-top,0px));background:var(--green);color:var(--green-ink);border-radius:26px;padding:24px 24px 22px;overflow:hidden;display:flex;flex-direction:column;gap:14px;box-shadow:0 18px 40px rgba(20,60,45,.25)}
.desk .leaf{position:absolute;right:-30px;top:-20px;width:190px;height:190px;opacity:.9;pointer-events:none}
.desk>*{position:relative}
.dhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.dhead h2{font-size:clamp(26px,2.6vw,36px);font-weight:900;letter-spacing:.04em;line-height:1.1}
.pill{background:var(--orange);color:#fff;font-weight:900;border-radius:999px;padding:5px 14px;font-size:15px;white-space:nowrap}
.pill.soft{background:rgba(255,255,255,.16)}
.dsub{font-weight:700;font-size:15px;margin-top:-6px;opacity:.9}
.dlab{font-size:14px;opacity:.9;font-weight:900;display:flex;align-items:center;gap:8px;justify-content:space-between}
.dlab small{font-weight:700;opacity:.8;font-size:12px}
.dnote{font-size:13px;font-weight:700;background:rgba(255,255,255,.12);border-radius:10px;padding:7px 12px}
.dnote.warn{background:rgba(233,100,59,.28)}
.confirm{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:none;border-radius:16px;background:var(--yellow);color:var(--yellow-ink);font-size:22px;font-weight:900;padding:13px;cursor:pointer;box-shadow:0 4px 0 #C99A1E;letter-spacing:.06em}
.confirm svg{width:24px;height:24px}
.confirm:active:not(:disabled){transform:translateY(2px);box-shadow:0 2px 0 #C99A1E}
.confirm:disabled{opacity:.5;cursor:not-allowed}
.passbtn{width:100%;border:2px solid rgba(255,255,255,.85);background:transparent;color:var(--green-ink);border-radius:14px;font-weight:900;font-size:17px;padding:10px;cursor:pointer}
.passbtn:hover{background:rgba(255,255,255,.08)}
.empty{border:2px dashed rgba(255,255,255,.35);border-radius:16px;padding:20px 16px;text-align:center;font-weight:700;opacity:.92}
.empty b{display:block;font-size:19px;margin-bottom:4px}
.think{display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.1);border-radius:16px;padding:14px}
.think .av{width:56px;height:56px;flex:none}
.think b{font-size:19px}
.dots::after{content:"…";display:inline-block;animation:blink 1.1s steps(3) infinite}
@keyframes blink{0%{opacity:.2}50%{opacity:1}100%{opacity:.2}}
.chooser{display:flex;flex-wrap:wrap;gap:6px}
.chooser button{border:2px solid rgba(255,255,255,.55);background:transparent;color:var(--green-ink);border-radius:12px;padding:7px 12px;font-weight:900;cursor:pointer;display:inline-flex;align-items:center;gap:6px;min-height:40px}
.chooser button .av{width:24px;height:24px}
.chooser button.on{background:var(--card);color:var(--ink);border-color:var(--card)}
.chooser button:disabled{opacity:.35;cursor:not-allowed}
.chooser button.red.on{background:var(--red);border-color:var(--red);color:#fff}
.chooser button.blue.on{background:var(--blue);border-color:var(--blue);color:#fff}
.chooser.big button{flex:1;justify-content:center;font-size:16px}
.opt2{display:flex;flex-direction:column;gap:6px}
.opt2 button{display:flex;justify-content:space-between;gap:10px;align-items:center;text-align:left;border:2px solid rgba(255,255,255,.4);background:transparent;color:var(--green-ink);border-radius:12px;padding:9px 12px;cursor:pointer}
.opt2 button b{font-weight:900;font-size:15px}
.opt2 button span{font-size:12px;opacity:.85}
.opt2 button.on{background:var(--card);color:var(--ink);border-color:var(--card)}
.opt2 button.on span{opacity:1;color:var(--muted)}
.opt2 button:disabled{opacity:.35;cursor:not-allowed}
.dsec{display:flex;flex-direction:column;gap:8px;padding-top:12px;border-top:1px solid rgba(255,255,255,.2)}

/* private note card */
.intel{position:relative;background:var(--pink);color:var(--ink);border-radius:14px;padding:14px 16px 12px;box-shadow:0 6px 14px rgba(0,0,0,.18)}
.intel::after{content:"";position:absolute;right:0;top:0;width:28px;height:28px;background:linear-gradient(225deg,var(--green) 50%,var(--pink2) 50%);border-bottom-left-radius:8px}
.intel .ilab{display:flex;align-items:center;gap:8px;font-weight:900;color:#B24A35;font-size:16px;padding-bottom:8px;border-bottom:1.5px solid var(--pink2)}
.intel .ilab svg{width:20px;height:20px}
.intel ul{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:260px;overflow:auto}
.intel li{font-size:13.5px;line-height:1.45;display:flex;gap:8px;align-items:flex-start}
.intel li .rt{font-family:var(--f-num);font-weight:700;font-size:11px;border:1.5px solid var(--pink2);border-radius:6px;padding:0 5px;background:var(--card);white-space:nowrap;margin-top:1px}
.intel li.void{opacity:.45;text-decoration:line-through}
.intel .inote{font-size:12.5px;color:#5B4A40;margin-top:8px}
.intel .big{font-size:22px;font-weight:900;margin:8px 0 2px}
.stamp{border:1.5px solid #B24A35;color:#B24A35;border-radius:8px;padding:1px 9px;font-weight:900;font-size:12px;white-space:nowrap;display:inline-block;transform:rotate(-3deg)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:900;padding:1px 9px;border-radius:8px;background:var(--flat-bg);color:var(--ink);white-space:nowrap}
.chip.red{background:var(--red);color:#fff}.chip.blue{background:var(--blue);color:#fff}.chip.violet{background:var(--violet);color:#fff}
.chip.gold{background:var(--gold-bg);color:#6B4D07}.chip.green{background:var(--up-bg);color:var(--up)}.chip.down{background:var(--down-bg);color:var(--down)}

/* feed */
.feed{margin-top:18px}
.feedlist{list-style:none;margin:0;padding:0;overflow:auto;max-height:320px}
.feedlist li{display:grid;grid-template-columns:auto 34px minmax(0,1fr);gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.qtag{font-family:var(--f-num);font-weight:700;font-size:12px;border:1.5px solid var(--line2);border-radius:6px;padding:1px 6px;background:var(--card)}
.feedlist .av{width:34px;height:34px}
.feedlist .txt{font-size:13.5px;line-height:1.45;min-width:0}
.feedlist .ic{width:34px;height:34px;border-radius:50%;background:var(--paper2);display:grid;place-items:center;color:var(--green)}
.feedlist .ic svg{width:18px;height:18px}
.feedlist li.q .txt{font-weight:900;color:var(--green)}
.feedlist li.k .txt{color:#8A4A12}
.pn{font-weight:900;color:var(--ink)}

/* players strip */
.players{margin-top:18px;background:var(--card);border:1.5px solid var(--line);border-radius:20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));padding:8px;gap:6px;box-shadow:0 8px 20px rgba(90,70,30,.06)}
.pl{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:14px;position:relative;min-width:0}
.pl.cur{background:var(--pink)}
.pl .av{width:52px;height:52px;flex:none}
.pl .nm{font-size:17px;font-weight:900;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tag{font-size:11px;font-weight:700;border:1.5px solid var(--line2);border-radius:6px;padding:0 5px;color:var(--muted);background:var(--card)}
.pl .fig{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:13px;color:var(--muted)}
.pl .fig b{font-family:var(--f-num);font-weight:800;color:var(--ink);font-size:16px;margin-left:3px}

/* responsive */
@media (max-width:1040px){
  .board{grid-template-columns:minmax(0,1fr);grid-template-areas:"hero" "desk" "main"}
  .desk{position:relative;top:0}
  .hero-art{width:70%;opacity:.55}
}
@media (max-width:640px){
  .vsep{display:none}
  .steps{order:3;flex-basis:100%;justify-content:flex-start;overflow-x:auto;padding-bottom:2px}
  .step{padding:4px 10px;font-size:13px}.step.now{padding:5px 12px;font-size:15px}
  .brand small{display:none}
  .desk{padding:20px 16px;border-radius:22px}
  .tops .btn{padding:8px 11px}
}

/* modals */
.overlay{position:fixed;inset:0;background:var(--scrim);display:grid;place-items:center;z-index:50;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--card);color:var(--ink);border-radius:24px;border:1.5px solid var(--line);width:min(660px,100%);max-height:calc(100dvh - 32px);overflow:auto;padding:24px;box-shadow:0 30px 70px rgba(40,30,10,.3)}
.modal h2{font-size:27px;font-weight:900;margin-bottom:6px;letter-spacing:.03em}
.modal .sub{color:var(--muted);margin:0 0 14px}
.modal .acts{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}
.modal .acts .btn{padding:10px 20px;font-size:16px}
.modal .intel::after{background:linear-gradient(225deg,var(--card) 50%,var(--pink2) 50%)}
.seats{display:flex;flex-direction:column;gap:10px}
.seat{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center}
.seat .av{width:44px;height:44px}
.seat input{font:inherit;font-weight:700;padding:9px 12px;border:1.5px solid var(--line2);border-radius:12px;background:var(--paper);color:var(--ink);min-width:0;width:100%}
.seg{display:inline-flex;border:1.5px solid var(--line2);border-radius:12px;overflow:hidden;background:var(--paper);flex-wrap:wrap}
.seg button{border:none;background:transparent;color:var(--muted);padding:8px 12px;cursor:pointer;font-weight:700}
.seg button.on{background:var(--green);color:var(--green-ink)}
.field{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:14px 0;flex-wrap:wrap}
.field>span{font-weight:900;font-size:16px}
.note{font-size:12px;color:var(--muted)}
.pitch{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:0 0 6px}
.pitch div{background:var(--paper);border-radius:14px;padding:12px;font-size:13px;color:var(--muted)}
.pitch b{display:block;color:var(--ink);font-size:15px;font-weight:900;margin-bottom:2px}
.setup-art{height:120px;margin:-24px -24px 16px;overflow:hidden;border-radius:24px 24px 0 0}
.setup-art svg{width:100%;height:100%}
.rules{font-size:15px;line-height:1.8}
.rules h3{font-size:19px;font-weight:900;margin:18px 0 6px;color:var(--green)}
.rules p,.rules li{max-width:64ch}
.rules ol,.rules ul{padding-left:1.3em;margin:6px 0}
.rules table{border-collapse:collapse;font-size:14px;margin:6px 0;width:100%}
.rules td,.rules th{border-top:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.rules th{font-size:12px;color:var(--muted)}
.handoff .av{width:84px;height:84px;margin-bottom:10px}
table.res{width:100%;border-collapse:collapse;margin-top:12px;font-size:14px}
table.res th{font-size:12px;color:var(--muted);text-align:right;font-weight:700;padding:4px 6px}
table.res td{text-align:right;padding:8px 6px;border-top:1px solid var(--line);font-family:var(--f-num);font-weight:700;font-variant-numeric:tabular-nums}
table.res th:first-child,table.res td:first-child{text-align:left;font-family:var(--f-body)}
.tablewrap{overflow-x:auto}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--muted)}
.win{font-size:32px;font-weight:900;color:var(--green);margin:4px 0}
.revlist{display:flex;flex-direction:column;gap:8px}
.rev{border:1.5px solid var(--line2);border-radius:14px;padding:10px 14px;background:var(--paper);display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.rev h4{font-size:16px;font-weight:900}
.rev .kn{font-size:12.5px;color:var(--muted);font-weight:700}
@media (prefers-reduced-motion:reduce){.dots::after{animation:none}.btn{transition:none}}

/* Layout: the altar (this turn's flipped offerings) on the left, the green desk with the anger meter on the right. */
.altar{background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:14px;box-shadow:0 2px 0 var(--line);min-height:170px}
.cards{display:flex;flex-wrap:wrap;gap:8px}
.oc{width:84px;border-radius:12px;border:1.5px solid var(--line2);background:var(--paper);display:flex;flex-direction:column;align-items:center;padding:6px 4px 6px;gap:2px;position:relative}
.oc svg{width:54px;height:54px}
.oc .ocpic{width:66px;height:66px;border-radius:9px;object-fit:cover}
.oc b{font-size:13.5px;font-weight:900;line-height:1.2}
.oc small{font-size:11px;font-weight:700;color:var(--muted)}
.oc .v{position:absolute;top:4px;left:6px;font-family:var(--f-num);font-weight:800;font-size:15px;color:var(--green)}
.oc.angry{background:var(--down-bg);border-color:#E7B2A6}.oc.angry .v{color:var(--down)}
.oc.sp{background:var(--gold-bg);border-color:#E6CF8C}
.oc.new{animation:pop .35s ease-out}
.oc.mini{width:58px;padding:4px 2px}.oc.mini svg{width:34px;height:34px}.oc.mini b{font-size:11.5px}.oc.mini .v{font-size:12px;top:2px;left:4px}
@keyframes pop{0%{transform:translateY(-14px) scale(.85);opacity:0}100%{transform:none;opacity:1}}
.meter{display:flex;gap:6px;align-items:center}
.meter i{flex:1;height:16px;border-radius:6px;background:rgba(255,255,255,.18)}
.meter i.on{background:var(--orange)}
.meter i.tol{outline:2px dashed rgba(255,255,255,.75);outline-offset:1px}
.bigline{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.bigline b{font-family:var(--f-num);font-size:34px;font-weight:800;line-height:1}
.risk{font-weight:900;font-size:13px;border-radius:999px;padding:2px 10px;background:rgba(255,255,255,.16)}
.risk.hi{background:var(--orange)}
.hand{display:flex;flex-wrap:wrap;gap:6px}

  charm:'<rect x="18" y="6" width="28" height="52" rx="3" fill="#F5C443" stroke="#C99A1E" stroke-width="2"/><text x="32" y="26" text-anchor="middle" font-size="12" font-weight="900" fill="#C8432F">平</text><text x="32" y="42" text-anchor="middle" font-size="12" font-weight="900" fill="#C8432F">安</text><path d="M24 50h16" stroke="#C8432F" stroke-width="2"/>',
  cups:'<path d="M10 40a14 14 0 0 1 24-12l-6 8a5 5 0 0 0-9 4z" fill="#C8432F"/><path d="M54 40a14 14 0 0 0-24-12l6 8a5 5 0 0 1 9 4z" fill="#D7542B"/><path d="M14 48h36" stroke="#8A5A2E" stroke-width="3" stroke-linecap="round"/>',
  paper:'<rect x="10" y="14" width="34" height="34" fill="#E9C46A" stroke="#B88A1E" stroke-width="2" transform="rotate(-8 27 31)"/><rect x="20" y="18" width="34" height="34" fill="#F5D37A" stroke="#B88A1E" stroke-width="2"/><rect x="31" y="29" width="12" height="12" fill="#C8432F"/><path d="M48 10q-4 6 0 10q4-6 0-10z" fill="#E9643B"/>',
  grab:'<path d="M20 52V26a4 4 0 0 1 8 0v14V18a4 4 0 0 1 8 0v20V20a4 4 0 0 1 8 0v22l4-6a4 4 0 0 1 7 4l-9 14a12 12 0 0 1-10 6H30a10 10 0 0 1-10-8z" fill="#F2C49B" stroke="#8A5A2E" stroke-width="2" stroke-linejoin="round"/>',
};
const TYPES={
  guai:{n:'乖乖',v:1,cnt:6,k:'off',d:'1 分。在供桌上時，好兄弟耐心 +1'},
  noodle:{n:'泡麵',v:2,cnt:8,k:'off',d:'2 分'},
  soda:{n:'汽水',v:2,cnt:7,k:'off',d:'2 分'},
  can:{n:'罐頭',v:1,cnt:9,k:'off',d:`1 分。收成每湊滿 ${CAN_SET} 罐疊成罐頭塔，終局 +${CAN_BONUS}`},
  pine:{n:'鳳梨',v:3,cnt:6,k:'off',d:'3 分，旺來'},
  cake:{n:'紅龜粿',v:4,cnt:4,k:'off',d:'4 分'},
  wine:{n:'米酒',v:5,cnt:2,k:'off',d:'5 分'},
  angry1:{n:'小不爽',a:1,cnt:12,k:'ang',d:'好兄弟怒氣 +1'},
  angry2:{n:'大不爽',a:2,cnt:6,k:'ang',d:'好兄弟怒氣 +2'},
  charm:{n:'平安符',cnt:2,k:'sp',d:'自動生效：要翻桌時改成把供桌全部收成，回合結束'},
  cups:{n:'擲筊',cnt:3,k:'sp',d:'翻牌前使用：先偷看牌堆頂，可以把它丟進棄牌'},
  paper:{n:'燒紙錢',cnt:2,k:'sp',d:'翻到不爽時使用：把那張不爽燒給一位對手，他下個回合開局就帶著這份怒氣'},
  grab:{n:'順手牽羊',cnt:2,k:'sp',d:'自己回合使用：拿走一位對手最新收成的一張供品，放上你的供桌（翻桌一樣會丟）'},
};
const OFFS=['guai','noodle','soda','can','pine','cake','wine'];
const OBJS=[
  {id:'noodle',n:'泡麵控',d:'收成泡麵最多的人 +4',f:(P)=>most(P,p=>cnt(p,'noodle'),4)},
  {id:'can',n:'罐頭塔大師',d:'收成罐頭最多的人 +4',f:(P)=>most(P,p=>cnt(p,'can'),4)},
  {id:'variety',n:'辦桌澎湃',d:'收成有 5 種以上供品 +4',f:(P)=>P.map(p=>new Set(p.bank.filter(c=>TYPES[c].k==='off')).size>=5?4:0)},
  {id:'careful',n:'小心翼翼',d:'整場沒翻過桌 +4',f:(P)=>P.map(p=>p.busts?0:4)},
  {id:'bold',n:'膽子很大',d:'曾經一次收成 7 張以上 +4',f:(P)=>P.map(p=>p.maxBank>=7?4:0)},
  {id:'sweet',n:'甜甜的',d:'鳳梨加紅龜粿共 4 張以上 +3',f:(P)=>P.map(p=>cnt(p,'pine')+cnt(p,'cake')>=4?3:0)},
  {id:'guai',n:'機台很乖',d:'收成乖乖最多的人 +3',f:(P)=>most(P,p=>cnt(p,'guai'),3)},
  {id:'wine',n:'阿伯愛喝',d:'每張米酒再 +2',f:(P)=>P.map(p=>cnt(p,'wine')*2)},
  {id:'thief',n:'手腳很快',d:'用過順手牽羊的人 +2',f:(P)=>P.map(p=>p.stole?2:0)},
];
function cnt(p,t){return p.bank.filter(c=>c===t).length;}
function most(P,f,v){const xs=P.map(f),m=Math.max(...xs);return xs.map(x=>x===m&&m>0?v:0);}
const AI_NAMES=['阿嬤','里長伯','三叔公','表姊','廟公','隔壁阿姨'];
const SAVE_KEY='pudu-save-v1';

/* ================= state ================= */
let S=null, UI={};
let setupCfg={n:4,seats:[{name:'你',ai:false}].concat(AI_NAMES.slice(0,5).map(n=>({name:n,ai:true}))),speed:'中'};
const NP=()=>S.players.length;
const humans=()=>S.players.filter(p=>!p.ai&&!p.remote); // humans on this device
const pn=i=>`<b class="pn" data-p="${i}">${esc(S.players[i].name)}</b>`;
function log(html,cls=''){const m=/data-p="(\d)"/.exec(html);S.log.unshift({h:html,c:cls,a:m?+m[1]:null,r:S.round});if(S.log.length>200)S.log.length=200;}
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(S));}catch(e){}}
function clearSave(){lsSet(SAVE_KEY,null);}
const ROUNDS=()=>ROUNDS_BY_N[NP()]||4;
const tol=()=>BASE_TOL+S.table.filter(c=>c==='guai').length;
const tableVal=()=>S.table.reduce((a,c)=>a+(TYPES[c].v||0),0);
const offOnTable=()=>S.table.filter(c=>TYPES[c].k==='off');

/* ================= setup ================= */
function buildDeck(){const d=[];Object.entries(TYPES).forEach(([k,t])=>{for(let i=0;i<t.cnt;i++)d.push(k);});return shuffle(d);}
function setupGame(players){
  clearTimeout(timer);
  S={players:players.map(p=>({name:p.name,ai:p.ai,remote:!!p.remote,pid:p.pid||null,bank:[],hand:[],busts:0,pend:0,maxBank:0,stole:false})),
     deck:buildDeck(),discard:[],table:[],anger:0,round:1,start:Math.random()*players.length|0,cur:0,turns:0,phase:'turn',
     objs:shuffle(OBJS.map(o=>o.id)).slice(0,3),log:[],cfgPlayers:players,last:null,gid:rid(6)};
  if(NET.host)S.online={code:NET.code};
  S.cur=S.start;
  log('普渡開始！供桌擺好，好兄弟陸續入座。','q');
  UI={};beginTurn();
}
function beginTurn(){
  const p=S.players[S.cur];
  S.table=[];S.anger=p.pend;S.burned=p.pend?p.pendCards||[]:[];p.pend=0;p.pendCards=[];
  if(S.anger)log(`${pn(S.cur)} 一開局就帶著燒過來的 ${S.anger} 點怒氣`,'k');
  S.phase='turn';UI={};save();proceed();
}

/* ================= core actions ================= */
function drawCard(){
  if(!S.deck.length){if(!S.discard.length)return null;S.deck=shuffle(S.discard);S.discard=[];log('牌堆翻完了，把棄牌洗回去繼續','q');}
  return S.deck.pop();
}
function flip(){
  const i=S.cur,p=S.players[i];
  const c=drawCard();
  if(!c){bank(true);return;}
  S.last=c;UI.peek=null;
  const t=TYPES[c];
  if(t.k==='sp'){p.hand.push(c);log(`${pn(i)} 翻到特殊卡「${t.n}」收進手牌`);afterFlip();return;}
  if(t.k==='off'){S.table.push(c);afterFlip();return;}
  // angry
  if(p.hand.includes('paper')){
    if(p.ai){const tgt=aiBurnTarget(i,c);if(tgt!=null){burn(i,c,tgt);return;}}
    else{S.pendingAngry=c;save();render();return;}
  }
  takeAngry(c);
}
function burn(i,c,tgt){
  const p=S.players[i];p.hand.splice(p.hand.indexOf('paper'),1);S.discard.push('paper');
  const q=S.players[tgt];q.pend+=TYPES[c].a;q.pendCards=(q.pendCards||[]).concat(c);
  S.pendingAngry=null;
  log(`${pn(i)} 燒紙錢，把「${TYPES[c].n}」送給 ${pn(tgt)}`,'k');
  afterFlip();
}
function takeAngry(c){
  const i=S.cur;S.pendingAngry=null;
  S.table.push(c);S.anger+=TYPES[c].a;
  if(S.anger>=tol()){
    const p=S.players[i];
    if(p.hand.includes('charm')){
      p.hand.splice(p.hand.indexOf('charm'),1);S.discard.push('charm');
      log(`${pn(i)} 差點翻桌，平安符發光！供桌平安收成`,'k');
      bank(false,true);return;
    }
    bust();return;
  }
  afterFlip();
}
function afterFlip(){save();proceed();}
function bust(){
  const i=S.cur,p=S.players[i];
  const lost=offOnTable();
  log(`${pn(i)} 惹毛好兄弟，<b>翻桌！</b>${lost.length?'供桌上 '+lost.length+' 張供品（'+tableVal()+' 分）全部飛走':'還好桌上沒東西'}`,'k');
  p.busts++;
  S.discard.push(...S.table,...(S.burned||[]));S.table=[];
  S.phase='bust';render();save();
  const p0=S.players[i];
  openModal(`<div class="handoff"><img class="av" src="img/ghost.webp" alt=""></div><h2>${esc(p0.name)} 翻桌了！</h2><p class="sub">好兄弟怒氣 ${S.anger}，超過耐心 ${tol()}。這回合的 ${lost.length} 張供品全部歸零，之前收成的不受影響。</p>
    <div class="acts"><button class="btn primary" data-m="go">換下一位</button></div>`,()=>{closeModal();endTurn();});
  if(!humans().length||p0.ai||p0.remote)timer=setTimeout(()=>modalCb&&modalCb('go'),Math.max(SPEED*2.2,p0.remote?2200:0));
}
function bank(forced,charm){
  const i=S.cur,p=S.players[i];
  const offs=offOnTable();
  p.bank.push(...offs);p.maxBank=Math.max(p.maxBank,offs.length);
  S.discard.push(...S.table.filter(c=>TYPES[c].k!=='off'),...(S.burned||[]));
  if(!charm)log(`${pn(i)} 見好就收，收成 ${offs.length} 張供品（${offs.reduce((a,c)=>a+TYPES[c].v,0)} 分）`,'');
  S.table=[];endTurn();
}
function useCups(){
  const i=S.cur,p=S.players[i];
  if(!p.hand.includes('cups'))return;
  if(!S.deck.length){S.deck=shuffle(S.discard);S.discard=[];}
  if(!S.deck.length)return;
  p.hand.splice(p.hand.indexOf('cups'),1);S.discard.push('cups');
  UI.peek=S.deck[S.deck.length-1];S.peekBy=i;
  log(`${pn(i)} 擲筊問好兄弟下一張是什麼`);
}
function peekBury(){const c=S.deck.pop();S.discard.push(c);log(`${pn(S.cur)} 擲出聖筊，把牌堆頂的「${TYPES[c].n}」請走了`,'k');UI.peek=null;S.peekBy=null;}
function useGrab(tgt){
  const i=S.cur,p=S.players[i],q=S.players[tgt];
  if(!p.hand.includes('grab')||!q.bank.length)return;
  p.hand.splice(p.hand.indexOf('grab'),1);S.discard.push('grab');
  const c=q.bank.pop();S.table.push(c);p.stole=true;
  log(`${pn(i)} 順手牽羊，從 ${pn(tgt)} 那裡拿走「${TYPES[c].n}」`,'k');
}
function endTurn(){
  S.turns++;S.peekBy=null;UI={};
  S.cur=(S.cur+1)%NP();
  if(S.cur===S.start){
    if(S.round>=ROUNDS()){finish();return;}
    S.round++;log(`第 ${S.round} 輪普渡`,'q');
  }
  if(humans().length>1)S.viewer=null;
  beginTurn();
}

/* ================= AI ================= */
function unseen(){
  // public knowledge: full deck minus everything visible (banks, hands, table, discard)
  const c={};Object.keys(TYPES).forEach(k=>c[k]=TYPES[k].cnt);
  const seen=[...S.discard,...S.table,...(S.burned||[])];S.players.forEach(p=>seen.push(...p.bank,...p.hand));
  seen.forEach(k=>c[k]--);
  if(S.deck.length===0)return null;
  return c;
}
function bustProb(){
  const c=unseen();if(!c)return 0;
  const tot=Object.values(c).reduce((a,b)=>a+Math.max(0,b),0)||1;
  const room=tol()-S.anger;
  let bad=0;if(room<=1)bad+=Math.max(0,c.angry1);if(room<=2)bad+=Math.max(0,c.angry2);
  return bad/tot;
}
function aiBurnTarget(i,c){
  const room=tol()-S.anger;
  if(TYPES[c].a<room-1&&Math.random()<.6)return null;
  const sc=S.players.map((p,j)=>({j,s:p.bank.reduce((a,k)=>a+(TYPES[k].v||0),0)})).filter(x=>x.j!==i).sort((a,b)=>b.s-a.s);
  return sc[0].j;
}
function aiStep(){
  const i=S.cur,p=S.players[i];
  const pb=bustProb(),val=tableVal();
  const leader=Math.max(...S.players.map((q,j)=>j===i?-1:score(j).base));
  const behind=leader-score(i).base;
  // steal first when it is safe
  if(p.hand.includes('grab')&&S.anger<tol()-1){
    let best=null,bv=1;S.players.forEach((q,j)=>{if(j!==i&&q.bank.length){const v=TYPES[q.bank[q.bank.length-1]].v;if(v>=bv){bv=v;best=j;}}});
    if(best!=null&&bv>=2){useGrab(best);return 'again';}
  }
  if(p.hand.includes('cups')&&pb>.18&&!UI.peek&&val>=3){useCups();const t=TYPES[UI.peek];
    if(t.k==='ang'&&S.anger+t.a>=tol()||t.k==='ang'&&Math.random()<.5){peekBury();}
    else UI.peek=null;return 'again';}
  const greed=1+Math.max(0,behind)/12+(S.round===ROUNDS()&&behind>0?.6:0);
  const gain=(1-pb)*1.7*greed, loss=pb*val*(p.hand.includes('charm')?0.15:1);
  if(offOnTable().length===0||gain>loss)return 'flip';
  return 'bank';
}

/* ================= scoring ================= */
function score(i){
  const p=S.players[i];
  const base=p.bank.reduce((a,c)=>a+(TYPES[c].v||0),0);
  const tower=Math.floor(cnt(p,'can')/CAN_SET)*CAN_BONUS;
  return {base,tower};
}
function finalScore(){
  const objv=S.objs.map(id=>OBJS.find(o=>o.id===id).f(S.players));
  return S.players.map((p,i)=>{const s=score(i);const ob=objv.map(v=>v[i]);return {...s,ob,total:s.base+s.tower+ob.reduce((a,b)=>a+b,0)};});
}
function finish(){
  S.phase='end';S.viewer=null;const sc=finalScore();S.final=sc;
  const best=Math.max(...sc.map(s=>s.total));
  let ws=sc.map((s,i)=>i).filter(i=>sc[i].total===best);
  if(ws.length>1){const mb=Math.min(...ws.map(i=>S.players[i].busts));ws=ws.filter(i=>S.players[i].busts===mb);}
  S.winners=ws;log(`普渡圓滿：${ws.map(i=>esc(S.players[i].name)).join('、')} 收成最豐盛`,'q');
  clearSave();render();endModal();
}
function endModal(){
  const sc=S.final;
  openModal(`<h2>普渡圓滿</h2><div class="win">${S.winners.map(i=>esc(S.players[i].name)).join('、')} 勝出</div>
   <p class="sub">供品分數、罐頭塔和好兄弟的口味一起結算。平手時翻桌次數少的人贏。</p>
   <div class="tablewrap"><table class="res"><thead><tr><th>玩家</th><th>供品</th><th>罐頭塔</th>${S.objs.map(id=>`<th>${OBJS.find(o=>o.id===id).n}</th>`).join('')}<th>翻桌</th><th>總分</th></tr></thead><tbody>
   ${sc.map((s,i)=>({s,i})).sort((a,b)=>b.s.total-a.s.total).map(({s,i})=>`<tr><td>${esc(S.players[i].name)}</td><td>${s.base}</td><td>+${s.tower}</td>${s.ob.map(v=>`<td>+${v}</td>`).join('')}<td>${S.players[i].busts}</td><td><b>${s.total}</b></td></tr>`).join('')}</tbody></table></div>
   <div class="acts"><button class="btn${NET.client?' primary':''}" data-m="close">看看供桌</button>${NET.client?'':'<button class="btn primary" data-m="again">再來一局</button>'}</div>`,m=>{closeModal();if(m==='again')setupGame(S.cfgPlayers);});
}

/* ================= flow ================= */
function proceed(){
  clearTimeout(timer);
  if(!S||S.phase!=='turn'||!$('#overlay').hidden)return render();
  const p=S.players[S.cur];
  if(p.ai){
    render();
    timer=setTimeout(()=>{
      if(S.phase!=='turn')return;
      const a=aiStep();
      if(a==='flip')flip();else if(a==='bank')bank();else{save();proceed();}
    },SPEED*(humans().length?1:.5));
    return;
  }
  if(p.remote){render();return;}
  if(humans().length>1&&S.viewer!==S.cur){
    S.viewer=null;render();
    openModal(`<div class="handoff">${avatar(S.cur)}</div><h2>輪到 ${esc(p.name)}</h2><p class="sub">請把裝置交給 ${esc(p.name)}。這個遊戲沒有秘密資訊，大家可以一起看著喊「再翻！」</p>
      <div class="acts"><button class="btn primary" data-m="go">開始翻供品</button></div>`,()=>{closeModal();S.viewer=S.cur;render();scrollDeskIntoView();});
    return;
  }
  S.viewer=S.cur;render();
}

/* ================= view ================= */
const myTurn=()=>S&&S.phase==='turn'&&!S.players[S.cur].ai&&$('#overlay').hidden&&!UI.sent&&(NET.client?S.cur===NET.seat:!S.players[S.cur].remote);
function cardHTML(c,cls=''){
  const t=TYPES[c];
  return `<div class="oc ${t.k==='ang'?'angry':t.k==='sp'?'sp':''} ${cls}" title="${esc(t.d)}">${t.v?`<span class="v">${t.v}</span>`:t.a?`<span class="v">+${t.a}</span>`:''}${t.k==='off'||t.k==='ang'?`<img class="ocpic" src="img/${t.k==='ang'?'ghost':c}.webp" alt="" loading="lazy">`:`<svg viewBox="0 0 64 64" aria-hidden="true">${ART[c]}</svg>`}<b>${t.n}</b>${cls.includes('mini')?'':`<small>${t.k==='ang'?'怒氣 +'+t.a:t.k==='sp'?'特殊':t.v+' 分'}</small>`}</div>`;
}
function render(){
  if(!S)return;
  const R=ROUNDS();let st='';
  for(let i=1;i<=R;i++){if(i>1)st+=`<span class="link ${i<=S.round?'done':''}"></span>`;st+=`<span class="step ${i<S.round||S.phase==='end'?'done':i===S.round&&S.phase!=='idle'?'now':''}">第${i}輪</span>`;}
  st+=`<span class="link ${S.phase==='end'?'done':''}"></span><span class="step ${S.phase==='end'?'now':''}">結算</span>`;
  $('#steps').innerHTML=st;
  const head={idle:'見好就收',turn:'翻供品',bust:'翻桌啦',end:'普渡圓滿'}[S.phase]||'見好就收';
  $('#hero').innerHTML=`<div class="hero-art">${heroArt()}</div><div class="hero-txt"><div class="eyebrow">GHOST MONTH</div><h2>${head}<span class="qbadge">${S.phase==='idle'?'準備開局':S.phase==='end'?'結算':'第 '+S.round+' 輪'}</span></h2>${swoosh}</div>`;
  renderAltar();renderDesk();renderPlayers();
  NET.publish();
  $('#objs').innerHTML=S.objs.map(id=>{const o=OBJS.find(x=>x.id===id);return `<div class="obj"><b>${o.n}</b><span>${o.d}</span></div>`;}).join('');
  const c=unseen()||{};
  $('#deckstat').innerHTML=Object.keys(TYPES).map(k=>`<span class="chip ${TYPES[k].k==='ang'?'down':TYPES[k].k==='sp'?'gold':''}">${TYPES[k].n} ${Math.max(0,c[k]??0)}</span>`).join('');
  $('#decknote').textContent=`牌堆 ${S.deck.length} 張・棄牌 ${S.discard.length} 張`;
  $('#feed').innerHTML=feedHTML(S.log,l=>l.r?'第'+l.r+'輪':'—','翻牌、收成和翻桌都會記在這裡。');
}
function renderAltar(){
  if(S.phase==='idle'){$('#altar').innerHTML='<div class="altar" style="color:var(--muted)">開局後，輪到的人從牌堆翻供品擺上供桌。</div>';$('#tablenote').textContent='';return;}
  if(S.phase==='end'){
    $('#tablenote').textContent='每個人的收成';
    $('#altar').innerHTML=`<div class="altar"><div class="revlist">${S.players.map((p,i)=>`<div class="rev"><h4>${esc(p.name)}・${S.final[i].total} 分</h4><div class="cards">${OFFS.filter(k=>cnt(p,k)).map(k=>`${cardHTML(k,'mini')}<span class="ptag" style="align-self:center">×${cnt(p,k)}</span>`).join('')||'<span class="note">什麼都沒收到</span>'}</div></div>`).join('')}</div></div>`;
    return;
  }
  const p=S.players[S.cur];
  $('#tablenote').textContent=`${p.name} 的供桌・${tableVal()} 分`;
  const n=S.table.length;
  $('#altar').innerHTML=`<div class="altar"><div class="cards">${S.table.map((c,k)=>cardHTML(c,k===n-1&&S.last===c?'new':'')).join('')||'<span class="note" style="padding:20px">供桌還是空的。按「再翻一張」開始。</span>'}</div></div>`;
}
function riskTxt(){const pb=bustProb();return `<span class="risk ${pb>=.25?'hi':''}">下一張翻桌機率 ${Math.round(pb*100)}%</span>`;}
function renderDesk(){
  let h=leafDeco;
  if(S.phase==='turn'||S.phase==='bust'){
    const p=S.players[S.cur],T=tol();
    const meter=Array.from({length:T},(_,k)=>`<i class="${k<S.anger?'on':''} ${k===T-1?'tol':''}"></i>`).join('');
    h+=`<div class="dhead"><h2>${myTurn()?'你的供桌':UI.sent?'已送出':p.ai?'對手翻牌':(p.remote||NET.client)?'等待對手':'換人中'}</h2><span class="pill">第 ${S.round} 輪</span></div>
      <div class="dsub">${esc(p.name)}・翻到怒氣 ${T} 就翻桌</div>
      <div class="dsec"><div class="dlab">好兄弟怒氣<small>耐心 ${T}（基本 ${BASE_TOL}，乖乖每張 +1）</small></div><div class="meter">${meter}</div>
      <div class="bigline"><b>${tableVal()}</b><span>分在桌上，還沒收成</span>${riskTxt()}</div></div>`;
    if(myTurn()&&S.phase==='turn'){
      if(S.pendingAngry){
        const c=S.pendingAngry;
        h+=`<div class="dsec"><div class="dlab">翻到「${TYPES[c].n}」！<small>你有燒紙錢</small></div><div class="peek">${cardHTML(c)}<div>要把這份怒氣燒給別人嗎？吞下去會變成怒氣 ${S.anger+TYPES[c].a} / ${T}。</div></div>
          <div class="chooser">${S.players.map((q,j)=>j===S.cur?'':`<button data-burn="${j}">${avatar(j)}燒給 ${esc(q.name)}</button>`).join('')}</div>
          <button class="passbtn" id="btnSwallow">自己吞下</button></div>`;
      }else{
        if(UI.peek){h+=`<div class="dsec"><div class="dlab">擲筊結果<small>只有你看得到</small></div><div class="peek">${cardHTML(UI.peek)}<div>牌堆頂是這張。要請走它嗎？</div></div><div class="chooser big"><button id="btnBury">請走（丟棄）</button><button id="btnKeep">留著</button></div></div>`;}
        const others=S.players.map((q,j)=>j).filter(j=>j!==S.cur&&S.players[j].bank.length);
        h+=`<div class="dsec"><div class="dlab">手牌<small>點一下使用</small></div><div class="hand">${p.hand.length?p.hand.map((c,k)=>`<button data-use="${c}" ${c==='charm'||c==='paper'||(c==='cups'&&UI.peek)||(c==='grab'&&!others.length)?'disabled':''} title="${esc(TYPES[c].d)}"><svg viewBox="0 0 64 64">${ART[c]}</svg>${TYPES[c].n}</button>`).join(''):'<span class="dnote">沒有特殊卡。翻到的特殊卡會收進這裡。</span>'}</div>
          ${UI.grab?`<div class="chooser">${others.map(j=>{const c=S.players[j].bank[S.players[j].bank.length-1];return `<button data-grab="${j}">${avatar(j)}${esc(S.players[j].name)}的${TYPES[c].n}</button>`;}).join('')}<button data-grab="-1">算了</button></div>`:''}</div>
          <button class="confirm" id="btnFlip">再翻一張 ${ICONS.arrow}</button>
          <button class="passbtn" id="btnBank" ${offOnTable().length?'':'disabled'}>見好就收（收成 ${offOnTable().length} 張）</button>`;
      }
    }else{
      h+=`<div class="think">${avatar(S.cur)}<div><b>${esc(p.name)}</b><div>${UI.sent?'等房主確認<span class="dots"></span>':p.ai?'盯著供桌猶豫要不要再翻<span class="dots"></span>':(p.remote||NET.client)?'在自己的手機上翻牌<span class="dots"></span>':'等待交接裝置'}</div></div></div>`;
      if(p.hand.length)h+=`<div class="dnote">手牌：${p.hand.map(c=>TYPES[c].n).join('、')}</div>`;
    }
  }else if(S.phase==='end'){
    h+=`<div class="dhead"><h2>普渡圓滿</h2><span class="pill">冠軍</span></div><div class="think">${avatar(S.winners[0])}<div><b>${S.winners.map(i=>esc(S.players[i].name)).join('、')}</b><div>總分 ${S.final[S.winners[0]].total}</div></div></div>
     <button class="passbtn" id="btnResult">再看一次結算</button>${NET.client?'':`<button class="confirm" id="btnAgain">再來一局 ${ICONS.arrow}</button>`}`;
  }else{
    h+=`<div class="dhead"><h2>準備開局</h2></div><div class="empty"><b>設定玩家後開始</b>2 到 6 人，可以混搭 AI。</div>`;
  }
  $('#desk').innerHTML=h+NET.barHTML();
}
function renderPlayers(){
  $('#players').innerHTML=S.players.map((p,i)=>{
    const s=S.phase==='end'&&S.final?S.final[i].total:score(i).base+score(i).tower;
    const top=p.bank.length?TYPES[p.bank[p.bank.length-1]].n:'—';
    return `<div class="pl ${i===S.cur&&S.phase==='turn'?'cur':''}">${avatar(i)}<div style="min-width:0"><div class="nm">${esc(p.name)}${p.ai?'<span class="tag">AI</span>':''}${i===S.start&&S.phase!=='idle'?'<span class="tag">起手</span>':''}</div>
    <div class="fig"><span>收成<b>${s}</b></span><span>張數<b>${p.bank.length}</b></span><span>翻桌<b>${p.busts}</b></span></div>
    <div class="piles"><span class="ptag">最上面：${top}</span>${p.hand.map(c=>`<span class="ptag" style="background:var(--gold-bg)">${TYPES[c].n}</span>`).join('')}${p.pend?`<span class="ptag" style="background:var(--down-bg)">帶怒氣 ${p.pend}</span>`:''}</div></div></div>`;}).join('');
}

  <rect x="190" y="132" width="450" height="14" rx="3" fill="#B0703A"/><rect x="200" y="146" width="10" height="34" fill="#8A5A2E"/><rect x="620" y="146" width="10" height="34" fill="#8A5A2E"/>
  <g transform="translate(240 82) scale(.8)">${ART.can}</g><g transform="translate(300 80) scale(.8)">${ART.noodle}</g><g transform="translate(360 78) scale(.8)">${ART.guai}</g><g transform="translate(420 80) scale(.8)">${ART.pine}</g><g transform="translate(480 82) scale(.8)">${ART.soda}</g><g transform="translate(540 84) scale(.8)">${ART.cake}</g>

/* ================= setup & rules ================= */
function showSetup(){
  clearTimeout(timer);
  const sv=lsGet(SAVE_KEY);
  openModal(`<div class="setup-art">${heroArt()}</div><h2>中元普渡</h2><p class="sub">農曆七月，整條街擺滿供桌。輪到你時從牌堆翻供品擺上桌，翻越多分越高。可是好兄弟脾氣不太好，翻到太多「不爽」就會翻桌，這回合全部歸零。</p>
   <div class="pitch"><div><b>再翻一張？</b>每張供品都是分數，每張不爽都讓怒氣上升。</div><div><b>見好就收</b>隨時可以收手，把桌上的供品收成，從此安全。</div><div><b>互相陷害</b>燒紙錢把怒氣送給別人，順手牽羊偷走別人的供品。</div></div>
   ${setupSeatsHTML(setupCfg,2,6)}
   <p class="note">多位人類玩家可以共用一台裝置輪流操作。這個遊戲沒有秘密，大家可以一起看。</p>
   <div class="acts"><a class="btn ghost" href="${LOBBY}">← 回大廳</a><button class="btn" data-m="rules">先看規則</button>${NET.setupBtns()}${sv&&sv.phase==='turn'?'<button class="btn" data-m="resume">繼續上一局</button>':''}<button class="btn primary" data-m="start">開始遊戲</button></div>`,
  m=>{
    if(setupSeatsHandle(setupCfg,m,showSetup))return;
    if(NET.setupHandle(m))return;
    if(m==='rules')showRules();
    else if(m==='resume')resumeGame(sv);
    else if(m==='start'){NET.leave();closeModal();SPEED=SPEEDS[setupCfg.speed];setupGame(seatsToPlayers(setupCfg,AI_NAMES));}
  });
}
function showRules(){showRulesHTML(`
  <p><b>目標：</b>幾輪普渡之後，收成分數最高的人獲勝（2 人 7 輪、3 人 6 輪、4 人 5 輪、5–6 人 4 輪）。平手時翻桌次數少的人贏。</p>
  <h3>你的回合</h3>
  <ol><li><b>再翻一張：</b>從牌堆翻一張。供品擺上你的供桌；不爽讓好兄弟怒氣上升；特殊卡直接收進手牌（之後才用，翻桌也不會丟）。</li>
  <li><b>翻桌：</b>怒氣累積到好兄弟的耐心（基本 ${BASE_TOL}，供桌上每張乖乖 +1）就翻桌，這回合桌上的供品全部丟掉。</li>
  <li><b>見好就收：</b>翻牌前隨時可以收手，桌上的供品放進你的收成堆，永久保留。</li></ol>
  <h3>牌堆（共 ${Object.values(TYPES).reduce((a,t)=>a+t.cnt,0)} 張）</h3>
  <table><tr><th>卡牌</th><th>張數</th><th>效果</th></tr>${Object.values(TYPES).map(t=>`<tr><td>${t.n}</td><td>${t.cnt}</td><td>${t.d}</td></tr>`).join('')}</table>
  <h3>終局計分</h3>
  <ul><li>收成裡每張供品的分數。</li><li>罐頭塔：每 ${CAN_SET} 罐 +${CAN_BONUS}。</li><li>好兄弟的口味：每局隨機翻三張，符合的人加分。</li></ul>
  <h3>口味卡（每局抽 3 張）</h3>
  <ul>${OBJS.map(o=>`<li><b>${o.n}：</b>${o.d}</li>`).join('')}</ul>
  <h3>小撇步</h3>
  <ul><li>「牌堆還剩什麼」會算好還沒出現的牌。不爽出得越多，後面就越安全。</li>
  <li>桌上有乖乖時可以多翻幾張：機台乖，好兄弟也乖。</li>
  <li>平安符只能救一次，但救下來時整桌都收成，適合留到桌上很肥時。</li>
  <li>燒紙錢送出的怒氣會在對方下回合一開始就算進去，送給領先的人最划算。</li></ul>
  <h3>實體版配件</h3>
  <p>${Object.values(TYPES).reduce((a,t)=>a+t.cnt,0)} 張撲克尺寸卡（63×88 mm）、9 張口味卡、1 個怒氣指示木塊。小盒即可裝下。</p>`);}

/* ================= input ================= */
$('#desk').addEventListener('click',e=>{
  if(e.target.closest('#btnAgain')){setupGame(S.cfgPlayers);return;}
  if(e.target.closest('#btnResult')){endModal();return;}
  if(!myTurn())return;
  const b=e.target.closest('button');if(!b||b.disabled)return;
  if(b.dataset.burn!=null)return act({t:'burn',j:+b.dataset.burn});
  if(b.id==='btnSwallow')return act({t:'swallow'});
  if(S.pendingAngry)return;
  if(b.id==='btnFlip')return act({t:'flip'});
  if(b.id==='btnBank')return act({t:'bank'});
  if(b.id==='btnBury')return act({t:'bury'});
  if(b.id==='btnKeep')return act({t:'keep'});
  if(b.dataset.use==='cups')return act({t:'cups'});
  if(b.dataset.use==='grab'){UI.grab=!UI.grab;render();return;}
  if(b.dataset.grab!=null){const j=+b.dataset.grab;UI.grab=false;if(j>=0)return act({t:'grab',j});render();}
});
// one entry point for a move: this device, or the host applying a move sent from a friend's phone
function act(a){
  if(NET.client){NET.send(a);UI={sent:true};render();return;}
  applyAct(S.cur,a);
}
function applyAct(i,a){
  if(S.phase!=='turn'||i!==S.cur)return;
  const p=S.players[i],okJ=j=>Number.isInteger(j)&&j>=0&&j<NP()&&j!==i;
  if(S.pendingAngry){
    if(a.t==='burn'&&okJ(+a.j)&&p.hand.includes('paper'))return burn(i,S.pendingAngry,+a.j);
    if(a.t==='swallow')return takeAngry(S.pendingAngry);
    return;
  }
  if(a.t==='flip'){UI.grab=false;UI.peek=null;S.peekBy=null;flip();return;}
  if(a.t==='bank'){if(!offOnTable().length)return;bank();return;}
  if(a.t==='bury'){if(S.peekBy!==i)return;peekBury();}
  else if(a.t==='keep'){UI.peek=null;S.peekBy=null;}
  else if(a.t==='cups'){if(S.peekBy===i)return;useCups();}
  else if(a.t==='grab'){if(okJ(+a.j))useGrab(+a.j);}
  else return;
  save();render();
}
async function resumeGame(sv){
  closeModal();SPEED=SPEEDS[setupCfg.speed];NET.leave();
  if(sv.online&&!(await NET.resumeHost(sv))){sv.players.forEach(p=>{if(p.remote){p.remote=false;p.ai=true;}});delete sv.online;}
  S=sv;S.viewer=null;UI={};render();proceed();
}
const GAME={id:'pudu',name:'中元普渡',hostKey:'pudu-net-host',clientKey:'pudu-net-client',min:2,max:6,aiNames:AI_NAMES,
  secretHint:'擲筊看到的牌只會出現在你自己的手機上。',
  start(cfg){setupGame(cfg);},
  strip(pub){pub.deck=pub.deck.map(()=>null);},
  secret(i){return S.peekBy===i&&S.deck.length?{peek:S.deck[S.deck.length-1]}:{peek:null};},
  applySecret(seat,sec){S._peek=sec.peek||null;},
  waiting(){if(!S||S.phase!=='turn')return [];return S.players[S.cur].ai?[]:[S.cur];},
  action(seat,a){applyAct(seat,a);},
  afterTakeover(ws){ws.forEach(i=>{S.cfgPlayers[i]={name:S.players[i].name,ai:true};});if(S.pendingAngry&&ws.includes(S.cur))takeAngry(S.pendingAngry);else if($('#overlay').hidden)proceed();else render();},
  resumeUI(){if(S.phase==='end')endModal();else proceed();},
  clientReset(prev){if(!prev||prev.gid!==S.gid||prev.cur!==S.cur||prev.phase!==S.phase||prev.table.length!==S.table.length||prev.peekBy!==S.peekBy||prev.pendingAngry!==S.pendingAngry||JSON.stringify(prev.players[S.cur].hand)!==JSON.stringify(S.players[S.cur].hand))UI={};UI.peek=S.cur===NET.seat?S._peek:null;},
  clientModal(){
    if(S.phase==='end')return {key:'end'+S.gid,open:endModal};
    if(S.phase==='bust'){const p0=S.players[S.cur];return {key:'b'+S.gid+S.turns,open:()=>openModal(`<div class="handoff"><img class="av" src="img/ghost.webp" alt=""></div><h2>${esc(p0.name)} 翻桌了！</h2><p class="sub">好兄弟怒氣衝破耐心，這回合的供品全部歸零。</p><div class="acts"><button class="btn primary" data-m="ok">知道了</button></div>`,()=>closeModal())};}
    return null;
  },
};
$('#btnRules').addEventListener('click',showRules);
$('#btnNew').addEventListener('click',()=>{if(NET.online){NET.confirmLeave();return;}if(S&&S.phase!=='end'&&S.phase!=='idle'){openModal(`<h2>放棄目前這局？</h2><p class="sub">目前的進度會被清除。</p><div class="acts"><button class="btn" data-m="no">繼續玩</button><button class="btn primary" data-m="yes">開新遊戲</button></div>`,m=>{if(m==='yes'){clearTimeout(timer);clearSave();showSetup();}else{closeModal();proceed();}});}else showSetup();});

/* ================= boot ================= */
window.__game={setupGame,setSpeed:v=>{SPEED=v;},get S(){return S;},finalScore};
(function boot(){
  S={players:Array.from({length:4},()=>({name:'—',ai:true,bank:[],hand:[],busts:0,pend:0,maxBank:0})),deck:buildDeck(),discard:[],table:[],anger:0,round:1,start:0,cur:0,phase:'idle',objs:OBJS.slice(0,3).map(o=>o.id),log:[]};
  render();showSetup();
})();
</script>
