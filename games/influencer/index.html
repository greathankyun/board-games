<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>網紅爆紅計畫</title>
<meta name="description" content="原創輪抽派對桌遊：輪流抽選美食、旅遊、開箱、業配內容卡經營頻道，追演算法加成、躲炎上事件，三季後粉絲最多的人勝。">
<meta name="theme-color" content="#1E5641">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="icon" href="../../icons/icon-192.png">
<link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="遊戲群島">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Outfit:wght@600;700;800&display=swap">
<style>
:root{
  --paper:#F5EEE1; --paper2:#EFE6D4; --card:#FFFBF4; --ink:#1F2B27; --muted:#6E7068; --line:#E5D9C3; --line2:#D9CBB1;
  --green:#1E5641; --green2:#28704F; --green-ink:#F3F7EF; --yellow:#F5C443; --yellow-ink:#2A2310;
  --orange:#E9643B; --pink:#F7DDD3; --pink2:#EFC6B8; --up:#2C8F4E; --up-bg:#D5EEDA; --down:#C8432F; --down-bg:#F7DAD3; --flat-bg:#ECE5D7;
  --red:#D7542B; --red-bg:#F8DCCF; --blue:#2E7DC0; --blue-bg:#D6E7F5; --violet:#7A5AD3; --violet-bg:#E4DCF7; --gold:#D19A17; --gold-bg:#F6E7BE;
  --p0:#E58FA0; --p1:#8B67D6; --p2:#4F9E61; --p3:#E0922F; --p4:#3E9CC4; --p5:#C8573E; --p6:#6C7A3A; --p7:#5C6BC0;
  --scrim:rgba(40,32,20,.45);
  --f-body:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
  --f-num:'Outfit','Noto Sans TC',system-ui,sans-serif;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55;font-weight:500}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
  background-image:radial-gradient(rgba(120,90,40,.07) 1px,transparent 1px);background-size:5px 5px}
.wrap{position:relative;z-index:1;max-width:1600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 28px}
h1,h2,h3,h4{text-wrap:balance;margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
svg{display:block}

/* header */
.top{display:flex;align-items:center;gap:14px 22px;flex-wrap:wrap;padding-block:6px 12px;border-bottom:1.5px solid var(--line2)}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit}
.brand svg{width:44px;height:44px;flex:none}
.brand h1{font-size:clamp(26px,3.4vw,38px);font-weight:900;letter-spacing:.06em;line-height:1}
.brand small{font-family:var(--f-num);font-size:12px;letter-spacing:.42em;color:var(--ink);font-weight:600;margin-left:6px}
.homelink{display:inline-flex;align-items:center;gap:6px;font-size:15px;font-weight:900;color:var(--ink);text-decoration:none;border:1.5px solid var(--ink);border-radius:12px;padding:7px 12px;background:var(--card)}.homelink svg{width:18px;height:18px}
.vsep{width:1.5px;align-self:stretch;background:var(--line2);margin-block:6px}
.steps{display:flex;align-items:center;flex:1;min-width:0;justify-content:center}
.step{font-family:var(--f-num);font-weight:700;font-size:15px;padding:5px 14px;border-radius:999px;border:1.5px solid var(--line2);background:var(--card);color:var(--ink);white-space:nowrap}
.step.done{color:var(--muted);background:var(--paper2)}
.step.now{background:var(--green);border-color:var(--green);color:var(--green-ink);font-size:17px;padding:6px 18px}
.link{flex:1;min-width:8px;max-width:56px;height:2px;background:repeating-linear-gradient(90deg,var(--line2) 0 4px,transparent 4px 8px)}
.link.done{background:var(--green)}
.tops{display:flex;gap:10px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--ink);background:var(--card);color:var(--ink);padding:8px 16px;border-radius:12px;cursor:pointer;font-weight:700;line-height:1.2;text-decoration:none}
.btn svg{width:18px;height:18px}
.btn:hover:not(:disabled){transform:translateY(-1px)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.dark,.btn.primary{background:var(--green);border-color:var(--green);color:var(--green-ink)}
.btn.ghost{background:transparent}

/* layout */
.board{display:grid;grid-template-columns:minmax(0,1fr) minmax(340px,430px);grid-template-areas:"hero desk" "main desk";grid-template-rows:auto 1fr;gap:14px 18px;margin-top:12px;align-items:start}
.hero{grid-area:hero;position:relative;min-height:140px;display:flex;align-items:center;overflow:hidden;border-radius:18px}
.hero-txt{position:relative;z-index:2;padding:8px 0 10px}
.eyebrow{display:flex;align-items:center;gap:12px;font-family:var(--f-num);font-weight:600;letter-spacing:.32em;font-size:13px}
.eyebrow::after{content:"";width:80px;height:1.5px;background:var(--ink)}
.hero h2{font-size:clamp(28px,4vw,48px);font-weight:900;letter-spacing:.03em;line-height:1.15;margin-top:6px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.swoosh{display:block;width:150px;height:14px;margin-top:-2px}
.qbadge{position:relative;font-size:17px;font-weight:900;border:2px solid var(--ink);border-radius:999px;padding:3px 14px;background:var(--card);letter-spacing:.04em}
.hero-art{position:absolute;right:0;top:0;bottom:0;width:min(62%,640px);z-index:1;
  -webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 28%);mask-image:linear-gradient(90deg,transparent 0%,#000 28%)}
.hero-art svg{width:100%;height:100%}
main{grid-area:main;min-width:0}
.sect{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:900;padding-bottom:10px;border-bottom:1.5px solid var(--line2);margin:0 0 12px}
.sect svg{width:26px;height:26px;color:var(--orange)}
.sect{flex-wrap:wrap}
.sect small{font-size:13px;color:var(--muted);font-weight:700;margin-left:auto}
@media (max-width:640px){.sect small{flex-basis:100%;margin-left:0}}

/* desk */
.desk{grid-area:desk;position:sticky;top:max(10px,env(safe-area-inset-top,0px));background:var(--green);color:var(--green-ink);border-radius:26px;padding:24px 24px 22px;overflow:hidden;display:flex;flex-direction:column;gap:14px;box-shadow:0 18px 40px rgba(20,60,45,.25)}
.desk .leaf{position:absolute;right:-30px;top:-20px;width:190px;height:190px;opacity:.9;pointer-events:none}
.desk>*{position:relative}
.dhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.dhead h2{font-size:clamp(26px,2.6vw,36px);font-weight:900;letter-spacing:.04em;line-height:1.1}
.pill{background:var(--orange);color:#fff;font-weight:900;border-radius:999px;padding:5px 14px;font-size:15px;white-space:nowrap}
.pill.soft{background:rgba(255,255,255,.16)}
.dsub{font-weight:700;font-size:15px;margin-top:-6px;opacity:.9}
.dlab{font-size:14px;opacity:.9;font-weight:900;display:flex;align-items:center;gap:8px;justify-content:space-between}
.dlab small{font-weight:700;opacity:.8;font-size:12px}
.dnote{font-size:13px;font-weight:700;background:rgba(255,255,255,.12);border-radius:10px;padding:7px 12px}
.dnote.warn{background:rgba(233,100,59,.28)}
.confirm{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:none;border-radius:16px;background:var(--yellow);color:var(--yellow-ink);font-size:22px;font-weight:900;padding:13px;cursor:pointer;box-shadow:0 4px 0 #C99A1E;letter-spacing:.06em}
.confirm svg{width:24px;height:24px}
.confirm:active:not(:disabled){transform:translateY(2px);box-shadow:0 2px 0 #C99A1E}
.confirm:disabled{opacity:.5;cursor:not-allowed}
.passbtn{width:100%;border:2px solid rgba(255,255,255,.85);background:transparent;color:var(--green-ink);border-radius:14px;font-weight:900;font-size:17px;padding:10px;cursor:pointer}
.passbtn:hover{background:rgba(255,255,255,.08)}
.empty{border:2px dashed rgba(255,255,255,.35);border-radius:16px;padding:20px 16px;text-align:center;font-weight:700;opacity:.92}
.empty b{display:block;font-size:19px;margin-bottom:4px}
.think{display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.1);border-radius:16px;padding:14px}
.think .av{width:56px;height:56px;flex:none}
.think b{font-size:19px}
.dots::after{content:"…";display:inline-block;animation:blink 1.1s steps(3) infinite}
@keyframes blink{0%{opacity:.2}50%{opacity:1}100%{opacity:.2}}
.chooser{display:flex;flex-wrap:wrap;gap:6px}
.chooser button{border:2px solid rgba(255,255,255,.55);background:transparent;color:var(--green-ink);border-radius:12px;padding:7px 12px;font-weight:900;cursor:pointer;display:inline-flex;align-items:center;gap:6px;min-height:40px}
.chooser button .av{width:24px;height:24px}
.chooser button.on{background:var(--card);color:var(--ink);border-color:var(--card)}
.chooser button:disabled{opacity:.35;cursor:not-allowed}
.chooser button.red.on{background:var(--red);border-color:var(--red);color:#fff}
.chooser button.blue.on{background:var(--blue);border-color:var(--blue);color:#fff}
.chooser.big button{flex:1;justify-content:center;font-size:16px}
.opt2{display:flex;flex-direction:column;gap:6px}
.opt2 button{display:flex;justify-content:space-between;gap:10px;align-items:center;text-align:left;border:2px solid rgba(255,255,255,.4);background:transparent;color:var(--green-ink);border-radius:12px;padding:9px 12px;cursor:pointer}
.opt2 button b{font-weight:900;font-size:15px}
.opt2 button span{font-size:12px;opacity:.85}
.opt2 button.on{background:var(--card);color:var(--ink);border-color:var(--card)}
.opt2 button.on span{opacity:1;color:var(--muted)}
.opt2 button:disabled{opacity:.35;cursor:not-allowed}
.dsec{display:flex;flex-direction:column;gap:8px;padding-top:12px;border-top:1px solid rgba(255,255,255,.2)}

/* private note card */
.intel{position:relative;background:var(--pink);color:var(--ink);border-radius:14px;padding:14px 16px 12px;box-shadow:0 6px 14px rgba(0,0,0,.18)}
.intel::after{content:"";position:absolute;right:0;top:0;width:28px;height:28px;background:linear-gradient(225deg,var(--green) 50%,var(--pink2) 50%);border-bottom-left-radius:8px}
.intel .ilab{display:flex;align-items:center;gap:8px;font-weight:900;color:#B24A35;font-size:16px;padding-bottom:8px;border-bottom:1.5px solid var(--pink2)}
.intel .ilab svg{width:20px;height:20px}
.intel ul{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:260px;overflow:auto}
.intel li{font-size:13.5px;line-height:1.45;display:flex;gap:8px;align-items:flex-start}
.intel li .rt{font-family:var(--f-num);font-weight:700;font-size:11px;border:1.5px solid var(--pink2);border-radius:6px;padding:0 5px;background:var(--card);white-space:nowrap;margin-top:1px}
.intel li.void{opacity:.45;text-decoration:line-through}
.intel .inote{font-size:12.5px;color:#5B4A40;margin-top:8px}
.intel .big{font-size:22px;font-weight:900;margin:8px 0 2px}
.stamp{border:1.5px solid #B24A35;color:#B24A35;border-radius:8px;padding:1px 9px;font-weight:900;font-size:12px;white-space:nowrap;display:inline-block;transform:rotate(-3deg)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:900;padding:1px 9px;border-radius:8px;background:var(--flat-bg);color:var(--ink);white-space:nowrap}
.chip.red{background:var(--red);color:#fff}.chip.blue{background:var(--blue);color:#fff}.chip.violet{background:var(--violet);color:#fff}
.chip.gold{background:var(--gold-bg);color:#6B4D07}.chip.green{background:var(--up-bg);color:var(--up)}.chip.down{background:var(--down-bg);color:var(--down)}

/* feed */
.feed{margin-top:18px}
.feedlist{list-style:none;margin:0;padding:0;overflow:auto;max-height:320px}
.feedlist li{display:grid;grid-template-columns:auto 34px minmax(0,1fr);gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.qtag{font-family:var(--f-num);font-weight:700;font-size:12px;border:1.5px solid var(--line2);border-radius:6px;padding:1px 6px;background:var(--card)}
.feedlist .av{width:34px;height:34px}
.feedlist .txt{font-size:13.5px;line-height:1.45;min-width:0}
.feedlist .ic{width:34px;height:34px;border-radius:50%;background:var(--paper2);display:grid;place-items:center;color:var(--green)}
.feedlist .ic svg{width:18px;height:18px}
.feedlist li.q .txt{font-weight:900;color:var(--green)}
.feedlist li.k .txt{color:#8A4A12}
.pn{font-weight:900;color:var(--ink)}

/* players strip */
.players{margin-top:18px;background:var(--card);border:1.5px solid var(--line);border-radius:20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));padding:8px;gap:6px;box-shadow:0 8px 20px rgba(90,70,30,.06)}
.pl{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:14px;position:relative;min-width:0}
.pl.cur{background:var(--pink)}
.pl .av{width:52px;height:52px;flex:none}
.pl .nm{font-size:17px;font-weight:900;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tag{font-size:11px;font-weight:700;border:1.5px solid var(--line2);border-radius:6px;padding:0 5px;color:var(--muted);background:var(--card)}
.pl .fig{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:13px;color:var(--muted)}
.pl .fig b{font-family:var(--f-num);font-weight:800;color:var(--ink);font-size:16px;margin-left:3px}

/* responsive */
@media (max-width:1040px){
  .board{grid-template-columns:minmax(0,1fr);grid-template-areas:"hero" "desk" "main"}
  .desk{position:relative;top:0}
  .hero-art{width:70%;opacity:.55}
}
@media (max-width:640px){
  .vsep{display:none}
  .steps{order:3;flex-basis:100%;justify-content:flex-start;overflow-x:auto;padding-bottom:2px}
  .step{padding:4px 10px;font-size:13px}.step.now{padding:5px 12px;font-size:15px}
  .brand small{display:none}
  .desk{padding:20px 16px;border-radius:22px}
  .tops .btn{padding:8px 11px}
}

/* modals */
.overlay{position:fixed;inset:0;background:var(--scrim);display:grid;place-items:center;z-index:50;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--card);color:var(--ink);border-radius:24px;border:1.5px solid var(--line);width:min(660px,100%);max-height:calc(100dvh - 32px);overflow:auto;padding:24px;box-shadow:0 30px 70px rgba(40,30,10,.3)}
.modal h2{font-size:27px;font-weight:900;margin-bottom:6px;letter-spacing:.03em}
.modal .sub{color:var(--muted);margin:0 0 14px}
.modal .acts{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}
.modal .acts .btn{padding:10px 20px;font-size:16px}
.modal .intel::after{background:linear-gradient(225deg,var(--card) 50%,var(--pink2) 50%)}
.seats{display:flex;flex-direction:column;gap:10px}
.seat{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center}
.seat .av{width:44px;height:44px}
.seat input{font:inherit;font-weight:700;padding:9px 12px;border:1.5px solid var(--line2);border-radius:12px;background:var(--paper);color:var(--ink);min-width:0;width:100%}
.seg{display:inline-flex;border:1.5px solid var(--line2);border-radius:12px;overflow:hidden;background:var(--paper);flex-wrap:wrap}
.seg button{border:none;background:transparent;color:var(--muted);padding:8px 12px;cursor:pointer;font-weight:700}
.seg button.on{background:var(--green);color:var(--green-ink)}
.field{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:14px 0;flex-wrap:wrap}
.field>span{font-weight:900;font-size:16px}
.note{font-size:12px;color:var(--muted)}
.pitch{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:0 0 6px}
.pitch div{background:var(--paper);border-radius:14px;padding:12px;font-size:13px;color:var(--muted)}
.pitch b{display:block;color:var(--ink);font-size:15px;font-weight:900;margin-bottom:2px}
.setup-art{height:120px;margin:-24px -24px 16px;overflow:hidden;border-radius:24px 24px 0 0}
.setup-art svg{width:100%;height:100%}
.rules{font-size:15px;line-height:1.8}
.rules h3{font-size:19px;font-weight:900;margin:18px 0 6px;color:var(--green)}
.rules p,.rules li{max-width:64ch}
.rules ol,.rules ul{padding-left:1.3em;margin:6px 0}
.rules table{border-collapse:collapse;font-size:14px;margin:6px 0;width:100%}
.rules td,.rules th{border-top:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.rules th{font-size:12px;color:var(--muted)}
.handoff .av{width:84px;height:84px;margin-bottom:10px}
table.res{width:100%;border-collapse:collapse;margin-top:12px;font-size:14px}
table.res th{font-size:12px;color:var(--muted);text-align:right;font-weight:700;padding:4px 6px}
table.res td{text-align:right;padding:8px 6px;border-top:1px solid var(--line);font-family:var(--f-num);font-weight:700;font-variant-numeric:tabular-nums}
table.res th:first-child,table.res td:first-child{text-align:left;font-family:var(--f-body)}
.tablewrap{overflow-x:auto}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--muted)}
.win{font-size:32px;font-weight:900;color:var(--green);margin:4px 0}
.revlist{display:flex;flex-direction:column;gap:8px}
.rev{border:1.5px solid var(--line2);border-radius:14px;padding:10px 14px;background:var(--paper);display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.rev h4{font-size:16px;font-weight:900}
.rev .kn{font-size:12.5px;color:var(--muted);font-weight:700}
@media (prefers-reduced-motion:reduce){.dots::after{animation:none}.btn{transition:none}}


/* ---- game ---- */
/* Layout: algorithm banner and fan leaderboard on top, every channel's played content below; the desk holds your private hand. */
.algo{display:flex;gap:14px;align-items:center;background:#1F2B27;color:#fff;border-radius:18px;padding:12px 16px;margin-bottom:14px}
.algo .ic{width:46px;height:46px;border-radius:12px;background:var(--yellow);color:var(--yellow-ink);display:grid;place-items:center;font-weight:900;font-size:22px;flex:none}
.algo b{display:block;font-size:17px;font-weight:900}
.algo span{font-size:13px;opacity:.85}
.trk{display:flex;flex-direction:column;gap:6px}
.trow{display:grid;grid-template-columns:120px minmax(0,1fr) 70px;gap:10px;align-items:center;font-weight:900;font-size:13.5px}
.trow .nm{display:flex;align-items:center;gap:6px;min-width:0}
.trow .nm .av{width:26px;height:26px;flex:none}
.trow .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar2{height:16px;border-radius:8px;background:var(--paper2);position:relative;overflow:visible}
.bar2 i{position:absolute;left:0;top:0;bottom:0;border-radius:8px;background:var(--orange)}
.bar2 em{position:absolute;top:-3px;width:2px;height:22px;background:var(--line2)}
.trow .v{font-family:var(--f-num);font-weight:800;text-align:right}
.badge{display:inline-block;font-size:10.5px;font-weight:900;border-radius:6px;padding:0 5px;margin-left:4px;vertical-align:1px}
.badge.s{background:#E3E6EA;color:#55606B}.badge.g{background:var(--gold-bg);color:#8A6A0A}.badge.d{background:#D7EEF8;color:#1F6F96}
.chs{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.ch{background:var(--card);border:1.5px solid var(--line2);border-radius:16px;padding:10px 12px}
.ch .hd{display:flex;align-items:center;gap:8px;font-weight:900;margin-bottom:6px}
.ch .hd .av{width:30px;height:30px}
.ch .hd small{margin-left:auto;font-family:var(--f-num);color:var(--green);font-weight:800}
.ch .cs{display:flex;flex-wrap:wrap;gap:4px}

  ['flame',['舊文被挖出來','業配沒標示','嗆酸民','抄襲爭議','擺拍被抓包','發錯限動','亂講冷知識','直播忘了關鏡頭']],
  ['pr',['誠懇道歉影片','公關危機處理','律師聲明稿','暫停更新沉澱','真誠長文','粉絲後援會']],
];
const ALGOS=[
  {k:'food',n:'美食當道',d:'美食系列多算 1 張。迷因指定：美食。'},
  {k:'chal',n:'短影音時代',d:'挑戰湊到 2 張以上再 +4。迷因指定：挑戰。'},
  {k:'trip',n:'國旅補助',d:'每張旅遊 +1。迷因指定：旅遊。'},
  {k:'unbox',n:'開箱狂熱',d:'開箱人氣獎勵加倍（+12 / +6）。迷因指定：開箱。'},
  {k:'ad',n:'業配寒冬',d:'業配每張只有 +2，但不會被嫌太多。迷因指定：業配。'},
  {k:'live',n:'直播紅利',d:'每張直播再 +2。迷因指定：直播。'},
  {k:'collab',n:'聯名企劃',d:'合作一定拿到 +3 加成。迷因指定：合作。'},
  {k:'flame',n:'網路審判',d:'每次被炎上 −6。迷因指定：炎上（蹭炎上的熱度）。'},
];
const AI_NAMES=['吃貨小薇','背包阿傑','開箱王','科技宅','阿嬤上線'];
const SAVE_KEY='influencer-save-v1';
const FOOD=[0,1,3,6,10,15], TRIP=[0,2,5,9,14], CHAL=[0,1,6,12,18];

/* ================= state ================= */
let S=null, UI={};
let setupCfg={n:4,seats:[{name:'你',ai:false}].concat(AI_NAMES.slice(0,4).map(n=>({name:n,ai:true}))),speed:'中'};
const NP=()=>S.players.length;
const humans=()=>S.players.filter(p=>!p.ai&&!p.remote); // humans on this device
const pn=i=>`<b class="pn" data-p="${i}">${esc(S.players[i].name)}</b>`;
function log(html,cls=''){const m=/data-p="(\d+)"/.exec(html);S.log.unshift({h:html,c:cls,a:m?+m[1]:null,r:S.round});if(S.log.length>220)S.log.length=220;}
function save(){lsSet(SAVE_KEY,S);}
function clearSave(){lsSet(SAVE_KEY,null);}
const algo=()=>ALGOS[S.algos[S.round-1]];
function buildDeck(){const d=[];let id=0;DECKDEF.forEach(([k,list])=>list.forEach(x=>{const c={id:id++,k};if(Array.isArray(x)){c.n=x[0];if(k==='trip')c.reg=x[1];else c.v=x[1];}else c.n=x;d.push(c);}));return d;}
const fans=v=>`${v} 萬`;
const badge=v=>v>=100?'<span class="badge d">鑽石</span>':v>=60?'<span class="badge g">金</span>':v>=30?'<span class="badge s">銀</span>':'';

/* ================= setup ================= */
function setupGame(players){
  clearTimeout(timer);
  S={players:players.map(p=>({name:p.name,ai:p.ai,remote:!!p.remote,pid:p.pid||null,fans:0,hand:[],tab:[],flames:0,flameTotal:0,hist:[]})),round:1,pick:1,algos:shuffle(ALGOS.map((_,k)=>k)).slice(0,ROUNDS),
     ch:{},phase:'draft',log:[],viewer:null,cfgPlayers:players,gid:rid(6)};
  if(NET.host)S.online={code:NET.code};
  const hs=humans();S.viewer=hs.length===1?S.players.indexOf(hs[0]):null;
  log('三位數訂閱的小頻道們，準備衝一波！','q');
  startRound();
}
function startRound(){
  const deck=shuffle(buildDeck());const h=HAND[NP()];
  S.players.forEach(p=>{p.hand=deck.splice(0,h);p.tab=[];p.flames=0;});
  S.pick=1;S.ch={};S.phase='algo';render();save();
  const a=algo();
  openModal(`<h2>第 ${S.round} 季</h2><div class="intel" style="margin:6px 0 4px"><div class="ilab">${ICONS.spark}本季演算法</div><div class="big">${a.n}</div><div class="inote">${a.d}</div></div>
   <p class="sub">每人拿到 ${h} 張內容卡。每次大家同時選 1 張發布，剩下的傳給${S.round===2?'右':'左'}邊的人。</p>
   <div class="acts"><button class="btn primary" data-m="go">開始企劃</button></div>`,()=>{closeModal();S.phase='draft';proceed();});
  if(!humans().length)timer=setTimeout(()=>modalCb&&modalCb('go'),SPEED*2);
}

/* ================= scoring ================= */
function scoreTab(i,tabs,flames){
  const T=tabs[i],a=algo().k,cnt=k=>T.filter(c=>c.k===k).length;
  const out={};
  let f=cnt('food');if(a==='food'&&f>0)f++;out.food=f>5?15+(f-5)*5:FOOD[f];
  const regs=new Set(T.filter(c=>c.k==='trip').map(c=>c.reg)).size;out.trip=TRIP[regs]+(a==='trip'?cnt('trip'):0);
  // unboxing majority
  const sums=tabs.map(t=>t.filter(c=>c.k==='unbox').reduce((s,c)=>s+c.v,0));
  const mul=a==='unbox'?2:1;out.unbox=0;
  if(sums[i]>0){
    const vals=[...new Set(sums.filter(x=>x>0))].sort((x,y)=>y-x);
    const top=sums.filter(x=>x===vals[0]).length;
    if(sums[i]===vals[0])out.unbox=top>1?Math.floor((6+3)*mul/top):6*mul;
    else if(top===1&&sums[i]===vals[1]){const sec=sums.filter(x=>x===vals[1]).length;out.unbox=Math.floor(3*mul/sec);}
  }
  const ad=cnt('ad');out.ad=a==='ad'?ad*2:ad*4-Math.max(0,ad-2)*5;
  const kinds=new Set(T.map(c=>c.k)).size;out.live=cnt('live')*(kinds+(a==='live'?2:0));
  const ch=cnt('chal');out.chal=CHAL[Math.min(4,ch)]+(a==='chal'&&ch>=2?4:0);
  const n=tabs.length,L=tabs[(i+n-1)%n],R=tabs[(i+1)%n];
  const nbr=a==='collab'||(n>1&&(L.some(c=>c.k==='collab')||R.some(c=>c.k==='collab')));
  out.collab=cnt('collab')*(3+(nbr?3:0));
  out.meme=cnt('meme')*2*cnt(a);
  const pr=cnt('pr');out.pr=pr;
  const hit=Math.max(0,flames[i]-pr);out.flame=-hit*(a==='flame'?6:4);
  out.total=Object.values(out).reduce((s,v)=>s+v,0);
  return out;
}

/* ================= flow ================= */
function curTurn(){if(S.phase!=='draft')return null;if(NET.client)return S.ch[NET.seat]==null?NET.seat:null;const o=S.players.map((_,i)=>i).filter(i=>S.ch[i]==null);return o.find(i=>!S.players[i].remote)??o[0]??null;} // everyone picks at the same time; friends pick on their own phones
function proceed(){
  clearTimeout(timer);save();
  if(!S||!$('#overlay').hidden)return;
  if(S.phase!=='draft')return render();
  const cur=curTurn();
  if(cur==null){reveal();return;}
  const p=S.players[cur];
  if(p.ai){S.ch[cur]=aiPick(cur);proceed();return;}
  if(p.remote){render();return;}
  if(S.viewer!==cur){
    S.viewer=null;UI={};render();
    openModal(`<div class="handoff">${avatar(cur)}</div><h2>請把裝置交給 ${esc(p.name)}</h2><p class="sub">輪到你從手牌選一張內容發布。其他人請別偷看你的手牌。</p>
     <div class="acts"><button class="btn primary" data-m="go">我是 ${esc(p.name)}，開始</button></div>`,()=>{closeModal();S.viewer=cur;UI={};render();scrollDeskIntoView();});
    return;
  }
  render();
}
function reveal(){
  const n=NP();
  const picks=S.players.map((p,i)=>{const c=S.ch[i];const card=p.hand.find(x=>x.id===c.id);p.hand=p.hand.filter(x=>x.id!==c.id);return {i,card,t:c.t};});
  picks.forEach(({i,card,t})=>{
    S.players[i].tab.push(card);
    if(card.k==='flame'&&t!=null){S.players[t].flames++;S.players[t].flameTotal++;log(`${pn(i)} 發了「${card.n}」的爆料，矛頭指向 ${pn(t)}！`,'k');}
    else log(`${pn(i)} 發布了「${card.n}」（${CAT[card.k].n}）。`);
  });
  // pass hands
  const dir=S.round===2?-1:1;
  const hands=S.players.map(p=>p.hand);
  S.players.forEach((p,i)=>{p.hand=hands[(i-dir+n)%n];});
  S.ch={};S.pick++;
  if(S.players[0].hand.length===0){endRound();return;}
  if(humans().length>1)S.viewer=null;
  render();save();
  timer=setTimeout(proceed,humans().length?200:SPEED/3);
}
function endRound(){
  const tabs=S.players.map(p=>p.tab),fl=S.players.map(p=>p.flames);
  const res=S.players.map((_,i)=>scoreTab(i,tabs,fl));
  S.players.forEach((p,i)=>{p.fans+=res[i].total;p.hist.push({res:res[i],tab:p.tab.slice(),algo:S.algos[S.round-1]});});
  log(`第 ${S.round} 季結算：${S.players.map((p,i)=>`${pn(i)} ${res[i].total>=0?'+':''}${res[i].total} 萬`).join('、')}`,'q');
  S.phase='score';render();save();
  const rows=S.players.map((p,i)=>({p,i,r:res[i]})).sort((a,b)=>b.r.total-a.r.total);
  const keys=['food','trip','unbox','ad','live','chal','collab','meme','pr','flame'];
  openModal(`<h2>第 ${S.round} 季結算</h2><p class="sub">本季演算法「${algo().n}」</p>
   <div class="tablewrap"><table class="res"><thead><tr><th>網紅</th>${keys.map(k=>`<th>${CAT[k].n}</th>`).join('')}<th>本季</th><th>累積</th></tr></thead><tbody>
   ${rows.map(({p,i,r})=>`<tr><td>${esc(p.name)}</td>${keys.map(k=>`<td>${r[k]||0}</td>`).join('')}<td><b>${r.total>=0?'+':''}${r.total}</b></td><td>${p.fans}</td></tr>`).join('')}</tbody></table></div>
   <div class="acts"><button class="btn primary" data-m="go">${S.round>=ROUNDS?'看最終結果':'下一季'}</button></div>`,()=>{closeModal();
     if(S.round>=ROUNDS){finish();return;}
     S.round++;startRound();});
  if(!humans().length)timer=setTimeout(()=>modalCb&&modalCb('go'),SPEED*2);
}
function finish(){
  S.phase='end';
  const best=Math.max(...S.players.map(p=>p.fans));
  let w=S.players.map((_,i)=>i).filter(i=>S.players[i].fans===best);
  if(w.length>1){const m=Math.min(...w.map(i=>S.players[i].flameTotal));w=w.filter(i=>S.players[i].flameTotal===m);}
  S.winners=w;S.final=S.players.map(p=>({total:p.fans}));
  log(`年度網紅出爐：${w.map(pn).join('、')}！`,'q');
  clearSave();render();endModal();
}
function endModal(){
  openModal(`<h2>年度網紅頒獎</h2><div class="win">${S.winners.map(i=>esc(S.players[i].name)).join('、')} 爆紅了</div>
   <div class="tablewrap"><table class="res"><thead><tr><th>網紅</th>${[1,2,3].map(r=>`<th>第 ${r} 季</th>`).join('')}<th>被炎上</th><th>粉絲</th></tr></thead><tbody>
   ${S.players.map((p,i)=>({p,i})).sort((a,b)=>b.p.fans-a.p.fans).map(({p})=>`<tr><td>${esc(p.name)} ${badge(p.fans)}</td>${p.hist.map(h=>`<td>${h.res.total}</td>`).join('')}<td>${p.flameTotal}</td><td><b>${fans(p.fans)}</b></td></tr>`).join('')}</tbody></table></div>
   <p class="sub" style="margin-top:10px">粉絲 30 萬銀色按鈕、60 萬金色按鈕、100 萬鑽石按鈕。</p>
   <div class="acts"><button class="btn${NET.client?' primary':''}" data-m="close">看看頻道</button>${NET.client?'':'<button class="btn primary" data-m="again">再來一局</button>'}</div>`,m=>{closeModal();if(m==='again')setupGame(S.cfgPlayers);});
}

/* ================= AI ================= */
function gainOf(i,card,t){
  const tabs=S.players.map(p=>p.tab.slice()),fl=S.players.map(p=>p.flames);
  const before=scoreTab(i,tabs,fl).total;
  tabs[i].push(card);
  let g=scoreTab(i,tabs,fl).total-before;
  return g;
}
function aiPick(i){
  const p=S.players[i];const left=p.hand.length;
  let best=null;
  const leader=()=>{const n=NP();let b=null;for(let j=0;j<n;j++){if(j===i)continue;const v=S.players[j].fans+scoreTab(j,S.players.map(x=>x.tab),S.players.map(x=>x.flames)).total;if(b==null||v>b.v)b={j,v};}return b.j;};
  p.hand.forEach(c=>{
    let v=gainOf(i,c);let t=null;
    const T=p.tab,cnt=k=>T.filter(x=>x.k===k).length;
    if(c.k==='chal'){const n=cnt('chal');v+=left>2?(n===0?2.5:n===1?3:2):0;}
    if(c.k==='food'&&left>2)v+=1.2;
    if(c.k==='trip'&&left>2&&!T.some(x=>x.k==='trip'&&x.reg===c.reg))v+=1.5;
    if(c.k==='live'&&left>3)v+=1.5;
    if(c.k==='meme'&&left>2)v+=2;
    if(c.k==='collab')v+=1;
    if(c.k==='pr'){const threats=S.players.reduce((s,x,j)=>s+(j!==i?x.hand.filter(h=>h.k==='flame').length:0),0);v+=p.flames>cnt('pr')?(algo().k==='flame'?6:4):threats?1.5:0;}
    if(c.k==='flame'){t=leader();v=(algo().k==='flame'?6:4)*.85+(algo().k==='flame'?gainOf(i,c):0);}
    v+=Math.random()*1.2;
    if(!best||v>best.v)best={v,id:c.id,t};
  });
  return {id:best.id,t:best.t};
}

function myTurn(){const c=curTurn();return c!=null&&!S.players[c].ai&&S.viewer===c&&$('#overlay').hidden&&!UI.sent&&(NET.client||!S.players[c].remote);}

  $('#algo').innerHTML=S.phase==='idle'?'':`<div class="algo"><span class="ic">#</span><div><b>本季演算法：${algo().n}</b><span>${algo().d}</span></div></div>`;
  const tabs=S.players.map(p=>p.tab),fl=S.players.map(p=>p.flames);
  const cur=S.players.map((_,i)=>S.phase==='draft'||S.phase==='algo'?scoreTab(i,tabs,fl).total:0);
  const mx=Math.max(100,...S.players.map((p,i)=>p.fans+Math.max(0,cur[i])));
  $('#track').innerHTML=`<div class="trk">${S.players.map((p,i)=>`<div class="trow"><span class="nm">${avatar(i)}<span>${esc(p.name)}</span></span><span class="bar2"><i style="width:${Math.max(1,p.fans/mx*100)}%"></i>${[30,60,100].map(m=>`<em style="left:${m/mx*100}%" title="${m} 萬"></em>`).join('')}</span><span class="v">${p.fans}${cur[i]?`<small style="color:var(--muted)"> ${cur[i]>0?'+':''}${cur[i]}</small>`:''}${badge(p.fans)}</span></div>`).join('')}</div>`;
  $('#pickno').textContent=S.phase==='draft'?`手牌剩 ${S.players[0].hand.length} 張`:'';
  $('#channels').innerHTML=`<div class="chs">${S.players.map((p,i)=>`<div class="ch"><div class="hd">${avatar(i)}${esc(p.name)}<small>本季 ${S.phase==='draft'||S.phase==='algo'?cur[i]:'—'}</small></div><div class="cs">${p.tab.map(c=>`<span class="mini k-${c.k}" title="${esc(c.n)}">${CAT[c.k].n}${c.reg?'・'+c.reg:c.v?'・'+c.v:''}</span>`).join('')||'<span style="color:var(--muted);font-size:12.5px">還沒發布內容</span>'}</div>${p.flames?`<div class="flame">🔥 本季被炎上 ${p.flames} 次</div>`:''}</div>`).join('')}</div>`;
  renderDesk();renderPlayers();
  $('#feed').innerHTML=feedHTML(S.log,l=>l.r?'第'+l.r+'季':'—','每一則發布和每一次炎上都會記在這裡。');
  NET.publish();
}
function cardHTML(c,i,on){

}

       <button class="confirm" id="btnPick" ${sel&&(sel.k!=='flame'||UI.t!=null)?'':'disabled'}>發布 ${ICONS.arrow}</button>`;

}
function renderPlayers(){
  $('#players').innerHTML=S.players.map((p,i)=>`<div class="pl ${S.ch[i]==null&&S.phase==='draft'&&curTurn()===i?'cur':''}">${avatar(i)}<div style="min-width:0"><div class="nm">${esc(p.name)}${p.ai?'<span class="tag">AI</span>':''}${badge(p.fans)}</div>
    <div class="fig"><span>粉絲<b>${p.fans}</b>萬</span><span>炎上<b>${p.flameTotal}</b></span></div></div></div>`).join('');
}
function heroArt(){return `<svg viewBox="0 0 640 180" preserveAspectRatio="xMaxYMid slice" aria-hidden="true">
  <rect width="640" height="180" fill="#F3E6F0"/>
  <g transform="translate(300 18)"><rect width="96" height="150" rx="16" fill="#1F2B27"/><rect x="8" y="16" width="80" height="118" rx="6" fill="#FFFBF4"/><rect x="16" y="26" width="64" height="40" rx="4" fill="#C8432F"/><path d="M42 36v20l14-10z" fill="#fff"/><rect x="16" y="74" width="50" height="6" rx="3" fill="#D9CBB1"/><rect x="16" y="86" width="36" height="6" rx="3" fill="#D9CBB1"/><circle cx="26" cy="110" r="8" fill="#E58FA0"/><path d="M40 106h30M40 114h20" stroke="#D9CBB1" stroke-width="5" stroke-linecap="round"/></g>
  ${[[440,40,'#E9643B','❤'],[470,90,'#2E7DC0','👍'],[230,60,'#F5C443','★'],[520,56,'#E58FA0','❤'],[250,120,'#7A5AD3','▶']].map(([x,y,c,t])=>`<g transform="translate(${x} ${y})"><circle r="18" fill="${c}"/><text y="7" font-size="18" text-anchor="middle" fill="#fff">${t}</text></g>`).join('')}
  <path d="M420 150 Q500 140 560 100 T640 40" fill="none" stroke="#2C8F4E" stroke-width="5" stroke-linecap="round"/>
 </svg>`;}

/* ================= setup & rules ================= */
function showSetup(){
  clearTimeout(timer);
  const sv=lsGet(SAVE_KEY);
  openModal(`<div class="setup-art">${heroArt()}</div><h2>網紅爆紅計畫</h2><p class="sub">大家都想當網紅。每一季，你要從一疊內容企劃裡挑出最適合的：美食、旅遊、開箱、業配、挑戰……演算法每季都在變，而且永遠有人準備爆你的料。</p>
   <div class="pitch"><div><b>同時選、往下傳</b>每人挑一張、剩下的傳給鄰居。你挑走的，就是別人拿不到的。</div><div><b>演算法加成</b>每季隨機一張演算法卡，決定哪類內容特別紅。</div><div><b>炎上與公關</b>抽到爆料卡可以炎上對手，記得留一張公關卡保命。</div></div>
   ${setupSeatsHTML(setupCfg,2,5)}
   <p class="note">多位人類玩家共用一台裝置時，每一輪會輪流交接，手牌會蓋起來。</p>
   <div class="acts"><a class="btn ghost" href="${LOBBY}">← 回大廳</a><button class="btn" data-m="rules">先看規則</button>${NET.setupBtns()}${sv&&sv.phase==='draft'?'<button class="btn" data-m="resume">繼續上一局</button>':''}<button class="btn primary" data-m="start">開始遊戲</button></div>`,
  m=>{
    if(setupSeatsHandle(setupCfg,m,showSetup))return;
    if(NET.setupHandle(m))return;
    if(m==='rules')showRules();
    else if(m==='resume')resumeGame(sv);
    else if(m==='start'){NET.leave();closeModal();SPEED=SPEEDS[setupCfg.speed];setupGame(seatsToPlayers(setupCfg,AI_NAMES));}
  });
}
function showRules(){showRulesHTML(`
  <p><b>一句話：</b>三季輪抽。每次所有人同時從手牌挑一張內容發布，剩下的傳給鄰居。組出最紅的頻道，粉絲最多的人勝。</p>
  <p>2–5 人・20–30 分鐘・10 歲以上</p>
  <h3>準備</h3><p>90 張內容卡。每季洗牌後發手牌：2 人 10 張、3 人 9 張、4 人 8 張、5 人 7 張。翻一張演算法卡。</p>
  <h3>每一輪</h3><ol><li>所有人同時從手牌選 1 張，蓋著放好。</li><li>一起翻開，放進自己的頻道。打出炎上卡的人要指定一位對手。</li><li>剩下的手牌傳給鄰居：第 1、3 季傳左邊，第 2 季傳右邊。</li></ol>
  <p>手牌都打完，這一季就結算，頻道內容清空，下一季重新發牌。三季後粉絲最多的人勝，同分時被炎上次數少的人勝。</p>
  <h3>內容卡</h3><table><tr><th>類別</th><th>張數</th><th>怎麼得分</th></tr>${DECKDEF.map(([k,l])=>`<tr><td>${CAT[k].n}</td><td>${l.length}</td><td>${CAT[k].d}</td></tr>`).join('')}</table>
  <p>旅遊卡分北、中、南、東四區，各 3 張。開箱卡印有人氣 1–3。開箱人氣同分搶第一時，平分第一和第二的獎勵（無條件捨去）。</p>
  <h3>演算法卡（每季抽 1 張）</h3><ul>${ALGOS.map(a=>`<li><b>${a.n}：</b>${a.d}</li>`).join('')}</ul>
  <h3>粉絲按鈕</h3><p>累積 30 萬拿銀色按鈕、60 萬金色、100 萬鑽石（只是榮譽）。</p>
  <h3>先手補償</h3><p>所有人同時選牌，沒有先手。傳牌方向每季交換，避免總是同一個人幫你「餵牌」。</p>
  <h3>致勝心法</h3><ul><li>挑戰要湊到 2 張以上才划算，但別人也可能故意截走。</li><li>業配前兩張很好賺，第三張開始就虧了。</li><li>看看鄰居手上缺什麼：傳出去的牌就是送給他的禮物。</li><li>有人一直領先？炎上他。被炎上很痛？公關卡先收一張。</li></ul>`);}

/* ================= input ================= */
$('#desk').addEventListener('click',e=>{
  if(e.target.closest('#btnAgain')){setupGame(S.cfgPlayers);return;}
  if(e.target.closest('#btnResult')){endModal();return;}
  if(!myTurn())return;
  const b=e.target.closest('button');if(!b||b.disabled)return;
  const cur=curTurn();
  if(b.dataset.id!=null){UI.id=+b.dataset.id;}
  else if(b.dataset.t!=null)UI.t=+b.dataset.t;
  else if(b.id==='btnPick'){act({t:'pick',id:UI.id,tg:UI.t});return;}
  else return;
  render();
});
$('#btnRules').addEventListener('click',showRules);
$('#btnNew').addEventListener('click',()=>{if(NET.online){NET.confirmLeave();return;}if(S&&S.phase!=='end'&&S.phase!=='idle'){openModal(`<h2>放棄目前這局？</h2><p class="sub">目前的進度會被清除。</p><div class="acts"><button class="btn" data-m="no">繼續玩</button><button class="btn primary" data-m="yes">開新遊戲</button></div>`,m=>{if(m==='yes'){clearTimeout(timer);clearSave();showSetup();}else{closeModal();if(S.phase==='algo'){S.phase='draft';}if(S.phase==='score'){if(S.round>=ROUNDS)finish();else{S.round++;startRound();}return;}proceed();}});}else showSetup();});

// one entry point for a pick: this device, or the host applying a pick sent from a friend's phone
function act(a){
  if(NET.client){NET.send(a);UI={sent:true};render();return;}
  applyPick(curTurn(),a);
}
function applyPick(i,a){
  if(S.phase!=='draft'||i==null||S.ch[i]!=null)return;
  const c=S.players[i].hand.find(x=>x.id===+a.id);if(!c)return;
  const t=+a.tg;if(c.k==='flame'&&!(Number.isInteger(t)&&t>=0&&t<NP()&&t!==i))return;
  S.ch[i]={id:c.id,t:c.k==='flame'?t:null};UI={};if(humans().length>1)S.viewer=null;
  if($('#overlay').hidden)proceed();else{save();render();}
}
async function resumeGame(sv){
  closeModal();SPEED=SPEEDS[setupCfg.speed];NET.leave();
  if(sv.online&&!(await NET.resumeHost(sv))){sv.players.forEach(p=>{if(p.remote){p.remote=false;p.ai=true;}});delete sv.online;}
  S=sv;const hs=humans();S.viewer=hs.length===1?S.players.indexOf(hs[0]):null;UI={};proceed();
}
const GAME={id:'influencer',name:'網紅爆紅計畫',hostKey:'influencer-net-host',clientKey:'influencer-net-client',min:2,max:5,aiNames:AI_NAMES,
  secretHint:'你的手牌和這一輪選的內容只會出現在你自己的手機上。',
  start(cfg){setupGame(cfg);},
  strip(pub){if(pub.phase==='end')return;pub.players.forEach(p=>{p.hand=p.hand.map(()=>null);});for(const k in pub.ch)pub.ch[k]=1;},
  secret(i){return {hand:S.players[i].hand,ch:S.ch[i]||null};},
  applySecret(seat,sec){if(S.phase==='end')return;S.players[seat].hand=sec.hand||[];},
  waiting(){if(!S||S.phase!=='draft')return [];return S.players.map((_,i)=>i).filter(i=>S.ch[i]==null&&!S.players[i].ai);},
  action(seat,a){if(a.t==='pick')applyPick(seat,a);},
  afterTakeover(ws){ws.forEach(i=>{S.cfgPlayers[i]={name:S.players[i].name,ai:true};});if($('#overlay').hidden)proceed();else render();},
  resumeUI(){if(S.phase==='end')endModal();else proceed();},
  clientReset(prev){if(!prev||prev.gid!==S.gid||prev.round!==S.round||prev.pick!==S.pick||prev.phase!==S.phase||(prev.ch[NET.seat]==null)!==(S.ch[NET.seat]==null))UI={};},
  clientModal(){
    const g=S.gid;
    if(S.phase==='end')return {key:'end'+g,open:endModal};
    if(S.phase==='algo'){const a=algo();return {key:'a'+g+S.round,open:()=>openModal(`<h2>第 ${S.round} 季</h2><div class="intel" style="margin:6px 0 4px"><div class="ilab">${ICONS.spark}本季演算法</div><div class="big">${a.n}</div><div class="inote">${a.d}</div></div><p class="sub">等房主開始企劃。剩下的牌會傳給${S.round===2?'右':'左'}邊的人。</p><div class="acts"><button class="btn primary" data-m="ok">知道了</button></div>`,()=>closeModal())};}
    if(S.phase==='score'){const h=S.players.map((p,i)=>({p,i,r:p.hist[p.hist.length-1]})).filter(x=>x.r).sort((a,b)=>b.r.res.total-a.r.res.total);
      return {key:'s'+g+S.round,open:()=>openModal(`<h2>第 ${S.round} 季結算</h2><div class="tablewrap"><table class="res"><thead><tr><th>網紅</th><th>本季</th><th>累積</th></tr></thead><tbody>${h.map(({p,r})=>`<tr><td>${esc(p.name)}</td><td><b>${r.res.total>=0?'+':''}${r.res.total}</b></td><td>${p.fans}</td></tr>`).join('')}</tbody></table></div><div class="acts"><button class="btn primary" data-m="ok">知道了</button></div>`,()=>closeModal())};}
    return null;
  },
};

/* ================= boot ================= */
window.__game={setupGame,setSpeed:v=>{SPEED=v;},get S(){return S;}};
(function boot(){
  S={players:Array.from({length:4},()=>({name:'—',ai:true,fans:0,hand:[],tab:[],flames:0,flameTotal:0,hist:[]})),round:1,pick:1,algos:[0,1,2],ch:{},phase:'idle',log:[],viewer:null};
  render();showSetup();
})();

</script>
<script>if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("../../sw.js",{scope:"../../"}).catch(()=>{}));</script>
