<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>七日斷腸</title>
<meta name="description" content="原創武俠勒索桌遊：下毒是公開的，毒性和發作日是秘密的。合作搶秘境、背後暗算、拿解藥談判，七天後秘笈分最高者當上盟主。">
<meta name="theme-color" content="#1E5641">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="icon" href="../../icons/icon-192.png">
<link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="桌遊大廳">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Outfit:wght@600;700;800&display=swap">
<style>
:root{
  --paper:#F5EEE1; --paper2:#EFE6D4; --card:#FFFBF4; --ink:#1F2B27; --muted:#6E7068; --line:#E5D9C3; --line2:#D9CBB1;
  --green:#1E5641; --green2:#28704F; --green-ink:#F3F7EF; --yellow:#F5C443; --yellow-ink:#2A2310;
  --orange:#E9643B; --pink:#F7DDD3; --pink2:#EFC6B8; --up:#2C8F4E; --up-bg:#D5EEDA; --down:#C8432F; --down-bg:#F7DAD3; --flat-bg:#ECE5D7;
  --red:#D7542B; --red-bg:#F8DCCF; --blue:#2E7DC0; --blue-bg:#D6E7F5; --violet:#7A5AD3; --violet-bg:#E4DCF7; --gold:#D19A17; --gold-bg:#F6E7BE;
  --p0:#E58FA0; --p1:#8B67D6; --p2:#4F9E61; --p3:#E0922F; --p4:#3E9CC4; --p5:#C8573E; --p6:#6C7A3A; --p7:#5C6BC0;
  --scrim:rgba(40,32,20,.45);
  --f-body:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
  --f-num:'Outfit','Noto Sans TC',system-ui,sans-serif;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55;font-weight:500}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
  background-image:radial-gradient(rgba(120,90,40,.07) 1px,transparent 1px);background-size:5px 5px}
.wrap{position:relative;z-index:1;max-width:1600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 28px}
h1,h2,h3,h4{text-wrap:balance;margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
svg{display:block}

/* header */
.top{display:flex;align-items:center;gap:14px 22px;flex-wrap:wrap;padding-block:6px 12px;border-bottom:1.5px solid var(--line2)}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit}
.brand svg{width:44px;height:44px;flex:none}
.brand h1{font-size:clamp(26px,3.4vw,38px);font-weight:900;letter-spacing:.06em;line-height:1}
.brand small{font-family:var(--f-num);font-size:12px;letter-spacing:.42em;color:var(--ink);font-weight:600;margin-left:6px}
.homelink{display:inline-flex;align-items:center;gap:6px;font-size:15px;font-weight:900;color:var(--ink);text-decoration:none;border:1.5px solid var(--ink);border-radius:12px;padding:7px 12px;background:var(--card)}.homelink svg{width:18px;height:18px}
.vsep{width:1.5px;align-self:stretch;background:var(--line2);margin-block:6px}
.steps{display:flex;align-items:center;flex:1;min-width:0;justify-content:center}
.step{font-family:var(--f-num);font-weight:700;font-size:15px;padding:5px 14px;border-radius:999px;border:1.5px solid var(--line2);background:var(--card);color:var(--ink);white-space:nowrap}
.step.done{color:var(--muted);background:var(--paper2)}
.step.now{background:var(--green);border-color:var(--green);color:var(--green-ink);font-size:17px;padding:6px 18px}
.link{flex:1;min-width:8px;max-width:56px;height:2px;background:repeating-linear-gradient(90deg,var(--line2) 0 4px,transparent 4px 8px)}
.link.done{background:var(--green)}
.tops{display:flex;gap:10px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--ink);background:var(--card);color:var(--ink);padding:8px 16px;border-radius:12px;cursor:pointer;font-weight:700;line-height:1.2;text-decoration:none}
.btn svg{width:18px;height:18px}
.btn:hover:not(:disabled){transform:translateY(-1px)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.dark,.btn.primary{background:var(--green);border-color:var(--green);color:var(--green-ink)}
.btn.ghost{background:transparent}

/* layout */
.board{display:grid;grid-template-columns:minmax(0,1fr) minmax(340px,430px);grid-template-areas:"hero desk" "main desk";grid-template-rows:auto 1fr;gap:14px 18px;margin-top:12px;align-items:start}
.hero{grid-area:hero;position:relative;min-height:140px;display:flex;align-items:center;overflow:hidden;border-radius:18px}
.hero-txt{position:relative;z-index:2;padding:8px 0 10px}
.eyebrow{display:flex;align-items:center;gap:12px;font-family:var(--f-num);font-weight:600;letter-spacing:.32em;font-size:13px}
.eyebrow::after{content:"";width:80px;height:1.5px;background:var(--ink)}
.hero h2{font-size:clamp(28px,4vw,48px);font-weight:900;letter-spacing:.03em;line-height:1.15;margin-top:6px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.swoosh{display:block;width:150px;height:14px;margin-top:-2px}
.qbadge{position:relative;font-size:17px;font-weight:900;border:2px solid var(--ink);border-radius:999px;padding:3px 14px;background:var(--card);letter-spacing:.04em}
.hero-art{position:absolute;right:0;top:0;bottom:0;width:min(62%,640px);z-index:1;
  -webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 28%);mask-image:linear-gradient(90deg,transparent 0%,#000 28%)}
.hero-art svg{width:100%;height:100%}
main{grid-area:main;min-width:0}
.sect{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:900;padding-bottom:10px;border-bottom:1.5px solid var(--line2);margin:0 0 12px}
.sect svg{width:26px;height:26px;color:var(--orange)}
.sect{flex-wrap:wrap}
.sect small{font-size:13px;color:var(--muted);font-weight:700;margin-left:auto}
@media (max-width:640px){.sect small{flex-basis:100%;margin-left:0}}

/* desk */
.desk{grid-area:desk;position:sticky;top:max(10px,env(safe-area-inset-top,0px));background:var(--green);color:var(--green-ink);border-radius:26px;padding:24px 24px 22px;overflow:hidden;display:flex;flex-direction:column;gap:14px;box-shadow:0 18px 40px rgba(20,60,45,.25)}
.desk .leaf{position:absolute;right:-30px;top:-20px;width:190px;height:190px;opacity:.9;pointer-events:none}
.desk>*{position:relative}
.dhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.dhead h2{font-size:clamp(26px,2.6vw,36px);font-weight:900;letter-spacing:.04em;line-height:1.1}
.pill{background:var(--orange);color:#fff;font-weight:900;border-radius:999px;padding:5px 14px;font-size:15px;white-space:nowrap}
.pill.soft{background:rgba(255,255,255,.16)}
.dsub{font-weight:700;font-size:15px;margin-top:-6px;opacity:.9}
.dlab{font-size:14px;opacity:.9;font-weight:900;display:flex;align-items:center;gap:8px;justify-content:space-between}
.dlab small{font-weight:700;opacity:.8;font-size:12px}
.dnote{font-size:13px;font-weight:700;background:rgba(255,255,255,.12);border-radius:10px;padding:7px 12px}
.dnote.warn{background:rgba(233,100,59,.28)}
.confirm{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:none;border-radius:16px;background:var(--yellow);color:var(--yellow-ink);font-size:22px;font-weight:900;padding:13px;cursor:pointer;box-shadow:0 4px 0 #C99A1E;letter-spacing:.06em}
.confirm svg{width:24px;height:24px}
.confirm:active:not(:disabled){transform:translateY(2px);box-shadow:0 2px 0 #C99A1E}
.confirm:disabled{opacity:.5;cursor:not-allowed}
.passbtn{width:100%;border:2px solid rgba(255,255,255,.85);background:transparent;color:var(--green-ink);border-radius:14px;font-weight:900;font-size:17px;padding:10px;cursor:pointer}
.passbtn:hover{background:rgba(255,255,255,.08)}
.empty{border:2px dashed rgba(255,255,255,.35);border-radius:16px;padding:20px 16px;text-align:center;font-weight:700;opacity:.92}
.empty b{display:block;font-size:19px;margin-bottom:4px}
.think{display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.1);border-radius:16px;padding:14px}
.think .av{width:56px;height:56px;flex:none}
.think b{font-size:19px}
.dots::after{content:"…";display:inline-block;animation:blink 1.1s steps(3) infinite}
@keyframes blink{0%{opacity:.2}50%{opacity:1}100%{opacity:.2}}
.chooser{display:flex;flex-wrap:wrap;gap:6px}
.chooser button{border:2px solid rgba(255,255,255,.55);background:transparent;color:var(--green-ink);border-radius:12px;padding:7px 12px;font-weight:900;cursor:pointer;display:inline-flex;align-items:center;gap:6px;min-height:40px}
.chooser button .av{width:24px;height:24px}
.chooser button.on{background:var(--card);color:var(--ink);border-color:var(--card)}
.chooser button:disabled{opacity:.35;cursor:not-allowed}
.chooser button.red.on{background:var(--red);border-color:var(--red);color:#fff}
.chooser button.blue.on{background:var(--blue);border-color:var(--blue);color:#fff}
.chooser.big button{flex:1;justify-content:center;font-size:16px}
.opt2{display:flex;flex-direction:column;gap:6px}
.opt2 button{display:flex;justify-content:space-between;gap:10px;align-items:center;text-align:left;border:2px solid rgba(255,255,255,.4);background:transparent;color:var(--green-ink);border-radius:12px;padding:9px 12px;cursor:pointer}
.opt2 button b{font-weight:900;font-size:15px}
.opt2 button span{font-size:12px;opacity:.85}
.opt2 button.on{background:var(--card);color:var(--ink);border-color:var(--card)}
.opt2 button.on span{opacity:1;color:var(--muted)}
.opt2 button:disabled{opacity:.35;cursor:not-allowed}
.dsec{display:flex;flex-direction:column;gap:8px;padding-top:12px;border-top:1px solid rgba(255,255,255,.2)}

/* private note card */
.intel{position:relative;background:var(--pink);color:var(--ink);border-radius:14px;padding:14px 16px 12px;box-shadow:0 6px 14px rgba(0,0,0,.18)}
.intel::after{content:"";position:absolute;right:0;top:0;width:28px;height:28px;background:linear-gradient(225deg,var(--green) 50%,var(--pink2) 50%);border-bottom-left-radius:8px}
.intel .ilab{display:flex;align-items:center;gap:8px;font-weight:900;color:#B24A35;font-size:16px;padding-bottom:8px;border-bottom:1.5px solid var(--pink2)}
.intel .ilab svg{width:20px;height:20px}
.intel ul{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:260px;overflow:auto}
.intel li{font-size:13.5px;line-height:1.45;display:flex;gap:8px;align-items:flex-start}
.intel li .rt{font-family:var(--f-num);font-weight:700;font-size:11px;border:1.5px solid var(--pink2);border-radius:6px;padding:0 5px;background:var(--card);white-space:nowrap;margin-top:1px}
.intel li.void{opacity:.45;text-decoration:line-through}
.intel .inote{font-size:12.5px;color:#5B4A40;margin-top:8px}
.intel .big{font-size:22px;font-weight:900;margin:8px 0 2px}
.stamp{border:1.5px solid #B24A35;color:#B24A35;border-radius:8px;padding:1px 9px;font-weight:900;font-size:12px;white-space:nowrap;display:inline-block;transform:rotate(-3deg)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:900;padding:1px 9px;border-radius:8px;background:var(--flat-bg);color:var(--ink);white-space:nowrap}
.chip.red{background:var(--red);color:#fff}.chip.blue{background:var(--blue);color:#fff}.chip.violet{background:var(--violet);color:#fff}
.chip.gold{background:var(--gold-bg);color:#6B4D07}.chip.green{background:var(--up-bg);color:var(--up)}.chip.down{background:var(--down-bg);color:var(--down)}

/* feed */
.feed{margin-top:18px}
.feedlist{list-style:none;margin:0;padding:0;overflow:auto;max-height:320px}
.feedlist li{display:grid;grid-template-columns:auto 34px minmax(0,1fr);gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.qtag{font-family:var(--f-num);font-weight:700;font-size:12px;border:1.5px solid var(--line2);border-radius:6px;padding:1px 6px;background:var(--card)}
.feedlist .av{width:34px;height:34px}
.feedlist .txt{font-size:13.5px;line-height:1.45;min-width:0}
.feedlist .ic{width:34px;height:34px;border-radius:50%;background:var(--paper2);display:grid;place-items:center;color:var(--green)}
.feedlist .ic svg{width:18px;height:18px}
.feedlist li.q .txt{font-weight:900;color:var(--green)}
.feedlist li.k .txt{color:#8A4A12}
.pn{font-weight:900;color:var(--ink)}

/* players strip */
.players{margin-top:18px;background:var(--card);border:1.5px solid var(--line);border-radius:20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));padding:8px;gap:6px;box-shadow:0 8px 20px rgba(90,70,30,.06)}
.pl{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:14px;position:relative;min-width:0}
.pl.cur{background:var(--pink)}
.pl .av{width:52px;height:52px;flex:none}
.pl .nm{font-size:17px;font-weight:900;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tag{font-size:11px;font-weight:700;border:1.5px solid var(--line2);border-radius:6px;padding:0 5px;color:var(--muted);background:var(--card)}
.pl .fig{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:13px;color:var(--muted)}
.pl .fig b{font-family:var(--f-num);font-weight:800;color:var(--ink);font-size:16px;margin-left:3px}

/* responsive */
@media (max-width:1040px){
  .board{grid-template-columns:minmax(0,1fr);grid-template-areas:"hero" "desk" "main"}
  .desk{position:relative;top:0}
  .hero-art{width:70%;opacity:.55}
}
@media (max-width:640px){
  .vsep{display:none}
  .steps{order:3;flex-basis:100%;justify-content:flex-start;overflow-x:auto;padding-bottom:2px}
  .step{padding:4px 10px;font-size:13px}.step.now{padding:5px 12px;font-size:15px}
  .brand small{display:none}
  .desk{padding:20px 16px;border-radius:22px}
  .tops .btn{padding:8px 11px}
}

/* modals */
.overlay{position:fixed;inset:0;background:var(--scrim);display:grid;place-items:center;z-index:50;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--card);color:var(--ink);border-radius:24px;border:1.5px solid var(--line);width:min(660px,100%);max-height:calc(100dvh - 32px);overflow:auto;padding:24px;box-shadow:0 30px 70px rgba(40,30,10,.3)}
.modal h2{font-size:27px;font-weight:900;margin-bottom:6px;letter-spacing:.03em}
.modal .sub{color:var(--muted);margin:0 0 14px}
.modal .acts{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}
.modal .acts .btn{padding:10px 20px;font-size:16px}
.modal .intel::after{background:linear-gradient(225deg,var(--card) 50%,var(--pink2) 50%)}
.seats{display:flex;flex-direction:column;gap:10px}
.seat{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center}
.seat .av{width:44px;height:44px}
.seat input{font:inherit;font-weight:700;padding:9px 12px;border:1.5px solid var(--line2);border-radius:12px;background:var(--paper);color:var(--ink);min-width:0;width:100%}
.seg{display:inline-flex;border:1.5px solid var(--line2);border-radius:12px;overflow:hidden;background:var(--paper);flex-wrap:wrap}
.seg button{border:none;background:transparent;color:var(--muted);padding:8px 12px;cursor:pointer;font-weight:700}
.seg button.on{background:var(--green);color:var(--green-ink)}
.field{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:14px 0;flex-wrap:wrap}
.field>span{font-weight:900;font-size:16px}
.note{font-size:12px;color:var(--muted)}
.pitch{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:0 0 6px}
.pitch div{background:var(--paper);border-radius:14px;padding:12px;font-size:13px;color:var(--muted)}
.pitch b{display:block;color:var(--ink);font-size:15px;font-weight:900;margin-bottom:2px}
.setup-art{height:120px;margin:-24px -24px 16px;overflow:hidden;border-radius:24px 24px 0 0}
.setup-art svg{width:100%;height:100%}
.rules{font-size:15px;line-height:1.8}
.rules h3{font-size:19px;font-weight:900;margin:18px 0 6px;color:var(--green)}
.rules p,.rules li{max-width:64ch}
.rules ol,.rules ul{padding-left:1.3em;margin:6px 0}
.rules table{border-collapse:collapse;font-size:14px;margin:6px 0;width:100%}
.rules td,.rules th{border-top:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.rules th{font-size:12px;color:var(--muted)}
.handoff .av{width:84px;height:84px;margin-bottom:10px}
table.res{width:100%;border-collapse:collapse;margin-top:12px;font-size:14px}
table.res th{font-size:12px;color:var(--muted);text-align:right;font-weight:700;padding:4px 6px}
table.res td{text-align:right;padding:8px 6px;border-top:1px solid var(--line);font-family:var(--f-num);font-weight:700;font-variant-numeric:tabular-nums}
table.res th:first-child,table.res td:first-child{text-align:left;font-family:var(--f-body)}
.tablewrap{overflow-x:auto}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--muted)}
.win{font-size:32px;font-weight:900;color:var(--green);margin:4px 0}
.revlist{display:flex;flex-direction:column;gap:8px}
.rev{border:1.5px solid var(--line2);border-radius:14px;padding:10px 14px;background:var(--paper);display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.rev h4{font-size:16px;font-weight:900}
.rev .kn{font-size:12.5px;color:var(--muted);font-weight:700}
@media (prefers-reduced-motion:reduce){.dots::after{animation:none}.btn{transition:none}}
/* online rooms */
.roomcode{display:flex;gap:10px;justify-content:center;margin:6px 0 4px}
.roomcode span{width:64px;height:78px;display:grid;place-items:center;font-size:44px;font-weight:800;background:var(--green);color:var(--green-ink);border-radius:14px;box-shadow:0 4px 0 #123A2B}
@media (max-width:420px){.roomcode span{width:54px;height:66px;font-size:36px}}
.codein{font:inherit;font-weight:800;font-size:20px;padding:9px 14px;border:1.5px solid var(--line2);border-radius:12px;background:var(--paper);color:var(--ink);width:min(220px,100%)}
.seat b{font-weight:900}
.roombar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;font-weight:700;opacity:.9;border-top:1px solid rgba(255,255,255,.2);padding-top:12px;margin-top:4px}
.roombar b{font-size:20px;letter-spacing:.12em;background:rgba(255,255,255,.14);border-radius:8px;padding:0 10px}
.roombar .linkbtn{margin-left:auto;background:none;border:0;color:var(--green-ink);font:inherit;font-weight:800;text-decoration:underline;cursor:pointer;padding:4px}

/* Layout: today's secret realms on top of the left column, each sect's meridian board under them, green desk on the right. */
.sites{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:18px}
@media (max-width:1280px){.sites{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.sites{grid-template-columns:minmax(0,1fr)}}
.site{background:var(--card);border:1.5px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 2px 0 var(--line),0 8px 20px rgba(90,70,30,.07);display:flex;flex-direction:column;min-width:0}
.site .art{height:80px;position:relative;overflow:hidden}
.site .art svg{width:100%;height:100%}
.site .body{padding:10px 14px 12px;display:flex;flex-direction:column;gap:6px}
.site h3{font-size:22px;font-weight:900;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.th{font-family:var(--f-num);font-size:14px;font-weight:800;background:var(--ink);color:#fff;border-radius:999px;padding:1px 10px}
.rw{display:flex;gap:6px;flex-wrap:wrap}
.rwi{font-family:var(--f-num);font-weight:800;font-size:14px;border-radius:8px;padding:1px 9px;background:var(--gold-bg);color:#6B4D07}
.rwi.h{background:var(--up-bg);color:var(--up)}
.rwi.got{opacity:.45;text-decoration:line-through}
.contrib{font-size:12.5px;color:var(--muted);font-weight:700;display:flex;flex-wrap:wrap;gap:4px}
.sects{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.sect-b{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.sect-b.me{border-style:dashed;border-color:var(--ink)}
.sect-b .hd{display:flex;align-items:center;gap:10px}
.sect-b .hd .av{width:44px;height:44px;flex:none}
.sect-b .nm{font-size:17px;font-weight:900;display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.sect-b .fig{display:flex;gap:2px 10px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.sect-b .fig b{font-family:var(--f-num);color:var(--ink);font-size:15px;margin-left:2px}
.mer{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.slot{height:62px;border-radius:10px;border:1.5px dashed var(--line2);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:var(--muted);font-weight:700;position:relative;text-align:center;line-height:1.2;padding:2px}
.slot.p{border:none;background:var(--pc);color:#fff;box-shadow:inset 0 -3px 0 rgba(0,0,0,.2)}
.slot.p b{font-size:13px;font-weight:900}
.slot .hg{position:absolute;top:3px;right:5px;font-family:var(--f-num);font-weight:800;font-size:11px}
.slot.sel{outline:3px solid var(--yellow);outline-offset:1px}
.alloc{display:flex;flex-direction:column;gap:8px}
.arow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.arow>span{font-weight:900;font-size:15px;min-width:0}
.arow small{display:block;font-size:11.5px;opacity:.8;font-weight:700}
.stepper{display:grid;grid-template-columns:42px 44px 42px;background:var(--yellow);border-radius:12px;overflow:hidden;flex:none}
.stepper button{border:none;background:rgba(255,255,255,.35);color:var(--yellow-ink);font-size:22px;font-weight:700;cursor:pointer;line-height:1;padding:6px 0}
.stepper button:disabled{opacity:.4;cursor:not-allowed}
.stepper b{display:grid;place-items:center;font-family:var(--f-num);font-weight:800;font-size:20px;color:var(--yellow-ink);background:#FBE7A6}
.ptable{font-size:13px;width:100%;border-collapse:collapse}
.ptable td{padding:3px 4px;border-top:1px solid var(--pink2)}

/* ================= online multiplayer =================

const FIREBASE_CONFIG={"apiKey":"AIzaSyDX3vaUkNRwUVzY_0c_rcjlIz_cjlg_mmk","authDomain":"board-games-2c64d.firebaseapp.com","databaseURL":"https://board-games-2c64d-default-rtdb.asia-southeast1.firebasedatabase.app","projectId":"board-games-2c64d","storageBucket":"board-games-2c64d.firebasestorage.app","messagingSenderId":"1038938536228","appId":"1:1038938536228:web:931536e62f82f37fc91bb1"};

const EC={name:'ECDH',namedCurve:'P-256'};
const Crypto={
  async gen(){const k=await crypto.subtle.generateKey(EC,true,['deriveKey']);return {priv:await crypto.subtle.exportKey('jwk',k.privateKey),pub:await crypto.subtle.exportKey('jwk',k.publicKey)};},
  async derive(privJwk,pubJwk){const priv=await crypto.subtle.importKey('jwk',privJwk,EC,false,['deriveKey']);const pub=await crypto.subtle.importKey('jwk',pubJwk,EC,false,[]);
    return crypto.subtle.deriveKey({name:'ECDH',public:pub},priv,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);},
  async enc(key,obj){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(JSON.stringify(obj)));return b64(iv)+'.'+b64(new Uint8Array(ct));},
  async dec(key,s){const [iv,ct]=s.split('.');const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(iv)},key,unb64(ct));return JSON.parse(new TextDecoder().decode(pt));},
};
function LocalTx(){
  const bc=new BroadcastChannel('bg-net');const subs=[];
  const K=p=>'bgnet:'+p;
  const get=p=>{try{const v=localStorage.getItem(K(p));return v==null?null:JSON.parse(v);}catch(e){return null;}};
  const fire=m=>subs.slice().forEach(s=>{if(s.type==='v'&&s.path===m.path&&m.op==='set')s.cb(m.val);if(s.type==='a'&&m.op==='add'&&s.path===m.path&&!s.seen.has(m.key)){s.seen.add(m.key);s.cb(m.key,m.val);}});
  bc.onmessage=e=>fire(e.data);
  const send=m=>{fire(m);bc.postMessage(m);};
  return {
    set(p,v){localStorage.setItem(K(p),JSON.stringify(v));send({op:'set',path:p,val:v});},

    push(p,v){const key=Date.now().toString(36)+rid(4);const list=get(p+'/__list')||{};list[key]=v;localStorage.setItem(K(p+'/__list'),JSON.stringify(list));send({op:'add',path:p,key,val:v});},
    onAdd(p,cb){const s={type:'a',path:p,cb,seen:new Set()};subs.push(s);const list=get(p+'/__list')||{};setTimeout(()=>Object.keys(list).forEach(k=>{if(!s.seen.has(k)){s.seen.add(k);cb(k,list[k]);}}));return ()=>{const i=subs.indexOf(s);if(i>=0)subs.splice(i,1);};},
    remove(p){const i=p.lastIndexOf('/');const base=p.slice(0,i),key=p.slice(i+1);const list=get(base+'/__list');if(list&&list[key]!==undefined){delete list[key];localStorage.setItem(K(base+'/__list'),JSON.stringify(list));}else localStorage.removeItem(K(p));},

function loadScript(src){return new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>no(new Error('load '+src));document.head.appendChild(s);});}
async function FirebaseTx(){
  if(!window.firebase){
    const bases=['https://www.gstatic.com/firebasejs/10.12.2/','https://cdn.jsdelivr.net/npm/firebase@10.12.2/'];
    let lastErr;
    for(const base of bases){try{await loadScript(base+'firebase-app-compat.js');await loadScript(base+'firebase-database-compat.js');lastErr=null;break;}catch(e){lastErr=e;}}
    if(lastErr)throw new Error('無法載入連線元件');
  }
  if(!firebase.apps.length)firebase.initializeApp(FIREBASE_CONFIG);
  const db=firebase.database();
  return {
    set(p,v){return db.ref(p).set(v);},
    on(p,cb){const r=db.ref(p);const f=s=>{const v=s.val();if(v!=null)cb(v);};r.on('value',f);return ()=>r.off('value',f);},
    push(p,v){return db.ref(p).push(v);},
    onAdd(p,cb){const r=db.ref(p);const f=s=>cb(s.key,s.val());r.on('child_added',f);return ()=>r.off('child_added',f);},
    remove(p){return db.ref(p).remove();},
  };
}

}
function startDay(){
  if(S.deck.length<nSites())S.deck=shuffle(SITES.map((_,k)=>k));
  S.sites=Array.from({length:nSites()},()=>{const t=SITES[S.deck.pop()];return {...t,th:t.th-(NP()<=3?2:1),res:null};});
  S.ally=[];S.ng={};S.cm={};S.phase='neg';
  log(`第 ${S.day} 天：${S.sites.map(s=>s.n).join('、')} 開啟`,'q');
  UI={};render();proceed();
}

/* ================= knowledge ================= */
function candTypes(x){
  const owner=S.players[x.owner];
  const c={qibu:0,sangong:0,duan:0,fake:0};HAND.forEach(t=>c[t]++);
  owner.revealed.forEach(t=>c[t]--);
  if(x.hg>=1)c.qibu=0;if(x.hg>=2)c.sangong=0;
  for(const k in c)c[k]=Math.max(0,c[k]);
  return c;
}
function expDamage(x,viewer){
  if(viewer===x.owner)return dmgOf(x.type,x.hg);
  const c=candTypes(x),t=c.qibu+c.sangong+c.duan+c.fake;if(!t)return 0;
  return (c.qibu*dmgOf('qibu',x.hg)+c.sangong*dmgOf('sangong',x.hg)+c.duan*dmgOf('duan',x.hg))/t;
}
function dmgOf(type,hg){
  if(type==='fake')return 0;
  const left=DAYS-S.day;const triggerIn=POISON[type].days-hg;
  if(triggerIn>left)return POISON[type].end;
  if(type==='duan')return 4;if(type==='qibu')return 3;
  return Math.min(4,2*Math.max(1,left-triggerIn)*0.55+0.5);
}
function candText(x){const c=candTypes(x);return Object.keys(c).filter(k=>c[k]>0).map(k=>POISON[k].n).join(' / ')||'？';}

/* ================= AI ================= */
function score(i){const p=S.players[i];return p.pts+p.herbs*0.8+p.pills*2;}
function aiPropose(i){
  const p=S.players[i];
  // extortion
  const mine=S.poisons.filter(x=>x.owner===i);
  if(mine.length&&Math.random()<.8){
    const x=mine.sort((a,b)=>expDamage(b,b.on)-expDamage(a,a.on))[0];
    const ed=expDamage(x,x.on);const k=Math.max(1,Math.min(S.players[x.on].pts,Math.round(ed*0.75)));
    if(S.players[x.on].pts>=1)return {kind:'sell',to:x.on,pid:x.id,k};
  }
  const onMe=poisonsOn(i);
  if(onMe.length&&p.pts>=1){
    const x=onMe.sort((a,b)=>expDamage(b,i)-expDamage(a,i))[0];const ed=expDamage(x,i);
    if(ed>=1.5)return {kind:'buy',to:x.owner,pid:x.id,k:Math.max(1,Math.min(p.pts,Math.round(ed*0.5)))};
  }
  if(Math.random()<.7){const s=bestSites(i)[0];const others=S.players.map((_,j)=>j).filter(j=>j!==i&&avail(j)>0);if(others.length)return {kind:'ally',to:pick(others),site:s};}
  return null;
}
function aiRespond(i,pr){
  const p=S.players[i];
  if(pr.kind==='sell'){const x=S.poisons.find(y=>y.id===pr.pid);if(!x||p.pts<pr.k)return false;return pr.k<expDamage(x,i)*(0.8+Math.random()*0.3);}
  if(pr.kind==='buy'){const x=S.poisons.find(y=>y.id===pr.pid);if(!x)return false;if(x.type==='fake')return true;return pr.k>=dmgOf(x.type,x.hg)*0.6;}
  if(pr.kind==='ally')return avail(i)>0&&Math.random()<.7;
  return false;
}
function estOthers(i,s){
  const others=S.players.map((_,j)=>j).filter(j=>j!==i);
  let e=others.reduce((a,j)=>a+avail(j),0)/S.sites.length*0.6;
  S.ally.forEach(a=>{if(a.site===s&&(a.a===i||a.b===i)){const o=a.a===i?a.b:a.a;e+=avail(o)*0.4;}});
  return e;
}
function bestSites(i){
  return S.sites.map((s,k)=>{const v=s.rw.reduce((a,r)=>a+rwVal(r),0);const need=Math.max(0,s.th-estOthers(i,k));const ok=need<=avail(i)+0.5?1:0.35;return {k,val:(v/Math.max(1.5,s.rw.length))*ok-need*0.15+Math.random()*0.8};}).sort((a,b)=>b.val-a.val).map(x=>x.k);
}
function aiCommit(i){
  const p=S.players[i],res={alloc:S.sites.map(()=>0),assn:null,plant:null,purge:null,pill:null};
  const onMe=poisonsOn(i);
  if(p.pills>0&&onMe.length){const x=onMe.sort((a,b)=>expDamage(b,i)-expDamage(a,i))[0];if(expDamage(x,i)>=2)res.pill=x.id;}
  const rest=onMe.filter(x=>x.id!==res.pill);
  if(rest.length&&avail(i)>0){const x=rest.sort((a,b)=>expDamage(b,i)-expDamage(a,i))[0];const ed=expDamage(x,i);if(ed>=3.2&&Math.random()<.55)res.purge=x.id;}
  if(res.purge==null){
    let a=avail(i);const bs=bestSites(i);
    if(a>0){const first=Math.min(a,Math.max(Math.ceil(a*0.65),Math.ceil(S.sites[bs[0]].th-estOthers(i,bs[0]))));res.alloc[bs[0]]=first;a-=first;if(a>0&&bs[1]!=null)res.alloc[bs[1]]=a;}
  }
  if(p.assn>0&&Math.random()<.22){const allied=S.ally.filter(x=>x.a!==i&&x.b!==i).map(x=>x.site);const k=allied.length?pick(allied):bestSites(i)[0];res.assn=k;}
  if(p.hand.length&&Math.random()<.65){
    const tg=S.players.map((_,j)=>j).filter(j=>j!==i&&poisonsOn(j).length<SLOTS).sort((a,b)=>score(b)-score(a));
    if(tg.length){const t=Math.random()<.7?tg[0]:pick(tg);
      const w=p.hand.map(c=>c==='duan'?(S.day<=5?3:1):c==='sangong'?(S.day<=4?2.2:0.8):c==='qibu'?1.5:c==='fake'?1.6:1);
      let r=Math.random()*w.reduce((a,b)=>a+b,0),c=p.hand[0];for(let k=0;k<p.hand.length;k++){r-=w[k];if(r<=0){c=p.hand[k];break;}}
      res.plant={type:c,to:t};}
  }
  return res;
}

/* ================= flow ================= */
let pendingOffer=null;
function proceed(){
  clearTimeout(timer);save();
  if(!S||!$('#overlay').hidden)return;
  if(S.phase!=='neg'&&S.phase!=='commit')return render();
  if(S.offer)return render();
  const key=S.phase==='neg'?'ng':'cm';
  const next=order().find(j=>S[key][j]==null&&(S.phase==='neg'||!isRemote(j)));
  if(next==null){if(order().some(j=>S[key][j]==null)){render();return;}if(S.phase==='neg'){S.phase='commit';proceed();}else resolveDay();return;}
  const p=S.players[next];
  if(p.remote){render();return;}
  if(p.ai){render();timer=setTimeout(()=>{
    if(S.phase==='neg'){const pr=aiPropose(next);S.ng[next]=pr||{kind:'pass'};if(pr)offer(next,pr);else{log(`${pn(next)} 沒有提案`);proceed();}}
    else{S.cm[next]=aiCommit(next);proceed();}
  },humans().length?Math.min(SPEED,350):SPEED/3);return;}
  if(S.viewer!==next){
    S.viewer=null;UI={};render();
    openModal(`<div class="handoff">${avatar(next)}</div><h2>請把裝置交給 ${esc(p.name)}</h2><p class="sub">${S.phase==='neg'?'輪到你提案談判':'輪到你秘密出手'}。其他人請別偷看：畫面會顯示 ${esc(p.name)} 下的毒和手上的毒藥。</p>
     <div class="acts"><button class="btn primary" data-m="go">我是 ${esc(p.name)}，開始</button></div>`,()=>{closeModal();S.viewer=next;UI=freshUI(next);render();scrollDeskIntoView();});
    return;
  }
  if(!UI.ready)UI=freshUI(next);
  render();
}
function freshUI(i){return {ready:true,kind:'pass',to:null,pid:null,k:2,site:0,alloc:S.sites.map(()=>0),assn:null,plantT:null,plantTo:null,purge:null,pill:null};}
function propText(from,pr){
  const to=esc(S.players[pr.to].name),f=esc(S.players[from].name);
  if(pr.kind==='sell')return `${f} 對 ${to} 說：「你身上那份毒是我下的。給我 ${pr.k} 分秘笈，我給你解藥。」`;
  if(pr.kind==='buy')return `${f} 對 ${to} 說：「你下在我身上的毒，解藥給我，我付你 ${pr.k} 分秘笈。」`;
  return `${f} 邀 ${to}：「今天一起去打${S.sites[pr.site].n}。」（口頭承諾，不具約束力）`;
}
function offerHTML(from,to,pr,yes,no){
  const x=pr.pid!=null?S.poisons.find(y=>y.id===pr.pid):null;
  let info='';
  if(x&&pr.kind==='sell')info=`<div class="intel" style="margin-top:10px"><div class="ilab">${ICONS.lock}你身上這份毒</div><div class="inote">已經放了 ${x.hg} 天還沒發作。依 ${esc(S.players[x.owner].name)} 還沒亮出的毒推算，可能是：<b>${candText(x)}</b>。預估傷害約 ${expDamage(x,to).toFixed(1)} 分。</div></div>`;
  if(x&&pr.kind==='buy'&&x.type)info=`<div class="intel" style="margin-top:10px"><div class="ilab">${ICONS.lock}你下的那份毒</div><div class="inote">其實是 <b>${POISON[x.type].n}</b>（${POISON[x.type].fx}），已經 ${x.hg} 天。</div></div>`;
  const payer=S.players[pr.kind==='sell'?to:from];
  return `<div class="handoff">${avatar(from)}</div><h2>${esc(S.players[from].name)} 提案</h2><p class="sub">${propText(from,pr)}</p>${info}
      ${pr.kind!=='ally'&&payer.pts<pr.k?`<p class="note">付款方只有 ${payer.pts} 分，成交時有多少付多少。</p>`:''}
      <div class="acts"><button class="btn" data-m="no">${no}</button><button class="btn primary" data-m="yes">${yes}</button></div>`;
}
function offer(from,pr,relog=true){
  const to=pr.to,tp=S.players[to];
  if(relog)log(propText(from,pr));
  const finish=acc=>{
    S.offer=null;pendingOffer=null;
    if(acc){
      if(pr.kind==='ally'){S.ally.push({a:from,b:to,site:pr.site});log(`${pn(to)} 答應了`,'k');}
      else{const x=S.poisons.find(y=>y.id===pr.pid);
        const payer=pr.kind==='sell'?to:from,payee=pr.kind==='sell'?from:to,k=Math.min(pr.k,S.players[payer].pts);
        S.players[payer].pts-=k;S.players[payee].pts+=k;
        if(x){S.poisons=S.poisons.filter(y=>y!==x);}
        log(`${pn(to)} 成交：${esc(S.players[payer].name)} 付 ${k} 分，毒和解藥一起蓋著棄掉`,'k');}
    }else log(`${pn(to)} 拒絕了`);
    proceed();
  };
  if(tp.ai){finish(aiRespond(to,pr));return;}
  if(tp.remote){S.offer={id:++S.offerId,from,to,pr};pendingOffer={finish};save();render();return;}
  const ask=()=>{
    openModal(offerHTML(from,to,pr,pr.kind==='ally'?'答應':'成交','拒絕'),m=>{closeModal();if(localHumans().length>1)S.viewer=prevViewer;finish(m==='yes');});
  };
  const prevViewer=S.viewer;
  if(localHumans().length>1&&S.viewer!==to){
    S.viewer=null;render();
    openModal(`<div class="handoff">${avatar(to)}</div><h2>請把裝置交給 ${esc(tp.name)}</h2><p class="sub">${esc(S.players[from].name)} 有提案要給 ${esc(tp.name)} 決定。</p><div class="acts"><button class="btn primary" data-m="go">我是 ${esc(tp.name)}</button></div>`,()=>{closeModal();S.viewer=to;render();ask();});
  }else{render();ask();}
}
function submitNeg(){
  const pi=curTurn();if(pi==null)return;
  let pr=null;
  if(UI.kind==='sell'&&UI.pid!=null){const x=S.poisons.find(y=>y.id===UI.pid);pr={kind:'sell',to:x.on,pid:x.id,k:UI.k};}
  else if(UI.kind==='buy'&&UI.pid!=null){const x=S.poisons.find(y=>y.id===UI.pid);pr={kind:'buy',to:x.owner,pid:x.id,k:UI.k};}
  else if(UI.kind==='ally'&&UI.to!=null)pr={kind:'ally',to:UI.to,site:UI.site};
  if(NET.client){NET.send({t:'neg',pr});UI={sent:true};render();return;}
  doNeg(pi,pr);
}
function doNeg(pi,pr){
  S.ng[pi]=pr||{kind:'pass'};UI={};
  if(pr)offer(pi,pr);else{log(`${pn(pi)} 沒有提案`);if(localHumans().length>1)S.viewer=null;proceed();}
}
function submitCommit(){
  const pi=curTurn();if(pi==null)return;
  const c={alloc:UI.purge!=null?S.sites.map(()=>0):UI.alloc.slice(),assn:UI.assn,plant:UI.plantT&&UI.plantTo!=null?{type:UI.plantT,to:UI.plantTo}:null,purge:UI.purge,pill:UI.pill};
  if(NET.client){NET.send({t:'commit',c});UI={sent:true};render();return;}
  S.cm[pi]=c;
  UI={};if(localHumans().length>1)S.viewer=null;proceed();
}
function resolveDay(){
  const cm=S.cm,day=S.day,rows=[];
  // pills first
  order().forEach(i=>{const c=cm[i],p=S.players[i];if(c.pill!=null&&p.pills>0){const x=S.poisons.find(y=>y.id===c.pill&&y.on===i);if(x){p.pills--;S.poisons=S.poisons.filter(y=>y!==x);S.players[x.owner].revealed.push(x.type);log(`${pn(i)} 服下解毒丹，逼出 ${esc(S.players[x.owner].name)} 下的 ${POISON[x.type].n}`,'k');rows.push(`${esc(p.name)} 服下解毒丹：逼出${POISON[x.type].n}`);}}});
  // sites
  S.sites.forEach((s,k)=>{
    const con=order().map(i=>({i,c:cm[i].alloc[k]||0})).filter(x=>x.c>0);
    const assn=order().filter(i=>cm[i].assn===k);
    assn.forEach(i=>S.players[i].assn--);
    const tot=con.reduce((a,x)=>a+x.c,0);
    const res={tot,con,assn,ok:tot>=s.th,got:[]};
    if(res.ok){
      const rw=s.rw.slice().sort((a,b)=>rwVal(b)-rwVal(a));
      const ord=con.slice().sort((a,b)=>b.c-a.c||score(a.i)-score(b.i)).map(x=>x.i);
      let queue=ord.slice();
      if(assn.length===1){const a=assn[0];const top=ord[0];queue=queue.filter(i=>i!==a);if(rw.length){res.got.push({i:a,r:rw.shift(),as:true});}if(top!=null&&top!==a){S.players[top].injNext++;res.inj=top;}}
      else if(assn.length>1)queue=queue.filter(i=>!assn.includes(i));
      queue.forEach(i=>{if(rw.length)res.got.push({i,r:rw.shift()});});
      res.got.forEach(g=>{const p=S.players[g.i];if(g.r==='h'){p.herbs++;if(p.herbs>=2){p.herbs-=2;p.pills++;}}else p.pts+=g.r;});
    }
    s.res=res;
    const gotTxt=res.got.map(g=>`${esc(S.players[g.i].name)}${g.as?'（暗算）':''}拿${g.r==='h'?'藥材':g.r+'分'}`).join('、');
    log(`${s.n}：武力 ${tot}/${s.th}，${res.ok?'成功。'+(gotTxt||'沒人分到'):'失敗'}${assn.length>1?'。兩派同時暗算，互相抵銷':''}${res.inj!=null?`。${esc(S.players[res.inj].name)} 被暗算，一名弟子負傷`:''}`,res.ok?'':'k');
    rows.push(`<b>${s.n}</b>（${tot}/${s.th}）${res.ok?'成功':'失敗'}${gotTxt?'：'+gotTxt:''}${assn.length?`<span class="chip down">暗算 ${assn.map(i=>esc(S.players[i].name)).join('、')}</span>`:''}`);
  });
  // purge
  order().forEach(i=>{const c=cm[i];if(c.purge!=null){const x=S.poisons.find(y=>y.id===c.purge&&y.on===i);if(x){S.poisons=S.poisons.filter(y=>y!==x);S.players[x.owner].revealed.push(x.type);
    if(x.type==='fake'){S.players[x.owner].pts+=2;log(`${pn(i)} 運功逼毒，逼出來的是……假毒！${esc(S.players[x.owner].name)} +2 分`,'k');rows.push(`${esc(S.players[i].name)} 運功逼毒：假毒，${esc(S.players[x.owner].name)} +2`);}
    else{log(`${pn(i)} 運功逼毒，逼出 ${esc(S.players[x.owner].name)} 下的 ${POISON[x.type].n}`,'k');rows.push(`${esc(S.players[i].name)} 運功逼毒：逼出${POISON[x.type].n}`);}}}});
  // plant
  order().forEach(i=>{const c=cm[i],p=S.players[i];if(c.plant&&p.hand.includes(c.plant.type)&&poisonsOn(c.plant.to).length<SLOTS){
    p.hand.splice(p.hand.indexOf(c.plant.type),1);S.poisons.push({id:++S.pid,owner:i,on:c.plant.to,type:c.plant.type,hg:0,day});
    log(`${pn(i)} 在 ${esc(S.players[c.plant.to].name)} 的經脈上下了一份毒`,'k');rows.push(`${esc(p.name)} 對 ${esc(S.players[c.plant.to].name)} 下毒`);}});
  // reset day statuses, then hourglass
  S.players.forEach(p=>{p.inj=p.injNext;p.injNext=0;p.coma=false;});
  S.poisons.forEach(x=>x.hg++);
  const trig=S.poisons.filter(x=>x.type!=='fake'&&x.hg>=POISON[x.type].days);
  trig.forEach(x=>{const v=S.players[x.on];S.players[x.owner].revealed.push(x.type);
    if(x.type==='qibu'){v.coma=true;v.pts-=1;}else if(x.type==='sangong'){v.dis=Math.max(1,v.dis-2);}else if(x.type==='duan')v.pts-=4;
    log(`${pn(x.on)} 毒發！${esc(S.players[x.owner].name)} 下的是 ${POISON[x.type].n}：${POISON[x.type].fx}`,'k');rows.push(`<span class="chip down">毒發</span> ${esc(v.name)} 中了 ${esc(S.players[x.owner].name)} 的${POISON[x.type].n}`);});
  S.poisons=S.poisons.filter(x=>!trig.includes(x));
  S.phase='night';S.nightRows=rows;S.nightDay=day;render();save();
  const last=day>=DAYS;
  nightModal(last?'七日已到，結算盟主':'迎接第 '+(day+1)+' 天',()=>{closeModal();if(last)endGame();else{S.day++;S.start=(S.start+1)%NP();if(localHumans().length>1)S.viewer=null;startDay();}});
  if(!humans().length)timer=setTimeout(()=>modalCb&&modalCb('go'),SPEED*2);
}
function nightModal(btn,cb){
  openModal(`<h2>第 ${S.nightDay} 天 · 夜</h2><p class="sub">秘境結算、運功逼毒、下毒，最後所有毒藥的沙漏加一天，到期的毒當場發作。</p><div class="revlist">${(S.nightRows||[]).map(r=>`<div class="rev"><div>${r}</div></div>`).join('')}</div>
   <div class="acts"><button class="btn primary" data-m="go">${btn}</button></div>`,cb);
}

/* ================= view ================= */
function curTurn(){if(!S||(S.phase!=='neg'&&S.phase!=='commit')||S.offer)return null;
  if(S.phase==='commit'){if(NET.client)return S.cm[NET.seat]==null&&!UI.sent?NET.seat:null;return order().find(j=>S.cm[j]==null&&!isRemote(j))??null;}
  const c=order().find(j=>S.ng[j]==null)??null;if(NET.client&&c===NET.seat&&UI.sent)return null;return c;}
function myTurn(){const c=curTurn();return c!=null&&!S.players[c].ai&&S.viewer===c&&$('#overlay').hidden;}
function render(){
  if(!S)return;
  let st='';for(let i=1;i<=DAYS;i++){if(i>1)st+=`<span class="link ${i<=S.day?'done':''}"></span>`;st+=`<span class="step ${i<S.day||S.phase==='end'?'done':i===S.day&&S.phase!=='idle'?'now':''}">D${i}</span>`;}
  $('#steps').innerHTML=st;
  const head={idle:'七天七夜',neg:'談判桌',commit:'暗中出手',night:'毒發之夜',end:'盟主誕生'}[S.phase]||'七天七夜';
  $('#hero').innerHTML=`<div class="hero-art">${heroArt()}</div><div class="hero-txt"><div class="eyebrow">WULIN ASSEMBLY</div><h2>${head}<span class="qbadge">${S.phase==='idle'?'準備開局':S.phase==='end'?'七日已盡':'第 '+S.day+' 天'}</span></h2>${swoosh}</div>`;
  renderSites();renderSects();renderDesk();
  $('#feed').innerHTML=feedHTML(S.log,l=>l.d?'D'+l.d:'—','江湖上的每一筆交易和每一次毒發都會記在這裡。');
  NET.publish();
}
function siteArt(a){
  const pal=[['#E9D8B4','#B98F5A','#8A5A2E'],['#D8E6C8','#7FB07F','#4F8D5F'],['#E3F0D6','#9EC59A','#2F8F5B'],['#DCEAF3','#77B7D9','#2E6FB0'],['#EADCD0','#B88A6A','#5E3E2A']][a];
  return `<svg viewBox="0 0 320 80" preserveAspectRatio="xMidYMid slice"><rect width="320" height="80" fill="${pal[0]}"/><path d="M0 60 L60 30 L110 50 L170 18 L230 46 L280 28 L320 44 V80 H0Z" fill="${pal[1]}"/><path d="M0 70 Q80 56 160 66 T320 64 V80 H0Z" fill="${pal[2]}"/>${a===0?'<path d="M200 46 h40 v24 h-40z M196 46 l24-14 24 14z" fill="#B95B3B"/>':a===3?'<ellipse cx="220" cy="64" rx="50" ry="8" fill="#BFD7E8"/>':a===4?'<path d="M230 70 l6-40 4 40z M250 70 l4-30 4 30z" fill="#6E7068"/>':tree(230,50,14,'#4F8D5F')}</svg>`;
}
function renderSites(){
  $('#sitenote').textContent=S.phase==='idle'?'':`共 ${S.sites.length} 處，門檻＝所有門派派去的弟子總和`;
  const rwH=(r,got)=>`<span class="rwi ${r==='h'?'h':''} ${got?'got':''}">${r==='h'?'藥材':r+' 分'}</span>`;
  $('#sites').innerHTML=S.sites.map((s,k)=>{
    const allies=S.ally.filter(a=>a.site===k).map(a=>`<span class="chip green">${esc(S.players[a.a].name)}＋${esc(S.players[a.b].name)} 約好</span>`).join('');
    let res='';
    if(s.res){res=`<div class="contrib">${s.res.con.map(x=>`<span class="chip">${esc(S.players[x.i].name)} ${x.c}</span>`).join('')}${s.res.assn.map(i=>`<span class="chip down">${esc(S.players[i].name)} 暗算</span>`).join('')}<span class="chip ${s.res.ok?'green':'down'}">${s.res.tot}/${s.th} ${s.res.ok?'成功':'失敗'}</span></div>`;}
    return `<article class="site"><div class="art">${siteArt(s.a)}</div><div class="body"><h3>${s.n}<span class="th">門檻 ${s.th}</span></h3><div class="rw">${s.rw.map(r=>rwH(r)).join('')}</div>${allies?`<div class="contrib">${allies}</div>`:''}${res}</div></article>`;
  }).join('');
}
function slotHTML(x,viewer){
  if(!x)return '<div class="slot">空</div>';
  const known=viewer!=null&&viewer===x.owner&&x.type;
  const sel=myTurn()&&S.phase==='neg'&&UI.pid===x.id;
  return `<div class="slot p ${sel?'sel':''}" style="--pc:var(--p${x.owner})" title="${esc(S.players[x.owner].name)} 下的毒"><span class="hg">⏳${x.hg}</span><b>${sect(x.owner)}</b>${known?POISON[x.type].n:'？'}</div>`;
}
function renderSects(){
  const v=S.viewer;
  $('#mernote').textContent=v!=null&&S.phase!=='end'?`顯示 ${S.players[v].name} 看到的畫面`:S.phase==='end'?'':'換人中，毒藥內容蓋著';
  $('#sects').innerHTML=S.players.map((p,i)=>{
    const on=poisonsOn(i);const slots=[0,1,2].map(k=>slotHTML(on[k],S.phase==='end'?on[k]&&on[k].owner:v)).join('');

      <div class="mer">${slots}</div>${status?`<div class="stat" style="display:flex;gap:4px;flex-wrap:wrap">${status}</div>`:''}</div>`;

function intelHTML(i){

   ${on.length?`<ul>${on.map(x=>`<li><span class="rt">⏳${x.hg}</span><span>${esc(S.players[x.owner].name)} 下在你身上的毒，可能是 <b>${candText(x)}</b>，預估傷害 ${expDamage(x,i).toFixed(1)} 分</span></li>`).join('')}</ul>`:'<div class="inote">你身上目前沒有毒。</div>'}</div>`;

async function resumeSave(sv){
  closeModal();SPEED=SPEEDS[setupCfg.speed];NET.leave();

  <p>每天晚上所有毒藥的沙漏 +1，沙漏數到達發作天數就當場發作。七步倒當晚就發作；放了 2 天還沒發作的，就不可能是散功散。</p>
  <h3>每天流程</h3>
  <ol><li><b>談判：</b>依先手順序，每派可以對一個門派提一個案，對方當場答應或拒絕：
   <ul><li><b>賣解藥：</b>你下在對方身上的毒，開價讓他付秘笈分換解藥。假毒也能賣。</li>
   <li><b>買解藥：</b>出價請下毒的人把解藥給你。</li>
   <li><b>約打秘境：</b>約好今天一起去某處。口頭承諾，可以反悔。</li></ul>
   成交的毒和解藥一起蓋著棄掉，不公開是什麼毒。</li>
  <li><b>出手（秘密）：</b>每派分配弟子到各秘境，可以：
   <ul><li>在一處秘境放暗算籤（不算武力）。</li>
   <li>對一個門派下一份毒。</li>
   <li>運功逼毒：今天不派任何弟子，指定身上一份毒逼出並公開。逼出假毒的話，下毒的人 +2 分。</li>
   <li>服下解毒丹：解掉身上一份毒並公開，不影響派弟子。藥材湊滿 2 份自動煉成一顆解毒丹。</li></ul></li>
  <li><b>揭曉：</b>每處秘境所有門派的武力加總達到門檻就成功，派最多弟子的先挑獎勵，依序輪流（平手時分數低的先挑）。沒達到門檻就全部空手。
   <ul><li>只有一派暗算時，暗算者搶走第一順位，本來的第一名有 1 名弟子負傷，隔天不能出動。</li>
   <li>兩派以上在同一處暗算時互相抵銷，他們都拿不到獎勵。</li></ul></li>
  <li><b>夜：</b>新下的毒放上經脈，所有毒沙漏 +1，到期的毒發作。先手輪替。</li></ol>
  <h3>致勝心法</h3>
  <ul><li>沙漏是公開的倒數。一份放了 2 天的毒，只剩斷腸散或假毒兩種可能。</li>
  <li>對方手上亮過幾張假毒、幾張斷腸散，會改變你身上那份的機率。</li>
  <li>秘境門檻常常要兩三派一起湊，暗算籤讓你在合作的最後一刻搶走最好的那份。</li>
  <li>第 7 天殘毒照樣扣分，最後幾天下的斷腸散也很痛。</li></ul>
  <h3>和實體版的差別</h3>
  <p>實體版的談判是自由喊價。App 版把談判收斂成每天每派一次提案，提案有賣解藥、買解藥、約打秘境三種。</p>`);}

/* ================= input ================= */
$('#desk').addEventListener('click',e=>{
  if(e.target.closest('#btnAgain')){setupGame(S.cfgPlayers);return;}
  if(e.target.closest('#btnResult')){endModal();return;}
  if(!myTurn())return;
  const b=e.target.closest('button');if(!b||b.disabled)return;
  const d=b.dataset;
  if(d.kind){UI.kind=d.kind;UI.pid=null;UI.to=null;}
  else if(d.pid!=null)UI.pid=+d.pid;
  else if(d.k!=null)UI.k=Math.max(1,Math.min(8,UI.k+(+d.k)));
  else if(d.to!=null)UI.to=+d.to;
  else if(d.site!=null)UI.site=+d.site;
  else if(b.id==='btnNeg'){submitNeg();return;}
  else if(d.al){const [k,dv]=d.al.split(':').map(Number);UI.alloc[k]=Math.max(0,UI.alloc[k]+dv);}
  else if(d.assn!=null){const v=+d.assn;UI.assn=v<0?null:v;}
  else if(d.pt!=null){UI.plantT=d.pt||null;UI.plantTo=null;}
  else if(d.ptt!=null)UI.plantTo=+d.ptt;
  else if(d.purge!=null){const v=+d.purge;UI.purge=UI.purge===v?null:v;}
  else if(d.pill!=null){const v=+d.pill;UI.pill=UI.pill===v?null:v;}
  else if(b.id==='btnCommit'){submitCommit();return;}
  else return;
  render();
});
$('#btnRules').addEventListener('click',showRules);
$('#btnNew').addEventListener('click',()=>{if(NET.online){NET.confirmLeave();return;}if(S&&S.phase!=='end'&&S.phase!=='idle'){openModal(`<h2>放棄目前這局？</h2><p class="sub">目前的進度會被清除。</p><div class="acts"><button class="btn" data-m="no">繼續玩</button><button class="btn primary" data-m="yes">開新遊戲</button></div>`,m=>{if(m==='yes'){clearTimeout(timer);clearSave();showSetup();}else{closeModal();if(S.phase==='night'){S.day>=DAYS?endGame():(S.day++,S.start=(S.start+1)%NP(),startDay());}else proceed();}});}else showSetup();});

/* ================= online hooks ================= */
const isIdx=(j,n)=>Number.isInteger(j)&&j>=0&&j<n;
function validNeg(i,pr){
  if(!pr||pr.kind==='pass')return null;
  const p=S.players[i],k=Math.max(1,Math.min(8,Math.round(+pr.k||1)));
  if(pr.kind==='sell'){const x=S.poisons.find(y=>y.id===+pr.pid);if(!x||x.owner!==i||S.players[x.on].pts<=0)return null;return {kind:'sell',to:x.on,pid:x.id,k};}
  if(pr.kind==='buy'){const x=S.poisons.find(y=>y.id===+pr.pid);if(!x||x.on!==i||p.pts<1)return null;return {kind:'buy',to:x.owner,pid:x.id,k};}
  if(pr.kind==='ally'){const to=+pr.to,site=+pr.site;if(!isIdx(to,NP())||to===i||!isIdx(site,S.sites.length))return null;return {kind:'ally',to,site};}
  return null;
}
function validCommit(i,c){
  if(!c)return null;const p=S.players[i],on=poisonsOn(i);
  const purge=c.purge!=null&&on.some(x=>x.id===+c.purge)?+c.purge:null;
  let alloc=S.sites.map((_,k)=>Math.max(0,Math.floor(+((c.alloc||[])[k])||0)));
  if(purge!=null||alloc.reduce((a,b)=>a+b,0)>avail(i))alloc=purge!=null?S.sites.map(()=>0):null;
  if(!alloc)return null;
  const assn=c.assn!=null&&p.assn>0&&isIdx(+c.assn,S.sites.length)?+c.assn:null;
  let plant=null;if(c.plant&&p.hand.includes(c.plant.type)){const to=+c.plant.to;if(isIdx(to,NP())&&to!==i&&poisonsOn(to).length<SLOTS)plant={type:c.plant.type,to};}
  const pill=c.pill!=null&&p.pills>0&&+c.pill!==purge&&on.some(x=>x.id===+c.pill)?+c.pill:null;
  return {alloc,assn,plant,purge,pill};
}
const GAME={id:'seven-days',name:'七日斷腸',hostKey:'sevendays-net-host',clientKey:'sevendays-net-client',min:3,max:5,aiNames:AI_NAMES,
  secretHint:'你手上的毒藥、你下的毒是什麼，只會出現在你自己的手機上。',
  start(cfg){setupGame(cfg);},
  strip(pub){
    delete pub.deck;
    if(pub.cm)for(const j in pub.cm)pub.cm[j]=1;
    if(pub.phase==='end')return;
    pub.poisons.forEach(x=>{x.type=null;});
    pub.players.forEach(p=>{p.hand=p.hand.map(()=>null);});
  },
  secret(i){return {hand:S.players[i].hand,types:S.poisons.filter(x=>x.owner===i).map(x=>[x.id,x.type])};},
  applySecret(seat,sec){if(S.phase==='end')return;S.players[seat].hand=sec.hand||[];(sec.types||[]).forEach(([id,t])=>{const x=S.poisons.find(y=>y.id===id);if(x)x.type=t;});},
  waiting(){if(!S)return [];
    if(S.phase==='neg'){if(S.offer)return S.players[S.offer.to].ai?[]:[S.offer.to];const c=order().find(j=>S.ng[j]==null);return c!=null&&!S.players[c].ai?[c]:[];}
    if(S.phase==='commit')return order().filter(j=>S.cm[j]==null&&!S.players[j].ai);
    return [];},
  action(seat,a){
    if(a.t==='resp'){if(S.offer&&S.offer.id===+a.id&&S.offer.to===seat&&pendingOffer)pendingOffer.finish(!!a.acc);return;}
    if(a.t==='neg'&&S.phase==='neg'){if(S.offer||order().find(j=>S.ng[j]==null)!==seat)return;doNeg(seat,validNeg(seat,a.pr));return;}
    if(a.t==='commit'&&S.phase==='commit'){if(S.cm[seat]!=null)return;const c=validCommit(seat,a.c);if(!c)return;S.cm[seat]=c;if($('#overlay').hidden)proceed();else{save();render();}}
  },
  afterTakeover(ws){ws.forEach(i=>{S.cfgPlayers[i]={name:S.players[i].name,ai:true};});
    if(S.offer&&pendingOffer&&ws.includes(S.offer.to)){pendingOffer.finish(aiRespond(S.offer.to,S.offer.pr));return;}
    if($('#overlay').hidden)proceed();else render();},
  resumeUI(){if(S.phase==='end')endModal();else if(S.phase==='night')nightModal(S.day>=DAYS?'七日已到，結算盟主':'迎接第 '+(S.day+1)+' 天',()=>{closeModal();if(S.day>=DAYS)endGame();else{S.day++;S.start=(S.start+1)%NP();startDay();}});else proceed();},
  clientReset(prev){
    if(!prev||prev.gid!==S.gid||prev.phase!==S.phase||prev.day!==S.day)UI={};
    if(!UI.ready&&!UI.sent)UI=freshUI(NET.seat);
  },
  clientModal(){
    if(S.phase==='end')return {key:'end'+S.gid,open:endModal};
    if(S.offer&&S.offer.to===NET.seat){const o=S.offer;return {key:'o'+S.gid+o.id,open:()=>openModal(offerHTML(o.from,o.to,o.pr,o.pr.kind==='ally'?'答應':'成交','拒絕'),m=>{closeModal();NET.send({t:'resp',id:o.id,acc:m==='yes'});})};}
    const g=S.gid+':'+S.nightDay;
    if(S.nightRows&&this.seenNight!==g)return {key:'n'+g,open:()=>nightModal('知道了',()=>{this.seenNight=g;closeModal();NET.resync();})};
    return null;
  },
};

window.__sd={setupGame,setSpeed:v=>{SPEED=v;},get S(){return S;}};
(function boot(){
  S={players:Array.from({length:4},()=>({name:'—',ai:true,pts:0,dis:DISCIPLES,inj:0,coma:false,herbs:0,pills:0,assn:ASSASSIN,hand:HAND.slice(),revealed:[]})),poisons:[],day:1,start:0,phase:'idle',sites:SITES.slice(0,3).map(s=>({...s,res:null})),ally:[],ng:{},cm:{},log:[],viewer:null};
  render();showSetup();
})();
